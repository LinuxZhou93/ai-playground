<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ART NEXUS | 智能艺术创作港 - 科技特长生</title>
    <!-- Core Libraries -->
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <link
        href="https://fonts.loli.net/css2?family=Plus+Jakarta+Sans:wght@300;600;800&family=Orbitron:wght@400;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --nexus-bg: #050508;
            --nexus-accent: #00F5FF;
        }

        body {
            background: var(--nexus-bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-border {
            border: 1px solid rgba(0, 245, 255, 0.2);
            transition: all 0.3s ease;
        }

        .neon-border:hover {
            border-color: var(--nexus-accent);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.2);
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(112, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 245, 255, 0.05) 0%, transparent 50%);
            filter: blur(80px);
        }

        [v-cloak] {
            display: none !important;
        }

        .tool-card {
            opacity: 1 !important;
            transform: none !important;
        }

        /* Force visibility */
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body class="selection:bg-cyan-500/30">
    <div id="app" v-cloak>
        <div class="bg-mesh"></div>

        <!-- Header -->
        <nav class="fixed top-0 w-full z-50 py-6 px-10 flex justify-between items-center glass-panel">
            <div class="flex items-center gap-4">
                <div
                    class="w-10 h-10 bg-gradient-to-br from-cyan-400 to-purple-600 rounded-lg flex items-center justify-center orbitron font-black text-xl">
                    A</div>
                <div>
                    <h1 class="orbitron font-black text-xs tracking-[0.4em] uppercase opacity-50">AI ART NEXUS</h1>
                    <p class="font-bold text-sm tracking-tight text-cyan-400">智能艺术创作枢纽</p>
                </div>
            </div>
            <button @click="goHome"
                class="orbitron text-[10px] font-black border border-cyan-400/30 px-6 py-2 rounded-full hover:bg-cyan-400 hover:text-black transition-all">EXIT_TERMINAL</button>
        </nav>

        <main class="pt-40 px-10 max-w-7xl mx-auto space-y-24 pb-40">
            <!-- Hero -->
            <section class="flex flex-col lg:flex-row items-center gap-16 py-10">
                <div class="flex-1 space-y-8">
                    <h2
                        class="text-6xl md:text-8xl orbitron font-black leading-none bg-gradient-to-r from-white via-cyan-200 to-purple-400 bg-clip-text text-transparent">
                        BEYOND <br>IMAGINATION.
                    </h2>
                    <p class="text-lg text-white/40 leading-relaxed max-w-xl">
                        整合全球顶尖生成式 AI 艺术工具。从“文生图”到“图生视频”，跨越维度捕捉灵感，定义属于科技特长生的创作主权。
                    </p>
                </div>
                <div class="flex-1">
                    <div class="glass-panel p-2 rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop"
                            class="w-full rounded-2xl grayscale hover:grayscale-0 transition-all duration-1000">
                    </div>
                </div>
            </section>

            <!-- Tools -->
            <section class="space-y-12">
                <h3 class="orbitron text-3xl font-black tracking-tighter">AI ART STACK / 创作工具栈</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <div v-for="tool in tools" :key="tool.name"
                        class="tool-card glass-panel p-10 rounded-[40px] neon-border group">
                        <div class="text-5xl mb-6">{{ tool.icon }}</div>
                        <h4 class="orbitron text-xl font-black mb-4">{{ tool.name }}</h4>
                        <p class="text-sm text-white/50 leading-relaxed mb-8 h-20">{{ tool.desc }}</p>
                        <div class="space-y-3">
                            <a v-for="link in tool.links" :key="link.label" :href="link.url" target="_blank"
                                class="flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-cyan-400 hover:text-black transition-all">
                                <span class="text-[10px] font-black orbitron uppercase">{{ link.label }}</span>
                                <span class="text-lg">→</span>
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    tools: [
                        { name: 'MIDJOURNEY', icon: '🎨', desc: '目前全球艺术感最强的文生图工具，支持极致的风格化与摄影质感。', links: [{ label: 'Official', url: 'https://www.midjourney.com/' }, { label: 'Guide', url: 'https://docs.midjourney.com/' }] },
                        { name: 'NANO BANANA', icon: '🍌', desc: '新兴的高性能 AI 视觉实验项目，专注于极速生成与动态反馈。', links: [{ label: 'Portal', url: 'https://nano.banana.ai/' }] },
                        { name: 'STABLE DIFFUSION', icon: '🌀', desc: '开源界的王者，支持局域网部署与 ControlNet 精准控图。', links: [{ label: 'Stability', url: 'https://stability.ai/' }, { label: 'Civitai', url: 'https://civitai.com/' }] },
                        { name: 'LUMA DREAM', icon: '🎬', desc: '好莱坞级别的图生视频、文生视频工具，赋予静态画面生命力。', links: [{ label: 'Dream', url: 'https://lumalabs.ai/' }] },
                        { name: 'LEONARDO', icon: '🦁', desc: '全能型创作平台，内置强大的实时绘画预览与画布扩展功能。', links: [{ label: 'Platform', url: 'https://leonardo.ai/' }] },
                        { name: 'RUNWAY', icon: '🚀', desc: '定义视频生成的新标准，利用物理引擎感知的神经网络构建现实。', links: [{ label: 'Gen-3', url: 'https://runwayml.com/' }] }
                    ]
                }
            },
            methods: {
                goHome() { window.location.href = 'index.html'; }
            },
            mounted() {
                gsap.from(".tool-card", { opacity: 0, y: 50, duration: 1, stagger: 0.1, ease: "power4.out" });
            }
        }).mount('#app');
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.24_3"></script>
</body>

</html>
