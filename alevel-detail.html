<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Level 课程详解 | A-Level Detailed Guide</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    

    <!-- Google Fonts -->
    <link
        href="https://fonts.loli.net/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #f97316;
            --primary-glow: rgba(249, 115, 22, 0.4);
        }

        body {
            background-color: #0c0705;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-card {
            background: rgba(43, 22, 12, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.1);
        }

        .hero-bg {
            background: radial-gradient(circle at top right, rgba(249, 115, 22, 0.15), transparent),
                radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.08), transparent);
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .scroll-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .grade-badge {
            width: 4.5rem;
            height: 4.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.3);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .grade-badge:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const BookText = (props) => <IconBase {...props}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></IconBase>;
        const Landmark = (props) => <IconBase {...props}><line x1="3" x2="21" y1="22" y2="22" /><line x1="6" x2="6" y1="18" y2="11" /><line x1="10" x2="10" y1="18" y2="11" /><line x1="14" x2="14" y1="18" y2="11" /><line x1="18" x2="18" y1="18" y2="11" /><polygon points="12 2 20 7 4 7 12 2" /></IconBase>;
        const Award = (props) => <IconBase {...props}><circle cx="12" cy="8" r="7" /><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" /></IconBase>;
        const Zap = (props) => <IconBase {...props}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></IconBase>;
        const ArrowLeft = (props) => <IconBase {...props}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></IconBase>;

        const DetailSection = ({ title, subtitle, children }) => (
            <section className="mb-24 scroll-reveal">
                <div className="flex items-center gap-4 mb-8">
                    <div className="h-0.5 w-12 bg-orange-500"></div>
                    <div>
                        <h2 className="text-3xl font-orbitron font-bold text-white uppercase tracking-tighter">{title}</h2>
                        <span className="text-xs font-mono text-orange-400/60 uppercase tracking-widest">{subtitle}</span>
                    </div>
                </div>
                {children}
            </section>
        );

        const App = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);

            return (
                <div className="min-h-screen hero-bg">
                    {/* Header/Nav */}
                    <nav className="fixed top-0 w-full z-50 p-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
                        <a href="international-hub.html" className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
                            <div className="p-2 rounded-lg bg-white/5 border border-white/10 group-hover:border-orange-500/50 transition-all">
                                <ArrowLeft className="w-5 h-5" />
                            </div>
                            <span className="text-xs font-bold tracking-widest uppercase">返回全球智慧中心</span>
                        </a>
                        <div className="text-[10px] font-mono text-orange-400 tracking-widest animate-pulse">BRITISH_ACADEMIC_PROTOCOL_CONNECTED</div>
                    </nav>

                    <main className="container mx-auto px-6 pt-40 pb-20">
                        {/* Hero Section */}
                        <div className="max-w-4xl mb-32">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/10 border border-orange-500/20 text-orange-400 text-[10px] font-bold uppercase tracking-widest mb-8">
                                <Landmark className="w-3 h-3" /> UK Education Standard
                            </div>
                            <h1 className="text-7xl md:text-9xl font-orbitron font-bold text-white mb-8 leading-none">
                                A-LEVEL<br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-600">Pure Academic Depth</span>
                            </h1>
                            <p className="text-xl text-slate-400 leading-relaxed font-light max-w-2xl border-l-2 border-orange-500/30 pl-8">
                                A-Level（General Certificate of Education Advanced Level）是英国的全民课程体系，也是英国学生的大学入学考试课程。由于其深入细致的学科专业度，A-Level 被国际教育界誉为“普及至全球的金牌课程体系”，是通到剑桥、牛津等G5尖端学府的必经之路。
                            </p>
                        </div>

                        {/* Core Pillars */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-12 mb-40">
                            <div className="glass-card rounded-[2.5rem] p-10 flex flex-col justify-between">
                                <div>
                                    <h3 className="text-2xl font-bold text-white mb-4">AS Level (第一年)</h3>
                                    <p className="text-slate-400 text-sm leading-relaxed mb-6">
                                        作为基础阶段，学生通常选择4门感兴趣的课程。AS 考试成绩通常作为大学预录取（Conditional Offer）的重要参考依据。
                                    </p>
                                </div>
                                <div className="h-2 w-full bg-orange-500/20 rounded-full overflow-hidden">
                                    <div className="h-full w-1/2 bg-orange-500"></div>
                                </div>
                            </div>
                            <div className="glass-card rounded-[2.5rem] p-10 flex flex-col justify-between">
                                <div>
                                    <h3 className="text-2xl font-bold text-white mb-4">A2 Level (第二年)</h3>
                                    <p className="text-slate-400 text-sm leading-relaxed mb-6">
                                        进阶阶段，学生会从AS课程中挑选3门最擅长的科目继续深造。A2的成绩与AS合并构成完整的 A-Level 最终分数。
                                    </p>
                                </div>
                                <div className="h-2 w-full bg-orange-500/20 rounded-full overflow-hidden">
                                    <div className="h-full w-full bg-gradient-to-r from-orange-500 to-red-600"></div>
                                </div>
                            </div>
                        </div>

                        {/* Subject Depth Section */}
                        <DetailSection title="深度学科选择" subtitle="SUBJECT_SPECIALIZATION_MATRIX">
                            <p className="text-slate-400 mb-10 max-w-2xl">A-Level 的核心优势在于“偏科友好”：你不必像IB那样全能，而是可以在自己最热爱的领域钻研到极致。</p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {[
                                    { title: "数理核心", desc: "数学、高等数学、物理、化学" },
                                    { title: "商科方向", desc: "经济学、商业学、会计学" },
                                    { title: "人文艺术", desc: "历史、地理、艺术与设计" },
                                    { title: "现代科技", desc: "计算机科学、媒体研究" }
                                ].map((item, i) => (
                                    <div key={i} className="p-6 rounded-2xl bg-white/5 border border-white/10 hover:border-orange-500 transition-all group">
                                        <Zap className="w-6 h-6 text-orange-400 mb-4 group-hover:animate-pulse" />
                                        <h4 className="text-lg font-bold text-white mb-2">{item.title}</h4>
                                        <p className="text-slate-500 text-xs leading-relaxed">{item.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </DetailSection>

                        {/* Scoring System */}
                        <DetailSection title="等级评分制" subtitle="GRADING_STANDARDS_A_TO_E">
                            <div className="flex flex-wrap gap-8 justify-center items-center py-12">
                                {["A*", "A", "B", "C", "D"].map(g => (
                                    <div key={g} className="grade-badge">{g}</div>
                                ))}
                            </div>
                            <div className="max-w-3xl mx-auto glass-card rounded-2xl p-8 border-l-4 border-orange-500">
                                <h4 className="font-bold text-white mb-3">G5 名校门槛参考</h4>
                                <ul className="space-y-3 text-sm text-slate-400">
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-orange-500"></div> 牛津/剑桥：通常要求 A*A*A - A*AA</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-orange-500"></div> 帝国理工/LSE：通常要求 A*AA - AAA</li>
                                    <li className="flex items-center gap-2"><div className="w-1.5 h-1.5 rounded-full bg-orange-500"></div> A-Level 成绩可获得全球顶尖名校的学分抵免。</li>
                                </ul>
                            </div>
                        </DetailSection>

                        {/* Global Recognition Link */}
                        <div className="mt-20 flex flex-col md:flex-row gap-8 items-center justify-between">
                            <div className="flex items-center gap-6">
                                <div className="p-5 rounded-2xl bg-orange-500/10 text-orange-500">
                                    <BookText className="w-10 h-10" />
                                </div>
                                <div>
                                    <h4 className="text-xl font-bold text-white">选择你的学术主场</h4>
                                    <p className="text-slate-500 text-xs italic uppercase tracking-wider">Join 10,000+ schools in 160 countries</p>
                                </div>
                            </div>
                            <a href="https://www.cambridgeinternational.org" target="_blank" className="px-12 py-4 rounded-xl bg-orange-600 hover:bg-orange-500 text-white font-bold tracking-widest uppercase transition-all shadow-lg shadow-orange-600/20">查看 CAIE 课程大纲 ↗</a>
                        </div>
                    </main>

                    <footer className="py-20 border-t border-white/5 text-center">
                        <p className="text-slate-600 text-[10px] font-mono tracking-[0.4em] uppercase">Titan OS | British Academic Strategy Hub | 2025</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js"></script>
</body>

</html>
