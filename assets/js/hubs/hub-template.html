<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading... | TITAN OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/titan-core.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="assets/css/cognitive-selector.css">
    <script src="assets/js/hubs/hub-data.js?v=1"></script>
    <style>
        .cyber-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.15;
            background-image: linear-gradient(var(--hub-color-rgba, rgba(244, 63, 94, 0.4)) 1px, transparent 1px),
            linear-gradient(90deg, var(--hub-color-rgba, rgba(244, 63, 94, 0.4)) 1px, transparent 1px);
            background-size: 40px 40px; transform: perspective(600px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: grid-move 20s linear infinite; }
        @keyframes grid-move { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }
        :root { --hub-color: #fb7185; --hub-color-rgba: rgba(244, 63, 94, 0.4); }
        .glass-panel { background: rgba(0,0,0,0.4); backdrop-filter: blur(12px); border: 1px solid var(--hub-color-rgba); border-radius: 16px; }
        .holo-card { transition: transform 0.3s ease, border-color 0.3s; }
        .holo-card:hover { border-color: var(--hub-color); box-shadow: 0 0 20px var(--hub-color-rgba); }
        #preloader { position: fixed; inset: 0; background: #030712; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-bar { width: 300px; height: 2px; background: rgba(255,255,255,0.1); margin-top: 20px; position: relative; overflow: hidden; }
        .loader-progress { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--hub-color); box-shadow: 0 0 10px var(--hub-color); }
        .core-visual { width: 100%; height: 100%; position: absolute; display: flex; align-items: center; justify-content: center; transform-style: preserve-3d; }
        .core-ring { position: absolute; border-radius: 50%; opacity: 0.8; }
        .core-ring-1 { border: 2px dashed var(--hub-color-rgba); width: 400px; height: 400px; animation: spin 20s linear infinite; }
        .core-ring-2 { border: 1px solid var(--hub-color); width: 350px; height: 350px; animation: spin-rev 15s linear infinite; }
        .core-ring-3 { border: 4px dotted var(--hub-color-rgba); width: 480px; height: 480px; animation: spin 30s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    </style>
</head>
<body class="bg-[#030712] text-white overflow-x-hidden font-noto">
    <!-- Inline tailwind arbitrary values are replaced by native CSS mostly or fallback to standard TW classes -->
    <div id="preloader">
        <div style="color: #fb7185" class="text-sm tracking-[0.3em] font-bold font-orbitron" id="load-text">INITIALIZING TITAN PROTOCOL...</div>
        <div class="loader-bar"><div class="loader-progress" id="load-progress"></div></div>
    </div>
    <div class="cyber-grid"></div>
    <div class="fixed top-[-20%] left-[-10%] w-[800px] h-[800px] rounded-full blur-[150px] pointer-events-none" style="background: rgba(244, 63, 94,0.08)"></div>

    <nav class="fixed top-0 w-full z-50 glass-panel border-x-0 border-t-0 p-4 px-6 flex justify-between items-center transition-transform duration-300" id="navbar">
        <div class="flex items-center gap-4">
            <div id="nav-icon" class="w-10 h-10 rounded-full border flex items-center justify-center animate-pulse shadow-lg text-xl" style="border-color: var(--hub-color-rgba); box-shadow: 0 0 15px var(--hub-color-rgba)">📦</div>
            <div class="font-bold text-xl tracking-[0.2em] font-orbitron">FUSION<span id="nav-suffix" style="color: var(--hub-color)">SYS</span></div>
        </div>
        <a href="index.html" class="flex items-center gap-2 group cursor-pointer text-gray-400 hover:text-white text-xs tracking-widest transition-colors duration-300 font-orbitron">
            [ RETURN_TO_HUB ]
        </a>
    </nav>

    <header class="relative min-h-screen flex items-center pt-20 overflow-hidden">
        <div class="container mx-auto px-6 relative z-10 flex flex-col lg:flex-row items-center gap-16">
            <div class="lg:w-7/12 space-y-8 gs-reveal mt-20 lg:mt-0">
                <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded-full border" style="border-color: var(--hub-color-rgba); background: rgba(244, 63, 94,0.1)">
                    <span id="status-ping" class="w-2 h-2 rounded-full animate-ping" style="background: var(--hub-color)"></span>
                    <span id="tag-prefix" class="text-xs font-bold tracking-widest font-mono" style="color: var(--hub-color)">CORE_SYS</span>
                </div>
                <h1 class="text-6xl md:text-7xl lg:text-8xl font-black leading-[1.1] tracking-tight uppercase font-orbitron">
                    <span id="hero-first">TITAN</span><br>
                    <span id="hero-second" class="text-transparent bg-clip-text" style="background-image: linear-gradient(to right, var(--hub-color), white); filter: drop-shadow(0 0 20px var(--hub-color-rgba));">OFFICIAL</span><br>
                    <span id="hero-zh" class="text-3xl lg:text-5xl tracking-widest text-white mt-4 block font-noto">学科实验室</span>
                </h1>
                <p id="hero-desc" class="text-gray-400 font-light text-lg leading-relaxed max-w-2xl border-l-2 pl-6 py-2 content-desc" style="border-color: var(--hub-color-rgba)">
                    加载中...
                </p>
                <div class="glass-panel p-4 mt-8 w-full max-w-md text-xs text-green-400 h-32 overflow-hidden relative border font-mono" style="border-color: var(--hub-color-rgba)">
                     <div class="absolute inset-0 pointer-events-none z-10" style="background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.3) 2px,rgba(0,0,0,0.3) 4px)"></div>
                     <div id="typewriter" class="opacity-80 break-all whitespace-pre-wrap"></div>
                </div>
            </div>

            <div class="lg:w-5/12 flex justify-center items-center gs-reveal relative h-[500px]">
                <div id="hero-visual-container" class="core-visual">
                    <div class="core-ring core-ring-1"></div>
                    <div class="core-ring core-ring-2"></div>
                    <div class="core-ring core-ring-3"></div>
                    <div id="hero-icon" class="absolute w-[80%] h-[80%] flex items-center justify-center text-[120px] animate-pulse" style="filter: drop-shadow(0 0 30px var(--hub-color));">🔬</div>
                </div>
                <div class="absolute top-10 right-0 glass-panel px-3 py-2 text-[10px] font-mono animate-bounce border" style="color: var(--hub-color); border-color: var(--hub-color-rgba)">SYNC_RATE: 99.98%</div>
                <div class="absolute bottom-20 -left-10 glass-panel px-3 py-2 text-[10px] font-mono text-white border" style="border-color: var(--hub-color-rgba)">INTEGRITY: OPTIMAL</div>
            </div>
        </div>
    </header>

    <section class="py-32 relative z-10" id="matrix">
        <div class="container mx-auto px-6">
            <div class="flex flex-col items-center text-center mb-24 gs-reveal-up">
                <div class="tracking-[0.5em] text-sm mb-4 font-orbitron" style="color: var(--hub-color)">/// KNOWLEDGE MATRIX</div>
                <h2 id="matrix-title" class="text-4xl lg:text-5xl font-black font-noto">核心架构阵列</h2>
                <div class="w-24 h-1 mt-6" style="background: linear-gradient(to right, transparent, var(--hub-color), transparent)"></div>
            </div>

            <div id="sub-sectors-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 relative">
                <!-- Dynamic Content -->
            </div>
        </div>
    </section>
    
    <!-- 认知维度选择器浮层 -->
    <div id="cognitive-selector">
        <div class="selector-close" onclick="window.hideCognitiveSelector()">✕</div>
        <div class="selector-content">
            <div class="assistant-intro">
                <div class="assistant-avatar"></div>
                <div class="assistant-speech">嘿！我是小创老师。这门课你想怎么学？</div>
            </div>
            
            <div class="dimension-grid">
                <!-- 快速扫描 -->
                <div class="dimension-card" onclick="window.launchCourse('scan')">
                    <div class="dimension-icon">⚡</div>
                    <div class="dimension-name">闪电突击</div>
                    <div class="dimension-info">只想看重点精华？<br>我带你快快过一遍！</div>
                    <div class="card-glow"></div>
                </div>
                
                <!-- 案例实战 -->
                <div class="dimension-card" onclick="window.launchCourse('case')">
                    <div class="dimension-icon">🛠️</div>
                    <div class="dimension-name">实战基地</div>
                    <div class="dimension-info">想看是怎么做的？<br>我们去实验室看演示！</div>
                    <div class="card-glow"></div>
                </div>
                
                <!-- 底层逻辑 -->
                <div class="dimension-card" onclick="window.launchCourse('logic')">
                    <div class="dimension-icon">🧬</div>
                    <div class="dimension-name">超级大脑</div>
                    <div class="dimension-info">想搞懂背后的秘密？<br>像科学家一样去研究！</div>
                    <div class="card-glow"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- TITAN AI ASSISTANT -->
    <script src="assets/js/titan-ai-assistant.js?v=2026.03.26_10"></script>

    <script>
        // Virtual Hub Dynamic Logic
        function initVirtualHub() {
            const urlParams = new URLSearchParams(window.location.search);
            const hubId = urlParams.get('id') || 'hub-auto-101.html';
            const data = window.TitanHubData.getHubData(hubId);
            const category = window.TitanHubData.CATEGORIES[data.category] || window.TitanHubData.CATEGORIES['academic'];

            // CSS Variable Injection
            document.documentElement.style.setProperty('--hub-color', category.themeColor);
            const hexToRgba = (hex, alpha) => {
                const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            };
            document.documentElement.style.setProperty('--hub-color-rgba', hexToRgba(category.themeColor, 0.4));

            // DOM Updates
            document.getElementById('page-title').innerText = `${data.name} | TITAN OS`;
            document.getElementById('nav-icon').innerText = data.icon;
            document.getElementById('nav-suffix').innerText = category.suffix || 'LAB';
            document.getElementById('nav-suffix').style.color = category.themeColor;
            
            document.getElementById('tag-prefix').innerText = `${category.tagPrefix}: ${data.id || 'SYNC'}`;
            document.getElementById('tag-prefix').style.color = category.themeColor;
            document.getElementById('status-ping').style.backgroundColor = category.themeColor;

            const nameParts = data.id ? data.id.split('_') : ['HUB', 'MODULE'];
            document.getElementById('hero-first').innerText = nameParts[0] || 'TITAN';
            document.getElementById('hero-second').innerText = nameParts.slice(1).join('_') || 'OBJECTIVE';
            document.getElementById('hero-second').style.backgroundImage = `linear-gradient(to right, ${category.themeColor}, white)`;
            document.getElementById('hero-zh').innerText = data.name;
            document.getElementById('hero-desc').innerText = data.desc;
            document.getElementById('hero-icon').innerText = data.icon;

            // Render Sub Sectors
            const sectorsGrid = document.getElementById('sub-sectors-grid');
            if (data.subSectors && data.subSectors.length > 0) {
                sectorsGrid.innerHTML = data.subSectors.map(s => `
                    <div class="block glass-panel p-8 holo-card group cursor-pointer gs-reveal-up border-l-4" 
                         style="border-left-color: ${category.themeColor}"
                         onclick="window.showCognitiveSelector('${s.title.replace(/'/g, "\\'")}', '${s.classroom}')">
                        <div class="flex justify-between items-start mb-8">
                            <div class="text-[3rem] opacity-20 font-black font-orbitron leading-none group-hover:opacity-100 transition-opacity" style="color: ${category.themeColor}">${s.id}</div>
                            <span class="text-[10px] font-mono px-2 py-1 bg-green-500 bg-opacity-10 text-green-400 rounded-sm border border-green-500 border-opacity-20">${s.label}</span>
                        </div>
                        <h3 class="text-2xl font-bold font-noto mb-3 text-white">${s.title}</h3>
                        <p class="text-gray-400 text-sm leading-relaxed mb-6 font-light">${s.desc}</p>
                        <div class="w-full bg-black bg-opacity-50 h-1.5 rounded-full overflow-hidden">
                            <div class="w-0 h-full group-hover:w-full transition-all duration-1000 ease-out" style="background-color: ${category.themeColor}"></div>
                        </div>
                    </div>
                `).join('');
            } else if (sectorsGrid) {
                sectorsGrid.innerHTML = '<div class="col-span-full text-center opacity-50 py-20 font-mono">/// NO ARCHIVE SECTORS FOUND FOR THIS MODULE ///</div>';
            }

            // Interactive logic
            document.querySelectorAll('.holo-card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                    const xc = (x / rect.width) * 100; const yc = (y / rect.height) * 100;
                    card.style.transform = `perspective(1000px) rotateX(${(yc - 50) * -0.15}deg) rotateY(${(xc - 50) * 0.15}deg) translateY(-5px)`;
                });
                card.addEventListener('mouseleave', () => { card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)`; });
            });
        }

        // --- 维度选择器逻辑 ---
        let currentTargetCourse = { title: '', url: '' };
        window.showCognitiveSelector = (title, url) => {
            currentTargetCourse = { title, url };
            document.getElementById('sel-course-name').innerText = title;
            const selector = document.getElementById('cognitive-selector');
            selector.style.display = 'flex';
            gsap.to(selector, { opacity: 1, duration: 0.5, ease: "power2.out" });
        };

        window.hideCognitiveSelector = () => {
            const selector = document.getElementById('cognitive-selector');
            gsap.to(selector, { opacity: 0, duration: 0.3, ease: "power2.in", onComplete: () => {
                selector.style.display = 'none';
            }});
        };

        // 发起课程 (选择维度后触发)
        window.launchCourse = (level) => {
            const { title, url } = currentTargetCourse;
            // 默认直接跳转到云端全屏实战课堂 (跳过本地 openmaic-classroom.html 包装)
            const destination = 'https://ai.zhouxiaomai.com/';
            
            // 跳转到预习页 (由于模版在 assets/js/hubs/，需向上跳三级回到根目录)
            const previewUrl = `../../../knowledge_overview.html?topic=${encodeURIComponent(title)}&level=${level}&target=${encodeURIComponent(destination)}`;
            
            // 退出动画
            gsap.to(".selector-content", { y: -50, opacity: 0, duration: 0.5, ease: "power2.in", onComplete: () => {
                window.location.href = previewUrl;
            }});
        };

        window.addEventListener('load', () => {
            initVirtualHub();
            
            const tl = gsap.timeline();
            tl.to("#load-progress", { width: "100%", duration: 1.5, ease: "power3.inOut" })
              .to("#load-text", { opacity: 0, text: "SYSTEM ONLINE", duration: 0.2 }, "+=0")
              .to("#preloader", { yPercent: -100, duration: 0.8, ease: "power4.inOut" }, "+=0.3")
              .from(".gs-reveal", { y: +50, opacity: 0, duration: 1.2, stagger: 0.15, ease: "back.out(1.2)" }, "-=0.2")
              .from(".gs-reveal-up", { y: 50, opacity: 0, duration: 1, stagger: 0.1, ease: "power3.out" }, "-=0.5");
        });

        const bootText = [
            "CONNECTING TO TITAN CLOUD CORE...",
            "AUTHENTICATING NEURAL INTERFACE...",
            "SUCCESS. LATENCY: 8ms",
            "FETCHING MODULE DYNAMICS...",
            "SYSTEM READY. WAITING FOR COMMAND."
        ];
        let bootContainer = document.getElementById('typewriter');
        let bootHTML = '';
        setTimeout(() => {
            bootText.forEach((txt, i) => {
                setTimeout(() => {
                    bootHTML += `<div><span class="text-gray-500">[${new Date().toISOString().substring(11,23)}]</span> -> ${txt}</div>`;
                    bootContainer.innerHTML = bootHTML;
                }, i * 600);
            });
        }, 2000);

        gsap.registerPlugin(ScrollTrigger);
        let lastScroll = 0;
        window.addEventListener("scroll", () => {
            let currentScroll = window.pageYOffset;
            if (currentScroll > lastScroll && currentScroll > 100) {
                const nav = document.getElementById("navbar");
                if (nav) nav.style.transform = "translateY(-100%)";
            } else {
                const nav = document.getElementById("navbar");
                if (nav) nav.style.transform = "translateY(0)";
            }
            lastScroll = currentScroll;
        });
    </script>
</body>
</html>
