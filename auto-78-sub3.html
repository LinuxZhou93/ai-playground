<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能药物缓释微胶囊 | TITAN OS</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.loli.net/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;500;900&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #030712; color: #ffffff; overflow-x: hidden; }
        .glass-panel { background: rgba(0,0,0,0.5); backdrop-filter: blur(16px); border: 1px solid rgba(168, 85, 247, 0.2); }
        .bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.1;
            background-image: linear-gradient(rgba(168, 85, 247,1) 1px, transparent 1px), linear-gradient(90deg, rgba(168, 85, 247,1) 1px, transparent 1px);
            background-size: 50px 50px; transform: perspective(1000px) rotateX(45deg) scale(2);
            animation: grid-scroll 20s linear infinite; }
        @keyframes grid-scroll { 0% { transform: perspective(1000px) rotateX(45deg) scale(2) translateY(0); } 100% { transform: perspective(1000px) rotateX(45deg) scale(2) translateY(50px); } }
        
        .matrix-fall { font-family: monospace; position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; pointer-events: none; opacity: 0.15; color: #c084fc; line-height: 1; font-size: 14px; white-space: pre; z-index: 0; }
        
        .hexa-cube { width: 100px; height: 100px; transform-style: preserve-3d; animation: spin-cube 15s infinite linear; }
        .hexa-face { position: absolute; width: 100%; height: 100%; border: 2px solid #c084fc; opacity: 0.6; background: rgba(168, 85, 247, 0.1); }
        .f-front { transform: translateZ(50px); } .f-back { transform: rotateY(180deg) translateZ(50px); }
        .f-right { transform: rotateY(90deg) translateZ(50px); } .f-left { transform: rotateY(-90deg) translateZ(50px); }
        .f-top { transform: rotateX(90deg) translateZ(50px); } .f-bottom { transform: rotateX(-90deg) translateZ(50px); }
        @keyframes spin-cube { 0% { transform: rotateX(0deg) rotateY(0deg); } 100% { transform: rotateX(360deg) rotateY(360deg); } }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>
<body class="font-cyber selection:bg-[#c084fc] selection:text-white">
    <div class="bg-grid"></div>
    <div class="matrix-fall" id="matrix-canvas"></div>
    
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center py-20 px-4">
        <a href="hub-auto-78.html" class="fixed top-8 left-8 text-[#c084fc] hover:text-white transition-colors tracking-widest text-xs border border-[rgba(168, 85, 247,0.3)] bg-black/50 px-4 py-2 rounded uppercase backdrop-blur-md gs-rev">
            ← [ ABORT NODE & RETURN TO 微纳机器人与精准医疗 ]
        </a>
        
        <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center gs-rev">
            <div class="space-y-8">
                <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded border border-[rgba(168, 85, 247,0.3)] bg-[rgba(168, 85, 247,0.1)] w-fit">
                    <span class="w-2 h-2 rounded bg-[#c084fc] animate-ping"></span>
                    <span class="font-mono text-[#c084fc] text-xs font-bold tracking-widest">SUB-SYSTEM 03: SECURE</span>
                </div>
                
                <h1 class="text-5xl md:text-6xl font-black leading-tight bg-clip-text text-transparent" style="background-image: linear-gradient(to right, white, #c084fc)">
                    智能药物缓释微胶囊
                </h1>
                
                <div class="glass-panel p-6 border-l-4" style="border-left-color: #c084fc">
                    <p class="text-lg text-gray-300 font-light leading-relaxed">
                        设计响应病灶区pH值、酶浓度或温度变化的智能涂层，实现药物的定点释放。
                    </p>
                </div>
                
                <div class="grid grid-cols-2 gap-4 font-mono text-xs">
                    <div class="glass-panel p-4 flex flex-col">
                        <span class="text-gray-500 mb-1">LOCAL_ID</span>
                        <span class="text-[#c084fc]">N-78-3</span>
                    </div>
                    <div class="glass-panel p-4 flex flex-col">
                        <span class="text-gray-500 mb-1">DATA_LAKE</span>
                        <span class="text-green-400">SYNC_OK</span>
                    </div>
                </div>
            </div>
            
            <div class="relative h-[400px] flex justify-center items-center">
                <!-- 3D CUBE ANIMATION -->
                <div style="perspective: 800px;">
                    <div class="hexa-cube">
                        <div class="hexa-face f-front"></div>
                        <div class="hexa-face f-back"></div>
                        <div class="hexa-face f-right"></div>
                        <div class="hexa-face f-left"></div>
                        <div class="hexa-face f-top"></div>
                        <div class="hexa-face f-bottom"></div>
                    </div>
                </div>
                <!-- Circular rings behind cube -->
                <div class="absolute w-[300px] h-[300px] rounded-full border border-[rgba(168, 85, 247,0.2)] animate-[spin_10s_linear_infinite]"></div>
                <div class="absolute w-[200px] h-[200px] rounded-full border border-dashed border-[rgba(168, 85, 247,0.4)] animate-[spin_8s_linear_infinite_reverse]"></div>
            </div>
        </div>
    </div>
    
    <script>
        gsap.from(".gs-rev", { y: 30, opacity: 0, duration: 1, stagger: 0.2, ease: "power3.out", delay: 0.5 });
        
        const canvas = document.getElementById('matrix-canvas');
        let txt = "";
        for(let i=0; i<40; i++) {
            for(let j=0; j<80; j++) {
                txt += Math.random() > 0.5 ? "1" : "0";
                txt += Math.random() > 0.8 ? " " : "";
            }
            txt += "\n";
        }
        canvas.textContent = txt;
        setInterval(() => {
            const arr = canvas.textContent.split("\n");
            arr.unshift(arr.pop());
            canvas.textContent = arr.join("\n");
        }, 50);
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.24_1"></script>
</body>
</html>
