<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Loading | FUTURE AI</title>
    <link href="https://fonts.loli.net/css2?family=Orbitron:wght@500;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #0b0b15;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Orbitron', sans-serif;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            margin: 0;
            background: linear-gradient(90deg, #00C2FF, #FF2E93);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #888;
            margin-top: 10px;
        }

        .back-btn {
            margin-top: 40px;
            padding: 10px 30px;
            border: 1px solid #00C2FF;
            color: #00C2FF;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #00C2FF;
            color: black;
            box-shadow: 0 0 20px #00C2FF;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>
    <div class="icon">🚧</div>
    <h1>SYSTEM BUILDING</h1>
    <p>该模块正在由 AI 架构师构建中...</p>
    <p style="font-size:12px; font-family:sans-serif; color:#444;">MODULE_ID: <span id="mod-id">UNKNOWN</span></p>
    <a href="index.html" class="back-btn">RETURN HOME</a>
    <script>document.getElementById('mod-id').innerText = window.location.pathname.split('/').pop().toUpperCase();</script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js"></script>
</body>

</html>
