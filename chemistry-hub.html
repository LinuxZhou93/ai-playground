<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学分子中心 | Chemistry Molecular Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Outfit:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #10b981;
            /* emerald-500 */
            --primary-glow: rgba(16, 185, 129, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .font-quick {
            font-family: 'Quicksand', sans-serif;
        }

        .font-mono-atom {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .molecular-pattern {
            background-image:
                radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, transparent 1px);
            background-size: 40px 40px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes bubble {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }

        .bubble {
            position: absolute;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: bubble 4s ease-in infinite;
        }

        .periodic-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .periodic-cell:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            transform: scale(1.1);
            z-index: 10;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const FlaskConical = (props) => <IconBase {...props}><path d="M10 2v8L4.5 20.29A1 1 0 0 0 5.4 21.7h13.2a1 1 0 0 0 .9-1.41L14 10V2" /><path d="M8.5 2h7" /><path d="M7 16h10" /></IconBase>;
        const FlaskRound = (props) => <IconBase {...props}><path d="M10 2v7.31" /><path d="M14 9.3V2" /><path d="M8.5 2h7" /><path d="M14 9.3a6.5 6.5 0 1 1-4 0" /><path d="M5.52 16h12.96" /></IconBase>;
        const Atom = (props) => <IconBase {...props}><circle cx="12" cy="12" r="1" /><path d="M20.2 20.2c2.04-2.03.02-9.17-4.5-15.89-4.52-6.72-10.23-10.12-12.27-8.09-2.04 2.03-.02 9.17 4.5 15.89 4.52 6.72 10.23 10.12 12.27 8.09z" /><path d="M3.8 3.8c-2.04 2.03-.02 9.17 4.5 15.89 4.52 6.72 10.23 10.12 12.27 8.09 2.04-2.03.02-9.17-4.5-15.89-4.52-6.72-10.23-10.12-12.27-8.09z" /></IconBase>;
        const ShieldCheck = (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /><path d="m9 12 2 2 4-4" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;

        const ReactionCard = ({ title, type, icon: Icon, color }) => (
            <div className="glass-card rounded-2xl p-6 group cursor-pointer relative overflow-hidden">
                <div className={`p-3 rounded-xl inline-block mb-4 ${color.replace('text-', 'bg-').replace('-400', '-500/10')} ${color}`}>
                    <Icon className="w-6 h-6" />
                </div>
                <span className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1">{type}</span>
                <h3 className="text-xl font-bold mb-4 group-hover:text-emerald-400 transition-colors">{title}</h3>
                <div className="flex items-center gap-2 text-slate-400 text-xs font-bold">
                    VIEW REACTION <Icon className="w-3 h-3" />
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative molecular-pattern pb-20">
                    {/* Animated Bubbles */}
                    <div className="bubble w-4 h-4 left-[10%] bottom-0" style={{ animationDelay: '0s' }}></div>
                    <div className="bubble w-6 h-6 left-[25%] bottom-0" style={{ animationDelay: '1s' }}></div>
                    <div className="bubble w-3 h-3 left-[40%] bottom-0" style={{ animationDelay: '2.5s' }}></div>
                    <div className="bubble w-5 h-5 left-[70%] bottom-0" style={{ animationDelay: '0.8s' }}></div>
                    <div className="bubble w-4 h-4 left-[85%] bottom-0" style={{ animationDelay: '1.5s' }}></div>

                    {/* Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-8 py-3 flex items-center gap-10 border border-white/10">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-emerald-400 font-bold text-xs uppercase tracking-widest">Synthesis</a>
                        <a href="#" className="text-slate-400 hover:text-emerald-400 transition-colors text-xs uppercase tracking-widest">Analysis</a>
                        <a href="#" className="text-slate-400 hover:text-emerald-400 transition-colors text-xs uppercase tracking-widest">Thermodynamics</a>
                    </nav>

                    {/* Standards */}
                    <div className="fixed top-6 right-6 z-50 flex gap-4">
                        <a href="junior-chemistry-curriculum.html?stage=j" className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition-all shadow-lg flex items-center gap-2">
                            初中课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                        <a href="senior-chemistry-curriculum.html?stage=s" className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition-all shadow-lg flex items-center gap-2">
                            高中课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 items-center mb-20">
                            <div className="lg:col-span-12 xl:col-span-7">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-500 text-xs font-bold mb-6">
                                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                                    MOLECULAR ENGINE ACTIVE
                                </div>
                                <h1 className="text-6xl md:text-8xl font-bold mb-8 leading-tight">
                                    解构物质的<br />
                                    <span className="gradient-text">核心语法</span>
                                </h1>
                                <p className="text-xl text-slate-400 max-w-xl mb-10 leading-relaxed">
                                    探索原子间的能量交换。从元素周期表的奥秘到有机合成的无限可能，在数字化烧瓶中观测化学反应的真谛。
                                </p>
                                <div className="flex gap-4">
                                    <button className="bg-emerald-600 hover:bg-emerald-500 text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-emerald-500/20 flex items-center gap-3">
                                        进入仿真实验室 <FlaskConical className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>

                            {/* Periodic Table Teaser */}
                            <div className="hidden xl:block lg:col-span-5">
                                <div className="glass-card rounded-[3rem] p-8 relative h-full">
                                    <div className="grid grid-cols-5 gap-3 h-full">
                                        {[
                                            { s: 'H', n: 1, c: 'text-sky-400' }, { s: '', n: null }, { s: '', n: null }, { s: '', n: null }, { s: 'He', n: 2, c: 'text-rose-400' },
                                            { s: 'Li', n: 3, c: 'text-amber-400' }, { s: 'Be', n: 4, c: 'text-indigo-400' }, { s: 'B', n: 5, c: 'text-emerald-400' }, { s: 'C', n: 6, c: 'text-slate-300' }, { s: 'N', n: 7, c: 'text-emerald-400' },
                                            { s: 'O', n: 8, c: 'text-emerald-400' }, { s: 'F', n: 9, c: 'text-amber-400' }, { s: 'Ne', n: 10, c: 'text-rose-400' }, { s: 'Na', n: 11, c: 'text-amber-400' }, { s: 'Mg', n: 12, c: 'text-amber-400' }
                                        ].map((el, i) => (
                                            el.s ? (
                                                <div key={i} className="periodic-cell">
                                                    <span className="text-[8px] font-mono-atom text-slate-500 mb-1">{el.n}</span>
                                                    <span className={`text-xl font-bold ${el.c}`}>{el.s}</span>
                                                </div>
                                            ) : <div key={i}></div>
                                        ))}
                                    </div>
                                    <div className="absolute -bottom-4 -left-4 glass-card px-4 py-2 rounded-xl text-xs font-bold text-emerald-400 border border-emerald-500/30">
                                        Dynamic Periodic System
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Reaction Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-20">
                            <ReactionCard
                                type="Oxidation"
                                title="氧化还原反应"
                                icon={Atom}
                                color="text-amber-400"
                            />
                            <ReactionCard
                                type="Organic"
                                title="有机合成路径"
                                icon={FlaskRound}
                                color="text-indigo-400"
                            />
                            <ReactionCard
                                type="Inorganic"
                                title="离子平衡模拟"
                                icon={FlaskConical}
                                color="text-sky-400"
                            />
                            <ReactionCard
                                type="Safety"
                                title="实验室安全协议"
                                icon={ShieldCheck}
                                color="text-emerald-400"
                            />
                        </div>

                        {/* Lab Info */}
                        <div className="glass-card rounded-[3rem] p-12 text-center relative overflow-hidden">
                            <h2 className="text-3xl font-bold mb-6">准备好调制你的第一个反应了吗？</h2>
                            <p className="text-slate-400 mb-10 max-w-xl mx-auto">
                                沉浸式粒子系统将实时展示化学键的断裂与重组，让看不见的微观反应在屏幕前变得生动可触。
                            </p>
                            <button className="bg-emerald-600 hover:bg-emerald-500 text-white px-12 py-4 rounded-full font-bold shadow-2xl transition-all hover:scale-105 active:scale-95">
                                初始化虚拟反应釜
                            </button>
                        </div>
                    </main>

                    <footer className="mt-24 py-16 border-t border-white/5 text-center text-slate-500 text-xs font-bold uppercase tracking-widest font-mono-atom">
                        © 2025 Molecular Chemistry Hub | Atomically Precise Education
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
