<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学分子中心 | Chemistry Molecular Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->

    <!-- Tailwind CSS -->
    

    <!-- Google Fonts -->
    <link
        href="https://fonts.loli.net/css2?family=Quicksand:wght@400;700&family=Outfit:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"

    <style>
        :root {
            --primary: #10b981;
            /* emerald-500 */
            --primary-glow: rgba(16, 185, 129, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .font-quick {
            font-family: 'Quicksand', sans-serif;
        }

        .font-mono-atom {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .molecular-pattern {
            background-image:
                radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, transparent 1px);
            background-size: 40px 40px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes bubble {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }

        .bubble {
            position: absolute;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: bubble 4s ease-in infinite;
        }

        .periodic-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            transition: all 0.2s;
            cursor: pointer;
        }

        .periodic-cell:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
            transform: scale(1.1);
            z-index: 10;
        }

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>
