                                                <div 
                                                    key={`${track.id}-${stage.id}`}
                                                    onClick={() => { setSelectedNode(data); setSelectedStage(stage); }}
                                                    className="glass-card rounded-[2rem] p-8 cursor-pointer relative overflow-hidden group/card"
                                                >
                                                    <div className={`absolute top-0 right-0 w-24 h-24 bg-gradient-to-br ${stage.glow} to-transparent opacity-0 group-hover/card:opacity-100 transition-opacity`}></div>
                                                    <h5 className="text-xl font-bold text-gray-100 mb-4 group-hover/card:text-red-400 transition-colors">{data?.title || "规划中..."}</h5>
                                                    <div className="space-y-4">
                                                        <div className="flex flex-wrap gap-2">
                                                            {data?.core.slice(0, 2).map((c, i) => (
                                                                <span key={i} className="text-[10px] bg-white/5 px-2 py-1 rounded-md text-gray-400 border border-white/5">{c}</span>
                                                            ))}
                                                        </div>
                                                        <p className="text-xs text-gray-500 line-clamp-3 leading-loose">{data?.desc}</p>
                                                    </div>
                                                    <div className="mt-8 flex items-center justify-between">
                                                        <div className="flex gap-1.5">
                                                            <div className="w-1.5 h-1.5 rounded-full bg-red-500"></div>
                                                            <div className="w-1.5 h-1.5 rounded-full bg-blue-500 opacity-30"></div>
                                                            <div className="w-1.5 h-1.5 rounded-full bg-amber-500 opacity-30"></div>
                                                        </div>
                                                        <span className="text-[10px] text-gray-600 font-mono">EXPLORE →</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    <DetailModal 
                        isOpen={!!selectedNode} 
                        onClose={() => { setSelectedNode(null); setSelectedStage(null); }} 
                        data={selectedNode} 
                        stage={selectedStage} 
                    />

                    <footer className="py-20 border-t border-white/5 bg-black/50 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-6 text-center">
                            <p className="text-gray-600 text-sm mb-4">© TITAN OS ACADEMIC CENTER · 科技特长生人文底座规划</p>
                            <div className="flex justify-center gap-8 text-gray-400 text-xs font-chinese">
                                <span>博学之</span><span>审问之</span><span>慎思之</span><span>明辨之</span><span>笃行之</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
