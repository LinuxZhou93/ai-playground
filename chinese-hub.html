<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语文学习中心 | Chinese Learning Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Zhi+Mang+Xing&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #fb7185;
            --primary-glow: rgba(251, 113, 133, 0.4);
            --sidebar-width: 280px;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            position: relative;
        }

        /* Sidebar Styling Sync */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            z-index: 40;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 2.5rem 2rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, #be123c 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .main-content {
            flex: 1;
            height: 100%;
            overflow-y: auto;
            position: relative;
            background: transparent;
        }

        .font-ink {
            font-family: 'Zhi Mang Xing', cursive;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gradient-text {
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chinese-pattern {
            background-image: radial-gradient(rgba(225, 29, 72, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .scroller::-webkit-scrollbar {
            width: 6px;
        }

        .scroller::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroller::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <div id="root" class="app-container"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Book = (props) => <IconBase {...props}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></IconBase>;
        const PenTool = (props) => <IconBase {...props}><path d="m12 19 7-7 3 3-7 7-3-3z" /><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" /><path d="m2 2 5 2.3" /><path d="m2 2 2.3 5" /></IconBase>;
        const Library = (props) => <IconBase {...props}><path d="m16 6 4 14" /><path d="M12 6v14" /><path d="M8 8v12" /><path d="M4 4v16" /></IconBase>;
        const Scroll = (props) => <IconBase {...props}><path d="M19 17V5a2 2 0 0 0-2-2H4" /><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 0 0 2 2H8" /><path d="M15 21v-2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2" /><path d="M8 21v-2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></IconBase>;
        const Box = (props) => <IconBase {...props}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><polyline points="3.29 7 12 12 20.71 7" /><line x1="12" y1="22" x2="12" y2="12" /></IconBase>;
        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></IconBase>;
        const Brush = (props) => <IconBase {...props}><path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08" /><path d="M7.07 14.94c-3.91 3.91-4.63 9.06-4.63 9.06s5.15-.73 9.06-4.63" /><path d="m9.06 11.9 3.04 3.04" /></IconBase>;
        const Sparkles = (props) => <IconBase {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><path d="M5 3v4" /><path d="M19 17v4" /><path d="M3 5h4" /><path d="M17 19h4" /></IconBase>;

        const FeatureCard = ({ icon: Icon, title, desc, tag, color }) => (
            <div className="glass-card rounded-3xl p-6 relative overflow-hidden group cursor-pointer">
                <div className={`absolute top-0 right-0 w-32 h-32 opacity-10 group-hover:opacity-20 transition-all duration-700 transform translate-x-8 -translate-y-8 group-hover:scale-125 ${color}`}>
                    <Icon className="w-full h-full" />
                </div>
                <div className="relative z-10">
                    <span className={`px-3 py-1 rounded-full text-[10px] font-bold border ${color.replace('text-', 'border-').replace('-400', '-500/30')} ${color.replace('text-', 'bg-').replace('-400', '-500/10')} mb-4 inline-block`}>
                        {tag}
                    </span>
                    <h3 className="text-xl font-bold mb-2 group-hover:text-rose-400 transition-colors">{title}</h3>
                    <p className="text-slate-400 text-sm leading-relaxed">{desc}</p>
                </div>
            </div>
        );

        const LearningPath = () => (
            <div className="w-full mt-12 bg-slate-900/40 rounded-[3rem] p-8 border border-slate-800/50">
                <div className="flex items-center justify-between mb-8 px-4">
                    <h2 className="text-2xl font-bold">学习路径 <span className="text-slate-500 font-normal">Learning Path</span></h2>
                    <div className="flex gap-2">
                        <div className="w-8 h-1 bg-rose-500 rounded-full"></div>
                        <div className="w-4 h-1 bg-slate-700 rounded-full"></div>
                        <div className="w-4 h-1 bg-slate-700 rounded-full"></div>
                    </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-4 gap-6 relative">
                    {/* Progress Line */}
                    <div className="hidden md:block absolute top-1/2 left-0 w-full h-0.5 bg-slate-800 -translate-y-1/2 z-0"></div>

                    {[
                        { title: "识字筑基", icon: LayoutGrid, status: "completed", n: "01" },
                        { title: "经典诵读", icon: Scroll, status: "current", n: "02" },
                        { title: "文学创作", icon: PenTool, status: "locked", n: "03" },
                        { title: "哲学思辨", icon: Library, status: "locked", n: "04" },
                    ].map((step, i) => (
                        <div key={i} className="relative z-10 flex flex-col items-center">
                            <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 transition-all duration-500 ${step.status === 'completed' ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30' :
                                step.status === 'current' ? 'bg-slate-800 border-2 border-rose-500 text-rose-500' :
                                    'bg-slate-800 text-slate-500 grayscale'
                                }`}>
                                <step.icon className="w-8 h-8" />
                            </div>
                            <span className="text-xs text-slate-500 mb-1 font-mono">{step.n}</span>
                            <h4 className={`font-bold ${step.status === 'locked' ? 'text-slate-500' : 'text-white'}`}>{step.title}</h4>
                        </div>
                    ))}
                </div>
            </div>
        );

        const SidebarItem = ({ icon: Icon, label, active, onClick }) => (
            <div

            >
                <Icon className="w-5 h-5" />
                <span className="text-sm font-medium">{label}</span>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');

            return (
                <div className="flex w-full h-full overflow-hidden">
                    {/* Sidebar */}
                    <aside className="sidebar">
                        <div className="sidebar-header">
                            <div className="logo-area mb-12">
                                <div className="logo-box">
                                    <Book className="text-white w-6 h-6" />
                                </div>
                                <div className="flex flex-col">
                                    <span className="font-bold text-lg tracking-tight">Psyche-X</span>
                                    <span className="text-[10px] text-rose-500 font-bold uppercase tracking-widest">Chinese Hub</span>
                                </div>
                            </div>

                            <nav className="space-y-2">
                                <SidebarItem icon={Home} label="首页" active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                                <SidebarItem icon={Library} label="图书馆" active={activeTab === 'library'} onClick={() => setActiveTab('library')} />
                                <SidebarItem icon={PenTool} label="创作工坊" active={activeTab === 'writing'} onClick={() => setActiveTab('writing')} />
                                <SidebarItem icon={Scroll} label="研修课" active={activeTab === 'courses'} onClick={() => setActiveTab('courses')} />
                            </nav>
                        </div>

                        <div className="mt-auto p-8 border-t border-white/5">
                            <button
                                onClick={() => window.location.href = 'index.html'}
                                className="w-full py-3 rounded-xl bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white text-xs font-bold transition-all border border-white/10 flex items-center justify-center gap-2"
                            >
                                <ArrowRight className="w-4 h-4 rotate-180" />
                                返回基站
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="main-content scroller">
                        {/* Sticky Inline Header */}
                        <header className="h-20 px-12 flex items-center justify-between border-b border-white/5 sticky top-0 bg-slate-950/20 backdrop-blur-xl z-30">
                            <div className="flex items-center gap-8">
                                <h2 className="text-sm font-bold tracking-widest text-slate-500 uppercase">Neural Connection: Active</h2>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="flex bg-white/5 p-1 rounded-xl">
                                    <button className="px-3 py-1.5 rounded-lg bg-rose-500 text-white text-[10px] font-bold">CN</button>
                                    <button className="px-3 py-1.5 rounded-lg text-slate-500 text-[10px] font-bold hover:text-white transition">EN</button>
                                </div>
                                <a href="chinese-curriculum.html" className="h-10 px-6 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold flex items-center gap-2 transition-all shadow-lg shadow-rose-600/20">
                                    查看课标 <LayoutGrid className="w-4 h-4" />
                                </a>
                            </div>
                        </header>

                        <div className="px-12 py-12">
                            {/* Hero Section */}
                            <div className="flex flex-col xl:flex-row items-center gap-16 mb-24 anim-fade-in">
                                <div className="flex-1">
                                    <span className="inline-block px-4 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-500 text-xs font-bold tracking-widest uppercase mb-8">
                                        Traditional Meets Modern
                                    </span>
                                    <h1 className="text-6xl md:text-7xl font-ink mb-8 text-white leading-tight">
                                        书香<span className="gradient-text">墨意</span>，<br />
                                        感悟华夏之魂
                                    </h1>
                                    <p className="text-lg text-slate-400 max-w-xl leading-relaxed mb-10">
                                        在这里，文字不再是枯燥的符号，而是流淌在指尖的历史与情感。探索中文之美，从一撇一捺开始。
                                    </p>
                                    <div className="flex flex-wrap gap-4">
                                        <button className="bg-rose-600 text-white px-10 py-4 rounded-2xl font-bold hover:bg-rose-500 transition-all shadow-xl shadow-rose-600/20 hover:-translate-y-1">开始探索</button>
                                        <button className="glass-card px-10 py-4 rounded-2xl font-bold text-white hover:bg-white/10 transition-all">每日一诗</button>
                                    </div>
                                </div>
                                <div className="flex-1 relative">
                                    <div className="w-full aspect-square max-w-md mx-auto relative group">
                                        <div className="absolute inset-0 bg-rose-500/20 rounded-full blur-[100px] animate-pulse"></div>
                                        <div className="relative z-10 w-full h-full glass-card rounded-[3rem] p-4 flex items-center justify-center overflow-hidden border border-rose-500/20">
                                            <div className="absolute top-0 left-0 w-full h-full opacity-10 chinese-pattern"></div>
                                            <span className="text-[14rem] font-ink text-rose-500/30 select-none group-hover:scale-110 transition-transform duration-1000">语</span>
                                        </div>
                                        {/* Dynamic Badges */}
                                        <div className="absolute -top-6 -right-6 glass-card p-5 rounded-3xl shadow-2xl animate-float">
                                            <span className="text-3xl font-ink text-rose-400">水墨丹青</span>
                                        </div>
                                        <div className="absolute -bottom-8 -left-8 glass-card p-5 rounded-3xl shadow-2xl animate-float" style={{ animationDelay: '-2s' }}>
                                            <span className="text-3xl font-ink text-amber-400">词意万千</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Feature Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <FeatureCard
                                    icon={Library}
                                    title="思辨研讨区"
                                    desc="就经典议题展开跨时空对话。培养严谨的逻辑表达与批判性思维能力。"
                                    tag="PHILOSOPHY"
                                    color="text-amber-400"
                                />
                                <FeatureCard
                                    icon={PenTool}
                                    title="创作工坊"
                                    desc="从创意火花到锦绣文章，AI辅助您的文学创作之路。"
                                    tag="WRITING"
                                    color="text-amber-400"
                                />
                                <FeatureCard
                                    icon={Scroll}
                                    title="跨学科技能"
                                    desc="探索语文与其他学科的融合，通过史学语感构建全面认知。"
                                    tag="SYNERGY"
                                    color="text-sky-400"
                                />
                            </div>

                            {/* Learning Path Component */}
                            <LearningPath />

                            {/* Synchronized Classroom (SmartEdu Integration) */}
                            <section className="mt-20">
                                <div className="flex items-center justify-between mb-8">
                                    <div>
                                        <h2 className="text-3xl font-bold flex items-center gap-3">
                                            <div className="w-1.5 h-8 bg-rose-500 rounded-full"></div>
                                            国家智慧教育同步课堂

                                    <a href="https://basic.smartedu.cn/syncClassroom" target="_blank" className="bg-white/5 hover:bg-white/10 text-rose-400 px-6 py-2 rounded-full font-bold text-sm border border-rose-500/20 transition-all">
                                        访问国家平台总入口
                                    </a>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    {/* Textbook Focus */}
                                    <div className="glass-card rounded-[2.5rem] p-8 flex flex-col md:flex-row gap-8 items-center border border-rose-500/10">
                                        <div className="w-40 h-56 bg-slate-800 rounded-xl shadow-2xl relative overflow-hidden flex-shrink-0 group">
                                            <div className="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent z-10"></div>
                                            <div className="absolute inset-0 flex items-center justify-center p-4 text-center z-20">
                                                <span className="text-2xl font-ink text-white">语文<br /><span className="text-sm font-sans opacity-60">一年级 上册</span></span>
                                            </div>

                                        </div>
                                        <div className="flex-1">
                                            <div className="inline-block px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-500 text-[10px] font-bold mb-3">当前学段推荐</div>
                                            <h3 className="text-2xl font-bold mb-4 font-ink tracking-wider">一年级 · 语文 · 统编版</h3>
                                            <div className="space-y-3">
                                                <a href="https://basic.smartedu.cn/syncClassroom?defaultTag=e7bbb2de-0590-11ed-9c79-92fc3b3249d5%2Fe7bbd296-0590-11ed-9c79-92fc3b3249d5%2F6a749654-0772-11ed-ac74-092ab92074e6%2F44bee8bc-54e6-11ed-9c34-850ba61fa9f4%2Fff8080814371757b014390f883db0453%2F5136342961" target="_blank" className="flex items-center justify-between p-3 rounded-xl bg-white/5 hover:bg-white/10 transition-colors group">
                                                    <span className="text-sm text-slate-300 group-hover:text-rose-400 transition-colors">第一单元：识字 - 《我是中国人》</span>
                                                    <span className="text-[10px] font-bold text-slate-500">名师视频</span>

                                                    <span className="text-[10px] font-bold text-slate-500">资源包</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Resource Mini Grid */}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="glass-card rounded-3xl p-6 border-t-2 border-rose-500/50">
                                            <div className="text-3xl font-ink text-rose-500 mb-2">咏鹅</div>
                                            <p className="text-xs text-slate-400 mb-4">同步名家诵读解析</p>
                                            <button className="text-[10px] font-bold text-rose-400 flex items-center gap-1 group">
                                                立即播放 <span className="group-hover:translate-x-1 transition-transform">→</span>

                                        </div>

                                        <div className="glass-card rounded-3xl p-6 border-t-2 border-amber-500/50">

                                            <button className="text-[10px] font-bold text-amber-400 flex items-center gap-1 group">
                                                进入训练 <span className="group-hover:translate-x-1 transition-transform">→</span>
                                            </button>
                                        </div>
                                        <div className="col-span-2 glass-card rounded-3xl p-6 flex items-center justify-between bg-gradient-to-r from-rose-500/5 to-transparent border-l-4 border-rose-500">
                                            <div>
                                                <h4 className="font-bold text-lg">智能同步练习</h4>
                                                <p className="text-xs text-slate-500 mt-1">基于国家平台知识点图谱生成的自适应练习</p>
                                            </div>
                                            <button className="bg-rose-600 text-white px-6 py-2 rounded-full text-xs font-bold shadow-lg shadow-rose-600/20">开始刷题</button>
                                        </div>
                                    </div>
                                </div>
                            </section>

                            {/* Existing Resources Section */}
                            <section className="mt-20">
                                <div className="flex items-center justify-between mb-10">
                                    <h2 className="text-3xl font-bold">校本研修资源 <span className="text-slate-500 text-lg font-normal ml-2">School-based Resources</span></h2>
                                    <button className="text-rose-400 font-bold hover:underline">查看全部</button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {[
                                        { title: "《诗经》审美初探", type: "精读课", img: "bg-gradient-to-br from-rose-500/20 to-slate-900" },
                                        { title: "中国文人画的文学意境", type: "跨学科", img: "bg-gradient-to-br from-amber-500/20 to-slate-900" },
                                        { title: "现代散文写作指南", type: "实战", img: "bg-gradient-to-br from-indigo-500/20 to-slate-900" },
