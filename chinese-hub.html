<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语文学习中心 | Chinese Learning Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Zhi+Mang+Xing&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #e11d48;
            --primary-glow: rgba(225, 29, 72, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', 'Noto Serif SC', serif;
            overflow-x: hidden;
        }

        .font-ink {
            font-family: 'Zhi Mang Xing', cursive;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(225, 29, 72, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px var(--primary-glow);
        }

        .neon-border {
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .gradient-text {
            background: linear-gradient(135deg, #fb7185 0%, #e11d48 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chinese-pattern {
            background-image: radial-gradient(rgba(225, 29, 72, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .scroll-hide::-webkit-scrollbar {
            display: none;
        }

        .ink-reveal {
            animation: inkReveal 2s ease-out forwards;
        }

        @keyframes inkReveal {
            from {
                opacity: 0;
                filter: blur(10px);
            }

            to {
                opacity: 1;
                filter: blur(0);
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Book = (props) => <IconBase {...props}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></IconBase>;
        const PenTool = (props) => <IconBase {...props}><path d="m12 19 7-7 3 3-7 7-3-3z" /><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" /><path d="m2 2 5 2.3" /><path d="m2 2 2.3 5" /></IconBase>;
        const Library = (props) => <IconBase {...props}><path d="m16 6 4 14" /><path d="M12 6v14" /><path d="M8 8v12" /><path d="M4 4v16" /></IconBase>;
        const Scroll = (props) => <IconBase {...props}><path d="M19 17V5a2 2 0 0 0-2-2H4" /><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 0 0 2 2H8" /><path d="M15 21v-2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2" /><path d="M8 21v-2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;

        const FeatureCard = ({ icon: Icon, title, desc, tag, color }) => (
            <div className="glass-card rounded-3xl p-6 relative overflow-hidden group cursor-pointer">
                <div className={`absolute top-0 right-0 w-32 h-32 opacity-10 group-hover:opacity-20 transition-all duration-700 transform translate-x-8 -translate-y-8 group-hover:scale-125 ${color}`}>
                    <Icon className="w-full h-full" />
                </div>
                <div className="relative z-10">
                    <span className={`px-3 py-1 rounded-full text-[10px] font-bold border ${color.replace('text-', 'border-').replace('-400', '-500/30')} ${color.replace('text-', 'bg-').replace('-400', '-500/10')} mb-4 inline-block`}>
                        {tag}
                    </span>
                    <h3 className="text-xl font-bold mb-2 group-hover:text-rose-400 transition-colors">{title}</h3>
                    <p className="text-slate-400 text-sm leading-relaxed">{desc}</p>
                </div>
            </div>
        );

        const LearningPath = () => (
            <div className="w-full mt-12 bg-slate-900/40 rounded-[3rem] p-8 border border-slate-800/50">
                <div className="flex items-center justify-between mb-8 px-4">
                    <h2 className="text-2xl font-bold">学习路径 <span className="text-slate-500 font-normal">Learning Path</span></h2>
                    <div className="flex gap-2">
                        <div className="w-8 h-1 bg-rose-500 rounded-full"></div>
                        <div className="w-4 h-1 bg-slate-700 rounded-full"></div>
                        <div className="w-4 h-1 bg-slate-700 rounded-full"></div>
                    </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-4 gap-6 relative">
                    {/* Progress Line */}
                    <div className="hidden md:block absolute top-1/2 left-0 w-full h-0.5 bg-slate-800 -translate-y-1/2 z-0"></div>

                    {[
                        { title: "识字筑基", icon: LayoutGrid, status: "completed", n: "01" },
                        { title: "经典诵读", icon: Scroll, status: "current", n: "02" },
                        { title: "文学创作", icon: PenTool, status: "locked", n: "03" },
                        { title: "哲学思辨", icon: Library, status: "locked", n: "04" },
                    ].map((step, i) => (
                        <div key={i} className="relative z-10 flex flex-col items-center">
                            <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mb-4 transition-all duration-500 ${step.status === 'completed' ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30' :
                                step.status === 'current' ? 'bg-slate-800 border-2 border-rose-500 text-rose-500' :
                                    'bg-slate-800 text-slate-500 grayscale'
                                }`}>
                                <step.icon className="w-8 h-8" />
                            </div>
                            <span className="text-xs text-slate-500 mb-1 font-mono">{step.n}</span>
                            <h4 className={`font-bold ${step.status === 'locked' ? 'text-slate-500' : 'text-white'}`}>{step.title}</h4>
                        </div>
                    ))}
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative pb-20 chinese-pattern">
                    {/* Floating Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-6 py-3 flex items-center gap-8 border border-white/10 shadow-2xl">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-rose-400 font-bold text-sm">首页</a>
                        <a href="#" className="text-slate-400 hover:text-rose-400 transition-colors text-sm">图书馆</a>
                        <a href="#" className="text-slate-400 hover:text-rose-400 transition-colors text-sm">创作泉</a>
                        <a href="#" className="text-slate-400 hover:text-rose-400 transition-colors text-sm">社区</a>
                    </nav>

                    {/* Top Right Action */}
                    <div className="fixed top-6 right-6 z-50">
                        <a href="chinese-curriculum.html" className="flex items-center gap-2 bg-rose-600 hover:bg-rose-500 text-white px-5 py-2.5 rounded-full font-bold text-sm transition-all shadow-xl hover:scale-105 active:scale-95 group">
                            查看课标大纲
                            <LayoutGrid className="w-4 h-4 group-hover:rotate-90 transition-transform" />
                        </a>
                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero Section */}
                        <div className="flex flex-col md:flex-row items-center gap-12 mb-20 ink-reveal">
                            <div className="flex-1 text-center md:text-left">
                                <span className="inline-block px-4 py-1.5 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-500 text-xs font-bold tracking-widest uppercase mb-6">
                                    Traditional Meets Modern
                                </span>
                                <h1 className="text-5xl md:text-8xl font-ink mb-6 text-white leading-tight">
                                    书香<span className="gradient-text">墨意</span>，<br />
                                    感悟华夏之魂
                                </h1>
                                <p className="text-lg text-slate-400 max-w-xl leading-relaxed mb-8">
                                    在这里，文字不再是枯燥的符号，而是流淌在指尖的历史与情感。探索中文之美，从一撇一捺开始。
                                </p>
                                <div className="flex flex-wrap justify-center md:justify-start gap-4">
                                    <button className="bg-white text-slate-900 px-8 py-3 rounded-full font-bold hover:bg-rose-50 transition-colors shadow-lg">开始探索</button>
                                    <button className="glass-card px-8 py-3 rounded-full font-bold text-white hover:bg-white/10 transition-colors">每日一诗</button>
                                </div>
                            </div>
                            <div className="flex-1 relative">
                                <div className="w-full aspect-square max-w-md mx-auto relative">
                                    {/* Abstract Visual Decor */}
                                    <div className="absolute inset-0 bg-rose-500/20 rounded-full blur-[100px] animate-pulse"></div>
                                    <div className="relative z-10 w-full h-full glass-card rounded-[4rem] p-8 flex items-center justify-center overflow-hidden">
                                        <div className="absolute top-0 left-0 w-full h-full opacity-20 chinese-pattern"></div>
                                        <span className="text-[12rem] font-ink text-rose-500/30 select-none">语</span>
                                    </div>
                                    {/* Floating Badges */}
                                    <div className="absolute -top-4 -right-4 glass-card p-4 rounded-2xl animate-bounce" style={{ animationDuration: '3s' }}>
                                        <span className="text-2xl font-ink text-rose-400">水墨丹青</span>
                                    </div>
                                    <div className="absolute -bottom-6 -left-6 glass-card p-4 rounded-2xl animate-bounce" style={{ animationDuration: '4s' }}>
                                        <span className="text-2xl font-ink text-amber-400">词意万千</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Feature Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <FeatureCard
                                icon={Library}
                                title="古典经纬"
                                desc="沉浸式体验古文、诗词，穿越千年与圣贤对话。"
                                tag="LITERATURE"
                                color="text-rose-400"
                            />
                            <FeatureCard
                                icon={PenTool}
                                title="创作工坊"
                                desc="从创意火花到锦绣文章，AI辅助您的文学创作之路。"
                                tag="WRITING"
                                color="text-amber-400"
                            />
                            <FeatureCard
                                icon={Scroll}
                                title="跨学科技能"
                                desc="探索语文与其他学科的融合，通过史学语感构建全面认知。"
                                tag="SYNERGY"
                                color="text-sky-400"
                            />
                        </div>

                        {/* Learning Path Component */}
                        <LearningPath />

                        {/* Resources Section */}
                        <section className="mt-20">
                            <div className="flex items-center justify-between mb-10">
                                <h2 className="text-3xl font-bold">精选资源 <span className="text-slate-500 text-lg font-normal ml-2">Selected Resources</span></h2>
                                <button className="text-rose-400 font-bold hover:underline">查看全部</button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                                {[
                                    { title: "《诗经》审美初探", type: "精读课", img: "bg-gradient-to-br from-rose-500/20 to-slate-900" },
                                    { title: "中国文人画的文学意境", type: "跨学科", img: "bg-gradient-to-br from-amber-500/20 to-slate-900" },
                                    { title: "现代散文写作指南", type: "实战", img: "bg-gradient-to-br from-indigo-500/20 to-slate-900" },
                                    { title: "论语中的逻辑思维", type: "哲学", img: "bg-gradient-to-br from-emerald-500/20 to-slate-900" },
                                ].map((res, i) => (
                                    <div key={i} className="glass-card rounded-2xl overflow-hidden group cursor-pointer">
                                        <div className={`h-32 ${res.img} relative flex items-center justify-center transition-transform duration-500 group-hover:scale-110`}>
                                            <span className="text-4xl opacity-20 font-ink">资源</span>
                                        </div>
                                        <div className="p-4">
                                            <span className="text-[10px] text-rose-500 font-bold">{res.type}</span>
                                            <h4 className="font-bold mt-1 group-hover:text-rose-400 transition-colors">{res.title}</h4>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>

                    {/* Call to Action */}
                    <section className="mt-20 container mx-auto px-6">
                        <div className="glass-card rounded-[3rem] p-12 text-center relative overflow-hidden">
                            <div className="absolute inset-0 opacity-5 pointer-events-none chinese-pattern"></div>
                            <h2 className="text-4xl font-bold mb-6">准备好开启文学之旅了吗？</h2>
                            <p className="text-slate-400 mb-10 max-w-2xl mx-auto">
                                加入我们的社区，与全球数万名文学爱好者一起分享见解、磨砺笔锋。
                            </p>
                            <button className="bg-rose-600 hover:bg-rose-500 text-white px-12 py-4 rounded-full font-bold text-lg transition-all shadow-xl hover:scale-105">
                                立即注册免费体验
                            </button>
                        </div>
                    </section>

                    <footer className="mt-20 py-12 border-t border-slate-800 text-center text-slate-500 text-sm">
                        <p>© 2025 语文学习中心 - 构建全息文学认知系统</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
