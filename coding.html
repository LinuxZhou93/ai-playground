<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Coding Lab | 创意编程实验室</title>

    <!-- Dependencies (Libs Mode) -->
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/three.min.js"></script>

    <!-- Scripts -->
    <script src="assets/js/background-3d.js" defer></script>
    <link rel="stylesheet" href="assets/css/ai-assistant.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        scratch: { orange: '#FFAB19', purple: '#855CD6', cyan: '#4D97FF', green: '#4CBF56' },
                        odyssey: {
                            purple: '#8B5CF6',
                            cyan: '#06B6D4',
                            pink: '#EC4899',
                            amber: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            /* Slate-900 */
            color: white;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-slate-900 text-white overflow-x-hidden">
    <!-- 3D Background Canvas -->
    <canvas id="bg-canvas" class="fixed inset-0 z-0"></canvas>

    <div id="app" class="relative z-10">
        <!-- Navbar -->
        <nav class="sticky top-0 z-50 glass-panel border-b border-indigo-500/20">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div
                        class="w-8 h-8 rounded bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold">
                        C</div>
                    <span class="font-bold text-xl">Coding<span class="text-indigo-400">Lab</span></span>
                </div>
                <a href="index.html" class="text-sm text-slate-400 hover:text-white transition-colors">Home</a>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <!-- Hero Section -->
            <section class="min-h-[70vh] flex items-center justify-center mb-20 relative overflow-hidden rounded-3xl">
                <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/40 via-purple-900/40 to-pink-900/40">
                </div>
                <div class="relative z-10 text-center px-4 max-w-5xl">
                    <h1 class="text-6xl md:text-8xl font-black mb-6 leading-tight">
                        <span
                            class="bg-gradient-to-r from-white via-indigo-200 to-purple-200 bg-clip-text text-transparent">Code.</span>
                        <span
                            class="bg-gradient-to-r from-purple-200 via-pink-200 to-white bg-clip-text text-transparent">Create.</span>
                        <span
                            class="bg-gradient-to-r from-white via-cyan-200 to-indigo-200 bg-clip-text text-transparent">Inspire.</span>
                    </h1>
                    <p class="text-2xl md:text-3xl text-slate-300 mb-8 font-light">用代码点亮未来，让创意改变世界</p>
                    <div class="flex flex-wrap gap-4 justify-center">
                        <a href="#editors"
                            class="px-8 py-4 bg-white text-slate-900 rounded-full font-bold text-lg hover:scale-105 transition-transform shadow-2xl">开始探索</a>
                    </div>
                </div>
            </section>

            <!-- Editors Section -->
            <section id="editors" class="mb-20">
                <div class="text-center mb-12">
                    <h2
                        class="text-5xl font-black mb-4 bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                        选择你的编程之旅</h2>
                </div>

                <div class="grid md:grid-cols-2 gap-8 mb-8">
                    <!-- Scratch -->
                    <a href="ide-scratch.html" class="editor-card group block">
                        <div
                            class="glass-panel rounded-3xl p-8 border-2 border-indigo-500/30 hover:border-indigo-500 transition-all duration-500 hover:scale-105 hover:shadow-2xl hover:shadow-indigo-500/50">
                            <div class="flex items-start gap-6 mb-6">
                                <div
                                    class="w-24 h-24 rounded-2xl bg-gradient-to-br from-scratch-orange to-scratch-purple flex items-center justify-center text-5xl shadow-lg">
                                    S</div>
                                <div>
                                    <h3 class="text-3xl font-black text-white mb-2">Scratch 3.0</h3>
                                    <p class="text-indigo-400 font-bold mb-2">8+ 岁 | 图形化编程</p>
                                </div>
                            </div>
                            <span
                                class="block text-center px-6 py-3 bg-gradient-to-r from-scratch-purple to-scratch-cyan text-white rounded-xl font-bold">立即开始
                                &rarr;</span>
                        </div>
                    </a>

                    <!-- ScratchJr -->
                    <a href="ide-jr.html" class="editor-card group block">
                        <div
                            class="glass-panel rounded-3xl p-8 border-2 border-yellow-500/30 hover:border-yellow-500 transition-all duration-500 hover:scale-105 hover:shadow-2xl hover:shadow-yellow-500/50">
                            <div class="flex items-start gap-6 mb-6">
                                <div
                                    class="w-24 h-24 rounded-2xl bg-gradient-to-br from-yellow-400 to-orange-500 flex items-center justify-center text-5xl shadow-lg">
                                    Jr</div>
                                <div>
                                    <h3 class="text-3xl font-black text-white mb-2">ScratchJr</h3>
                                    <p class="text-yellow-400 font-bold mb-2">5-7 岁 | 触屏编程</p>
                                </div>
                            </div>
                            <span
                                class="block text-center px-6 py-3 bg-gradient-to-r from-yellow-500 to-orange-500 text-white rounded-xl font-bold">开始探索
                                &rarr;</span>
                        </div>
                    </a>
                </div>
            </section>

            <!-- Projects Section (Static) -->
            <section id="projects">
                <div class="text-center mb-12">
                    <h2
                        class="text-5xl font-black mb-4 bg-gradient-to-r from-purple-400 via-pink-400 to-orange-400 bg-clip-text text-transparent">
                        精选作品</h2>
                </div>
                <!-- Static Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Project 1 -->
                    <div
                        class="glass-panel rounded-2xl overflow-hidden group hover:border-indigo-500/50 transition-all hover:scale-105 cursor-pointer">
                        <div class="h-48 bg-slate-800 relative flex items-center justify-center text-slate-500">
                            <span class="text-4xl">🎮</span>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-white truncate mb-1">躲避球游戏</h3>
                            <p class="text-xs text-slate-400 line-clamp-2 mb-3">经典的躲避球游戏，控制角色躲避飞来的球。</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- AI Assistant -->
    <script src="assets/js/ai-assistant.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initAIAssistant === 'function') initAIAssistant('coding');
            if (typeof init3DScene === 'function') init3DScene();
        });
    </script>
</body>

</html>
