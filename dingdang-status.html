<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIT COMMAND STATUS</title>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;500;700;900&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/dingdang-status.css">
</head>
<body class="unit-status-page">
    
    <!-- HEADER & NAV -->
    <nav class="unit-nav">
        <div class="nav-brand" onclick="location.href='index.html'" style="cursor: pointer;">
            <div class="nav-logo-box"></div>
            <span>TITAN<span class="highlight">OS</span></span>
        </div>
        <div class="nav-title">DISTRIBUTED AUTONOMY MATRIX</div>
        <div class="nav-return" onclick="location.href='index.html'">EXIT TERMINAL</div>
    </nav>

    <div class="grid-overlay"></div>

    <!-- MAIN DASHBOARD -->
    <div class="unit-dashboard">
        
        <!-- TELEMETRY BAR -->
        <div class="telemetry-bar">
            <div class="telemetry-label">GLOBAL NETWORK</div>
            <div class="telemetry-data">
                <span class="t-key">LATENCY:</span><span class="t-val" id="net-latency">--</span>
                <span class="t-line"></span>
                <span class="t-key">DOWNLINK:</span><span class="t-val highlight" id="net-down">--</span>
                <span class="t-line"></span>
                <span class="t-key">UPLINK:</span><span class="t-val warning" id="net-up">--</span>
                <span class="t-line"></span>
                <span class="t-key">IP:</span><span class="t-val" id="net-ip">--</span>
                <span class="t-badge success" id="net-status">STABLE</span>
            </div>
        </div>

        <!-- UNITS SPREAD (4 Columns) -->
        <div id="units-container" class="units-grid">
            <!-- Populated by JS -->
            <div class="unit-col placeholder-col">
                <div class="skeleton-pulse"></div>
            </div>
            <div class="unit-col placeholder-col">
                <div class="skeleton-pulse" style="animation-delay: 0.2s"></div>
            </div>
            <div class="unit-col placeholder-col">
                <div class="skeleton-pulse" style="animation-delay: 0.4s"></div>
            </div>
            <div class="unit-col placeholder-col">
                <div class="skeleton-pulse" style="animation-delay: 0.6s"></div>
            </div>
        </div>

    </div>

    <script src="assets/js/dingdang-status.js"></script>
</body>
</html>
