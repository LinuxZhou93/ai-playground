<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叮当状态 | FUTURE AI</title>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/dingdang-status.css">
</head>
<body class="dingdang-status-page">
    
    <!-- HEADER -->
    <div class="header">
        <div class="logo-group">
            <div class="logo-main" onclick="location.href='index.html'" style="cursor: pointer;">
                <div class="logo-symbol">
                    <div class="s-circle"></div>
                    <div class="s-line"></div>
                </div>
                <div class="logo-text">
                    <span style="color:white;">FUTURE</span><span style="color:var(--primary);">AI</span>
                </div>
            </div>
            <div class="logo-sub">Holo Cluster Settings & Status</div>
        </div>
        <div class="header-status">
            <div class="status-pill" onclick="location.href='index.html'" style="cursor:pointer; background:rgba(255,255,255,0.1)">
                ← 返回主页
            </div>
        </div>
    </div>

    <!-- MAIN FULLSCREEN DASHBOARD -->
    <div class="dingdang-dashboard-wrapper">
        <div class="dingdang-dashboard-header">
            <h1 class="dingdang-title">CLUSTER COMPUTE NODES</h1>
            <p class="dingdang-subtitle">Real-time status of distributed Mac instances / 叮当分布式计算节点实时状态</p>
        </div>
        
        <div id="mac-status-container" class="dingdang-grid">
            <!-- Loading State -->
            <div class="dingdang-card">
                <div class="card-header-row">
                    <div class="card-title-group">
                        <span class="node-name">Initializing...</span>
                    </div>
                    <div class="status-badge offline">AWAITING</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Background Effects -->
    <div id="particles-js" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none;"></div>

    <script src="assets/js/dingdang-status.js"></script>
</body>
</html>
