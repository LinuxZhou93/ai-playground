<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dino World V2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            color: #0f0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        canvas {
            border: 1px solid #333;
        }

        .back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            border: 1px solid white;
            padding: 5px 15px;
            border-radius: 4px;
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>
    <a href="index.html" class="back">← BACK</a>
    <canvas id="game" width="800" height="400"></canvas>
    <h2 style="color:white; margin-top:20px;">DINO WORLD PREVIEW</h2>
    <p style="color:#666">Press SPACE to Jump</p>
    <script>
        // Simple Dino Runner
        const c = document.getElementById('game');
        const ctx = c.getContext('2d');
        let dino = { x: 50, y: 350, w: 30, h: 30, dy: 0, jump: false };
        let obs = [];
        let frame = 0;

        function update() {
            frame++;
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 800, 400);

            // Ground
            ctx.strokeStyle = 'white'; ctx.beginPath(); ctx.moveTo(0, 380); ctx.lineTo(800, 380); ctx.stroke();

            // Dino
            if (dino.jump) { dino.dy = -10; dino.jump = false; }
            dino.y += dino.dy;
            dino.dy += 0.5; // Gravity
            if (dino.y > 350) { dino.y = 350; dino.dy = 0; }

            ctx.fillStyle = '#00E676';
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);

            // Obstacles
            if (frame % 100 === 0) obs.push({ x: 800, y: 350, w: 20, h: 30 });
            obs.forEach((o, i) => {
                o.x -= 5;
                ctx.fillStyle = '#FF2E93'; ctx.fillRect(o.x, o.y, o.w, o.h);
                if (o.x < -20) obs.splice(i, 1);
            });

            requestAnimationFrame(update);
        }
        document.addEventListener('keydown', (e) => { if (e.code === 'Space') dino.jump = true; });
        update();
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.22_2"></script>
</body>

</html>
