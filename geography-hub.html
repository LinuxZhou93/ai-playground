<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地理探索中心 | Geography & Earth Science Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Syne:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6;
            /* blue-500 */
            --primary-glow: rgba(59, 130, 246, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .font-syne {
            font-family: 'Syne', sans-serif;
        }

        .font-mono-geo {
            font-family: 'JetBrains Mono', monospace;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .earth-grid {
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes rotate-globe {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .rotate-globe {
            animation: rotate-globe 20s linear infinite;
        }

        .coord-overlay {
            position: absolute;
            font-size: 10px;
            color: rgba(59, 130, 246, 0.3);
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Globe = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></IconBase>;
        const Map = (props) => <IconBase {...props}><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" /><line x1="9" x2="9" y1="3" y2="18" /><line x1="15" x2="15" y1="6" y2="21" /></IconBase>;
        const Mountain = (props) => <IconBase {...props}><path d="m8 3 4 8 5-5 5 15H2L8 3z" /></IconBase>;
        const Compass = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;

        const EcoModule = ({ title, category, icon: Icon, color }) => (
            <div className="glass-card rounded-2xl p-6 group cursor-pointer relative overflow-hidden">
                <div className={`absolute -bottom-6 -right-6 p-8 opacity-5 group-hover:opacity-10 transition-all duration-700 ${color}`}>
                    <Icon className="w-24 h-24" />
                </div>
                <div className="relative z-10">
                    <span className={`text-[10px] font-bold tracking-widest uppercase mb-2 block ${color}`}>{category}</span>
                    <h3 className="text-xl font-bold mb-4 group-hover:text-blue-400 transition-colors">{title}</h3>
                    <div className="h-0.5 w-full bg-slate-800 rounded-full mb-4">
                        <div className="h-full bg-blue-500 w-1/4 group-hover:w-full transition-all duration-500"></div>
                    </div>
                    <div className="flex items-center gap-2 text-slate-500 text-xs font-bold uppercase transition-colors group-hover:text-white">
                        Access GIS <Compass className="w-3 h-3" />
                    </div>
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative earth-grid pb-20">
                    <div className="coord-overlay top-4 left-4">LAT: 39.9042° N</div>
                    <div className="coord-overlay top-4 right-4">LNG: 116.4074° E</div>
                    <div className="coord-overlay bottom-4 left-4">ALT: 42.5m</div>
                    <div className="coord-overlay bottom-4 right-4">V_WIND: 12km/h SE</div>

                    {/* Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-8 py-3 flex items-center gap-10 border border-white/10">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-blue-400 font-bold text-xs uppercase tracking-widest">Hydrosphere</a>
                        <a href="#" className="text-slate-400 hover:text-blue-400 transition-colors text-xs uppercase tracking-widest">Geosphere</a>
                        <a href="#" className="text-slate-400 hover:text-blue-400 transition-colors text-xs uppercase tracking-widest">Atmosphere</a>
                    </nav>

                    {/* Standards */}
                    <div className="fixed top-6 right-6 z-50">
                        <a href="geography-curriculum.html?stage=p" className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-6 py-2.5 rounded-full font-bold text-sm transition-all shadow-xl shadow-blue-500/20">
                            查看全阶段课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 items-center mb-24">
                            <div className="lg:col-span-12 xl:col-span-7">
                                <div className="inline-flex items-center gap-3 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-500 text-xs font-bold mb-6 font-mono-geo">
                                    <div className="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                                    GLOBAL_SCAN: SYNC_COMPLETE
                                </div>
                                <h1 className="text-6xl md:text-8xl font-syne font-bold mb-8 leading-none">
                                    触碰地球的<br />
                                    <span className="gradient-text">核心脉动</span>
                                </h1>
                                <p className="text-xl text-slate-400 max-w-xl mb-10 leading-relaxed font-light">
                                    不只是地图的堆砌。从大气的能量循环到人类文明的聚落演化，在数字孪生的地球模型中，洞察自然与社会的交响。
                                </p>
                                <div className="flex gap-4">
                                    <button className="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-blue-500/20 flex items-center gap-3 transition-all">
                                        开启全景视角 <Globe className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>

                            {/* Globe Visual */}
                            <div className="hidden xl:block lg:col-span-5 relative">
                                <div className="relative w-full aspect-square">
                                    <div className="absolute inset-0 bg-blue-500/10 blur-[120px] rounded-full"></div>
                                    <div className="relative z-10 glass-card rounded-full p-20 border border-blue-500/20 overflow-hidden flex items-center justify-center">
                                        <div className="rotate-globe text-blue-500/20">
                                            <Globe className="w-64 h-64" />
                                        </div>
                                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center">
                                            <div className="text-4xl font-syne font-bold text-blue-400 mb-1">TERRA</div>
                                            <div className="text-[10px] font-mono-geo text-slate-500 tracking-[0.4em] uppercase">Digital Twin</div>
                                        </div>
                                    </div>
                                    {/* Floating Stats */}
                                    <div className="absolute top-0 right-0 glass-card p-4 rounded-xl border border-blue-500/30">
                                        <div className="text-[10px] text-slate-500 font-bold mb-1">POPULATION</div>
                                        <div className="text-blue-400 font-mono-geo font-bold">8,092,421,003</div>
                                    </div>
                                    <div className="absolute bottom-10 left-0 glass-card p-4 rounded-xl border border-emerald-500/30">
                                        <div className="text-[10px] text-slate-500 font-bold mb-1">FOREST COVER</div>
                                        <div className="text-emerald-400 font-mono-geo font-bold">31.2%</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Ecology Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-20">
                            <EcoModule
                                category="Climatology"
                                title="极端气候监测"
                                icon={Globe}
                                color="text-sky-400"
                            />
                            <EcoModule
                                category="Cartography"
                                title="高斯-克吕格投影"
                                icon={Map}
                                color="text-emerald-400"
                            />
                            <EcoModule
                                category="Geomorphology"
                                title="板块构造模拟"
                                icon={Mountain}
                                color="text-amber-400"
                            />
                            <EcoModule
                                category="Economy"
                                title="区域可持续发展"
                                icon={Compass}
                                color="text-blue-400"
                            />
                        </div>

                        {/* GIS Section */}
                        <section className="bg-slate-900/40 rounded-[3rem] p-12 md:p-20 border border-white/5 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-10 opacity-10"><Map className="w-80 h-80" /></div>
                            <div className="relative z-10 max-w-2xl">
                                <h2 className="text-4xl font-syne font-bold mb-6">地理信息系统 (GIS) 重构</h2>
                                <p className="text-slate-400 text-lg mb-10 leading-relaxed font-light">
                                    我们不带你死记硬背地名。在这里，你可以操作专业级的 GIS 系统，将多层空间属性数据进行叠加，从纷繁复杂的自然与人文要素中，提炼出区域平衡的终极逻辑。
                                </p>
                                <button className="bg-white text-slate-900 px-8 py-3 rounded-full font-bold hover:bg-blue-50 transition-colors uppercase text-sm tracking-widest">
                                    进入空间分析实验室
                                </button>
                            </div>
                        </section>
                    </main>

                    <footer className="mt-24 py-16 border-t border-white/5 text-center text-slate-600 text-[10px] font-mono-geo tracking-[0.5em] uppercase">
                        © 2025 Geography Hub | Understanding the Interconnected Earth
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
