<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Learning Hub V3 | Titan Intelligence</title>
    <link
        href="https://fonts.loli.net/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;500;700&family=Orbitron:wght@500;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-deep: #020617;
            --sidebar-w: 260px;
            --accent-blue: #3b82f6;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-p: #94a3b8;
            --text-h: #f8fafc;
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 10px;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-h);
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-w);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .logo {
            font-family: 'Orbitron';
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(90deg, #fff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .check-in-widget {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(124, 58, 237, 0.1));
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .check-in-header {
            font-size: 11px;
            color: var(--text-p);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card h4 {
            margin: 0;
            font-size: 18px;
            color: var(--text-h);
        }

        .stat-card p {
            margin: 0;
            font-size: 10px;
            color: var(--text-p);
        }

        .check-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }

        .check-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.2);
        }

        .check-btn.completed {
            background: #059669;
            cursor: default;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 10px;
            color: var(--text-p);
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--glass-bg);
            color: var(--accent-blue);
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-w);
            padding: 40px 60px;
        }

        .search-area {
            position: sticky;
            top: 0;
            padding: 20px 0;
            background: var(--bg-deep);
            z-index: 900;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .search-inner {
            flex: 1;
            position: relative;
        }

        .search-inner input {
            width: 100%;
            padding: 15px 50px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .search-inner i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-p);
        }

        /* --- Course Grid --- */
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0 20px;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            /* 增大卡片，减少列数，解决看不清 */
            gap: 30px;
        }

        .course-card {
            background: #111827;
            /* 默认底色，防止图裂时留白 */
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            height: 240px;
            /* 固定高度，增强整齐感 */
        }

        .course-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent-blue);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .img-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            transition: 0.5s;
        }

        .course-card:hover .card-img {
            filter: brightness(0.4);
            transform: scale(1.1);
        }

        /* 文字防抖遮罩 */
        .img-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(2, 6, 23, 0.95) 20%, rgba(2, 6, 23, 0.4) 60%, transparent 100%);
            z-index: 1;
        }

        .card-body {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            z-index: 2;
        }

        .card-tag {
            font-size: 9px;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 10px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 2.8em;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-p);
        }

        /* --- Quick Preview Panel (Hover) --- */
        .preview-overlay {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.9);
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .course-card:hover .preview-overlay {
            opacity: 1;
        }

        .preview-text {
            font-size: 12px;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 15px;
        }

        .preview-meta {
            font-size: 10px;
            color: var(--accent-blue);
            font-weight: 600;
        }

        /* --- Pagination / Load More --- */
        .load-more-container {
            text-align: center;
            padding: 60px 0;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-h);
            padding: 12px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .btn-outline:hover {
            background: var(--glass-bg);
            border-color: white;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: 0.3s;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>

    <script src="assets/js/global-class-data.js"></script>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="logo">
            <div class="brand-logo"><i data-lucide="globe"></i></div>
            TITAN GLOBAL
        </div>

        <div class="check-in-widget">
            <div class="check-in-header">Learning Journey</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <h4 id="statDays">0</h4>
                    <p>连续打卡</p>
                </div>
                <div class="stat-card">
                    <h4 id="statCompleted">0</h4>
                    <p>已学课程</p>
                </div>
            </div>
            <button class="check-btn" id="checkBtn" onclick="doCheckIn()">每日打卡</button>
        </div>

        <div class="check-in-header">Browse Categories</div>
        <ul class="nav-list" id="categoryNav">
            <!-- JS Injection -->
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="search-area">
            <div class="search-inner">
                <i data-lucide="search"></i>
                <input type="text" id="searchInput" placeholder="搜索全球顶尖青少年公开课 (1000+ 资源)..." oninput="handleSearch()">
            </div>
            <a href="index.html" style="color:var(--text-p)"><i data-lucide="home"></i></a>
        </header>

        <section id="discovery">
            <div class="grid-header">
                <h2 id="gridTitle">正在加载...</h2>
                <span id="resultCount" style="color:var(--text-p); font-size:12px">显示 0 / 1000+</span>
            </div>

            <div class="course-grid" id="courseGrid">
                <!-- Course Cards injected here -->
            </div>

            <div class="load-more-container">
                <button class="btn-outline" id="loadMoreBtn" onclick="loadMore()">加载更多课程</button>
            </div>
        </section>
    </main>

    <script>
        // --- State Management ---
        let currentCategory = 'all';
        let searchQuery = '';
        let displayedCount = 20;
        const PAGE_SIZE = 20;

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            initSidebar();
            initStats();
            renderCourses();
            lucide.createIcons();
        });

        // --- Stats & Check-in ---
        function initStats() {
            const now = new Date().toDateString();
            const lastDate = localStorage.getItem('titan_last_check');
            const streak = parseInt(localStorage.getItem('titan_streak') || '0');
            const total = parseInt(localStorage.getItem('titan_total_completed') || '0');

            document.getElementById('statDays').innerText = streak;
            document.getElementById('statCompleted').innerText = total;

            if (lastDate === now) {
                const btn = document.getElementById('checkBtn');
                btn.innerText = '已打卡 √';
                btn.classList.add('completed');
                btn.disabled = true;
            }
        }

        function doCheckIn() {
            const now = new Date().toDateString();
            const lastDate = localStorage.getItem('titan_last_check');
            let streak = parseInt(localStorage.getItem('titan_streak') || '0');

            if (lastDate !== now) {
                streak++;
                localStorage.setItem('titan_last_check', now);
                localStorage.setItem('titan_streak', streak);
                document.getElementById('statDays').innerText = streak;

                const btn = document.getElementById('checkBtn');
                btn.innerText = '已打卡 √';
                btn.classList.add('completed');
                btn.disabled = true;

                // Fire effect or sound? (Optional)
                alert('🎉 打卡成功！继续保持学习！');
            }
        }

        // --- Navigation ---
        function initSidebar() {
            const nav = id('categoryNav');
            courseCategories.forEach(cat => {
                const li = document.createElement('li');
                li.className = `nav-item ${cat.id === 'all' ? 'active' : ''}`;
                li.innerHTML = `<i data-lucide="${cat.icon}" width="16"></i> ${cat.name}`;
                li.onclick = () => switchCategory(cat.id, li);
                nav.appendChild(li);
            });
        }

        function switchCategory(catId, element) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            currentCategory = catId;
            displayedCount = PAGE_SIZE;
            renderCourses();
        }

        function handleSearch() {
            searchQuery = id('searchInput').value.toLowerCase();
            displayedCount = PAGE_SIZE;
            renderCourses();
        }

        // --- Rendering ---

        function renderCourses() {
            const grid = id('courseGrid');
            const filtered = fullCourseDatabase.filter(r => {
                const matchCat = currentCategory === 'all' || r.category === currentCategory;
                const matchSearch = r.title.toLowerCase().includes(searchQuery) ||
                    r.provider.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            grid.innerHTML = '';
            const slice = filtered.slice(0, displayedCount);

            slice.forEach((c, idx) => {
                const card = document.createElement('div');
                card.className = 'course-card';
                // 增加基于分类的背景占位色
                const fallbackColor = catColors[c.category] || catColors['default'];
                card.style.backgroundColor = fallbackColor;

                card.onclick = () => openCourse(c.link);

                card.innerHTML = `
                    <div class="img-container">
                        <img src="${c.img}" class="card-img" alt="${c.title}" loading="lazy" 
                             onerror="this.style.display='none'; this.parentElement.style.backgroundColor='${fallbackColor}'">
                        <div class="img-overlay"></div>
                    </div>
                    <div class="card-body">
                        <span class="card-tag" style="background:${fallbackColor}44; color:${fallbackColor}">${c.provider}</span>
                        <h3 class="card-title">${c.title}</h3>
                        <div class="card-footer">
                            <span style="color:#fbbf24">★ ${c.rating}</span>
                            <span style="color:${getDiffColor(c.difficulty)}">${c.difficulty}</span>
                        </div>
                    </div>
                    <div class="preview-overlay">
                        <div class="preview-text">${c.desc}</div>
                        <div class="preview-meta">立即进入学习 <i data-lucide="external-link" width="12"></i></div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // Update Headings
            id('gridTitle').innerText = getCategoryName(currentCategory);
            id('resultCount').innerText = `显示 ${slice.length} / ${filtered.length}`;

            // Toggle Load More
            id('loadMoreBtn').style.display = displayedCount >= filtered.length ? 'none' : 'inline-block';

            lucide.createIcons();
        }

        function loadMore() {
            displayedCount += PAGE_SIZE;
            renderCourses();
        }

        function openCourse(link) {
            // Log completion on click (simplified logic)
            let total = parseInt(localStorage.getItem('titan_total_completed') || '0');
            total++;
            localStorage.setItem('titan_total_completed', total);
            id('statCompleted').innerText = total;

            window.open(link, '_blank');
        }

        // --- Helpers ---
        function id(name) { return document.getElementById(name); }
        function getCategoryName(cid) { return courseCategories.find(c => c.id === cid).name; }
        function getDiffColor(d) {
            if (d === 'Easy') return '#4ade80';
            if (d === 'Medium') return '#facc15';
            return '#f87171';
        }

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.26_10"></script>
</body>

</html>
