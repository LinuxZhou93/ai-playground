                                <div className="bg-stone-800/30 p-4 rounded-xl border border-stone-700/50">

                                    <p className="text-stone-400 text-sm leading-relaxed">{data.detail}</p>

                                    <p className="text-orange-200/80 text-sm font-mono">{data.example}</p>
                                </div>

                                    <div className="bg-amber-900/10 p-4 rounded-xl border border-amber-500/20">
                                        <h4 className="text-amber-300 font-bold mb-2 flex items-center gap-2">
                                            <Feather className="w-4 h-4" /> 研究项目

                                        <p className="text-amber-200/80 text-sm">{data.research}</p>

                                        <p className="text-emerald-200/80 text-sm">{data.ai_integration}</p>

            const stageFilter = queryParams.get('stage'); // 'p', 'j', 's'

            let filteredStages = stages;
            let stageTitle = "";

            if (stageFilter === 'p') {
                filteredStages = stages.filter(s => s.id.startsWith('p_'));
                stageTitle = " - 小学阶段";
            } else if (stageFilter === 'j') {
                filteredStages = stages.filter(s => s.id.startsWith('j_'));
                stageTitle = " - 初中阶段";
            } else if (stageFilter === 's') {
                filteredStages = stages.filter(s => s.id.startsWith('s_'));
                stageTitle = " - 高中阶段";
            }

            const gridClass = `grid grid-cols-[200px_repeat(${filteredStages.length},300px)] gap-6`;

                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);

                                        </div>
                                    ))}

                                    {tracks.map(track => (

                                            {/* Stage Nodes */}

                                                return (
                                                    <div
                                                        key={`${track.id}-${stage.id}`}

                                                            setSelectedNode(data);

                                                            transition-all duration-300 group/card overflow-hidden flex flex-col

                                                    >
                                                        {/* Hover Glow */}

                                                        <div className="relative z-10 h-full flex flex-col">
                                                            <h4 className="text-lg font-bold text-stone-200 mb-3 group-hover/card:text-white transition-colors">
                                                                {data.title}

                                                            <div className="space-y-2 mb-4 flex-grow">
                                                                {data.core.slice(0, 3).map((item, i) => (
                                                                    <div key={i} className="flex items-center gap-2 text-xs text-stone-400">

                    <DetailModal

                        stageColor={selectedStageColor}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
