<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史时空中心 | History & Chronology Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Noto+Serif+SC:wght@700&family=Outfit:wght@400;700&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #f59e0b;
            /* amber-500 */
            --primary-glow: rgba(245, 158, 11, 0.4);
        }

        body {
            background-color: #0c0a09;
            /* warm dark stone */
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .font-ink {
            font-family: 'Zhi Mang Xing', cursive;
        }

        .font-serif-cn {
            font-family: 'Noto Serif SC', serif;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        .glass-card {
            background: rgba(41, 37, 36, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(245, 158, 11, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .history-gradient {
            background: radial-gradient(circle at top right, rgba(245, 158, 11, 0.1), transparent),
                radial-gradient(circle at bottom left, rgba(120, 113, 108, 0.1), transparent);
        }

        .timeline-scroll::-webkit-scrollbar {
            height: 4px;
        }

        .timeline-scroll::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.3);
            border-radius: 10px;
        }

        .parchment-text {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vintage-overlay {
            background-image: url('https://www.transparenttextures.com/patterns/cardboard.png');
            opacity: 0.03;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></IconBase>;
        const Landmark = (props) => <IconBase {...props}><line x1="12" x2="12" y1="22" y2="10" /><path d="m12 2-1 2H2v2c0 2 1.5 3 3.5 3S9 8 9 6V4L8 2h4Z" /><path d="m12 2 1 2h9v2c0 2-1.5 3-3.5 3S15 8 15 6V4l1-2h-4Z" /><line x1="18" x2="22" y1="13" y2="13" /><line x1="2" x2="6" y1="13" y2="13" /><line x1="2" x2="22" y1="22" y2="22" /></IconBase>;
        const Compass = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z" /></IconBase>;
        const Scroll = (props) => <IconBase {...props}><path d="M19 17V5a2 2 0 0 0-2-2H4" /><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 0 0 2 2H8" /><path d="M15 21v-2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2" /><path d="M8 21v-2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;

        const ChronoCard = ({ era, title, icon: Icon }) => (
            <div className="glass-card rounded-2xl p-6 min-w-[280px] snap-center group cursor-pointer border-b-2 border-amber-900/50 hover:border-amber-500 transition-all">
                <span className="text-[10px] font-cinzel font-bold text-amber-500/60 uppercase tracking-widest mb-1 block">{era}</span>
                <h3 className="text-xl font-serif-cn font-bold mb-6">{title}</h3>
                <div className="flex justify-between items-end">
                    <Icon className="w-10 h-10 text-stone-600 group-hover:text-amber-500/30 transition-colors" />
                    <button className="text-xs font-bold text-slate-500 group-hover:text-white transition-colors">ENTER ERA</button>
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative history-gradient pb-20 overflow-hidden">
                    <div className="absolute inset-0 vintage-overlay"></div>

                    {/* Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-8 py-3 flex items-center gap-10 border border-white/10">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-amber-500 font-bold text-xs font-cinzel tracking-widest uppercase">Chronicles</a>
                        <a href="#" className="text-slate-400 hover:text-amber-500 transition-colors text-xs font-cinzel tracking-widest uppercase">Relics</a>
                        <a href="#" className="text-slate-400 hover:text-amber-500 transition-colors text-xs font-cinzel tracking-widest uppercase">Archives</a>
                    </nav>

                    {/* Standards */}
                    <div className="fixed top-6 right-6 z-50">
                        <a href="history-curriculum.html?stage=p" className="flex items-center gap-2 bg-amber-700 hover:bg-amber-600 text-white px-6 py-2.5 rounded-full font-bold text-sm transition-all shadow-xl shadow-amber-900/40">
                            查看全阶段课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero */}
                        <div className="flex flex-col md:flex-row items-center gap-16 mb-24 relative">
                            <div className="flex-1 text-center md:text-left">
                                <span className="inline-block text-amber-500 font-cinzel text-xs tracking-[0.4em] mb-6 uppercase">Custodians of Time</span>
                                <h1 className="text-6xl md:text-9xl font-serif-cn font-bold mb-8 leading-tight">
                                    历史的<span className="parchment-text">回响</span>
                                </h1>
                                <p className="text-xl text-stone-400 max-w-xl mb-10 leading-relaxed font-light">
                                    超越年份的堆砌。通过史料实证、唯物史观，在时间的灰烬中拼凑出人类文明的宏大版图。
                                </p>
                                <div className="flex flex-wrap justify-center md:justify-start gap-4">
                                    <button className="bg-amber-600 hover:bg-amber-500 text-stone-950 px-10 py-4 rounded-xl font-bold transition-all shadow-xl shadow-amber-500/20 flex items-center gap-3">
                                        开启时空胶囊 <Scroll className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>

                            {/* Decorative Visual */}
                            <div className="flex-1 w-full max-w-md relative">
                                <div className="absolute inset-0 bg-amber-500/10 blur-[100px] rounded-full"></div>
                                <div className="glass-card rounded-[4rem] p-12 aspect-square flex items-center justify-center relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity">
                                        <Compass className="w-64 h-64" />
                                    </div>
                                    <span className="text-[12rem] font-ink text-amber-500/20 select-none">史</span>
                                    <div className="absolute bottom-10 left-10 flex flex-col">
                                        <span className="text-4xl font-cinzel font-bold text-amber-500 uppercase">Legacy</span>
                                        <span className="text-xs text-stone-500 font-bold tracking-widest uppercase">Since Dawn of Ages</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Chrono Timeline Selection */}
                        <div className="mb-20">
                            <h2 className="text-3xl font-serif-cn font-bold mb-10 border-l-4 border-amber-600 pl-4">时空锚点</h2>
                            <div className="flex overflow-x-auto gap-8 pb-10 snap-x timeline-scroll">
                                <ChronoCard era="Ancient Era" title="华夏文明与早期国家" icon={Landmark} />
                                <ChronoCard era="Middle Ages" title="繁荣与多元的隋唐宋元" icon={Scroll} />
                                <ChronoCard era="Early Modern" title="明清更替与近代前夜" icon={BookOpen} />
                                <ChronoCard era="Modern History" title="救亡图存与新民主主义探索" icon={Landmark} />
                                <ChronoCard era="Contemporary" title="中国特色社会主义新时代" icon={Compass} />
                            </div>
                        </div>

                        {/* Archive Section */}
                        <section className="bg-stone-900/40 rounded-[3rem] p-12 md:p-20 border border-white/5 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-10 opacity-5 rotate-12"><Scroll className="w-64 h-64" /></div>
                            <div className="max-w-2xl relative z-10">
                                <h2 className="text-4xl font-serif-cn font-bold mb-6">全息史料博物馆</h2>
                                <p className="text-stone-400 text-lg mb-10 leading-relaxed font-light">
                                    我们不只是在读历史。通过数字化复原的珍贵史料、高精度的文物 3D 模型以及沉浸式的历史场景重现，让你真正站立在历史的转折点上，见证每一个文明决策的瞬间。
                                </p>
                                <button className="border border-amber-500/50 hover:bg-amber-500/10 text-amber-500 px-8 py-3 rounded-full font-bold transition-all uppercase text-sm tracking-widest">
                                    进入档案馆
                                </button>
                            </div>
                        </section>
                    </main>

                    <footer className="mt-24 py-16 border-t border-white/5 bg-stone-950/80 text-center text-stone-600 text-[10px] font-cinzel tracking-[0.4em] uppercase">
                        © 2025 History Hub | Every Record Matters, Every Choice Endures
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
