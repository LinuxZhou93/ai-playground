    <script>
        window.addEventListener('load', () => {
            const tl = gsap.timeline();
            tl.to("#load-bar", { width: "100%", duration: 1.5, ease: "power1.inOut" })
              .to("#load-text", { text: "DONE.", color: "#4ade80", duration: 0.2 }, "+=0")
              .to("#preloader", { opacity: 0, duration: 0.8, ease: "power2.inOut" }, "+=0.5")
              .set("#preloader", { display: "none" })
              .from(".gs-reveal", { y: +40, opacity: 0, duration: 1, stagger: 0.15, ease: "back.out(1.2)" }, "-=0.2");
              
            initECharts();
            initCanvasBg();
        });

        gsap.registerPlugin(ScrollTrigger);
        gsap.utils.toArray('.gs-reveal-up').forEach((elem) => {
            gsap.from(elem, { scrollTrigger: { trigger: elem, start: "top 90%" }, y: 50, opacity: 0, duration: 1, ease: "power3.out" });
        });

        const term = document.getElementById('terminal-logs');
        const logs = typeof customLogs !== "undefined" ? customLogs : ["System OK"];
        setInterval(() => {
            if(Math.random() > 0.6) return;
            const d = document.createElement('div');
            d.innerHTML = `> ${logs[Math.floor(Math.random()*logs.length)]}`;
            term.appendChild(d);
            if(term.children.length > 20) term.removeChild(term.firstChild);
            term.scrollTop = term.scrollHeight;
        }, 800);

        function initECharts() {
            // ECharts initialized with dynamic theme color
            const chart1 = echarts.init(document.getElementById('chart-main'));
            const chart2 = echarts.init(document.getElementById('chart-sub'));
            
            // Generate basic line chart and bar chart mapped to topic
            let data1 = []; let now = new Date();
            for(let i=0; i<50; i++) { data1.push({name:now.toString(), value:[now, Math.random()*100]}); now = new Date(+now + 1000); }
            
            chart1.setOption({
                tooltip: {trigger: 'axis'},
                xAxis: {type: 'time', splitLine:{show:false}, axisLabel:{show:false}},
                yAxis: {type: 'value', splitLine:{lineStyle:{color:'rgba(244, 63, 94,0.1)'}}},
                series: [{ type: 'line', showSymbol: false, data: data1, itemStyle: {color: '#fb7185'}, areaStyle: {color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0, color:'rgba(244, 63, 94,0.5)'},{offset:1, color:'transparent'}])} }]
            });
            
            chart2.setOption({
                xAxis: {type: 'category', data: ['A','B','C','D']},
                yAxis: {type: 'value', show: false},
                series: [{ type: 'bar', data: [40, 70, 50, 90], itemStyle: {color: '#fb7185'} }]
            });

            setInterval(() => {
                let current = new Date();
                data1.shift(); data1.push({name: current.toString(), value: [current, Math.random()*100]});
                chart1.setOption({series: [{data: data1}]});
                chart2.setOption({series: [{data: [Math.random()*100, Math.random()*100, Math.random()*100, Math.random()*100]}]});
            }, 1000);
            
            window.addEventListener('resize', () => { chart1.resize(); chart2.resize(); });
        }

        const customLogs = [
    "INITIALIZING NEURAL TENSOR FIELD: [SUCCESS]",
    "CALIBRATING SYNAPTIC LATENCY: 0.0042ms (OPTIMAL)",
    "DECODING MULTI-DIMENSIONAL TOPOLOGY FOR [[topic]]...",
    "SYNCING QUANTUM STATE VECTORS WITH LOCAL NODE...",
    "DATA STREAM INTEGRITY: 99.98% @ ENCRYPTED_BUFFER_0x7F",
    "MAPPING NON-EUCLIDEAN ARCHITECTURE OF [[desc]]",
    "INJECTING HEURISTIC ALGORITHMS INTO RESEARCH MATRIX...",
    "DETECTING ANOMALOUS FLUCTUATIONS IN DATA STRATA...",
    "RECONSTRUCTING VOLUMETRIC MANIFOLD: PHASE 4/5...",
    "SYSTEM STATUS: ALL CORE MODULES OPERATING IN CYBER-DARK PROTOCOL."
];

function initCanvasBg() {
    const canvas = document.getElementById('canvas-bg');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    let width, height;
    let particles = [];
    const mouse = { x: -1000, y: -1000, radius: 150 };

    // 配置参数
    const PARTICLE_COUNT = 120;
    const CONNECTION_DIST = 160;
    const THEME_COLOR = '#fb7185';
    const THEME_RGBA = 'rgba(244, 63, 94,';

    class Particle {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.vx = (Math.random() - 0.5) * 0.8;
            this.vy = (Math.random() - 0.5) * 0.8;
            this.radius = Math.random() * 2 + 1;
            this.pulse = Math.random() * Math.PI;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.pulse += 0.05;

            // 边界检查
            if (this.x < 0 || this.x > width) this.vx *= -1;
            if (this.y < 0 || this.y > height) this.vy *= -1;

            // 鼠标交互：排斥效果
            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                this.x -= dx * force * 0.03;
                this.y -= dy * force * 0.03;
            }
        }

        draw() {
            const alpha = 0.4 + Math.sin(this.pulse) * 0.3;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `${THEME_RGBA} ${alpha})`;
            ctx.fill();
            
            // 核心光点
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
        }
    }

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }
    }

    function drawConnections() {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const p1 = particles[i];
                const p2 = particles[j];
                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < CONNECTION_DIST) {
                    const alpha = (1 - dist / CONNECTION_DIST) * 0.5;
                    ctx.beginPath();
                    ctx.lineWidth = 0.8;
                    ctx.strokeStyle = `${THEME_RGBA} ${alpha})`;
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();

                    // 偶尔生成的“数据脉冲”
                    if (Math.random() > 0.9992) {
                        drawPulse(p1, p2);
                    }
                }
            }
        }
    }

    function drawPulse(p1, p2) {
        const gradient = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
        gradient.addColorStop(0, 'transparent');
        gradient.addColorStop(0.5, '#fff');
        gradient.addColorStop(1, 'transparent');
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function animate() {
        // 赛博暗黑背景覆盖，带有一点拖尾效果
        ctx.fillStyle = 'rgba(10, 10, 12, 0.15)';
        ctx.fillRect(0, 0, width, height);

        drawConnections();

        particles.forEach(p => {
            p.update();
            p.draw();
        });

        // 绘制鼠标光晕
        const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, mouse.radius);
        grad.addColorStop(0, `${THEME_RGBA} 0.15)`);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, mouse.radius, 0, Math.PI * 2);
        ctx.fill();

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    resize();
    animate();
}

// 自动初始化（如果DOM已加载）
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    initCanvasBg();
} else {
    document.addEventListener('DOMContentLoaded', initCanvasBg);
}
// Overridden initCanvasBg
function initCanvasBg_old() {
            const canvas = document.getElementById('canvas-bg');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;
            
            // A generic highly aesthetic flow field / particle system
            let particles = [];
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random()*w, y: Math.random()*h,
                    vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
                    size: Math.random()*2
                });
            }
            
            function animate() {
                ctx.clearRect(0,0,w,h);
                ctx.fillStyle = '#fb7185';
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if(p.x<0||p.x>w) p.vx*=-1;
                    if(p.y<0||p.y>h) p.vy*=-1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
