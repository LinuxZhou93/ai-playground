<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino IDE | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <style>
        body {
            background: #0B0B15;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <!-- Navbar -->
    <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-[#1E1E2E]/50">
        <div class="flex items-center gap-3">
            <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div
                    class="w-8 h-8 rounded bg-gradient-to-br from-teal-500 to-emerald-600 flex items-center justify-center font-bold text-white text-xl">
                    ♾️</div>
                <span class="font-bold text-lg">Arduino <span class="text-teal-400">Studio</span></span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-xs text-teal-400 bg-teal-900/30 px-3 py-1 rounded-full border border-teal-500/30">
                Powered by Wokwi Simulator
            </div>
            <a href="https://www.arduino.cc/en/software" target="_blank"
                class="px-4 py-1.5 bg-teal-600 hover:bg-teal-500 text-white rounded font-bold text-sm transition-colors flex items-center gap-2">
                ⬇️ Download Local IDE
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 border-r border-white/10 bg-[#1E1E2E]/30 flex flex-col">
            <div class="p-3 border-b border-white/5 font-bold text-sm text-slate-400">Projects</div>
            <div class="p-4 space-y-2">
                <button onclick="loadSim('blink')"
                    class="w-full text-left p-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300">
                    💡 LED Blink
                </button>
                <button onclick="loadSim('servo')"
                    class="w-full text-left p-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300">
                    🦾 Servo Motor
                </button>
                <button onclick="loadSim('lcd')"
                    class="w-full text-left p-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300">
                    📺 LCD Display
                </button>
            </div>

            <div class="mt-auto p-4 border-t border-white/10 text-xs text-slate-500">
                Arduino 是一种开源电子原型平台。这里我们使用 Wokwi 模拟器在浏览器中运行 Arduino 代码。
            </div>
        </div>

        <!-- Simulator Area -->
        <div class="flex-1 bg-[#1E1E2E] relative">
            <iframe id="sim-frame" src="https://wokwi.com/projects/new/arduino-uno?hex=1"
                allow="midi; geolocation; microphone; camera; display-capture; encrypted-media;"></iframe>
        </div>
    </div>

    <script>
        function loadSim(type) {
            const frame = document.getElementById('sim-frame');
            if (type === 'blink') {
                frame.src = "https://wokwi.com/projects/new/arduino-uno?hex=1";
                // Note: Wokwi doesn't easily allow direct deep linking to specific code without saving a project first.
                // For now, we link to a blank new project or specific existing shared project IDs if available.
                // Ideally, Replace these URLs with your own saved Wokwi project URLs.
                // frame.src = "https://wokwi.com/projects/32456789...";
            } else if (type === 'servo') {
                frame.src = "https://wokwi.com/projects/new/arduino-uno";
            }
            else if (type === 'lcd') {
                frame.src = "https://wokwi.com/projects/new/arduino-uno";
            }
        }
    </script>
</body>

</html>
