<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded C IDE | 编程实践站</title>

    <!-- Dependencies -->
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>

    <!-- CodeMirror -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/nord.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        c: { blue: '#294C7E', dark: '#5C6BC0' },
                        odyssey: { dark: '#0B0B15', surface: '#1E1E2E' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #0B0B15;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <div id="app" class="h-full flex flex-col">
        <!-- Navbar -->
        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-gradient-to-br from-blue-600 to-slate-700 flex items-center justify-center font-bold text-white text-lg">
                        C</div>
                    <span class="font-bold text-lg">System <span class="text-blue-400">Core</span></span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <button @click="showInfo"
                    class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold text-sm transition-colors">
                    ▶ Simulate (Dev)
                </button>
            </div>
        </nav>

        <!-- Main Workspace -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar -->
            <div class="w-64 border-r border-white/10 bg-odyssey-surface/30 flex flex-col">
                <div class="p-3 border-b border-white/5 font-bold text-sm text-slate-400">Labs</div>
                <div class="flex-1 overflow-y-auto p-2 space-y-1">
                    <button v-for="ex in examples" :key="ex.name" @click="loadExample(ex)"
                        class="w-full text-left px-3 py-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300 hover:text-white truncate">
                        {{ ex.name }}
                    </button>
                </div>
            </div>

            <!-- Editor -->
            <div class="flex-1 flex flex-col md:flex-row">
                <div class="flex-1 flex flex-col border-r border-white/10 bg-[#2E3440]">
                    <div class="bg-[#2a2f3a] px-4 py-1 text-xs text-slate-400 flex justify-between">
                        <span>main.c</span>
                        <span class="text-slate-500">GCC / Embedded</span>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>

                <!-- Info Panel -->
                <div class="w-full md:w-1/3 flex flex-col bg-[#0f0f1a]">
                    <div class="bg-[#1a1a2e] px-4 py-1 text-xs text-slate-400 border-b border-white/5 font-bold">
                        Registers & Memory</div>
                    <div class="flex-1 p-6 font-mono text-sm text-slate-300">
                        <div class="mb-4">
                            <h4 class="text-blue-400 font-bold mb-2">MCU Status</h4>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div class="bg-white/5 p-2 rounded">PC: 0x08000000</div>
                                <div class="bg-white/5 p-2 rounded">SP: 0x2000FFFF</div>
                            </div>
                        </div>
                        <div class="border-t border-white/10 pt-4">
                            <p class="text-slate-500 italic">模拟器开发中... 暂时仅支持代码编辑。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const editor = ref(null);

                const examples = [
                    {
                        name: 'Blink LED (Register)',
                        code: `// Direct Register Access Example
#define RCC_AHB1ENR  (*((volatile unsigned int *)0x40023830))
#define GPIOA_MODER  (*((volatile unsigned int *)0x40020000))
#define GPIOA_ODR    (*((volatile unsigned int *)0x40020014))

void delay(int count) {
    while(count--) { __asm("nop"); }
}

int main(void) {
    // Enable Clock for GPIOA
    RCC_AHB1ENR |= (1 << 0);
    
    // Set PA5 as Output
    GPIOA_MODER |= (1 << 10);
    
    while(1) {
        GPIOA_ODR ^= (1 << 5); // Toggle LED
        delay(1000000);
    }
}`
                    },
                    {
                        name: 'Hello World (UART)',
                        code: `#include <stdio.h>

int main(void) {
    // UART Initialization assumed
    
    printf("System Booting...\\n");
    printf("CPU Clock: 168 MHz\\n");
    
    int counter = 0;
    while(1) {
        printf("Heartbeat: %d\\n", counter++);
        // delay
    }
    return 0;
}`
                    }
                ];

                const loadExample = (ex) => {
                    if (editor.value) editor.value.setValue(ex.code);
                };

                const showInfo = () => {
                    alert('嵌入式 C 编译器即将上线！\n\n目前您可以学习寄存器操作和底层驱动编写。');
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'text/x-csrc',
                        theme: 'nord',
                        lineNumbers: true,
                        indentUnit: 4,
                        lineWrapping: true
                    });

                    loadExample(examples[0]);
                });

                return { examples, loadExample, showInfo };
            }
        }).mount('#app');
    </script>
</body>

</html>
