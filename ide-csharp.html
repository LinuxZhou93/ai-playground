<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C# Studio | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/material-palenight.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        csharp: { purple: '#68217A', blue: '#178600' },
                        odyssey: { dark: '#0C1021', surface: '#23273A' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0C1021;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <div id="app" class="h-full flex flex-col relative">
        <!-- Intro Overlay -->
        <div v-if="showIntro"
            class="fixed inset-0 z-50 bg-[#0B0B15] flex flex-col items-center justify-center transition-transform duration-700">
            <div class="max-w-4xl w-full mx-auto px-6 relative z-10 animate-slide-up">
                <div
                    class="w-24 h-24 mx-auto mb-8 rounded-3xl bg-gradient-to-br from-purple-600 to-fuchsia-600 flex items-center justify-center shadow-2xl shadow-purple-500/30">
                    <span class="text-5xl text-white font-bold">C#</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-bold text-center text-white mb-6 tracking-tight">
                    Game Dev
                </h1>
                <p class="text-xl text-slate-400 text-center max-w-2xl mx-auto mb-12 leading-relaxed">
                    The language of Unity. Create 3D worlds, VR experiences, and cross-platform games played by
                    millions.
                </p>
                <div class="grid md:grid-cols-3 gap-6 mb-12">
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🎮</div>
                        <h3 class="font-bold text-white mb-1">Unity Engine</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">👓</div>
                        <h3 class="font-bold text-white mb-1">AR / VR</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🖥️</div>
                        <h3 class="font-bold text-white mb-1">Windows Apps</h3>
                    </div>
                </div>
                <div class="text-center">
                    <button @click="showIntro = false"
                        class="group relative px-8 py-4 bg-white text-black rounded-full font-bold text-xl hover:bg-purple-50 transition-all shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_rgba(255,255,255,0.5)] hover:-translate-y-1">
                        Enter Studio
                        <span class="inline-block ml-2 group-hover:translate-x-1 transition-transform">→</span>
                    </button>
                </div>
            </div>
        </div>

        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-csharp-purple flex items-center justify-center font-bold text-white text-xs">
                        C#</div>
                    <span class="font-bold text-lg">C# <span class="text-purple-400">Studio</span></span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-xs text-slate-500">.NET 6.0 (Simulated)</div>
                <button @click="runCode" :disabled="loading"
                    class="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm flex items-center gap-2">
                    <span v-if="loading" class="animate-spin">⟳</span>
                    <span v-else>▶ Run</span>
                </button>
            </div>
        </nav>
        <div class="flex-1 flex overflow-hidden">
            <div class="w-64 border-r border-white/10 bg-odyssey-surface/30 flex flex-col">
                <div class="p-3 border-b border-white/5 font-bold text-sm text-slate-400">Unity / .NET</div>
                <div class="flex-1 overflow-y-auto p-2 space-y-1">
                    <button v-for="ex in examples" :key="ex.name" @click="loadExample(ex)"
                        class="w-full text-left px-3 py-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300 hover:text-white truncate">
                        {{ ex.name }}
                    </button>
                </div>
            </div>
            <div class="flex-1 flex flex-col md:flex-row">
                <div class="flex-1 flex flex-col border-r border-white/10 bg-[#292D3E]">
                    <div class="bg-[#1e212e] px-4 py-1 text-xs text-slate-400 flex justify-between">
                        <span>Program.cs</span>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>
                <div class="w-full md:w-1/3 flex flex-col bg-[#0f0f1a]">
                    <div class="bg-[#1a1a2e] px-4 py-1 text-xs text-slate-400 border-b border-white/5 font-bold">Console
                    </div>
                    <div id="terminal"
                        class="flex-1 p-4 font-mono text-sm overflow-y-auto whitespace-pre-wrap text-slate-300">
                        <div v-for="(log, i) in logs" :key="i"
                            :class="log.type === 'error' ? 'text-red-400' : 'text-slate-300'">{{ log.msg }}</div>
                        <div v-if="logs.length === 0" class="text-slate-600 italic">Click "Run" to execute...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const showIntro = ref(true);
                const loading = ref(false);
                const logs = ref([]);
                const editor = ref(null);

                const examples = [
                    { name: 'Hello World', code: `using System;\n\npublic class Program {\n    public static void Main() {\n        Console.WriteLine("Hello, C#!");\n    }\n}` },
                    { name: 'Unity Script', code: `using UnityEngine;\n\npublic class Player : MonoBehaviour {\n    void Start() {\n        Debug.Log("Player Spawned at (0,0,0)");\n    }\n}` },
                    { name: 'Calculator', code: `using System;\n\npublic class Calc {\n    public static void Main() {\n        int x = 10, y = 5;\n        Console.WriteLine($"Sum: {x + y}");\n    }\n}` }
                ];

                const loadExample = (ex) => { if (editor.value) editor.value.setValue(ex.code); logs.value = []; };
                const addToLog = (msg, type = 'info') => logs.value.push({ msg, type });

                const runCode = () => {
                    loading.value = true;
                    logs.value = [];
                    const code = editor.value.getValue();

                    setTimeout(() => {
                        if (code.includes('Console.WriteLine')) {
                            const matches = [...code.matchAll(/Console\.WriteLine\((.*?)\);/g)];
                            matches.forEach(m => addToLog(m[1].replace(/"/g, '')));
                        } else if (code.includes('Debug.Log')) {
                            addToLog("[Unity Log] Player Spawned at (0,0,0)");
                            addToLog("(Unity Engine Simulation)");
                        } else {
                            addToLog("Build succeeded.");
                        }
                        loading.value = false;
                    }, 800);
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'text/x-csharp', theme: 'material-palenight', lineNumbers: true, indentUnit: 4, lineWrapping: true
                    });
                    loadExample(examples[0]);
                });
                return { showIntro, loading, logs, runCode, examples, loadExample };
            }
        }).mount('#app');
    </script>
</body>

</html>
