<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Studio | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/go/go.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/ttcn.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        go: { cyan: '#00ADD8', black: '#000000' },
                        odyssey: { dark: '#0C1021', surface: '#23273A' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0C1021;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <div id="app" class="h-full flex flex-col relative">
        <!-- Intro Overlay -->
        <div v-if="showIntro"
            class="fixed inset-0 z-50 bg-[#0B0B15] flex flex-col items-center justify-center transition-transform duration-700">
            <div class="max-w-4xl w-full mx-auto px-6 relative z-10 animate-slide-up">
                <div
                    class="w-24 h-24 mx-auto mb-8 rounded-3xl bg-gradient-to-br from-cyan-400 to-blue-500 flex items-center justify-center shadow-2xl shadow-cyan-400/30">
                    <span class="text-5xl text-white font-bold">Go</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-bold text-center text-white mb-6 tracking-tight">
                    Cloud Native
                </h1>
                <p class="text-xl text-slate-400 text-center max-w-2xl mx-auto mb-12 leading-relaxed">
                    Designed by Google. Simple, reliable, and efficient software for the modern cloud infrastructure.
                </p>
                <div class="grid md:grid-cols-3 gap-6 mb-12">
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">☁️</div>
                        <h3 class="font-bold text-white mb-1">Cloud Services</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🚀</div>
                        <h3 class="font-bold text-white mb-1">High Perf</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🐹</div>
                        <h3 class="font-bold text-white mb-1">Concurrency</h3>
                    </div>
                </div>
                <div class="text-center">
                    <button @click="showIntro = false"
                        class="group relative px-8 py-4 bg-white text-black rounded-full font-bold text-xl hover:bg-cyan-50 transition-all shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_rgba(255,255,255,0.5)] hover:-translate-y-1">
                        Enter Studio
                        <span class="inline-block ml-2 group-hover:translate-x-1 transition-transform">→</span>
                    </button>
                </div>
            </div>
        </div>

        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-go-cyan flex items-center justify-center font-bold text-white text-xs">
                        Go</div>
                    <span class="font-bold text-lg">Go <span class="text-go-cyan">Studio</span></span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-xs text-slate-500">Go 1.19 (Simulated)</div>
                <button @click="runCode" :disabled="loading"
                    class="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-bold text-sm flex items-center gap-2">
                    <span v-if="loading" class="animate-spin">⟳</span>
                    <span v-else>▶ Run</span>
                </button>
            </div>
        </nav>
        <div class="flex-1 flex overflow-hidden">
            <div class="w-64 border-r border-white/10 bg-odyssey-surface/30 flex flex-col">
                <div class="p-3 border-b border-white/5 font-bold text-sm text-slate-400">Back-end</div>
                <div class="flex-1 overflow-y-auto p-2 space-y-1">
                    <button v-for="ex in examples" :key="ex.name" @click="loadExample(ex)"
                        class="w-full text-left px-3 py-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300 hover:text-white truncate">
                        {{ ex.name }}
                    </button>
                </div>
            </div>
            <div class="flex-1 flex flex-col md:flex-row">
                <div class="flex-1 flex flex-col border-r border-white/10 bg-[#f9f9f9]">
                    <div class="bg-gray-100 px-4 py-1 text-xs text-slate-500 flex justify-between"><span>main.go</span>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>
                <div class="w-full md:w-1/3 flex flex-col bg-[#0f0f1a]">
                    <div class="bg-[#1a1a2e] px-4 py-1 text-xs text-slate-400 border-b border-white/5 font-bold">Console
                    </div>
                    <div id="terminal"
                        class="flex-1 p-4 font-mono text-sm overflow-y-auto whitespace-pre-wrap text-slate-300">
                        <div v-for="(log, i) in logs" :key="i"
                            :class="log.type === 'error' ? 'text-red-400' : 'text-slate-300'">{{ log.msg }}</div>
                        <div v-if="logs.length === 0" class="text-slate-600 italic">Click "Run" to execute...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const showIntro = ref(true);
                const loading = ref(false);
                const logs = ref([]);
                const editor = ref(null);

                const examples = [
                    { name: 'Hello Go', code: `package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello, Go!")\n}` },
                    { name: 'Loop', code: `package main\n\nimport "fmt"\n\nfunc main() {\n    for i := 0; i < 5; i++ {\n        fmt.Println("Count:", i)\n    }\n}` },
                    { name: 'Simple Web Server', code: `package main\n\nimport (\n    "fmt"\n    "net/http"\n)\n\nfunc main() {\n    fmt.Println("Server started at :8080")\n}` }
                ];

                const loadExample = (ex) => { if (editor.value) editor.value.setValue(ex.code); logs.value = []; };
                const addToLog = (msg, type = 'info') => logs.value.push({ msg, type });

                const runCode = () => {
                    loading.value = true;
                    logs.value = [];
                    const code = editor.value.getValue();

                    setTimeout(() => {
                        if (code.includes('fmt.Println')) {
                            // Simple simulation
                            const matches = [...code.matchAll(/fmt\.Println\("(.*?)"\)/g)];
                            matches.forEach(m => addToLog(m[1]));

                            if (code.includes('for i := 0')) {
                                for (let i = 0; i < 5; i++) addToLog("Count: " + i);
                            }
                        } else {
                            addToLog("Program exited.");
                        }
                        loading.value = false;
                    }, 600);
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'go', theme: 'ttcn', lineNumbers: true, indentUnit: 4, lineWrapping: true
                    });
                    loadExample(examples[0]);
                });
                return { showIntro, loading, logs, runCode, examples, loadExample };
            }
        }).mount('#app');
    </script>
</body>

</html>
