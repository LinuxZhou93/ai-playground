<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Studio | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/eclipse.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        html: { orange: '#E34F26', blue: '#2965F1' },
                        odyssey: { dark: '#0C1021', surface: '#23273A' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0C1021;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <div id="app" class="h-full flex flex-col relative">
        <!-- Intro Overlay -->
        <div v-if="showIntro"
            class="fixed inset-0 z-50 bg-[#0B0B15] flex flex-col items-center justify-center transition-transform duration-700">
            <div class="max-w-4xl w-full mx-auto px-6 relative z-10 animate-slide-up">
                <div
                    class="w-24 h-24 mx-auto mb-8 rounded-3xl bg-gradient-to-br from-orange-500 to-blue-500 flex items-center justify-center shadow-2xl shadow-orange-500/30">
                    <span class="text-5xl text-white font-bold">Web</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-bold text-center text-white mb-6 tracking-tight">
                    Web Studio
                </h1>
                <p class="text-xl text-slate-400 text-center max-w-2xl mx-auto mb-12 leading-relaxed">
                    Create beautiful websites with HTML and CSS. See your changes instantly.
                </p>
                <div class="grid md:grid-cols-3 gap-6 mb-12">
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🔨</div>
                        <h3 class="font-bold text-white mb-1">Structure</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🎨</div>
                        <h3 class="font-bold text-white mb-1">Style</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🖱️</div>
                        <h3 class="font-bold text-white mb-1">Interaction</h3>
                    </div>
                </div>
                <div class="text-center">
                    <button @click="showIntro = false"
                        class="group relative px-8 py-4 bg-white text-black rounded-full font-bold text-xl hover:bg-orange-50 transition-all shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_rgba(255,255,255,0.5)] hover:-translate-y-1">
                        Start Designing
                        <span class="inline-block ml-2 group-hover:translate-x-1 transition-transform">→</span>
                    </button>
                </div>
            </div>
        </div>

        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-gradient-to-br from-html-orange to-html-blue flex items-center justify-center font-bold text-white text-xs">
                        WEB</div>
                    <span class="font-bold text-lg">Web <span class="text-html-orange">Studio</span></span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-xs text-green-400"><span
                        class="w-2 h-2 rounded-full bg-green-500"></span> Live Preview</div>
                <button @click="updatePreview"
                    class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded font-bold text-sm flex items-center gap-2 transition-colors">
                    ▶ Refresh
                </button>
            </div>
        </nav>
        <div class="flex-1 flex overflow-hidden">
            <div class="w-56 border-r border-white/10 bg-odyssey-surface/30 flex flex-col">
                <div class="p-3 border-b border-white/5 font-bold text-sm text-slate-400">Templates</div>
                <div class="flex-1 overflow-y-auto p-2 space-y-1">
                    <button v-for="ex in examples" :key="ex.name" @click="loadExample(ex)"
                        class="w-full text-left px-3 py-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300 hover:text-white truncate">
                        {{ ex.name }}
                    </button>
                </div>
            </div>
            <!-- Split Pane -->
            <div class="flex-1 flex flex-col md:flex-row">
                <div class="flex-1 flex flex-col border-r border-white/10 relative">
                    <div class="bg-gray-800 px-4 py-1 text-xs text-white flex justify-between"><span>index.html</span>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>
                <div class="flex-1 flex flex-col bg-white">
                    <div class="bg-gray-100 px-4 py-1 text-xs text-gray-500 border-b flex justify-between">
                        <span>Preview</span> <span>localhost:3000</span>
                    </div>
                    <iframe id="preview-frame" class="w-full h-full border-none"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const showIntro = ref(true);
                const editor = ref(null);
                const examples = [
                    { name: 'Simple Page', code: `<h1>Hello World</h1>\n<p>This is my first website.</p>\n<button onclick="alert('Clicked!')">Click Me</button>` },
                    { name: 'Styled Card', code: `<style>\n  .card { padding: 20px; border: 1px solid #ddd; border-radius: 8px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }\n  h2 { color: #2563eb; margin-top:0; }\n</style>\n<div class="card">\n  <h2>Cool Card</h2>\n  <p>CSS makes things beautiful!</p>\n</div>` },
                    { name: 'Animation', code: `<style>\n  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }\n  .ball { width: 50px; height: 50px; background: red; border-radius: 50%; animation: bounce 1s infinite; margin: 50px; }\n</style>\n<div class="ball"></div>` }
                ];

                const loadExample = (ex) => { if (editor.value) editor.value.setValue(ex.code); updatePreview(); };

                const updatePreview = () => {
                    const code = editor.value.getValue();
                    const iframe = document.getElementById('preview-frame');
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    doc.open();
                    doc.write(code);
                    doc.close();
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'htmlmixed', theme: 'eclipse', lineNumbers: true, indentUnit: 2, lineWrapping: true
                    });
                    loadExample(examples[0]);

                    // Auto-update with debounce could be added, but manual refresh is safer for loop protection
                });
                return { showIntro, updatePreview, examples, loadExample };
            }
        }).mount('#app');
    </script>
</body>

</html>
