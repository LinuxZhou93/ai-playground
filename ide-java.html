<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java IDE | 编程实践站</title>

    <!-- Dependencies -->
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>

    <!-- CodeMirror for Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/eclipse.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        java: { red: '#f89820', blue: '#5382a1' },
                        odyssey: { dark: '#0B0B15', surface: '#1E1E2E' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: #0B0B15;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            border-radius: 0.5rem;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1E1E2E;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <div id="app" class="h-full flex flex-col">
        <!-- Navbar -->
        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-gradient-to-br from-java-red to-java-blue flex items-center justify-center font-bold text-white text-lg">
                        ☕</div>
                    <span class="font-bold text-lg">Java <span class="text-java-red">Studio</span></span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-xs text-yellow-400">
                    <span>⚠️</span> 在线编译功能开发中
                </div>
                <button @click="showInfo"
                    class="px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded font-bold text-sm transition-colors">
                    ℹ️ Info
                </button>
            </div>
        </nav>

        <!-- Main Workspace -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar (Examples) -->
            <div class="w-64 border-r border-white/10 bg-odyssey-surface/30 flex flex-col">
                <div class="p-3 border-b border-white/5 font-bold text-sm text-slate-400">Examples</div>
                <div class="flex-1 overflow-y-auto p-2 space-y-1">
                    <button v-for="ex in examples" :key="ex.name" @click="loadExample(ex)"
                        class="w-full text-left px-3 py-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300 hover:text-white truncate">
                        {{ ex.name }}
                    </button>
                </div>
            </div>

            <!-- Editor Area -->
            <div class="flex-1 flex flex-col md:flex-row">
                <!-- Code Editor -->
                <div class="flex-1 flex flex-col border-r border-white/10 bg-white">
                    <div class="bg-[#f5f5f5] px-4 py-1 text-xs text-slate-600 flex justify-between border-b">
                        <span>Main.java</span>
                        <span class="text-slate-500">Java 17</span>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>

                <!-- Info Panel -->
                <div class="w-full md:w-1/3 flex flex-col bg-[#0f0f1a]">
                    <div class="bg-[#1a1a2e] px-4 py-1 text-xs text-slate-400 border-b border-white/5 font-bold">
                        说明</div>
                    <div class="flex-1 p-6 overflow-y-auto text-slate-300 space-y-4">
                        <div class="bg-yellow-900/20 border border-yellow-600/30 rounded-lg p-4">
                            <h3 class="font-bold text-yellow-400 mb-2">⚠️ 开发中</h3>
                            <p class="text-sm text-slate-300">Java 在线编译功能正在开发中。目前您可以：</p>
                            <ul class="text-sm text-slate-400 mt-2 space-y-1 list-disc list-inside">
                                <li>查看示例代码</li>
                                <li>学习 Java 语法</li>
                                <li>编辑和保存代码</li>
                            </ul>
                        </div>

                        <div class="bg-blue-900/20 border border-blue-600/30 rounded-lg p-4">
                            <h3 class="font-bold text-blue-400 mb-2">💡 推荐工具</h3>
                            <p class="text-sm text-slate-300 mb-2">在线运行 Java 代码，推荐使用：</p>
                            <ul class="text-sm space-y-2">
                                <li>
                                    <a href="https://www.jdoodle.com/online-java-compiler" target="_blank"
                                        class="text-blue-400 hover:underline">JDoodle</a>
                                </li>
                                <li>
                                    <a href="https://www.programiz.com/java-programming/online-compiler/"
                                        target="_blank" class="text-blue-400 hover:underline">Programiz</a>
                                </li>
                            </ul>
                        </div>

                        <div class="bg-green-900/20 border border-green-600/30 rounded-lg p-4">
                            <h3 class="font-bold text-green-400 mb-2">📚 学习资源</h3>
                            <p class="text-sm text-slate-300">Java 是一门强大的面向对象编程语言，广泛应用于：</p>
                            <ul class="text-sm text-slate-400 mt-2 space-y-1 list-disc list-inside">
                                <li>Android 应用开发</li>
                                <li>企业级系统</li>
                                <li>大数据处理</li>
                                <li>游戏开发（Minecraft）</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const editor = ref(null);

                const examples = [
                    {
                        name: 'Hello World',
                        code: `public class Main {
    public static void main(String[] args) {
        // Welcome to Java Studio!
        String name = "Friend";
        System.out.println("Hello, " + name + "!");
        System.out.println("Welcome to Creative Coding Lab.");
    }
}`
                    },
                    {
                        name: 'Simple Calculator',
                        code: `public class Calculator {
    public static void main(String[] args) {
        int a = 10;
        int b = 5;
        
        System.out.println("Addition: " + (a + b));
        System.out.println("Subtraction: " + (a - b));
        System.out.println("Multiplication: " + (a * b));
        System.out.println("Division: " + (a / b));
    }
}`
                    },
                    {
                        name: 'Class Example',
                        code: `class Person {
    private String name;
    private int age;
    
    public Person(String name, int age) {
        this.name = name;
        this.age = age;
    }
    
    public void introduce() {
        System.out.println("Hi, I'm " + name + ", " + age + " years old.");
    }
}

public class Main {
    public static void main(String[] args) {
        Person alice = new Person("Alice", 12);
        alice.introduce();
    }
}`
                    }
                ];

                const loadExample = (ex) => {
                    if (editor.value) editor.value.setValue(ex.code);
                };

                const showInfo = () => {
                    alert('Java 在线编译功能开发中！\n\n请使用推荐的在线工具运行代码，或在本地安装 JDK。');
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'text/x-java',
                        theme: 'eclipse',
                        lineNumbers: true,
                        indentUnit: 4,
                        lineWrapping: true
                    });

                    loadExample(examples[0]);
                });

                return { examples, loadExample, showInfo };
            }
        }).mount('#app');
    </script>
</body>

</html>
