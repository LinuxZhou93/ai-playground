<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Studio | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        js: { yellow: '#F7DF1E', black: '#323330' },
                        odyssey: { dark: '#0B0B15', surface: '#1E1E2E' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0B0B15;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            border-radius: 0.5rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1E1E2E;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748B;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <!-- Intro Overlay -->
    <div id="app" class="h-full flex flex-col relative">
        <div v-if="showIntro"
            class="fixed inset-0 z-50 bg-[#0B0B15] flex flex-col items-center justify-center transition-transform duration-700">
            <div class="max-w-4xl w-full mx-auto px-6 relative z-10 animate-slide-up">
                <div
                    class="w-24 h-24 mx-auto mb-8 rounded-3xl bg-js-yellow flex items-center justify-center shadow-2xl shadow-yellow-500/30">
                    <span class="text-5xl text-black font-bold">JS</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-bold text-center text-white mb-6 tracking-tight">
                    JavaScript Studio
                </h1>
                <p class="text-xl text-slate-400 text-center max-w-2xl mx-auto mb-12 leading-relaxed">
                    The language of the web. Build interactive, dynamic applications.
                </p>
                <div class="grid md:grid-cols-3 gap-6 mb-12">
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🎨</div>
                        <h3 class="font-bold text-white mb-1">Frontend</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">⚙️</div>
                        <h3 class="font-bold text-white mb-1">Logic</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">✨</div>
                        <h3 class="font-bold text-white mb-1">Interaction</h3>
                    </div>
                </div>
                <div class="text-center">
                    <button @click="showIntro = false"
                        class="group relative px-8 py-4 bg-white text-black rounded-full font-bold text-xl hover:bg-yellow-50 transition-all shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_rgba(255,255,255,0.5)] hover:-translate-y-1">
                        Start Scripting
                        <span class="inline-block ml-2 group-hover:translate-x-1 transition-transform">→</span>
                    </button>
                </div>
            </div>
        </div>

        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-js-yellow flex items-center justify-center font-bold text-black text-xs">
                        JS</div>
                    <span class="font-bold text-lg">JavaScript <span class="text-js-yellow">Studio</span></span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-xs text-green-400"><span
                        class="w-2 h-2 rounded-full bg-green-500"></span> Browser Runtime</div>
                <button @click="runCode"
                    class="px-4 py-1.5 bg-yellow-500 hover:bg-yellow-400 text-black rounded font-bold text-sm flex items-center gap-2 transition-colors">
                    ▶ Run Code
                </button>
            </div>
        </nav>
        <div class="flex-1 flex overflow-hidden">
            <div class="w-64 border-r border-white/10 bg-odyssey-surface/30 flex flex-col">
                <div class="p-3 border-b border-white/5 font-bold text-sm text-slate-400">Examples</div>
                <div class="flex-1 overflow-y-auto p-2 space-y-1">
                    <button v-for="ex in examples" :key="ex.name" @click="loadExample(ex)"
                        class="w-full text-left px-3 py-2 rounded hover:bg-white/5 text-sm transition-colors text-slate-300 hover:text-white truncate">
                        {{ ex.name }}
                    </button>
                </div>
            </div>
            <div class="flex-1 flex flex-col md:flex-row">
                <div class="flex-1 flex flex-col border-r border-white/10 bg-[#282a36]">
                    <div class="bg-[#21222C] px-4 py-1 text-xs text-slate-400 flex justify-between">
                        <span>script.js</span>
                        <span class="text-slate-500">ES6+ Supported</span>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>
                <div class="w-full md:w-1/3 flex flex-col bg-[#0f0f1a]">
                    <div class="bg-[#1a1a2e] px-4 py-1 text-xs text-slate-400 border-b border-white/5 font-bold">Console
                        Output</div>
                    <div id="terminal"
                        class="flex-1 p-4 font-mono text-sm overflow-y-auto whitespace-pre-wrap text-slate-300">
                        <div v-for="(log, i) in logs" :key="i"
                            :class="log.type === 'error' ? 'text-red-400' : 'text-slate-300'">{{ log.msg }}</div>
                        <div v-if="logs.length === 0" class="text-slate-600 italic">Click "Run Code" to see output...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;
        createApp({
            setup() {
                const showIntro = ref(true);
                const logs = ref([]);
                const editor = ref(null);
                const examples = [
                    { name: 'Hello World', code: `// Welcome to JS Studio\nconsole.log("Hello, World!");\nconsole.log("Welcome to coding!");` },
                    { name: 'Variables & Math', code: `let a = 10;\nlet b = 20;\nconsole.log(\`Sum: \${a + b}\`);\nconsole.log(\`Product: \${a * b}\`);` },
                    { name: 'Loops', code: `// Count to 5\nfor(let i=1; i<=5; i++) {\n    console.log(\`Count: \${i}\`);\n}` },
                    { name: 'Objects', code: `const hero = {\n    name: "Coder",\n    level: 99\n};\nconsole.log(\`Hero \${hero.name} is level \${hero.level}\`);` }
                ];

                const loadExample = (ex) => { if (editor.value) editor.value.setValue(ex.code); logs.value = []; };
                const addToLog = (msg, type = 'info') => {
                    // Start stringifying objects to simulate console behavior
                    if (typeof msg === 'object') msg = JSON.stringify(msg, null, 2);
                    logs.value.push({ msg, type });
                    nextTick(() => { const term = document.getElementById('terminal'); if (term) term.scrollTop = term.scrollHeight; });
                };

                const runCode = () => {
                    logs.value = [];
                    const code = editor.value.getValue();
                    try {
                        // Capture console.log
                        const originalLog = console.log;
                        console.log = (...args) => {
                            args.forEach(arg => addToLog(arg));
                            originalLog.apply(console, args);
                        };

                        // Execute
                        // Wrap in a function to allow returns (though not displayed) and isolate scope slightly
                        new Function(code)();

                        // Restore
                        console.log = originalLog;
                    } catch (err) {
                        addToLog(err.toString(), 'error');
                    }
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'javascript', theme: 'dracula', lineNumbers: true, indentUnit: 4, lineWrapping: true
                    });
                    loadExample(examples[0]);
                });
                return { showIntro, logs, runCode, examples, loadExample };
            }
        }).mount('#app');
    </script>
</body>

</html>
