<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro:bit Lab | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    
    <style>
        body {
            background: #0C1021;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <div id="app" class="h-full flex flex-col relative">
        <!-- Intro Overlay -->
        <div v-if="showIntro"
            class="fixed inset-0 z-50 bg-[#0B0B15] flex flex-col items-center justify-center transition-transform duration-700 overflow-y-auto">
            <div class="max-w-4xl w-full mx-auto px-6 py-12 relative z-10 animate-slide-up">
                <div class="text-center mb-8">
                    <div
                        class="w-24 h-24 mx-auto mb-6 rounded-3xl bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center shadow-2xl shadow-green-500/30">
                        <span class="text-5xl text-white font-bold">🟩</span>
                    </div>
                    <h1 class="text-5xl md:text-6xl font-bold text-white mb-4 tracking-tight">Micro:bit Studio</h1>
                    <p class="text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed">
                        专为教育设计的微型电脑。内置 LED 阵列、蓝牙和传感器，支持图形化积木和 Python 编程，让编程充满乐趣。
                    </p>
                </div>

                <!-- Feature Grid -->
                <div class="grid md:grid-cols-3 gap-6 mb-10">
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-4xl mb-4">🏫</div>
                        <h3 class="text-lg font-bold text-white mb-2">STEM 教育</h3>
                        <p class="text-sm text-slate-400">全球数百万学生的首选编程入门硬件，寓教于乐。</p>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-4xl mb-4">🧩</div>
                        <h3 class="text-lg font-bold text-white mb-2">双模编程</h3>
                        <p class="text-sm text-slate-400">从简单的积木拖拽开始，无缝过渡到 Python 代码编写。</p>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-4xl mb-4">💡</div>
                        <h3 class="text-lg font-bold text-white mb-2">创意无限</h3>
                        <p class="text-sm text-slate-400">制作计步器、电子名牌、互动游戏等各种创意项目。</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col md:flex-row items-center justify-center gap-6 mb-12">
                    <button @click="showIntro = false"
                        class="px-8 py-4 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white rounded-xl font-bold text-xl transition-all shadow-lg hover:shadow-green-500/30 hover:-translate-y-1 flex items-center gap-2">
                        <span>▶</span> 进入实验室
                    </button>
                    <a href="https://makecode.microbit.org/" target="_blank"
                        class="px-8 py-4 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-lg transition-all border border-white/10 flex items-center gap-2">
                        <span>📥</span> MakeCode
                    </a>
                    <a href="https://microbit.org/projects/" target="_blank"
                        class="px-8 py-4 bg-transparent hover:bg-white/5 text-slate-300 hover:text-white rounded-xl font-bold text-lg transition-all flex items-center gap-2">
                        <span>🌐</span> 项目案例
                    </a>
                </div>

                <!-- Learning Path Hint -->
                <div class="text-center border-t border-white/10 pt-8">
                    <p class="text-slate-500 text-sm mb-4">合作伙伴与资源</p>
                    <div
                        class="flex items-center justify-center gap-6 opacity-60 grayscale hover:grayscale-0 transition-all">
                        <a href="https://microbit.org/" target="_blank" class="flex flex-col items-center gap-2 group">
                            <div
                                class="w-8 h-8 flex items-center justify-center font-bold text-green-500 text-sm border border-green-500 rounded">
                                M</div>
                            <span class="text-xs text-slate-400 group-hover:text-green-400">Micro:bit</span>
                        </a>
                        <a href="https://makecode.com/" target="_blank" class="flex flex-col items-center gap-2 group">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg"
                                class="w-8 h-8 group-hover:scale-110 transition-transform">
                            <span class="text-xs text-slate-400 group-hover:text-blue-400">Microsoft</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-microbit-green flex items-center justify-center font-bold text-white text-xs">
                        M</div>
                    <span class="font-bold text-lg">Micro:bit <span class="text-green-400">Lab</span></span>
                </a>
                <div class="ml-4 flex gap-2">
                    <button class="px-3 py-1 bg-white/10 rounded text-xs hover:bg-white/20">Blocks</button>
                    <button class="px-3 py-1 bg-green-600 rounded text-xs">Python</button>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button @click="runCode" :disabled="loading"
                    class="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm flex items-center gap-2">
                    <span v-if="loading" class="animate-spin">⟳</span>
                    <span v-else>▶ Download</span>
                </button>
            </div>
        </nav>
        <div class="flex-1 flex overflow-hidden">

            <div class="flex-1 flex flex-col md:flex-row">
                <!-- Code Area -->
                <div class="flex-1 flex flex-col border-r border-white/10 bg-[#272822]">
                    <textarea id="code-editor"></textarea>
                </div>
                <!-- Simulator -->
                <div class="w-full md:w-1/3 flex flex-col bg-[#eee] p-8 items-center justify-center relative">
                    <!-- Microbit SVG Mockup -->
                    <div class="w-64 h-52 bg-black rounded-lg relative shadow-xl border-b-4 border-gray-800">
                        <!-- LED Matrix -->
                        <div class="absolute top-10 left-12 w-40 h-28 grid grid-cols-5 gap-2">
                            <div v-for="n in 25" :key="n" class="w-full h-full rounded-sm bg-red-900 opacity-20"
                                :class="{'opacity-100 bg-red-500 shadow-[0_0_10px_red]': isLedOn(n)}"></div>
                        </div>
                        <!-- Buttons -->
                        <div class="absolute bottom-20 left-4 w-4 h-4 rounded-full bg-black border border-gray-600">
                        </div>
                        <div class="absolute bottom-20 right-4 w-4 h-4 rounded-full bg-black border border-gray-600">
                        </div>
                        <!-- Logo -->
                        <div class="absolute top-4 left-4 text-white font-bold text-[10px]">micro:bit</div>
                        <!-- Connector -->
                        <div
                            class="absolute bottom-0 left-0 w-full h-4 bg-yellow-400 rounded-b-lg border-t-4 border-yellow-600">
                        </div>
                    </div>
                    <div class="mt-8 text-black font-mono text-sm">{{ statusMsg }}</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const showIntro = ref(true);
                const loading = ref(false);
                const statusMsg = ref("Ready");
                const ledMap = ref([]);
                const editor = ref(null);

                const codeSample = `from microbit import *\n\nwhile True:\n    display.show(Image.HEART)\n    sleep(1000)\n    display.show(Image.HAPPY)\n    sleep(1000)`;

                const isLedOn = (n) => ledMap.value.includes(n);

                const runCode = () => {
                    loading.value = true;
                    statusMsg.value = "Flashing...";
                    setTimeout(() => {
                        loading.value = false;
                        statusMsg.value = "Running...";
                        // Simulate running
                        let toggle = true;
                        const interval = setInterval(() => {
                            if (toggle) {
                                // Draw Heart (Approximation indices)
                                ledMap.value = [2, 4, 6, 7, 8, 9, 10, 11, 13, 15, 17, 23];
                            } else {
                                // Draw Smiley
                                ledMap.value = [2, 4, 10, 14, 16, 17, 18, 19, 20];
                            }
                            toggle = !toggle;
                        }, 1000);
                        setTimeout(() => { clearInterval(interval); ledMap.value = []; statusMsg.value = "Done"; }, 5000);
                    }, 1000);
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'python', theme: 'monokai', lineNumbers: true, indentUnit: 4, lineWrapping: true
                    });
                    editor.value.setValue(codeSample);
                });
                return { showIntro, loading, statusMsg, isLedOn, runCode };
            }
        }).mount('#app');
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js"></script>
</body>

</html>
