<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro:bit IDE | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <style>
        body {
            background: #0B0B15;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <!-- Navbar -->
    <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-[#1E1E2E]/50">
        <div class="flex items-center gap-3">
            <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div
                    class="w-8 h-8 rounded bg-gradient-to-br from-purple-500 to-indigo-600 flex items-center justify-center font-bold text-white text-xl">
                    📟</div>
                <span class="font-bold text-lg">Micro:bit <span class="text-purple-400">MakeCode</span></span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://makecode.microbit.org/" target="_blank"
                class="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm transition-colors flex items-center gap-2">
                🚀 Open in Full Screen
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 bg-white">
        <!-- Embed MakeCode Editor -->
        <iframe src="https://makecode.microbit.org/#editor" title="MakeCode Editor"></iframe>
    </div>
</body>

</html>
