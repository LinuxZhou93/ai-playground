<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro:bit Lab | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        microbit: { green: '#00AF41', red: '#E3000B' },
                        odyssey: { dark: '#0C1021', surface: '#23273A' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #0C1021;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <div id="app" class="h-full flex flex-col relative">
        <!-- Intro Overlay -->
        <div v-if="showIntro"
            class="fixed inset-0 z-50 bg-[#0B0B15] flex flex-col items-center justify-center transition-transform duration-700">
            <div class="max-w-4xl w-full mx-auto px-6 relative z-10 animate-slide-up">
                <div
                    class="w-24 h-24 mx-auto mb-8 rounded-3xl bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center shadow-2xl shadow-green-500/30">
                    <span class="text-5xl text-white font-bold">🟩</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-bold text-center text-white mb-6 tracking-tight">
                    Micro:bit
                </h1>
                <p class="text-xl text-slate-400 text-center max-w-2xl mx-auto mb-12 leading-relaxed">
                    The pocket-sized computer transforming digital skills learning. Start coding with Blocks or Python.
                </p>
                <div class="grid md:grid-cols-3 gap-6 mb-12">
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🧩</div>
                        <h3 class="font-bold text-white mb-1">MakeCode</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🐍</div>
                        <h3 class="font-bold text-white mb-1">MicroPython</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">💡</div>
                        <h3 class="font-bold text-white mb-1">LEDs & Sensors</h3>
                    </div>
                </div>
                <div class="text-center">
                    <button @click="showIntro = false"
                        class="group relative px-8 py-4 bg-white text-black rounded-full font-bold text-xl hover:bg-green-50 transition-all shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_rgba(255,255,255,0.5)] hover:-translate-y-1">
                        Enter Lab
                        <span class="inline-block ml-2 group-hover:translate-x-1 transition-transform">→</span>
                    </button>
                </div>
            </div>
        </div>

        <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-odyssey-surface/50">
            <div class="flex items-center gap-3">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <div
                        class="w-8 h-8 rounded bg-microbit-green flex items-center justify-center font-bold text-white text-xs">
                        M</div>
                    <span class="font-bold text-lg">Micro:bit <span class="text-green-400">Lab</span></span>
                </a>
                <div class="ml-4 flex gap-2">
                    <button class="px-3 py-1 bg-white/10 rounded text-xs hover:bg-white/20">Blocks</button>
                    <button class="px-3 py-1 bg-green-600 rounded text-xs">Python</button>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button @click="runCode" :disabled="loading"
                    class="px-4 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded font-bold text-sm flex items-center gap-2">
                    <span v-if="loading" class="animate-spin">⟳</span>
                    <span v-else>▶ Download</span>
                </button>
            </div>
        </nav>
        <div class="flex-1 flex overflow-hidden">

            <div class="flex-1 flex flex-col md:flex-row">
                <!-- Code Area -->
                <div class="flex-1 flex flex-col border-r border-white/10 bg-[#272822]">
                    <textarea id="code-editor"></textarea>
                </div>
                <!-- Simulator -->
                <div class="w-full md:w-1/3 flex flex-col bg-[#eee] p-8 items-center justify-center relative">
                    <!-- Microbit SVG Mockup -->
                    <div class="w-64 h-52 bg-black rounded-lg relative shadow-xl border-b-4 border-gray-800">
                        <!-- LED Matrix -->
                        <div class="absolute top-10 left-12 w-40 h-28 grid grid-cols-5 gap-2">
                            <div v-for="n in 25" :key="n" class="w-full h-full rounded-sm bg-red-900 opacity-20"
                                :class="{'opacity-100 bg-red-500 shadow-[0_0_10px_red]': isLedOn(n)}"></div>
                        </div>
                        <!-- Buttons -->
                        <div class="absolute bottom-20 left-4 w-4 h-4 rounded-full bg-black border border-gray-600">
                        </div>
                        <div class="absolute bottom-20 right-4 w-4 h-4 rounded-full bg-black border border-gray-600">
                        </div>
                        <!-- Logo -->
                        <div class="absolute top-4 left-4 text-white font-bold text-[10px]">micro:bit</div>
                        <!-- Connector -->
                        <div
                            class="absolute bottom-0 left-0 w-full h-4 bg-yellow-400 rounded-b-lg border-t-4 border-yellow-600">
                        </div>
                    </div>
                    <div class="mt-8 text-black font-mono text-sm">{{ statusMsg }}</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const showIntro = ref(true);
                const loading = ref(false);
                const statusMsg = ref("Ready");
                const ledMap = ref([]);
                const editor = ref(null);

                const codeSample = `from microbit import *\n\nwhile True:\n    display.show(Image.HEART)\n    sleep(1000)\n    display.show(Image.HAPPY)\n    sleep(1000)`;

                const isLedOn = (n) => ledMap.value.includes(n);

                const runCode = () => {
                    loading.value = true;
                    statusMsg.value = "Flashing...";
                    setTimeout(() => {
                        loading.value = false;
                        statusMsg.value = "Running...";
                        // Simulate running
                        let toggle = true;
                        const interval = setInterval(() => {
                            if (toggle) {
                                // Draw Heart (Approximation indices)
                                ledMap.value = [2, 4, 6, 7, 8, 9, 10, 11, 13, 15, 17, 23];
                            } else {
                                // Draw Smiley
                                ledMap.value = [2, 4, 10, 14, 16, 17, 18, 19, 20];
                            }
                            toggle = !toggle;
                        }, 1000);
                        setTimeout(() => { clearInterval(interval); ledMap.value = []; statusMsg.value = "Done"; }, 5000);
                    }, 1000);
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'python', theme: 'monokai', lineNumbers: true, indentUnit: 4, lineWrapping: true
                    });
                    editor.value.setValue(codeSample);
                });
                return { showIntro, loading, statusMsg, isLedOn, runCode };
            }
        }).mount('#app');
    </script>
</body>

</html>
