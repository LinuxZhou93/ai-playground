<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixly Lab | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/eclipse.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mixly: { green: '#8BC34A', yellow: '#FFC107', gray: '#607D8B' },
                        odyssey: { dark: '#0C1021', surface: '#23273A' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: #F0F2F5;
            color: #333;
            font-family: 'Inter', sans-serif;
        }

        .CodeMirror {
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
        }

        .mixly-block {
            @apply px-3 py-2 rounded shadow text-white font-bold cursor-pointer hover:opacity-90 active:scale-95 transition-transform select-none mb-2 border-l-4 border-black/20;
        }

        .cat-btn {
            @apply w-full text-left px-4 py-2 hover:bg-gray-100 flex items-center gap-2 text-sm font-bold text-gray-600;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <div id="app" class="h-full flex flex-col relative">
        <!-- Intro Overlay -->
        <div v-if="showIntro"
            class="fixed inset-0 z-50 bg-[#0B0B15] flex flex-col items-center justify-center transition-transform duration-700">
            <div class="max-w-4xl w-full mx-auto px-6 relative z-10 animate-slide-up">
                <div
                    class="w-24 h-24 mx-auto mb-8 rounded-3xl bg-gradient-to-br from-green-400 to-lime-500 flex items-center justify-center shadow-2xl shadow-green-400/30">
                    <span class="text-5xl text-white font-bold">M</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-bold text-center text-white mb-6 tracking-tight">
                    Mixly 2.0
                </h1>
                <p class="text-xl text-slate-400 text-center max-w-2xl mx-auto mb-12 leading-relaxed">
                    Visual programming for hardware. Drag, drop, and create amazing projects with Arduino, ESP32, and
                    Python.
                </p>
                <div class="grid md:grid-cols-3 gap-6 mb-12">
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🧱</div>
                        <h3 class="font-bold text-white mb-1">Block Coding</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">📟</div>
                        <h3 class="font-bold text-white mb-1">Hardware</h3>
                    </div>
                    <div
                        class="bg-white/5 border border-white/10 rounded-2xl p-6 text-center hover:bg-white/10 transition-colors">
                        <div class="text-3xl mb-3">🐍</div>
                        <h3 class="font-bold text-white mb-1">Python</h3>
                    </div>
                </div>
                <div class="text-center">
                    <button @click="showIntro = false"
                        class="group relative px-8 py-4 bg-white text-black rounded-full font-bold text-xl hover:bg-green-50 transition-all shadow-[0_0_40px_rgba(255,255,255,0.3)] hover:shadow-[0_0_60px_rgba(255,255,255,0.5)] hover:-translate-y-1">
                        Start Creating
                        <span class="inline-block ml-2 group-hover:translate-x-1 transition-transform">→</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mixly Toolbar -->
        <nav class="h-14 bg-mixly-green flex items-center px-4 justify-between shadow-md z-10">
            <div class="flex items-center gap-2">
                <a href="coding.html" class="flex items-center gap-2 hover:opacity-90 transition-opacity">
                    <div
                        class="w-8 h-8 bg-white rounded-full flex items-center justify-center font-bold text-mixly-green">
                        M
                    </div>
                    <span class="text-white font-bold text-xl">Mixly 2.0</span>
                </a>
            </div>
            <div class="flex items-center gap-2">
                <button
                    class="bg-mixly-yellow text-black px-4 py-1 rounded-full font-bold text-sm shadow hover:bg-yellow-300 flex items-center gap-2">
                    <span>🔄</span> 初始化
                </button>
                <button @click="upload"
                    class="bg-white text-mixly-green px-6 py-1 rounded-full font-bold text-sm shadow hover:bg-gray-50 flex items-center gap-2">
                    <span v-if="loading" class="animate-spin">⟳</span>
                    <span v-else>▶ 上传到 Arduino</span>
                </button>
            </div>
        </nav>

        <div class="flex-1 flex overflow-hidden">
            <!-- Categories -->
            <div class="w-48 bg-white border-r border-gray-200 flex flex-col py-2">
                <button class="cat-btn"><span class="w-3 h-3 rounded-full bg-blue-500"></span> 输入/输出</button>
                <button class="cat-btn"><span class="w-3 h-3 rounded-full bg-green-500"></span> 控制</button>
                <button class="cat-btn"><span class="w-3 h-3 rounded-full bg-purple-500"></span> 数学</button>
                <button class="cat-btn"><span class="w-3 h-3 rounded-full bg-orange-500"></span> 串口</button>
                <button class="cat-btn"><span class="w-3 h-3 rounded-full bg-cyan-500"></span> 变量</button>
            </div>

            <!-- Workspace -->
            <div
                class="flex-1 bg-gray-50 relative overflow-hidden bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgb3BhY2l0eT0iMC4wNSI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiMwMDAiLz48L3N2Zz4=')]">
                <div class="absolute top-8 left-8 w-64">
                    <div class="mixly-block bg-green-500">
                        setup 初始化
                    </div>
                    <div class="mixly-block bg-blue-500 ml-4">
                        Serial.begin(9600);
                    </div>

                    <div class="mixly-block bg-green-500 mt-4">
                        loop 循环
                    </div>
                    <div class="mixly-block bg-blue-500 ml-4">
                        Serial.println("Hello Mixly");
                    </div>
                    <div class="mixly-block bg-orange-500 ml-4">
                        延时 1000 毫秒
                    </div>
                </div>
            </div>

            <!-- Code Preview -->
            <div class="w-1/3 bg-white border-l border-gray-200 flex flex-col">
                <div class="bg-gray-100 px-4 py-2 text-xs font-bold text-gray-500 flex justify-between">
                    <span>Generated C Code</span>
                    <button class="text-blue-500 hover:text-blue-700">Copy</button>
                </div>
                <div class="flex-1 relative">
                    <textarea id="code-editor"></textarea>
                </div>
                <!-- Serial Monitor -->
                <div
                    class="h-40 bg-black text-green-400 font-mono text-xs p-2 overflow-y-auto border-t border-gray-300 flex flex-col">
                    <div class="border-b border-gray-700 pb-1 mb-1 opacity-50">COM3 (Arduino Uno)</div>
                    <div v-for="(log, i) in logs" :key="i">{{ log }}</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const { createApp, ref, onMounted } = Vue;
        createApp({
            setup() {
                const showIntro = ref(true);
                const loading = ref(false);
                const logs = ref([]);
                const editor = ref(null);
                const code = `void setup() {
  Serial.begin(9600);
}

void loop() {
  Serial.println("Hello Mixly");
  delay(1000);
}`;

                const upload = () => {
                    loading.value = true;
                    logs.value = [];
                    logs.value.push("Compiling sketch...");
                    setTimeout(() => {
                        logs.value.push("Uploading to board...");
                        setTimeout(() => {
                            loading.value = false;
                            logs.value.push("Done uploading.");
                            // Start Serial Simulation
                            setInterval(() => {
                                if (logs.value.length > 20) logs.value.shift();
                                logs.value.push("Hello Mixly");
                            }, 1000);
                        }, 1000);
                    }, 800);
                };

                onMounted(() => {
                    editor.value = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                        mode: 'text/x-csrc', theme: 'eclipse', lineNumbers: true, indentUnit: 2, lineWrapping: true, readOnly: true
                    });
                    editor.value.setValue(code);
                });
                return { showIntro, loading, logs, upload };
            }
        }).mount('#app');
    </script>
</body>

</html>
