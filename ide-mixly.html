<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixly IDE | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <style>
        body {
            background: #0B0B15;
            color: #E2E8F0;
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <!-- Navbar -->
    <nav class="h-14 border-b border-white/10 flex items-center justify-between px-4 bg-[#1E1E2E]/50">
        <div class="flex items-center gap-3">
            <a href="coding.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <div
                    class="w-8 h-8 rounded bg-gradient-to-br from-orange-400 to-yellow-500 flex items-center justify-center font-bold text-white text-lg">
                    🧱</div>
                <span class="font-bold text-lg">Mixly <span class="text-orange-400">Studio</span></span>
            </a>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://mixly.org/pages/download" target="_blank"
                class="px-4 py-1.5 bg-orange-600 hover:bg-orange-500 text-white rounded font-bold text-sm transition-colors flex items-center gap-2">
                ⬇️ Download Mixly
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
        <div
            class="max-w-4xl w-full glass-panel p-12 rounded-3xl border border-orange-500/20 shadow-2xl shadow-orange-900/20">
            <div
                class="w-32 h-32 mx-auto bg-gradient-to-br from-orange-500 to-yellow-600 rounded-3xl flex items-center justify-center text-8xl mb-8 shadow-lg">
                🧱
            </div>

            <h1 class="text-5xl font-bold mb-6 text-white">图形化硬件编程</h1>
            <p class="text-xl text-slate-300 mb-10 max-w-2xl mx-auto leading-relaxed">
                Mixly (米思其) 是国内最流行的创客教育软件。它将复杂的 C++ 代码封装为积木块，让你像搭乐高一样控制 Arduino, ESP32 等硬件。
            </p>

            <div class="grid md:grid-cols-3 gap-6 mb-12 text-left">
                <div class="bg-white/5 p-6 rounded-xl border border-white/10">
                    <h3 class="text-orange-400 font-bold text-lg mb-2">简单易用</h3>
                    <p class="text-slate-400 text-sm">全中文界面，直观的积木拖拽，无需记忆复杂语法。</p>
                </div>
                <div class="bg-white/5 p-6 rounded-xl border border-white/10">
                    <h3 class="text-orange-400 font-bold text-lg mb-2">硬件支持</h3>
                    <p class="text-slate-400 text-sm">完美支持 Arduino Uno, Nano, ESP8266, ESP32 等主流开发板。</p>
                </div>
                <div class="bg-white/5 p-6 rounded-xl border border-white/10">
                    <h3 class="text-orange-400 font-bold text-lg mb-2">代码对照</h3>
                    <p class="text-slate-400 text-sm">实时生成 C++ 代码，帮助从图形化平滑过渡到代码编程。</p>
                </div>
            </div>

            <div class="flex gap-4 justify-center">
                <a href="https://mixly.org/" target="_blank"
                    class="px-8 py-4 bg-orange-600 hover:bg-orange-500 text-white rounded-xl font-bold text-lg transition-all hover:scale-105 shadow-xl shadow-orange-500/20">
                    访问 Mixly 官网
                </a>
                <a href="https://mixly.readthedocs.io/" target="_blank"
                    class="px-8 py-4 bg-white/10 hover:bg-white/20 text-white rounded-xl font-bold text-lg transition-all border border-white/10">
                    查看教程文档
                </a>
            </div>
        </div>

        <div class="mt-8 text-slate-500 text-sm">
            * Mixly 是本地桌面软件，需要下载安装后连接硬件使用。
        </div>
    </div>
</body>

</html>
