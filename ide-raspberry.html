<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Raspberry Pi Lab | 编程实践站</title>
    <script src="libs/tailwindcss.js"></script>
    <style>
        body {
            background: #0B0B15;
            color: #fff
        }
    </style>
</head>

<body class="flex flex-col h-screen text-center items-center justify-center p-8 bg-pink-900/10">
    <div class="w-full max-w-5xl bg-[#1E1E2E] rounded-3xl overflow-hidden shadow-2xl border border-pink-500/20">
        <div class="bg-gradient-to-r from-pink-600 to-rose-700 p-8">
            <h1 class="text-4xl font-bold text-white flex items-center justify-center gap-4">
                🍓 Raspberry Pi OS Simulator
            </h1>
        </div>
        <div class="p-12">
            <div class="grid md:grid-cols-2 gap-12 items-center">
                <div>
                    <img src="https://www.raspberrypi.com/documentation/ computers/images/raspberry_pi_os_desktop.png"
                        alt="Pi Desktop"
                        class="rounded-xl shadow-lg border border-white/10 opacity-50 hover:opacity-100 transition-opacity">
                    <!-- Fallback to placeholder if image fails, but using text description for now -->
                    <div class="mt-4 text-xs text-slate-500">（模拟树莓派桌面环境）</div>
                </div>
                <div class="text-left">
                    <h2 class="text-2xl font-bold text-pink-400 mb-4">Linux 学习实验室</h2>
                    <ul class="space-y-4 text-slate-300 mb-8">
                        <li class="flex items-center gap-2">🖥️ <strong>完整的 Linux 环境</strong>：学习命令行、文件系统和 Shell 脚本。</li>
                        <li class="flex items-center gap-2">🐍 <strong>Python 硬件控制</strong>：使用 GPIO Zero 库控制 LED、电机和传感器。
                        </li>
                        <li class="flex items-center gap-2">🌐 <strong>服务器搭建</strong>：学习 Web 服务器、数据库和网络安全。</li>
                    </ul>
                    <a href="https://www.raspberrypi.org/software/" target="_blank"
                        class="inline-block bg-pink-600 hover:bg-pink-500 text-white px-8 py-3 rounded-lg font-bold transition">下载
                        Raspberry Pi Imager</a>
                    <a href="coding.html" class="ml-4 inline-block text-slate-400 hover:text-white px-8 py-3">返回</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
