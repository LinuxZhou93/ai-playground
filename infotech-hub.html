<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信息科技中心 | InfoTech Innovation Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Outfit:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #8b5cf6;
            /* violet-500 */
            --primary-glow: rgba(139, 92, 246, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .font-code {
            font-family: 'Fira Code', monospace;
        }

        .font-space {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .binary-bg {
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes pulse-dot {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(3);
                opacity: 0;
            }
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: inherit;
            animation: pulse-dot 1.5s ease-out infinite;
        }

        .terminal-header {
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dot-red {
            background: #ef4444;
        }

        .dot-yellow {
            background: #f59e0b;
        }

        .dot-green {
            background: #10b981;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Cpu = (props) => <IconBase {...props}><rect width="16" height="16" x="4" y="4" rx="2" /><rect width="6" height="6" x="9" y="9" rx="1" /><path d="M15 2v2" /><path d="M15 20v2" /><path d="M2 15h2" /><path d="M2 9h2" /><path d="M20 15h2" /><path d="M20 9h2" /><path d="M9 2v2" /><path d="M9 20v2" /></IconBase>;
        const Database = (props) => <IconBase {...props}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" /><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" /></IconBase>;
        const Code2 = (props) => <IconBase {...props}><path d="m18 16 4-4-4-4" /><path d="m6 8-4 4 4 4" /><path d="m14.5 4-5 16" /></IconBase>;
        const Network = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /><path d="M10 6.5h4" /><path d="M10 17.5h4" /><path d="M6.5 10v4" /><path d="M17.5 10v4" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;

        const TechModule = ({ title, icon: Icon, tag, version }) => (
            <div className="glass-card rounded-2xl p-6 group cursor-pointer border-t border-violet-500/20">
                <div className="flex justify-between items-start mb-6">
                    <div className="p-3 rounded-xl bg-violet-500/10 text-violet-400 group-hover:scale-110 transition-transform">
                        <Icon className="w-6 h-6" />
                    </div>
                    <span className="text-[10px] font-code text-slate-500">{version}</span>
                </div>
                <span className="text-[10px] font-bold text-violet-500 tracking-widest uppercase mb-1 block">{tag}</span>
                <h3 className="text-lg font-bold mb-4 font-space">{title}</h3>
                <div className="h-1 w-full bg-slate-800 rounded-full overflow-hidden">
                    <div className="h-full bg-violet-600 w-2/3 group-hover:w-full transition-all duration-700"></div>
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative binary-bg pb-20">
                    {/* Background Binary Elements */}
                    <div className="absolute top-40 right-20 text-[10rem] font-code text-violet-500/05 select-none pointer-events-none">1010</div>
                    <div className="absolute bottom-20 left-10 text-[12rem] font-code text-violet-500/05 select-none pointer-events-none">0101</div>

                    {/* Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-8 py-3 flex items-center gap-10 border border-white/10">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-violet-400 font-bold text-xs uppercase tracking-widest">Compiler</a>
                        <a href="#" className="text-slate-400 hover:text-violet-400 transition-colors text-xs uppercase tracking-widest">Database</a>
                        <a href="#" className="text-slate-400 hover:text-violet-400 transition-colors text-xs uppercase tracking-widest">Network</a>
                    </nav>

                    {/* Standards */}
                    <div className="fixed top-6 right-6 z-50 flex gap-4">
                        <a href="junior-infotech-curriculum.html?stage=j" className="bg-violet-600 hover:bg-violet-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition-all shadow-lg flex items-center gap-2">
                            初中课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                        <a href="senior-infotech-curriculum.html?stage=s" className="bg-violet-600 hover:bg-violet-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs transition-all shadow-lg flex items-center gap-2">
                            高中课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-16 items-center mb-24">
                            <div className="lg:col-span-12 xl:col-span-7">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-violet-500/10 border border-violet-500/20 text-violet-500 text-xs font-bold mb-6 font-code">
                                    <span className="w-2 h-2 rounded-full bg-violet-500 animate-pulse"></span>
                                    CPU_TICK: 4.2GHz_OVERCLOCKED
                                </div>
                                <h1 className="text-6xl md:text-8xl font-space font-bold mb-8 leading-none">
                                    定义未来的<br />
                                    <span className="gradient-text">数字指令</span>
                                </h1>
                                <p className="text-xl text-slate-400 max-w-xl mb-10 leading-relaxed font-light">
                                    不仅仅是编程。从复杂算法的架构到分布式协议的实现，在比特的世界里，你就是唯一的造物主。
                                </p>
                                <div className="flex gap-4">
                                    <button className="bg-violet-600 hover:bg-violet-500 text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-violet-500/20 flex items-center gap-3 transition-all">
                                        初始化 IDE <Code2 className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>

                            {/* Code Terminal Visual */}
                            <div className="hidden xl:block lg:col-span-5 relative">
                                <div className="glass-card rounded-2xl overflow-hidden h-[400px] border border-violet-500/30 flex flex-col font-code text-sm">
                                    <div className="terminal-header">
                                        <div className="dot dot-red"></div>
                                        <div className="dot dot-yellow"></div>
                                        <div className="dot dot-green"></div>
                                        <span className="ml-4 text-xs text-slate-500">main.cpp</span>
                                    </div>
                                    <div className="p-6 text-slate-400 space-y-2">
                                        <div className="text-violet-400">#include &lt;iostream&gt;</div>
                                        <div className="text-violet-400">#include &lt;innovation&gt;</div>
                                        <br />
                                        <div>int main() &#123;</div>
                                        <div className="pl-4">World* world = <span className="text-emerald-400">new</span> World();</div>
                                        <div className="pl-4">world-&gt;initialize(FUTURE);</div>
                                        <div className="pl-4 text-slate-500">// Processing binary thoughts...</div>
                                        <div className="pl-4 text-violet-400">while</div> (world-&gt;isAlive()) &#123;
                                        <div className="pl-8">world-&gt;innovate();</div>
                                        <div className="pl-4">&#125;</div>
                                        <div>&#125;</div>
                                    </div>
                                </div>
                                <div className="absolute -bottom-6 -right-6 glass-card p-4 rounded-xl border border-emerald-500/50">
                                    <div className="text-[10px] text-slate-500 font-bold mb-1">BUILD STATUS</div>
                                    <div className="text-emerald-400 font-code font-bold flex items-center gap-2">
                                        <span className="relative flex h-2 w-2">
                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                        </span>
                                        SUCCESSFUL
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Tech Stack Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-20">
                            <TechModule
                                title="算法与复杂性"
                                tag="LOGIC"
                                icon={LayoutGrid}
                                version="v.2.4.0"
                            />
                            <TechModule
                                title="分布式数据库"
                                tag="STORAGE"
                                icon={Database}
                                version="v.SQL.3.1"
                            />
                            <TechModule
                                title="神经网络实现"
                                tag="AI"
                                icon={Cpu}
                                version="v.PYTORCH.9"
                            />
                            <TechModule
                                title="网络协议栈"
                                tag="CONNECT"
                                icon={Network}
                                version="v.TCP/IP"
                            />
                        </div>
                    </main>

                    <footer className="mt-24 py-16 border-t border-white/5 bg-slate-950/50">
                        <div className="container mx-auto px-6 text-center text-slate-600 text-xs font-bold uppercase tracking-widest font-code">
                            [ END_OF_LINE ] © 2025 INFOTECH HUB
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
