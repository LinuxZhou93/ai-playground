<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Archive | 读书观影区</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #bc13fe;
            --neon-green: #0aff0a;
            --bg-dark: #050510;
            --panel-bg: rgba(10, 20, 40, 0.7);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Share Tech Mono', 'Noto Sans SC', monospace;
        }

        /* 3D Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* UI Layer */
        .ui-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(2px);
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0) 0%, rgba(0, 243, 255, 0.1) 50%, rgba(0, 0, 0, 0) 100%);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
        }

        .back-btn {
            color: var(--neon-pink);
            text-decoration: none;
            border: 1px solid var(--neon-pink);
            padding: 8px 16px;
            font-size: 1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .back-btn:hover {
            background: var(--neon-pink);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-blue) rgba(0, 0, 0, 0.3);
        }

        .main-content::-webkit-scrollbar {
            width: 6px;
        }

        .main-content::-webkit-scrollbar-thumb {
            background-color: var(--neon-blue);
            border-radius: 3px;
        }

        /* Controls */
        .mode-switch {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }

        .mode-btn.active {
            color: #000;
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            font-weight: bold;
        }

        .mode-btn:hover:not(.active) {
            color: #fff;
            text-shadow: 0 0 5px #fff;
        }

        /* Grid */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            perspective: 1000px;
        }

        .media-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s;
            position: relative;
            cursor: pointer;
            height: 380px;
            display: flex;
            flex-direction: column;
        }

        .media-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2);
            border-color: var(--neon-blue);
            z-index: 10;
        }

        .media-thumb {
            height: 220px;
            background-color: #000;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .media-thumb::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 60%, var(--bg-dark));
        }

        .media-info {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .media-title {
            font-size: 1.1rem;
            color: var(--neon-blue);
            margin-bottom: 5px;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-type {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .media-desc {
            font-size: 0.9rem;
            color: #ddd;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            opacity: 0.8;
        }

        .action-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px;
            width: 100%;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .media-card:hover .action-btn {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        /* Modal Viewer */
        .viewer-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .viewer-content {
            width: 90%;
            height: 90%;
            background: #000;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px var(--neon-blue);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .viewer-header {
            padding: 10px 20px;
            background: rgba(0, 243, 255, 0.1);
            border-bottom: 1px solid var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            color: #ff0055;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover {
            transform: scale(1.2);
            text-shadow: 0 0 10px #ff0055;
        }

        /* Hero Section */
        .hero-section {
            width: 100%;
            max-width: 1400px;
            height: 300px;
            margin-bottom: 30px;
            border-radius: 10px;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.8)), url('https://www.hello-algo.com/assets/images/cover_light.png');
            background-size: cover;
            background-position: center 30%;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            border: 1px solid var(--neon-blue);
            display: flex;
            align-items: flex-end;
            padding: 30px;
            transition: all 0.5s;
        }

        .hero-section:hover {
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.4);
        }

        .hero-content {
            background: rgba(0, 10, 20, 0.85);
            padding: 20px;
            border-left: 4px solid var(--neon-blue);
            backdrop-filter: blur(5px);
            max-width: 600px;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: var(--neon-blue);
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .hero-desc {
            color: #ddd;
            margin-bottom: 20px;
        }

        .hero-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px 25px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .hero-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* Search & Controls */
        .controls-bar {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-blue);
            border-radius: 25px;
            padding: 5px 15px;
            width: 300px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            width: 100%;
            outline: none;
        }

        .search-icon {
            font-size: 1.2rem;
        }

        .cyber-select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 10px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
        }

        /* Tags & Badges */
        .diff-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .media-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.1);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .viewer-body {
            flex: 1;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Category Filter */
        .category-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-chip {
            padding: 5px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .cat-chip:hover,
        .cat-chip.active {
            border-color: var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
            color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

    <div class="ui-container">
        <header>
            <div class="logo">
                NEURAL_ARCHIVE <span style="font-size:0.8em; color:var(--neon-green)">// SUPREME_EDITION</span>
            </div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="SEARCH DATABASE..." oninput="handleSearch()">
                <div class="search-icon">🔍</div>
            </div>
            <a href="index.html" class="back-btn">EXIT SYSTEM</a>
        </header>

        <div class="main-content">

            <!-- Hero Section -->
            <div class="hero-section" id="hero-section">
                <div class="hero-content">
                    <h1 class="hero-title">本周推荐: HELLO 算法</h1>
                    <p class="hero-desc">《Hello 算法》：动画图解、一键运行。专为新手打造的数据结构与算法入门神书。全中文开源，免费阅读。</p>
                    <button class="hero-btn" onclick="openViewer(allResources.find(r=>r.id==='b_hello_algo'))">立即阅读
                        (READ NOW)</button>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-bar">
                <div class="mode-switch">
                    <button class="mode-btn active" id="btn-read" onclick="switchMode('read')">📖 LIBRARY</button>
                    <button class="mode-btn" id="btn-watch" onclick="switchMode('watch')">🎬 CINEMA</button>
                </div>

                <div class="filter-group">
                    <select id="difficultyFilter" onchange="handleSearch()" class="cyber-select">
                        <option value="all">ANY DIFFICULTY</option>
                        <option value="Beginner">BEGINNER</option>
                        <option value="Intermediate">INTERMEDIATE</option>
                        <option value="Advanced">ADVANCED</option>
                        <option value="Legendary">LEGENDARY</option>
                    </select>
                </div>
            </div>

            <div class="category-filter" id="category-filter">
                <!-- Javascript will populate this -->
            </div>

            <div class="media-grid" id="media-grid">
                <!-- Content will be injected here -->
            </div>
        </div>
    </div>

    <!-- Viewer Modal -->
    <div class="viewer-modal" id="viewer-modal">
        <div class="viewer-content">
            <div class="viewer-header">
                <span id="viewer-title" style="font-family: 'Orbitron'; color: var(--neon-blue);">TITLE_HERE</span>
                <span class="close-btn" onclick="closeViewer()">✖</span>
            </div>
            <div class="viewer-body" id="viewer-body">
                <!-- Iframe or Content placeholder -->
            </div>
        </div>
    </div>

    <script>
        // --- 3D Background Setup (Simulated Neural Network) ---
        const canvas = document.querySelector('#bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        // Particles
        const geometry = new THREE.BufferGeometry();
        const particleCount = 400;
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.2, transparent: true, opacity: 0.8 });
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Lines
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00f3ff, transparent: true, opacity: 0.15 });
        const lineGeometry = new THREE.BufferGeometry();
        // We will update lines in animate loop if needed, for now just simple drift
        // To keep performance high, let's just rotate the particle cloud

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.0005;
            particles.rotation.x += 0.0002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });


        // --- App Logic ---

        let currentMode = 'read';
        let allResources = [];

        // Mock Data Loading (Replace with fetch in real app)
        async function loadResources() {
            try {
                const response = await fetch('assets/data/media_resources.json');
                if (!response.ok) throw new Error("Failed to load resources");
                allResources = await response.json();
                renderGrid();
                renderCategories();
            } catch (e) {
                console.error(e);
                // Fallback / Initial Empty State
                document.getElementById('media-grid').innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 50px; color: #555;">[ SYSTEM OFFLINE: CHECKING DATABANKS... ]<br>Please create assets/data/media_resources.json</div>`;
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('btn-read').classList.toggle('active', mode === 'read');
            document.getElementById('btn-watch').classList.toggle('active', mode === 'watch');
            renderCategories();
            renderGrid();
        }

        function renderCategories() {
            const container = document.getElementById('category-filter');
            const relData = allResources.filter(r => r.type === currentMode);
            const categories = [...new Set(relData.map(r => r.category))];

            let html = `<div class="cat-chip active" onclick="filterCat('all')">ALL</div>`;
            categories.forEach(cat => {
                html += `<div class="cat-chip" onclick="filterCat('${cat}')">${cat}</div>`;
            });
            container.innerHTML = html;
        }

        let activeFilter = 'all';
        let searchQuery = '';
        let difficultyFilter = 'all';

        window.filterCat = function (cat) {
            activeFilter = cat;
            document.querySelectorAll('.cat-chip').forEach(el => {
                el.classList.toggle('active', el.innerText === cat || (cat === 'all' && el.innerText === 'ALL'));
            });
            renderGrid();
        }

        window.handleSearch = function () {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            difficultyFilter = document.getElementById('difficultyFilter').value;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('media-grid');
            grid.innerHTML = '';

            const filtered = allResources.filter(r => {
                const matchesMode = r.type === currentMode;
                const matchesCat = activeFilter === 'all' || r.category === activeFilter;
                const matchesSearch = r.title.toLowerCase().includes(searchQuery) ||
                    r.description.toLowerCase().includes(searchQuery) ||
                    (r.tags && r.tags.some(t => t.toLowerCase().includes(searchQuery)));
                const matchesDiff = difficultyFilter === 'all' || r.difficulty === difficultyFilter;

                return matchesMode && matchesCat && matchesSearch && matchesDiff;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #555; font-size: 1.5rem; margin-top: 50px;">NO MATCHING DATA FOUND IN ARCHIVE</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.dataset.difficulty = item.difficulty || 'Normal';
                card.onclick = () => openViewer(item);

                // Difficulty Color
                let diffColor = 'var(--neon-blue)';
                if (item.difficulty === 'Legendary') diffColor = '#ffd700'; // Gold
                if (item.difficulty === 'Advanced') diffColor = '#ff0055'; // Red
                if (item.difficulty === 'Beginner') diffColor = '#0aff0a'; // Green

                // Tags HTML
                const tagsHtml = item.tags ? item.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';

                card.innerHTML = `
                    <div class="media-thumb" style="background-image: url('${item.thumbnail || ''}'); border-bottom: 2px solid ${diffColor};">
                        <div class="diff-badge" style="color:${diffColor}; border-color:${diffColor}">${item.difficulty || 'General'}</div>
                    </div>
                    <div class="media-info">
                        <div>
                            <div class="media-title" style="${item.difficulty === 'Legendary' ? 'color:#ffd700; text-shadow:0 0 5px #ffd700' : ''}">${item.title}</div>
                            <div class="media-type">${item.category}</div>
                            <div class="media-tags">${tagsHtml}</div>
                            <div class="media-desc">${item.description}</div>
                        </div>
                        <button class="action-btn" style="border-color:${diffColor}; color:${diffColor}">
                            ${currentMode === 'read' ? 'ACCESS DATA' : 'INITIATE VISUAL'}
                        </button>
                    </div>
                `;

                // Add Legendary Effect
                if (item.difficulty === 'Legendary') {
                    card.style.boxShadow = "0 0 15px rgba(255, 215, 0, 0.2)";
                    card.style.border = "1px solid rgba(255, 215, 0, 0.5)";
                }

                grid.appendChild(card);
            });
        }

        function openViewer(item) {
            const modal = document.getElementById('viewer-modal');
            const title = document.getElementById('viewer-title');
            const body = document.getElementById('viewer-body');

            title.innerText = item.title;
            modal.style.display = 'flex';

            if (item.type === 'read') {
                // For PDF, we can use an iframe if it's a URL, or a simple text display if description
                if (item.url.endsWith('.pdf')) {
                    body.innerHTML = `<iframe src="${item.url}" width="100%" height="100%"></iframe>`;
                } else {
                    // Generic iframe for websites or online readers
                    body.innerHTML = `<iframe src="${item.url}" width="100%" height="100%" sandbox="allow-scripts allow-same-origin allow-popups allow-forms"></iframe>`;
                }
            } else {
                // Video
                if (item.url.includes('bilibili')) {
                    // Bilibili iframe optimization
                    body.innerHTML = `<iframe src="${item.url}&high_quality=1&as_wide=1&allowfullscreen=true" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"></iframe>`;
                } else {
                    body.innerHTML = `<iframe src="${item.url}" allowfullscreen></iframe>`;
                }
            }
        }

        window.closeViewer = function () {
            document.getElementById('viewer-modal').style.display = 'none';
            document.getElementById('viewer-body').innerHTML = ''; // Stop playback
        }

        // Init
        loadResources();

    </script>
</body>

</html>
