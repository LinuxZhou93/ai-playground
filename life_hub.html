    <script>
        // Init
        let currentFilter = 'All';

        // Define Categories Mapping for UI
        const categoryMap = {
            'All': { label: '全部 All', color: 'fuchsia' },
            'Genetics': { label: '遗传学 Genetics', color: 'fuchsia' },
            'Cell Bio': { label: '细胞生物学 Cell Bio', color: 'lime' },
            'Neuro': { label: '神经科学 Neuroscience', color: 'blue' },
            'Anatomy': { label: '解剖学 Anatomy', color: 'red' },
            'Ecology': { label: '生态学 Ecology', color: 'emerald' }
        };

        const colorClasses = {
            'fuchsia': { text: 'text-fuchsia-400', border: 'border-fuchsia-500/30', hover: 'hover:text-fuchsia-400', hoverBg: 'hover:bg-fuchsia-500' },
            'lime': { text: 'text-lime-400', border: 'border-lime-500/30', hover: 'hover:text-lime-400', hoverBg: 'hover:bg-lime-500' },
            'blue': { text: 'text-blue-400', border: 'border-blue-500/30', hover: 'hover:text-blue-400', hoverBg: 'hover:bg-blue-500' },
            'red': { text: 'text-red-400', border: 'border-red-500/30', hover: 'hover:text-red-400', hoverBg: 'hover:bg-red-500' },
            'emerald': { text: 'text-emerald-400', border: 'border-emerald-500/30', hover: 'hover:text-emerald-400', hoverBg: 'hover:bg-emerald-500' },
        };

        function renderFilters() {
            const container = document.getElementById('filter-container');
            const cats = ['All', 'Genetics', 'Cell Bio', 'Neuro', 'Anatomy', 'Ecology'];

            container.innerHTML = cats.map(cat => {
                const info = categoryMap[cat];
                const activeClass = currentFilter === cat
                    ? `bg-${info.color}-600 text-white border-${info.color}-500 shadow-[0_0_15px_rgba(255,255,255,0.3)]`
                    : `glass-panel text-slate-400 hover:text-${info.color}-400`;

                return `<button onclick="setFilter('${cat}')" 
                    class="px-6 py-2 font-bold uppercase text-xs tracking-widest border border-transparent transition-all whitespace-nowrap ${activeClass}">
                    ${info.label}
                </button>`;
            }).join('');
        }

        function setFilter(cat) {
            currentFilter = cat;
            renderFilters(); // Update active state
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('bio-grid');
            if (!window.lifeExperiments) return;

            const filtered = lifeExperiments.filter(item => currentFilter === 'All' || item.category === currentFilter);

            container.innerHTML = filtered.map((item, index) => {
                // Determine color theme based on category
                let themeColor = 'fuchsia';
                if (item.category === 'Cell Bio') themeColor = 'lime';
                if (item.category === 'Neuro') themeColor = 'blue';
                if (item.category === 'Anatomy') themeColor = 'red';
                if (item.category === 'Ecology') themeColor = 'emerald';

                const c = colorClasses[themeColor];
                const delay = index * 50;

                return `
                <div class="glass-panel p-1 group relative overflow-hidden h-[360px] animate-fade-in" style="animation-delay:${delay}ms">
                    <div class="absolute inset-0 bg-gray-900">
                        <img src="${item.thumbnail}" onerror="this.src='https://images.unsplash.com/photo-1530026405186-ed1f139313f8?q=80'" 
                             class="w-full h-full object-cover opacity-50 group-hover:opacity-70 transition-opacity duration-700 group-hover:scale-105 transition-transform">
                    </div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent"></div>
                    <div class="absolute bottom-0 left-0 p-6 w-full z-10 flex flex-col h-full justify-end">
                        <div class="mb-auto pt-4"><span class="text-[10px] font-mono border ${c.border} px-2 py-1 rounded ${c.text} bg-black/40 text-nowrap">${item.category.toUpperCase()}</span></div>
                        <h3 class="text-2xl font-display font-bold mb-2 text-white ${c.hover} transition-colors leading-tight">${item.title}</h3>
                        <p class="text-slate-400 text-sm mb-6 line-clamp-2">${item.desc}</p>
                        <button onclick="Tracker.log('life'); window.open('${item.url}', '_blank')" class="w-full py-3 border border-${themeColor}-500/50 ${c.hoverBg} hover:text-black ${c.text} text-xs font-bold uppercase transition-all tracking-widest bg-black/20">
                            启动 Start
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Run
        renderFilters();
        renderGrid();
    </script>

    <!-- BG SCRIPT -->
    <script>
        const canvas = document.getElementById('bio-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Bubble {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height + height; // Start below
                this.r = Math.random() * 10 + 2;
                this.speed = Math.random() * 1 + 0.5;
                this.wobble = Math.random() * Math.PI * 2;
                this.color = Math.random() > 0.5 ? 'rgba(217, 70, 239, 0.3)' : 'rgba(190, 242, 100, 0.3)';
            }
            update() {
                this.y -= this.speed;
                this.x += Math.sin(this.wobble) * 0.5;
                this.wobble += 0.05;
                if (this.y < -50) this.y = height + 50;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const bubbles = Array.from({ length: 50 }, () => new Bubble());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            bubbles.forEach(b => {
                b.update();
                b.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
