<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寻溯灵芝 · 探秘黄村坝 | 智能体感互动游戏</title>
    <!-- MediaPipe dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@700&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #D4AF37;
            /* Gold */
            --dark: #0a0a0a;
            --text: #ffffff;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--dark);
            font-family: 'Outfit', 'Noto Serif SC', sans-serif;
            color: var(--text);
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('assets/tcm/lingzhigame_bg.png');
            background-size: cover;
            background-position: center;
        }

        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
        }

        /* --- UI Elements --- */
        #hud {
            position: absolute;
            top: 40px;
            left: 40px;
            right: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 20px 40px;
            text-align: center;
        }

        #score-display {
            font-size: 64px;
            font-weight: 700;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            line-height: 1;
        }

        .hud-label {
            font-size: 16px;
            letter-spacing: 4px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        #timer-display {
            font-size: 48px;
            font-weight: 700;
            color: white;
            line-height: 1;
        }

        .timer-warning {
            color: #ff4757 !important;
            animation: pulseRed 1s infinite alternate;
        }

        @keyframes pulseRed {
            from {
                text-shadow: 0 0 10px rgba(255, 71, 87, 0);
            }

            to {
                text-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
            }
        }

        /* --- Hand Cursor --- */
        #hand-cursor {
            position: absolute;
            width: 80px;
            height: 80px;
            border: 3px solid var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.6), inset 0 0 20px rgba(212, 175, 55, 0.3);
            display: none;
            /* Hidden until hand detected */
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Inner glowing core */
        #hand-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--primary);
        }

        .cursor-active {
            transform: translate(-50%, -50%) scale(1.2) !important;
            border-color: #00ffcc !important;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.8), inset 0 0 20px rgba(0, 255, 204, 0.4) !important;
        }

        .cursor-active::after {
            background: #00ffcc !important;
            box-shadow: 0 0 30px #00ffcc !important;
        }

        /* --- Reishi Targets --- */
        .reishi-target {
            position: absolute;
            width: 120px;
            height: 120px;
            background-image: url('assets/tcm/lingzhigame_reishi_sprite.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%) scale(0);
            transform-origin: center bottom;
            opacity: 0;
            animation: growIn 0.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .reishi-premium {
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8));
            width: 150px;
            height: 150px;
        }

        @keyframes growIn {
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* --- Screens --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 200;
            transition: opacity 0.5s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title-primary {
            font-family: 'Noto Serif SC', serif;
            font-size: 80px;
            color: var(--primary);
            margin: 0 0 20px 0;
            text-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
        }

        .subtitle {
            font-size: 24px;
            letter-spacing: 8px;
            opacity: 0.8;
            margin-bottom: 60px;
        }

        .btn-start {
            background: linear-gradient(135deg, #D4AF37, #AA8529);
            color: black;
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.6);
        }

        /* Video feed for debugging/setup (optional, hide in production) */
        .input_video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 240px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transform: scaleX(-1);
            /* Mirror camera */
            z-index: 50;
            /* display: none; */
            /* Uncomment to hide camera feed */
        }

        /* Particle effects container */
        #particles {
            position: absolute;
            pointer-events: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 90;
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>

    <!-- Camera Feed -->
    <video class="input_video" autoplay playsinline></video>

    <div id="game-container">
        <div id="game-overlay"></div>
        <div id="particles"></div>

        <!-- Heads Up Display -->
        <div id="hud" style="display:none;">
            <div class="hud-panel">
                <div class="hud-label">活性药用价值</div>
                <div id="score-display">0</div>
            </div>
            <div class="hud-panel" style="border-color: rgba(255,255,255,0.2);">
                <div class="hud-label">剩余时间</div>
                <div id="timer-display">60</div>
            </div>
        </div>

        <!-- Hand Cursor -->
        <div id="hand-cursor"></div>

        <!-- Game Area where reishi spawn -->
        <div id="spawn-area" style="position:absolute; top:20%; left:10%; width:80%; height:60%;"></div>

        <!-- Screens -->

        <!-- Loading Screen -->
        <div id="screen-loading" class="screen">
            <h1 class="title-primary" style="font-size:40px;">初始化视觉神经中枢...</h1>
            <p style="opacity:0.6; margin-top: 20px;">正在加载正中大健康大屏体感引擎</p>
        </div>

        <!-- Start Screen -->
        <div id="screen-start" class="screen hidden">
            <h1 class="title-primary">寻溯灵芝</h1>
            <div class="subtitle">探秘通济黄村坝·原生境采摘体验</div>

            <div style="display:flex; gap: 40px; margin-bottom: 60px; text-align:left;">
                <div
                    style="background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 250px;">
                    <i class="fas fa-hand-paper"
                        style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
                    <h3 style="margin:0 0 10px 0;">隔空挥手</h3>
                    <p style="font-size:14px; opacity:0.7; margin:0;">站在屏幕正前方，挥动双手控制金色光环。</p>
                </div>
                <div
                    style="background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 250px;">
                    <i class="fas fa-bullseye" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
                    <h3 style="margin:0 0 10px 0;">悬停采摘</h3>
                    <p style="font-size:14px; opacity:0.7; margin:0;">将光环移动至出现的灵芝上悬停0.5秒完成采摘。</p>
                </div>
            </div>

            <button class="btn-start" onclick="startGame()">开启寻芝之旅</button>
        </div>

        <!-- Game Over Screen -->
        <div id="screen-gameover" class="screen hidden">
            <div class="subtitle" style="margin-bottom:20px; color:var(--primary);">评级：<span id="final-rank">寻药学徒</span>
            </div>
            <h1 class="title-primary" style="font-size:120px; margin-bottom:10px;"><span id="final-score">0</span> <span
                    style="font-size:40px;">分</span></h1>
            <p style="font-size: 20px; opacity:0.8; margin-bottom: 50px;">您为正中大健康智造工厂采摘了极其珍稀的原料！</p>
            <button class="btn-start" onclick="resetGame()"
                style="font-size:18px; padding:15px 40px; background: transparent; border: 2px solid var(--primary); color: white; box-shadow:none;">再次体验</button>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        // --- 1. Variables & Elements ---
        const videoElement = document.getElementsByClassName('input_video')[0];
        const cursor = document.getElementById('hand-cursor');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const spawnArea = document.getElementById('spawn-area');
        const particlesContainer = document.getElementById('particles');

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        let isGameRunning = false;
        let score = 0;
        let timeLeft = 60;
        let gameInterval, spawnInterval, timerInterval;
        let activeReishi = null;
        let hoverStartTime = 0;
        const HOVER_DURATION_MS = 600; // Time needed to pick a reishi

        // --- 2. MediaPipe Hand Tracking Setup ---
        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                // Determine screen dimensions
                const w = window.innerWidth;
                const h = window.innerHeight;

                // Get the main point of the first hand (Index Finger MCP or Middle MCP)
                // Landmark 9 is middle finger MCP, good for center of hand stability
                let pt = results.multiHandLandmarks[0][9];

                // Smoothing factor (Low pass filter)
                const smoothAlpha = 0.3;

                // Note: mediapipe x is mirrored compared to screen if we mirrored video
                // We map raw normalized coordinates directly to screen 
                // x goes from 0 (left of video) to 1 (right)
                let targetX = (1 - pt.x) * w;
                let targetY = pt.y * h;

                // Apply smoothing
                cursorX = cursorX + (targetX - cursorX) * smoothAlpha;
                cursorY = cursorY + (targetY - cursorY) * smoothAlpha;

                // Update CSS
                cursor.style.display = 'block';
                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';
            } else {
                cursor.style.display = 'none';
            }
        }

        const hands = new Hands({
            locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
            }
        });

        hands.setOptions({
            maxNumHands: 1, // Only track one hand for performance and clarity
            modelComplexity: 1, // Balance between accuracy and speed
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // Start WebCam
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });

        // --- 3. Game Engine Logic ---

        function initCamera() {
            document.getElementById('screen-loading').classList.remove('hidden');
            camera.start().then(() => {
                setTimeout(() => {
                    document.getElementById('screen-loading').classList.add('hidden');
                    document.getElementById('screen-start').classList.remove('hidden');
                }, 1000);
            }).catch(err => {
                console.warn("No camera found or user denied access. You can still test with a mouse by clicking.", err);
                document.getElementById('screen-loading').classList.add('hidden');
                document.getElementById('screen-start').classList.remove('hidden');
            });
        }

        // Initialize immediately
        initCamera();

        function startGame() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-gameover').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';

            score = 0;
            timeLeft = 60;
            isGameRunning = true;
            scoreDisplay.innerText = score;
            timerDisplay.innerText = timeLeft;
            timerDisplay.classList.remove('timer-warning');

            spawnArea.innerHTML = ''; // Clear prev Reishi

            // Loop for picking detection
            gameInterval = setInterval(gameLoop, 1000 / 60); // 60fps detection

            // Timer countdown
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft <= 10) timerDisplay.classList.add('timer-warning');

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Spawn interval
            spawnReishi();
            spawnInterval = setInterval(spawnReishi, 2500); // New spawn every 2.5s
        }

        function spawnReishi() {
            if (!isGameRunning) return;

            // remove old if exists
            if (activeReishi) {
                spawnArea.removeChild(activeReishi);
            }

            activeReishi = document.createElement('div');
            activeReishi.className = 'reishi-target';

            // Randomize position within spawn area
            const w = spawnArea.clientWidth;
            const h = spawnArea.clientHeight;
            const rx = Math.random() * (w - 120) + 60; // keep in bounds
            const ry = Math.random() * (h - 120) + 60;

            activeReishi.style.left = rx + 'px';
            activeReishi.style.top = ry + 'px';

            // 20% chance for premium reishi
            const isPremium = Math.random() > 0.8;
            if (isPremium) {
                activeReishi.classList.add('reishi-premium');
                activeReishi.dataset.points = 300;
            } else {
                activeReishi.dataset.points = 100;
            }

            // Fallback for click logic (if mouse needed for testing)
            activeReishi.addEventListener('click', (e) => {
                if (isGameRunning) pickReishi();
            });

            spawnArea.appendChild(activeReishi);
            hoverStartTime = 0; // reset
            cursor.classList.remove('cursor-active');
        }

        // Check if cursor is over AABB of target
        function checkCollision() {
            if (!activeReishi || cursor.style.display === 'none') return false;

            const rect1 = cursor.getBoundingClientRect();
            const rect2 = activeReishi.getBoundingClientRect();

            // Allow small margin of error (hitbox adjustment)
            const overlap = !(rect1.right < rect2.left + 20 ||
                rect1.left > rect2.right - 20 ||
                rect1.bottom < rect2.top + 20 ||
                rect1.top > rect2.bottom - 20);
            return overlap;
        }

        function gameLoop() {
            if (!isGameRunning) return;

            const isColliding = checkCollision();

            if (isColliding) {
                cursor.classList.add('cursor-active');
                if (hoverStartTime === 0) {
                    hoverStartTime = Date.now();
                } else {
                    const elapsed = Date.now() - hoverStartTime;
                    // Scale element slightly to show progression
                    activeReishi.style.transform = `translate(-50%, -50%) scale(${1 + (elapsed / HOVER_DURATION_MS) * 0.2})`;

                    if (elapsed > HOVER_DURATION_MS) {
                        pickReishi();
                    }
                }
            } else {
                cursor.classList.remove('cursor-active');
                if (activeReishi) {
                    activeReishi.style.transform = 'translate(-50%, -50%) scale(1)';
                }
                hoverStartTime = 0;
            }
        }

        function createExplosion(x, y, isPremium) {
            const count = isPremium ? 40 : 20;
            const colorPrimary = isPremium ? '#D4AF37' : '#cfaf69'; // Gold

            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'absolute';
                particle.style.width = (Math.random() * 8 + 4) + 'px';
                particle.style.height = particle.style.width;
                particle.style.background = Math.random() > 0.5 ? colorPrimary : '#ffffff';
                particle.style.borderRadius = '50%';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.boxShadow = `0 0 10px ${colorPrimary}`;

                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 150 + 50;
                const tx = x + Math.cos(angle) * velocity;
                const ty = y + Math.sin(angle) * velocity + 100; // arc down due to gravity

                particle.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx - x}px, ${ty - y}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 600 + Math.random() * 400,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();

                particlesContainer.appendChild(particle);
            }
        }

        function pickReishi() {
            if (!activeReishi) return;

            const rect = activeReishi.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            const pts = parseInt(activeReishi.dataset.points);
            const isPremium = pts > 100;

            score += pts;
            scoreDisplay.innerText = score;

            // Trigger visual feedback
            createExplosion(cx, cy, isPremium);

            // Pop text "+100"
            const popText = document.createElement('div');
            popText.innerText = `+${pts}`;
            popText.style.position = 'absolute';
            popText.style.left = cx + 'px';
            popText.style.top = (cy - 40) + 'px';
            popText.style.color = '#00ffcc';
            popText.style.fontSize = '32px';
            popText.style.fontWeight = 'bold';
            popText.style.textShadow = '0 0 10px #00ffcc';
            popText.style.zIndex = 100;

            popText.animate([
                { transform: 'translateY(0)', opacity: 1 },
                { transform: 'translateY(-50px)', opacity: 0 }
            ], { duration: 800, easing: 'ease-out' }).onfinish = () => popText.remove();

            particlesContainer.appendChild(popText);

            // Remove node
            spawnArea.removeChild(activeReishi);
            activeReishi = null;
            hoverStartTime = 0;
            cursor.classList.remove('cursor-active');

            // Flash screen
            scoreDisplay.style.transform = 'scale(1.3)';
            setTimeout(() => scoreDisplay.style.transform = 'scale(1)', 150);
        }

        function endGame() {
            isGameRunning = false;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            clearInterval(timerInterval);

            if (activeReishi) {
                spawnArea.removeChild(activeReishi);
                activeReishi = null;
            }

            cursor.classList.remove('cursor-active');
            document.getElementById('hud').style.display = 'none';
            document.getElementById('screen-gameover').classList.remove('hidden');

            // Set Rank
            const rankLabel = document.getElementById('final-rank');
            document.getElementById('final-score').innerText = score;
            if (score < 500) rankLabel.innerText = "寻药学徒";
            else if (score < 1500) rankLabel.innerText = "资深采药客";
            else if (score < 2500) rankLabel.innerText = "药王谷传人";
            else rankLabel.innerText = "国医采芝大师";
        }

        function resetGame() {
            startGame();
        }
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.24_3"></script>
</body>
