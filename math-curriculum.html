                s_2: { title: "数学建模专题", core: ["最优投资组合", "疾病传播SIRS模型", "通信加密初步"], literacy: "战略判断、模型评价", detail: "能够针对复杂问题给出数学解法。", example: "例：模拟病毒传播的数学规律。", ai_integration: "【AI】AI算法中的数学模型透明化。", challenge: "【拓展】全国数学建模竞赛真题欣赏。" },
                s_3: { title: "科技前沿数学应用", core: ["量化金融算法", "图像处理矩阵运用", "脑机连接中的信号"], literacy: "未来竞争力、科技灵魂", detail: "数学作为理解未来科技的终极密码。", example: "例：深度神经网络的矩阵乘法。", ai_integration: "【AI】神经网络自动寻优过程展示。", challenge: "【拓展】数学作为宇宙通用语言的哲学探讨。" }
            }
        };

        const DetailModal = ({ isOpen, onClose, data, stageColor }) => {
            if (!isOpen || !data) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in" onClick={onClose}>
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl w-[95%] md:w-full max-w-2xl overflow-hidden shadow-2xl transform transition-all max-h-[90vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                        <div className={`p-6 ${stageColor.replace('bg-', 'bg-opacity-20 bg-')} border-b border-slate-700 flex justify-between items-start sticky top-0 backdrop-blur-md z-10`}>
                            <div>
                                <h3 className="text-2xl font-bold text-white mb-2">{data.title}</h3>
                                <div className="flex gap-2">
                                    <span className="px-2 py-1 rounded text-xs font-bold bg-white/10 text-white border border-white/20">核心素养：{data.literacy}</span>
                                </div>
                            </div>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition-colors">
                                <X className="w-6 h-6" />
                            </button>
                        </div>

                        <div className="p-6 space-y-6">
                            <div>
                                <h4 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <Book className="w-4 h-4" /> 知识要点
                                </h4>
                                <div className="grid grid-cols-2 gap-3">
                                    {data.core.map((item, idx) => (
                                        <div key={idx} className="flex items-center gap-2 bg-slate-800/50 p-3 rounded-lg border border-slate-700">
                                            <div className={`w-2 h-2 rounded-full ${stageColor.replace('bg-', 'bg-')}`}></div>
                                            <span className="text-slate-200 text-sm">{item}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-4">
                                <div className="bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">
                                    <h4 className="text-slate-300 font-bold mb-2">🎓 课标解读</h4>
                                    <p className="text-slate-400 text-sm leading-relaxed">{data.detail}</p>
                                </div>

                                <div className="bg-blue-900/10 p-4 rounded-xl border border-blue-500/20">
                                    <h4 className="text-blue-300 font-bold mb-2">💡 典型例题</h4>
                                    <p className="text-blue-200/80 text-sm font-mono">{data.example}</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-purple-900/10 p-4 rounded-xl border border-purple-500/20">
                                        <h4 className="text-purple-300 font-bold mb-2 flex items-center gap-2">
                                            <Cpu className="w-4 h-4" /> AI & 编程融合
                                        </h4>
                                        <p className="text-purple-200/80 text-sm">{data.ai_integration}</p>
                                    </div>
                                    <div className="bg-orange-900/10 p-4 rounded-xl border border-orange-500/20">
                                        <h4 className="text-orange-300 font-bold mb-2 flex items-center gap-2">
                                            <Trophy className="w-4 h-4" /> 思维拓展
                                        </h4>
                                        <p className="text-orange-200/80 text-sm">{data.challenge}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedNode, setSelectedNode] = useState(null);
            const [selectedStageColor, setSelectedStageColor] = useState("");

            // Filter logic
            const queryParams = new URLSearchParams(window.location.search);
            const stageFilter = queryParams.get('stage'); // 'p', 'j', 's'

            let filteredStages = stages;
            let stageTitle = "";

            if (stageFilter === 'p') {
                filteredStages = stages.filter(s => s.id.startsWith('p_'));
                stageTitle = " - 小学阶段";
            } else if (stageFilter === 'j') {
                filteredStages = stages.filter(s => s.id.startsWith('j_'));
                stageTitle = " - 初中阶段";
            } else if (stageFilter === 's') {
                filteredStages = stages.filter(s => s.id.startsWith('s_'));
                stageTitle = " - 高中阶段";
            }

            const gridClass = `grid grid-cols-[200px_repeat(${filteredStages.length},300px)] gap-6`;

            useEffect(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, []);

            return (
                <div className="min-h-screen bg-[#020617] text-slate-100 pb-20 font-[Inter]">
                    {/* Navigation */}
                    <a href="subject-synergy.html" className="fixed top-4 right-4 md:top-6 md:right-6 z-40 p-2 md:p-3 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-full text-slate-400 hover:text-white hover:bg-blue-600 transition-all shadow-lg group">
                        <span className="mr-2 text-sm font-bold hidden group-hover:inline">返回学科协同</span>
                        <Home className="w-5 h-5 inline" />
                    </a>

                    {/* Header */}
                    <header className="pt-10 md:pt-20 pb-8 md:pb-12 px-4 text-center relative overflow-hidden">
                        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-blue-600/10 blur-[120px] rounded-full pointer-events-none"></div>
                        <h1 className="text-2xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-500 to-purple-600 mb-4 relative z-10">
                            K12 数学芯课标核心素养全景图{stageTitle}
                        </h1>
                        <p className="text-slate-400 max-w-2xl mx-auto text-sm md:text-lg">
                            从数感建立到抽象建模的逻辑思维进化矩阵
                        </p>
                    </header>

                    {/* Main Content Grid */}
                    <main className="max-w-7xl mx-auto px-4">
                        <div className="md:hidden text-center text-slate-500 text-xs mb-2 animate-pulse">
                            ← 左右滑动查看完整图谱 →
                        </div>
                        <div className="overflow-x-auto custom-scrollbar pb-4">
                            <div className="w-fit">
                                {/* Stage Headers */}
                                <div className={`${gridClass} mb-8 sticky top-0 bg-[#020617]/95 backdrop-blur z-30 py-4 border-b border-slate-800`}>
                                    <div className="flex items-end justify-end px-4 pb-2 text-slate-500 font-bold text-sm uppercase tracking-widest text-right">
                                        数学思维 / 学习阶段
                                    </div>
                                    {filteredStages.map(stage => (
                                        <div key={stage.id} className={`flex flex-col items-center p-4 rounded-xl ${stage.bgSoft} border ${stage.borderColor}`}>
                                            <span className={`text-lg font-bold ${stage.textColor}`}>{stage.label}</span>
                                            <span className="text-xs text-slate-400 mt-1">{stage.subtitle}</span>
                                        </div>
                                    ))}
                                </div>

                                {/* Tracks & Nodes */}
                                <div className="space-y-8">
                                    {tracks.map(track => (
                                        <div key={track.id} className={`${gridClass} group`}>
                                            {/* Track Header */}
                                            <div className={`glass-panel rounded-xl p-6 flex flex-col justify-center items-end text-right border-r-4 ${track.color.replace('text-', 'border-')}`}>
                                                <track.icon className={`w-8 h-8 ${track.color} mb-3`} />
                                                <h3 className={`text-xl font-bold text-white mb-1`}>{track.title}</h3>
                                                <p className="text-xs text-slate-500 font-medium">{track.desc}</p>
                                            </div>

                                            {/* Stage Nodes */}
                                            {filteredStages.map(stage => {
                                                const data = curriculumData[track.id][stage.id];
                                                return (
                                                    <div
                                                        key={`${track.id}-${stage.id}`}
                                                        onClick={() => {
                                                            setSelectedNode(data);
                                                            setSelectedStageColor(stage.color);
                                                        }}
                                                        className={`
                                                            relative h-full min-h-[180px] rounded-xl p-5 cursor-pointer
                                                            bg-slate-900/40 border border-slate-800
                                                            hover:bg-slate-800 hover:border-slate-600 hover:shadow-xl hover:-translate-y-1
                                                            transition-all duration-300 group/card overflow-hidden flex flex-col
                                                        `}
                                                    >
                                                        {/* Hover Glow */}
                                                        <div className={`absolute inset-0 opacity-0 group-hover/card:opacity-10 transition-opacity duration-500 bg-gradient-to-br ${track.gradient}`}></div>

                                                        <div className="relative z-10 h-full flex flex-col">
                                                            <h4 className="text-lg font-bold text-slate-200 mb-2 group-hover/card:text-white transition-colors">
                                                                {data.title}
                                                            </h4>

                                                            <div className="space-y-1.5 mb-4 flex-grow text-xs text-slate-400">
                                                                {data.core.slice(0, 3).map((item, i) => (
                                                                    <div key={i} className="flex items-center gap-2">
                                                                        <div className={`w-1.5 h-1.5 rounded-full ${stage.color}`}></div>
                                                                        {item}
                                                                    </div>
                                                                ))}
                                                                {data.core.length > 3 && <div className="text-slate-600 pl-3.5">...</div>}
                                                            </div>

                                                            <div className="mt-auto pt-3 border-t border-slate-700/50 flex items-center justify-between">
                                                                <span className={`text-[10px] font-bold px-2 py-1 rounded bg-slate-950 ${stage.textColor}`}>
                                                                    {stage.label.split(' ')[0]}
                                                                </span>
                                                                <span className="text-xs text-slate-500 group-hover/card:text-blue-400 transition-colors flex items-center gap-1">
                                                                    进入 <Check className="w-3 h-3" />
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    <DetailModal
                        isOpen={!!selectedNode}
                        onClose={() => setSelectedNode(null)}
                        data={selectedNode}
                        stageColor={selectedStageColor}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
