<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学探索中心 | Math Exploration Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-tech {
            font-family: 'Rajdhani', sans-serif;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .grid-pattern {
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .math-symbol {
            position: absolute;
            font-weight: bold;
            color: rgba(99, 102, 241, 0.03);
            pointer-events: none;
            user-select: none;
            z-index: 0;
            font-family: 'serif';
        }

        @keyframes rotate-slow {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .animate-rotate {
            animation: rotate-slow 20s linear infinite;
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Calculator = (props) => <IconBase {...props}><rect width="16" height="20" x="4" y="2" rx="2" /><line x1="8" x2="16" y1="6" y2="6" /><line x1="16" x2="16" y1="14" y2="18" /><path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" /><path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" /></IconBase>;
        const Shapes = (props) => <IconBase {...props}><path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.435 3.5a.7.7 0 0 1 1.13 0l3.76 5.421a.7.7 0 0 1-.627 1.079z" /><rect width="7" height="7" x="3" y="14" rx="1" /><circle cx="17.5" cy="17.5" r="3.5" /></IconBase>;
        const LineChart = (props) => <IconBase {...props}><path d="M3 3v18h18" /><path d="m19 9-5 5-4-4-3 3" /></IconBase>;
        const Compass = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36z" /></IconBase>;
        const Brain = (props) => <IconBase {...props}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z" /><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const ArrowRight = (props) => <IconBase {...props}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></IconBase>;

        const StatsItem = ({ label, value, color }) => (
            <div className="flex flex-col">
                <span className="text-slate-500 text-xs font-tech uppercase tracking-tighter">{label}</span>
                <span className={`text-2xl font-bold font-tech ${color}`}>{value}</span>
            </div>
        );

        const ModuleCard = ({ icon: Icon, title, desc, progress, color }) => (
            <div className="glass-card rounded-2xl p-6 group cursor-pointer border-l-4" style={{ borderColor: color }}>
                <div className="flex items-start justify-between mb-4">
                    <div className={`p-3 rounded-xl bg-slate-800/50 ${color.replace('border-', 'text-')}`}>
                        <Icon className="w-6 h-6" />
                    </div>
                    <span className="text-xs font-tech text-slate-500">{progress}% COMPLETE</span>
                </div>
                <h3 className="text-lg font-bold mb-2 group-hover:translate-x-1 transition-transform">{title}</h3>
                <p className="text-slate-400 text-sm mb-6 leading-relaxed">{desc}</p>
                <div className="w-full h-1 bg-slate-800 rounded-full overflow-hidden">
                    <div className="h-full bg-indigo-500 transition-all duration-1000" style={{ width: `${progress}%`, backgroundColor: color.split('-')[1] }}></div>
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative grid-pattern pb-20">
                    {/* Background Symbols */}
                    <span className="math-symbol text-[12rem] top-20 left-10">∫</span>
                    <span className="math-symbol text-[15rem] bottom-10 right-20">∑</span>
                    <span className="math-symbol text-[8rem] top-1/2 left-1/3">π</span>
                    <span className="math-symbol text-[10rem] top-40 right-1/4">∆</span>

                    {/* Navbar */}
                    <nav className="fixed top-0 left-0 w-full h-20 z-50 px-8 flex items-center justify-between border-b border-white/5 bg-slate-950/80 backdrop-blur-md">
                        <div className="flex items-center gap-10">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold font-orbitron">M</div>
                                <span className="font-orbitron font-bold tracking-widest text-lg">MATHLAB</span>
                            </div>
                            <div className="hidden md:flex gap-6 font-tech font-bold text-sm tracking-widest">
                                <a href="#" className="text-indigo-400">DASHBOARD</a>
                                <a href="#" className="text-slate-500 hover:text-white transition-colors uppercase">Problem Sets</a>
                                <a href="#" className="text-slate-500 hover:text-white transition-colors uppercase">Interactives</a>
                                <a href="#" className="text-slate-500 hover:text-white transition-colors uppercase">Academy</a>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <a href="math-curriculum.html" className="hidden sm:flex items-center gap-2 border border-indigo-500/30 text-indigo-400 px-4 py-2 rounded-lg font-tech font-bold text-sm hover:bg-indigo-500/10 transition-all">
                                [ 标准大纲 ]
                            </a>
                            <a href="index.html" className="p-2 text-slate-400 hover:text-white transition-colors">
                                <Home className="w-6 h-6" />
                            </a>
                        </div>
                    </nav>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero / Welcome */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 mb-20 items-center">
                            <div className="lg:col-span-7">
                                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-bold font-tech mb-6">
                                    <div className="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-pulse"></div>
                                    LOGIC ENGINE IS ACTIVE
                                </div>
                                <h1 className="text-5xl md:text-7xl font-orbitron font-bold mb-6 leading-tight">
                                    发现数字的<br />
                                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-violet-400 to-indigo-600">终极美感</span>
                                </h1>
                                <p className="text-lg text-slate-400 mb-8 max-w-2xl font-tech tracking-wide">
                                    超越计算，探索逻辑架构。从几何模型到微积分的无限延伸，构建属于你的数学大厦。
                                </p>
                                <div className="flex gap-4">
                                    <button className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-3 rounded-xl font-bold font-tech tracking-widest shadow-lg shadow-indigo-500/20 transition-all">
                                        CONTINUE LEARNING
                                    </button>
                                    <button className="glass-card px-8 py-3 rounded-xl font-bold font-tech tracking-widest hover:bg-white/5 transition-all">
                                        DAILY CHALLENGE
                                    </button>
                                </div>
                            </div>
                            <div className="lg:col-span-5 relative">
                                <div className="glass-card rounded-[3rem] p-10 aspect-square flex items-center justify-center relative overflow-hidden group">
                                    <div className="absolute inset-0 bg-gradient-to-br from-indigo-500/20 via-transparent to-violet-500/20"></div>
                                    <div className="relative z-10 w-full h-full border-2 border-dashed border-indigo-500/20 rounded-full animate-rotate"></div>
                                    <div className="absolute inset-0 flex items-center justify-center z-20">
                                        <div className="w-32 h-32 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-indigo-500/50 group-hover:scale-110 transition-transform duration-500">
                                            <Calculator className="w-16 h-16 text-white" />
                                        </div>
                                    </div>
                                    {/* Small floating elements */}
                                    <div className="absolute top-10 right-10 glass-card p-3 rounded-lg"><span className="text-indigo-400 font-tech">f(x) = sin(x)</span></div>
                                    <div className="absolute bottom-10 left-10 glass-card p-3 rounded-lg"><span className="text-violet-400 font-tech">e = mc²</span></div>
                                </div>
                            </div>
                        </div>

                        {/* Stats / Goals Section */}
                        <div className="glass-card rounded-3xl p-8 mb-16 grid grid-cols-2 lg:grid-cols-4 gap-8">
                            <StatsItem label="Streak" value="12 Days" color="text-amber-400" />
                            <StatsItem label="Mastery" value="84.2%" color="text-indigo-400" />
                            <StatsItem label="Points" value="12,450" color="text-violet-400" />
                            <StatsItem label="Rank" value="#124 Global" color="text-emerald-400" />
                        </div>

                        {/* Learning Modules Grid */}
                        <div className="mb-20">
                            <div className="flex items-center justify-between mb-10">
                                <h2 className="text-3xl font-orbitron font-bold">学习模块 <span className="text-slate-500 font-tech text-lg ml-2">Modules</span></h2>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                <ModuleCard
                                    icon={Shapes}
                                    title="几何拓扑"
                                    desc="研究空间变换与不变量。从平行公理到黎曼几何的宏大跨越。"
                                    progress={65}
                                    color="#6366f1"
                                />
                                <ModuleCard
                                    icon={LineChart}
                                    title="动态系统"
                                    desc="探究函数生长的规律。导数、积分与变化率的深度建模。"
                                    progress={42}
                                    color="#a855f7"
                                />
                                <ModuleCard
                                    icon={Brain}
                                    title="逻辑推演"
                                    desc="构建严密的公理解构体系。数理逻辑与集合论的基础设施。"
                                    progress={18}
                                    color="#ec4899"
                                />
                            </div>
                        </div>

                        {/* Interactive Area Callout */}
                        <div className="relative rounded-[4rem] overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-r from-indigo-900 via-indigo-950 to-slate-950"></div>
                            <div className="absolute inset-0 grid-pattern opacity-10"></div>
                            <div className="relative z-10 p-12 lg:p-20 flex flex-col lg:flex-row items-center gap-10">
                                <div className="flex-1">
                                    <h2 className="text-4xl lg:text-5xl font-orbitron font-bold mb-6">可视化实验室</h2>
                                    <p className="text-slate-400 mb-8 max-w-xl font-tech text-xl tracking-wide">
                                        拖动函数曲线，实时观察模型变化。让抽象概念通过动态仿真变得触手可及。
                                    </p>
                                    <button className="flex items-center gap-3 text-white font-bold font-tech tracking-widest text-lg group">
                                        进入实验室 <ArrowRight className="w-5 h-5 group-hover:translate-x-2 transition-transform" />
                                    </button>
                                </div>
                                <div className="flex-1 w-full lg:w-auto">
                                    <div className="glass-card rounded-2xl h-64 w-full shimmer relative overflow-hidden flex items-center justify-center">
                                        <div className="w-full px-10">
                                            <div className="h-1 bg-slate-800 rounded-full relative">
                                                <div className="absolute -top-2 left-1/2 w-5 h-5 bg-indigo-500 rounded-full shadow-lg shadow-indigo-500/50"></div>
                                            </div>
                                            <div className="flex justify-between mt-4 font-tech text-indigo-400 text-sm">
                                                <span>MIN</span>
                                                <span>VARIABLE X</span>
                                                <span>MAX</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className="mt-20 py-12 border-t border-white/5 bg-slate-950/50">
                        <div className="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold font-orbitron">M</div>
                                <span className="font-orbitron font-bold tracking-widest text-lg">MATHLAB</span>
                            </div>
                            <p className="text-slate-500 text-sm font-tech">© 2025 MATH EXPLORATION CENTER. ALL LOGIC RESERVED.</p>
                            <div className="flex gap-6 text-slate-400">
                                <a href="#" className="hover:text-indigo-400 transition-colors">PRIVACY</a>
                                <a href="#" className="hover:text-indigo-400 transition-colors">TERMS</a>
                                <a href="#" className="hover:text-indigo-400 transition-colors">SUPPORT</a>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
