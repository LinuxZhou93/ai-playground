                                                <track.icon className={`w-8 h-8 ${track.color} mb-3`} />
                                                <h3 className={`text-xl font-bold text-white mb-1`}>{track.title}</h3>
                                                <p className="text-xs text-slate-500 font-medium">{track.desc}</p>
                                            </div>

                                            {/* Stage Nodes */}
                                            {stages.map(stage => {
                                                const data = curriculumData[track.id][stage.id];
                                                return (
                                                    <div
                                                        key={`${track.id}-${stage.id}`}
                                                        onClick={() => {
                                                            setSelectedNode(data);
                                                            setSelectedStageColor(stage.color);
                                                        }}
                                                        className={`
                            relative h-full min-h-[180px] rounded-xl p-5 cursor-pointer
                            bg-slate-800/40 border border-slate-700/50
                            hover:bg-slate-800 hover:border-slate-600 hover:shadow-xl hover:-translate-y-1
                            transition-all duration-300 group/card overflow-hidden flex flex-col
                          `}
                                                    >
                                                        {/* Hover Glow */}
                                                        <div className={`absolute inset-0 opacity-0 group-hover/card:opacity-10 transition-opacity duration-500 bg-gradient-to-br ${track.gradient}`}></div>

                                                        <div className="relative z-10 h-full flex flex-col">
                                                            <h4 className="text-lg font-bold text-slate-200 mb-3 group-hover/card:text-white transition-colors">
                                                                {data.title}
                                                            </h4>

                                                            <div className="space-y-2 mb-4 flex-grow">
                                                                {data.core.slice(0, 3).map((item, i) => (
                                                                    <div key={i} className="flex items-center gap-2 text-xs text-slate-400">
                                                                        <div className={`w-1.5 h-1.5 rounded-full ${stage.color}`}></div>
                                                                        {item}
                                                                    </div>
                                                                ))}
                                                                {data.core.length > 3 && <div className="text-xs text-slate-600 pl-3.5">...</div>}
                                                            </div>

                                                            <div className="mt-auto pt-3 border-t border-slate-700/50 flex flex-col gap-2">
                                                                <div className="flex items-center justify-between">
                                                                    <span className={`text-[10px] font-bold px-2 py-1 rounded bg-slate-900 ${stage.textColor}`}>
                                                                        {stage.label.split(' ')[0]}
                                                                    </span>
                                                                    <span className="text-xs text-slate-500 group-hover/card:text-indigo-400 transition-colors flex items-center gap-1">
                                                                        详情 <Check className="w-3 h-3" />
                                                                    </span>
                                                                </div>
                                                                {/* Tags for AI/Challenge */}
                                                                <div className="flex gap-1">
                                                                    <span className="text-[9px] px-1.5 py-0.5 rounded bg-fuchsia-500/10 text-fuchsia-400 border border-fuchsia-500/20">AI思维</span>
                                                                    <span className="text-[9px] px-1.5 py-0.5 rounded bg-pink-500/10 text-pink-400 border border-pink-500/20">拓展</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    <DetailModal
                        isOpen={!!selectedNode}
                        onClose={() => setSelectedNode(null)}
                        data={selectedNode}
                        stageColor={selectedStageColor}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
