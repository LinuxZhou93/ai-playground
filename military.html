<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>军事武库 | Military Arsenal</title>
    <!-- TailwindCSS -->
    
    
    <link
        href="https://fonts.loli.net/css2?family=Black+Ops+One&family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <style>
        :root {
            --mil-green: #4ade80;
            --mil-dark: #051005;
            --glass: rgba(0, 50, 0, 0.3);
        }

        body {
            background-color: var(--mil-dark);
            color: #dcfce7;
            font-family: 'Roboto Mono', monospace;
            overflow-x: hidden;
        }

        /* Hero Background */
        .hero {
            position: relative;
            height: 70vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a331a 0%, #000 100%);
            z-index: -2;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(74, 222, 128, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74, 222, 128, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            perspective: 1000px;
            transform: rotateX(60deg) scale(2);
            opacity: 0.3;
        }

        .scan-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 5px;
            background: rgba(74, 222, 128, 0.5);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.8);
            animation: scan 3s linear infinite;
            z-index: 0;
            opacity: 0.5;
        }

        /* CRT Effect */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>

    <!-- Nav -->
    <nav class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur border-b border-green-900/50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="text-3xl">🛡️</div>
                <h1 class="font-display font-bold text-2xl tracking-wider text-white">
                    MILITARY <span class="text-green-500">ARSENAL</span>
                </h1>
            </div>
            <div class="flex items-center gap-6">
                <a href="#database" class="text-sm font-bold text-green-400 hover:text-white uppercase">Database</a>
                <a href="#intel" class="text-sm font-bold text-green-400 hover:text-white uppercase">Intel</a>
                <a href="index.html"
                    class="px-6 py-2 border border-green-500 text-green-500 hover:bg-green-500 hover:text-black font-bold uppercase transition-all">Home</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="grid-overlay"></div>
        <div class="scan-line"></div>

        <div class="relative z-10 text-center px-4 max-w-4xl">
            <h1
                class="text-6xl md:text-8xl font-display font-black text-white mb-4 tracking-tighter drop-shadow-[0_0_20px_rgba(74,222,128,0.5)]">
                DEFENSE <br><span
                    class="text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600">SYSTEMS</span>
            </h1>
            <p
                class="font-mono text-green-400/80 text-xl tracking-[0.5em] mb-12 border-y border-green-900/50 py-4 bg-black/40">
                TOP SECRET // CLEARANCE LEVEL 5
            </p>
            <div class="flex justify-center gap-6">
                <!-- 链接到之前的 LMS 播放页 -->
                <a href="course-military.html"
                    class="group relative px-8 py-4 bg-green-600 text-black font-bold font-display tracking-widest text-lg overflow-hidden hover:scale-105 transition-all">
                    <div
                        class="absolute inset-0 w-full h-full bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-500 skew-x-12">
                    </div>
                    ENTER MISSION CONTROL
                </a>
            </div>
        </div>
    </section>

    <!-- Database Section -->
    <section id="database" class="max-w-7xl mx-auto px-6 py-20 relative z-20">
        <div class="flex items-center gap-4 mb-12">
            <div class="w-2 h-10 bg-green-500"></div>
            <h2 class="text-3xl font-display font-bold text-white uppercase">Weapon Systems</h2>
        </div>

        <!-- Filters -->
        <div class="flex gap-4 mb-10 font-mono text-sm">
            <button onclick="filterType('all')"
                class="px-4 py-2 bg-green-900/30 border border-green-500/50 text-green-400 hover:bg-green-500 hover:text-black transition-all active-filter">ALL
                SYSTEMS</button>
            <button onclick="filterType('air')"
                class="px-4 py-2 bg-black border border-green-800 text-slate-400 hover:text-green-400 transition-all">AIR
                FORCE</button>
            <button onclick="filterType('land')"
                class="px-4 py-2 bg-black border border-green-800 text-slate-400 hover:text-green-400 transition-all">GROUND
                FORCES</button>
            <button onclick="filterType('sea')"
                class="px-4 py-2 bg-black border border-green-800 text-slate-400 hover:text-green-400 transition-all">NAVAL</button>
        </div>

        <!-- Grid -->
        <div id="weapon-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- JS Injected -->
        </div>
    </section>

    <!-- Intel Section -->
    <section id="intel" class="bg-black/50 border-t border-green-900 py-20">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex items-center gap-4 mb-12">
                <div class="w-2 h-10 bg-alert-500"></div>
                <h2 class="text-3xl font-display font-bold text-white uppercase">Technical Specs</h2>
            </div>

            <div class="overflow-x-auto pb-8">
                <div class="flex gap-6 w-max" id="intel-row">
                    <!-- JS Injected -->
                </div>
            </div>
        </div>
    </section>

    <footer class="border-t border-green-900 bg-black py-12 text-center">
        <p class="font-mono text-green-800 text-xs">CLASSIFIED MATERIAL // FOR AUTHORIZED EYES ONLY</p>
    </footer>

    <!-- DATA & LOGIC -->
    <script>
        // Data Store
        const weapons = [
            {
                id: 'j20',
                name: 'J-20 Mighty Dragon',
                code: '歼-20 威龙',
                type: 'air',
                desc: 'Fifth-generation stealth fighter aircraft designed for air superiority and precision strikes.',
                stats: { stealth: 95, speed: 90, firepower: 85 },
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/J-20_at_Airshow_China_2016.jpg/640px-J-20_at_Airshow_China_2016.jpg'
            },
            {
                id: '99a',
                name: 'Type 99A MBT',
                code: '99A 主战坦克',
                type: 'land',
                desc: 'Third-generation main battle tank featuring advanced composite armor and active protection systems.',
                stats: { armor: 95, firepower: 90, mobility: 70 },
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Type_99A_Main_Battle_Tank_at_Military_Parade.jpg/640px-Type_99A_Main_Battle_Tank_at_Military_Parade.jpg'
            },
            {
                id: '055',
                name: 'Type 055 Destroyer',
                code: '055型 驱逐舰',
                type: 'sea',
                desc: 'Stealth guided missile destroyer, providing air defense, anti-missile, and anti-submarine warfare capabilities.',
                stats: { radar: 98, firepower: 95, stealth: 60 },
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/DDG-101_Nanchang%2C_PLAN_Type_055.jpg/640px-DDG-101_Nanchang%2C_PLAN_Type_055.jpg'
            },
            {
                id: 'df41',
                name: 'DF-41 ICBM',
                code: '东风-41',
                type: 'land',
                desc: 'Solid-fueled road-mobile intercontinental ballistic missile.',
                stats: { range: 100, impact: 100, stealth: 50 },
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8c/DF-41_Intercontinental_Ballistic_Missile_at_National_Day_Parade_2019.jpg/640px-DF-41_Intercontinental_Ballistic_Missile_at_National_Day_Parade_2019.jpg'
            },
            {
                id: 'y20',
                name: 'Y-20 Kunpeng',
                code: '运-20 鲲鹏',
                type: 'air',
                desc: 'Large military transport aircraft for strategic airlift.',
                stats: { payload: 90, range: 85, speed: 60 },
                image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Y-20_at_Airshow_China_2014.jpg/640px-Y-20_at_Airshow_China_2014.jpg'
            }
        ];

        // Render Functions
        function renderWeapons(filter = 'all') {
            const grid = document.getElementById('weapon-grid');
            grid.innerHTML = weapons
                .filter(w => filter === 'all' || w.type === filter)
                .map(w => `
                <div class="group relative bg-green-900/10 border border-green-500/30 overflow-hidden hover:border-green-400 transition-all">
                    <div class="aspect-video bg-black relative">
                         <img src="${w.image}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity grayscale group-hover:grayscale-0">
                         <div class="absolute top-2 right-2 px-2 py-1 bg-black/80 text-[10px] font-mono text-green-500 border border-green-500/50 uppercase">
                            ${w.type}
                         </div>
                    </div>
                    <div class="p-6">
                        <div class="font-mono text-xs text-green-600 mb-1">${w.code}</div>
                        <h3 class="font-display text-xl text-white mb-3 group-hover:text-green-400">${w.name}</h3>
                        <p class="text-sm text-slate-400 mb-4 line-clamp-2">${w.desc}</p>
                        <div class="flex gap-2">
                             <div class="h-1 bg-green-900 flex-1 rounded-full overflow-hidden">
                                <div class="h-full bg-green-500" style="width: ${Object.values(w.stats)[0]}%"></div>
                             </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderIntel() {
            const row = document.getElementById('intel-row');
            row.innerHTML = weapons.map(w => `
                <div class="min-w-[300px] bg-black border border-white/10 p-6 relative hover:border-green-500 transition-colors">
                     <div class="absolute top-0 right-0 w-8 h-8 border-t border-r border-green-500/50"></div>
                     <div class="text-xs font-mono text-slate-500 mb-2">SPEC NUMBER // ${w.id.toUpperCase()}</div>
                     <h3 class="font-bold text-white mb-6 text-xl">${w.name}</h3>
                     
                     <div class="space-y-4 font-mono text-xs">
                        ${Object.entries(w.stats).map(([k, v]) => `
                            <div class="flex items-center gap-3">
                                <span class="w-16 uppercase text-green-800">${k}</span>
                                <div class="flex-1 h-2 bg-slate-900">
                                    <div class="h-full bg-green-600 w-0 animate-stat-grow" style="width: ${v}%"></div>
                                </div>
                                <span class="text-white">${v}</span>
                            </div>
                        `).join('')}
                     </div>
                </div>
            `).join('');
        }

        function filterType(type) {
            renderWeapons(type);
            // Update buttons
            document.querySelectorAll('button').forEach(btn => {
                // simple visual toggle logic needed here if expanding
            });
        }

        // Init
        renderWeapons();
        renderIntel();

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.24_3"></script>
</body>

</html>
