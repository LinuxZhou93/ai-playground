<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨子实验室 | Mozi Lab - 青少年科学教育基地</title>
    <!-- 复用 AI Playground 核心样式 -->
    <link rel="stylesheet" href="assets/css/titan-core.css">
    <style>
        :root {
            --mozi-primary: #00f2ff;
            --mozi-secondary: #0066ff;
            --mozi-bg: #050a14;
            --sidebar-width: 280px;
            --glass-bg: rgba(10, 20, 40, 0.7);
            --glass-border: rgba(0, 242, 255, 0.2);
        }

        body {
            background-color: var(--mozi-bg);
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 动态石墨烯背景 */
        #graphene-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
            background: radial-gradient(circle at center, #0a192f 0%, #050a14 100%);
        }

        .portal-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 侧边导航栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 2.5rem 1.5rem;
            z-index: 100;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            margin-bottom: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin-bottom: 1.5rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-hexagon {
            position: absolute;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--mozi-primary);
            stroke-width: 2;
            filter: drop-shadow(0 0 15px var(--mozi-primary));
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 0%, var(--mozi-primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .nav-menu {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--mozi-primary);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .nav-item:hover {
            background: rgba(0, 242, 255, 0.08);
            color: white;
            transform: translateX(5px);
            border-color: rgba(0, 242, 255, 0.2);
        }

        .nav-item.active {
            background: rgba(0, 242, 255, 0.12);
            color: var(--mozi-primary);
            border-color: rgba(0, 242, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.1);
        }

        .nav-item.active::before {
            transform: scaleY(1);
        }

        .nav-icon {
            font-size: 1.4rem;
        }

        .nav-text {
            font-weight: 500;
            font-size: 1.05rem;
        }

        /* 内容载体 */
        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        #content-frame {
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.5s ease;
        }

        /* 返回按钮 */
        .sidebar-footer {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-hub {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-hub:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* 响应式适配 */
        @media (max-width: 1024px) {
            .sidebar {
                width: 80px;
                padding: 2rem 0.5rem;
            }
            .brand-name, .brand-subtitle, .nav-text, .btn-hub span {
                display: none;
            }
            .nav-item {
                justify-content: center;
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="graphene-bg"></canvas>

    <div class="portal-container">
        <!-- 侧边导航 -->
        <aside class="sidebar">
            <div class="brand-header">
                <div class="logo-container">
                    <svg class="logo-hexagon" viewBox="0 0 100 100">
                        <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" />
                    </svg>
                    <svg viewBox="0 0 100 100" width="45" height="45">
                        <circle cx="50" cy="50" r="15" fill="#00f2ff" />
                        <path d="M50 20 L50 80 M20 50 L80 50" stroke="#050a14" stroke-width="4" />
                    </svg>
                </div>
                <div class="brand-name">墨子实验室</div>
                <div class="brand-subtitle">Mozi Lab Portal</div>
            </div>

            <nav class="nav-menu">
                <a href="mozi_sub_home.html" target="moziContent" class="nav-item active" onclick="setActive(this)">
                    <span class="nav-icon">🛡️</span>
                    <span class="nav-text">品牌使命</span>
                </a>
                <a href="mozi_sub_curriculum.html" target="moziContent" class="nav-item" onclick="setActive(this)">
                    <span class="nav-icon">🧬</span>
                    <span class="nav-text">1+4+N 体系</span>
                </a>
                <a href="mozi_sub_competition.html" target="moziContent" class="nav-item" onclick="setActive(this)">
                    <span class="nav-icon">🚀</span>
                    <span class="nav-text">竞赛晋升地图</span>
                </a>
                <a href="mozi_sub_research.html" target="moziContent" class="nav-item" onclick="setActive(this)">
                    <span class="nav-icon">🔬</span>
                    <span class="nav-text">科学家工作台</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="btn-hub">
                    <span>🔙</span>
                    <span>返回主站</span>
                </a>
            </div>
        </aside>

        <!-- 内容区域 -->
        <main class="workspace">
            <iframe name="moziContent" id="content-frame" src="mozi_sub_home.html"></iframe>
        </main>
    </div>

    <script>
        // 导航激活状态切换
        function setActive(el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            
            // 切换动效
            const frame = document.getElementById('content-frame');
            frame.style.opacity = '0';
            setTimeout(() => {
                frame.style.opacity = '1';
            }, 300);
        }

        // 石墨烯晶格 Canvas 动效
        const canvas = document.getElementById('graphene-bg');
        const ctx = canvas.getContext('2d');
        let width, height, nodes = [];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            nodes = [];
            
            const cols = Math.ceil(width / 60) + 1;
            const rows = Math.ceil(height / 52) + 1;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let x = c * 60;
                    let y = r * 52;
                    if (r % 2 === 1) x += 30;
                    nodes.push({ x, y, ox: x, oy: y });
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.15)';
            ctx.lineWidth = 1;
            
            const time = Date.now() * 0.001;

            nodes.forEach(n => {
                n.x = n.ox + Math.sin(time + n.oy * 0.02) * 10;
                n.y = n.oy + Math.cos(time + n.ox * 0.02) * 10;
            });

            // 绘制六边形结构连接
            ctx.beginPath();
            nodes.forEach((n1, i) => {
                nodes.slice(i + 1, i + 10).forEach(n2 => {
                    const d = Math.hypot(n1.x - n2.x, n1.y - n2.y);
                    if (d < 70) {
                        ctx.moveTo(n1.x, n1.y);
                        ctx.lineTo(n2.x, n2.y);
                    }
                });
            });
            ctx.stroke();

            // 绘制节点亮点
            ctx.fillStyle = 'rgba(0, 242, 255, 0.3)';
            nodes.forEach(n => {
                if (Math.random() > 0.99) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>
