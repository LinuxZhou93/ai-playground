<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN SOUND LAB | 泰坦音频实验室 - 科技特长生</title>
    <script src="libs/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&family=JetBrains+Mono:wght@300;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --sound-bg: #020617;
            --sound-cyan: #22d3ee;
            --sound-purple: #818cf8;
            --sound-pink: #f472b6;
        }

        body {
            background-color: var(--sound-bg);
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Waveform Animation Background */
        .wave-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background:
                radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.05) 0%, transparent 40%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--sound-cyan);
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.2);
        }

        .cyan-glow {
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.5);
        }

        [v-cloak] {
            display: none !important;
        }

        /* Animation class */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
        }
    </style>
</head>

<body class="selection:bg-cyan-500/30">
    <div id="app" v-cloak>
        <div class="wave-bg"></div>

        <!-- Header -->
        <nav class="fixed top-0 w-full z-50 py-6 px-10 flex justify-between items-center glass-card">
            <div class="flex items-center gap-4">
                <div
                    class="w-10 h-10 bg-cyan-500 rounded-full flex items-center justify-center text-black font-black text-xl">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                    </svg>
                </div>
                <div>
                    <h1 class="font-black text-xs tracking-[0.3em] uppercase opacity-50">TITAN SOUND LAB</h1>
                    <p class="font-bold text-sm cyan-glow">泰坦音频实验室</p>
                </div>
            </div>
            <button @click="goHome"
                class="mono text-[10px] font-black border border-white/10 px-6 py-2 rounded-full hover:bg-white hover:text-black transition-all">EXIT_SESSION</button>
        </nav>

        <main class="pt-40 px-10 max-w-7xl mx-auto space-y-32 pb-40">
            <!-- Hero -->
            <section class="flex flex-col lg:flex-row items-center gap-20">
                <div class="flex-1 space-y-8 reveal">
                    <div
                        class="inline-flex items-center gap-2 px-4 py-1 bg-cyan-500/10 border border-cyan-500/20 rounded-full text-[10px] font-black tracking-widest text-cyan-400">
                        <span class="animate-pulse">●</span> SONIC_ENGINE_ACTIVE
                    </div>
                    <h2 class="text-6xl md:text-8xl font-black leading-none italic tracking-tighter">
                        SOUND IS <br><span class="text-cyan-400">SCIENCE.</span>
                    </h2>
                    <p class="text-xl text-white/40 leading-relaxed max-w-xl font-medium">
                        欢迎来到音频科技的最前沿。在这里，音符是由代码编写的，旋律是神经网络的涌现，节奏是物理波动的结果。
                    </p>
                    <div class="flex gap-4">
                        <button
                            class="bg-cyan-500 text-black px-12 py-5 rounded-2xl font-black text-xs tracking-widest hover:scale-105 transition-all">开启共鸣
                            / HARMONIZE</button>
                    </div>
                </div>
                <div class="flex-1 reveal">
                    <div class="relative group">
                        <img src="/Users/zhoulin/.gemini/antigravity/brain/36507a07-2eed-4e8b-a428-935c7555323e/titan_sound_lab_hero_1766017553290.png"
                            class="w-full rounded-[40px] shadow-2xl border border-white/10 transition-transform duration-700 group-hover:scale-[1.02]"
                            alt="Sound Lab Hero">
                        <div class="absolute -bottom-10 -left-10 glass-card p-6 rounded-3xl border-cyan-500/30">
                            <div class="mono text-[10px] opacity-40 mb-1 tracking-widest">FREQUENCY_SPECTRUM</div>
                            <div class="flex gap-1 h-8 items-end">
                                <div v-for="n in 8" :key="n" class="w-1 bg-cyan-400 animate-pulse"
                                    :style="{height: Math.random()*100+'%', animationDelay: n*0.1+'s'}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Tech Tracks -->
            <section class="space-y-16">
                <div class="flex flex-col items-center text-center space-y-4 reveal">
                    <h3 class="text-4xl font-black tracking-tight">音频科技研究赛道 / RESEARCH_TRACKS</h3>
                    <div class="w-20 h-1 bg-cyan-400 rounded-full"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Track Cards -->
                    <div v-for="track in tracks" :key="track.id" @click="selectTrack(track.id)"
                        class="glass-card p-10 rounded-[48px] reveal cursor-pointer group">
                        <div class="text-5xl mb-8 group-hover:scale-110 transition-transform">{{ track.icon }}</div>
                        <h4 class="text-2xl font-black mb-4">{{ track.title }}</h4>
                        <p class="text-sm text-white/40 leading-relaxed mb-10 h-20">{{ track.desc }}</p>

                        <div class="space-y-3">
                            <div v-for="res in track.resources" :key="res.name" @click.stop="openLink(res.url)"
                                class="flex items-center justify-between p-4 rounded-2xl bg-white/5 hover:bg-cyan-500 hover:text-black cursor-pointer transition-all border border-transparent hover:border-cyan-500/30">
                                <span class="text-[10px] font-black tracking-widest uppercase">{{ res.name }}</span>
                                <span class="text-lg">→</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="py-20 text-center glass-card">
            <p class="mono text-[10px] font-black tracking-[0.5em] opacity-20 uppercase">Decoding Synchronicity... Titan
                Sound v2.0</p>
        </footer>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    tracks: [
                        {
                            id: 'ai-composition',
                            title: '神经网络作曲',
                            icon: '🧠',
                            desc: '驾驭 Suno, Udio 与 Google Magenta。探索当神经网络开始理解旋律与情感。',
                            resources: [
                                { name: 'Suno AI', url: 'https://suno.com' },
                                { name: 'Udio Music', url: 'https://udio.com' }
                            ]
                        },
                        {
                            id: 'physics',
                            title: '声音物理与波形',
                            icon: '🌊',
                            desc: '深入物理底层。通过可视化工具理解倍音、频率、波形以及合成器的运作原理。',
                            resources: [
                                { name: 'Music Lab', url: 'https://musiclab.chromeexperiments.com/' },
                                { name: 'Blob Opera', url: 'https://artsandculture.google.com/experiment/blob-opera/AAH93Al_B_M8wQ' }
                            ]
                        },
                        {
                            id: 'coding',
                            title: '算法音乐与编程',
                            icon: '💻',
                            desc: '用代码“写”出交响乐。学习 Sonic Pi 与 EarSketch，将逻辑转化为律动。',
                            resources: [
                                { name: 'Sonic Pi', url: 'https://sonic-pi.net/' },
                                { name: 'EarSketch', url: 'https://earsketch.gatech.edu/' }
                            ]
                        }
                    ]
                }
            },
            methods: {
                selectTrack(id) {
                    gsap.to("body", { opacity: 0, duration: 0.5, onComplete: () => {
                        window.location.href = `course-music.html?track=${id}`;
                    }});
                },
                openLink(url) { window.open(url, '_blank'); },
                goHome() { window.location.href = 'index.html'; }
            },
            mounted() {
                gsap.to(".reveal", {
                    opacity: 1,
                    y: 0,
                    duration: 1.2,
                    stagger: 0.15,
                    ease: "power4.out"
                });
            }
        }).mount('#app');
    </script>
</body>

</html>
