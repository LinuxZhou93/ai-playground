<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理模拟中心 | Physics Simulation Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;700&family=Syncopate:wght@400;700&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #06b6d4;
            /* cyan-500 */
            --primary-glow: rgba(6, 182, 212, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-chakra {
            font-family: 'Chakra Petch', sans-serif;
        }

        .font-sync {
            font-family: 'Syncopate', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .grid-line {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
        }

        .gradient-text {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes scanline {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(6, 182, 212, 0.2);
            position: absolute;
            top: 0;
            left: 0;
            animation: scanline 4s linear infinite;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Zap = (props) => <IconBase {...props}><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" /></IconBase>;
        const Magnet = (props) => <IconBase {...props}><path d="m6 15-4-4 6.75-6.75a5.25 5.25 0 0 1 7.5 0l6.75 6.75-4 4" /><path d="M5 8 8 5" /><path d="m16 5 3 3" /><path d="M10 16a2 2 0 1 0 4 0v-8a2 2 0 1 0-4 0v8Z" /></IconBase>;
        const Waves = (props) => <IconBase {...props}><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" /><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" /><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1" /></IconBase>;
        const Box = (props) => <IconBase {...props}><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;

        const SimCard = ({ title, icon: Icon, tag, desc }) => (
            <div className="glass-card rounded-2xl p-6 group cursor-pointer relative overflow-hidden">
                <div className="scanline opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div className="flex items-center gap-4 mb-4">
                    <div className="w-12 h-12 rounded-xl bg-cyan-500/10 flex items-center justify-center text-cyan-400">
                        <Icon className="w-6 h-6" />
                    </div>
                    <div>
                        <span className="text-[10px] font-bold text-cyan-500/60 uppercase tracking-widest">{tag}</span>
                        <h3 className="text-lg font-bold font-chakra">{title}</h3>
                    </div>
                </div>
                <p className="text-sm text-slate-400 leading-relaxed mb-6">{desc}</p>
                <div className="flex items-center gap-2 text-cyan-400 font-bold text-xs uppercase group-hover:gap-4 transition-all">
                    Initialize Simulation <Icon className="w-3 h-3" />
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative grid-line pb-20">
                    <div className="absolute inset-0 bg-gradient-to-b from-cyan-950/20 via-transparent to-transparent pointer-events-none"></div>

                    {/* Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-8 py-3 flex items-center gap-10 border border-white/10">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-cyan-400 font-bold text-xs font-sync uppercase tracking-widest">Dynamics</a>
                        <a href="#" className="text-slate-400 hover:text-cyan-400 transition-colors text-xs font-sync uppercase tracking-widest">Quantum</a>
                        <a href="#" className="text-slate-400 hover:text-cyan-400 transition-colors text-xs font-sync uppercase tracking-widest">Electrics</a>
                    </nav>

                    {/* Standards */}
                    <div className="fixed top-6 right-6 z-50 flex gap-4">
                        <a href="junior-physics-curriculum.html?stage=j" className="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs font-chakra transition-all shadow-lg flex items-center gap-2">
                            初中课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                        <a href="senior-physics-curriculum.html?stage=s" className="bg-cyan-600 hover:bg-cyan-50text-white px-5 py-2.5 rounded-xl font-bold text-xs font-chakra transition-all shadow-lg flex items-center gap-2">
                            高中课标 <LayoutGrid className="w-4 h-4" />
                        </a>
                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero */}
                        <div className="text-center mb-24 relative">
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-64 bg-cyan-500/10 blur-[100px] -z-10"></div>
                            <span className="inline-block text-cyan-400 font-sync text-[10px] tracking-[0.4em] mb-6 uppercase">Laws of the Universe</span>
                            <h1 className="text-6xl md:text-8xl font-chakra font-bold mb-8">
                                物理模拟<span className="gradient-text">核心</span>
                            </h1>
                            <p className="text-xl text-slate-400 max-w-2xl mx-auto leading-relaxed font-light">
                                破解自然常数，在虚拟实验室中还原时空的真实律动。从牛顿力学到量子效应的数字化重构。
                            </p>
                        </div>

                        {/* Interactive Widgets */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-20">
                            <div className="lg:col-span-8">
                                <div className="glass-card rounded-3xl p-8 h-full relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 p-10 opacity-5 group-hover:opacity-10 transition-opacity">
                                        <Zap className="w-64 h-64" />
                                    </div>
                                    <h2 className="text-3xl font-chakra font-bold mb-6 flex items-center gap-3">
                                        <div className="w-2 h-8 bg-cyan-500 rounded-full"></div>
                                        实时物理引擎演示
                                    </h2>
                                    <div className="bg-slate-900/80 rounded-2xl h-80 border border-cyan-500/20 flex items-center justify-center relative overflow-hidden">
                                        {/* Placeholder for Canvas Sim */}
                                        <div className="text-cyan-500/20 font-chakra text-8xl font-bold select-none">V = ΔS / ΔT</div>
                                        <div className="absolute bottom-6 left-6 flex gap-4">
                                            <div className="px-4 py-2 rounded-lg bg-cyan-500/10 text-cyan-400 text-xs font-bold border border-cyan-500/20">GRAVITY: 9.8m/s²</div>
                                            <div className="px-4 py-2 rounded-lg bg-cyan-500/10 text-cyan-400 text-xs font-bold border border-cyan-500/20">AIR_RES: OFF</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="lg:col-span-4 flex flex-col gap-8">
                                <div className="glass-card rounded-3xl p-6 flex-1 border-t-2 border-cyan-500/50">
                                    <h4 className="font-sync text-xs text-cyan-500 mb-4 tracking-tighter">Constants 01</h4>
                                    <div className="text-4xl font-chakra font-bold mb-1 tracking-widest">300,000</div>
                                    <div className="text-xs text-slate-500 font-bold uppercase tracking-widest">Light Speed (km/s)</div>
                                </div>
                                <div className="glass-card rounded-3xl p-6 flex-1 border-t-2 border-violet-500/50">
                                    <h4 className="font-sync text-xs text-violet-500 mb-4 tracking-tighter">Constants 02</h4>
                                    <div className="text-4xl font-chakra font-bold mb-1 tracking-widest">6.626 e-34</div>
                                    <div className="text-xs text-slate-500 font-bold uppercase tracking-widest">Planck Constant (J·s)</div>
                                </div>
                            </div>
                        </div>

                        {/* Simulation Categories */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <SimCard
                                tag="Kinematics"
                                title="经典力学"
                                desc="探索质点运动、刚体转动与弹性碰撞的确定性世界。"
                                icon={Box}
                            />
                            <SimCard
                                tag="Electrics"
                                title="电磁场仿真"
                                desc="麦克斯韦方程组的视觉化呈现，解析电与磁的交织。"
                                icon={Zap}
                            />
                            <SimCard
                                tag="Optics"
                                title="波动与光学"
                                desc="干涉、衍射与折射：光作为波与粒子的双重华尔兹。"
                                icon={Waves}
                            />
                            <SimCard
                                tag="Magnetic"
                                title="磁感应强度"
                                desc="研究磁通量与洛伦兹力，构建高效能量转换模型。"
                                icon={Magnet}
                            />
                        </div>
                    </main>

                    <footer className="mt-24 py-16 border-t border-white/5 bg-slate-950/50">
                        <div className="container mx-auto px-6 flex justify-between items-center text-[10px] font-sync text-slate-600 tracking-widest uppercase">
                            <span>Physics Simulation Hub v.2.4</span>
                            <span className="hidden md:block">Decoding the Fabric of Space-time</span>
                            <span>© 2025 Lab Hub</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
