<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思政中心 | Politics & Rule of Law Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700&family=Outfit:wght@400;700&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #ef4444;
            /* red-500 */
            --primary-glow: rgba(239, 68, 68, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-serif-cn {
            font-family: 'Noto Serif SC', serif;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(239, 68, 68, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .emblem-bg {
            background: radial-gradient(circle at 50% 50%, rgba(239, 68, 68, 0.05) 0%, transparent 70%);
        }

        .pillar-gradient {
            background: linear-gradient(135deg, #f87171 0%, #ef4444 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid-pattern {
            background-image: radial-gradient(rgba(239, 68, 68, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Shield = (props) => <IconBase {...props}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10" /></IconBase>;
        const Balance = (props) => <IconBase {...props}><path d="M16 16v3a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2" /><path d="M5 8v10a2 2 0 0 0 2 2h10" /><circle cx="17" cy="7" r="5" /></IconBase>;
        const Landmark = (props) => <IconBase {...props}><line x1="12" x2="12" y1="22" y2="10" /><path d="m12 2-1 2H2v2c0 2 1.5 3 3.5 3S9 8 9 6V4L8 2h4Z" /><path d="m12 2 1 2h9v2c0 2-1.5 3-3.5 3S15 8 15 6V4l1-2h-4Z" /><line x1="18" x2="22" y1="13" y2="13" /><line x1="2" x2="6" y1="13" y2="13" /><line x1="2" x2="22" y1="22" y2="22" /></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="19" cy="11" r="2" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;

        const PillarCard = ({ title, icon: Icon, desc }) => (
            <div className="glass-card rounded-2xl p-8 group cursor-pointer relative overflow-hidden">
                <div className="absolute -top-4 -right-4 w-32 h-32 opacity-5 group-hover:opacity-10 transition-all duration-700">
                    <Icon className="w-full h-full" />
                </div>
                <div className="relative z-10">
                    <div className="w-14 h-14 rounded-2xl bg-red-500/10 flex items-center justify-center text-red-500 mb-6 group-hover:scale-110 transition-transform">
                        <Icon className="w-7 h-7" />
                    </div>
                    <h3 className="text-2xl font-serif-cn font-bold mb-4">{title}</h3>
                    <p className="text-slate-400 leading-relaxed mb-6">{desc}</p>
                    <div className="h-0.5 w-12 bg-red-500/30 group-hover:w-full transition-all duration-500"></div>
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative grid-pattern emblem-bg pb-20">
                    {/* Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-8 py-3 flex items-center gap-10 border border-white/10">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-red-500 font-bold text-sm tracking-widest">核心素养</a>
                        <a href="#" className="text-slate-400 hover:text-red-500 transition-colors text-sm tracking-widest">法治意识</a>
                        <a href="#" className="text-slate-400 hover:text-red-500 transition-colors text-sm tracking-widest">社会参与</a>

                    {/* Standards */}
                    <div className="fixed top-6 right-6 z-50">
                        <a href="politics-curriculum.html?stage=p" className="flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-full font-bold text-sm transition-all shadow-xl shadow-red-500/20">
                            查看课标大纲 <LayoutGrid className="w-4 h-4" />

                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero */}
                        <div className="max-w-4xl mx-auto text-center mb-24">
                            <span className="inline-block px-4 py-1 rounded bg-red-500/10 border border-red-500/20 text-red-500 text-xs font-bold uppercase tracking-[0.2em] mb-8">
                                Responsibility & Virtue
                            </span>
                            <h1 className="text-6xl md:text-8xl font-serif-cn font-bold mb-8 leading-tight">
                                筑牢<span className="pillar-gradient">精神信仰</span>的底色
                            </h1>
                            <p className="text-xl text-slate-400 leading-relaxed mb-10 max-w-2xl mx-auto font-light">
                                道德与法治不仅是知识，更是行动的指南。在这里，通过社会实践模拟与法律案例深度解析，培养具备家国情怀与全球视野的未来公民。
                            </p>
                            <div className="flex justify-center gap-4">
                                <button className="bg-red-600 hover:bg-red-500 text-white px-10 py-4 rounded-2xl font-bold shadow-xl shadow-red-500/20 transition-all flex items-center gap-3">
                                    开启成长手册 <Shield className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        {/* Pillars Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-20">
                            <PillarCard
                                title="法治精神"
                                icon={Balance}
                                desc="理解法律边界，弘扬宪法精神，在模拟法庭中感受法律的公正与严谨。"
                            />
                            <PillarCard
                                title="人格发展"
                                icon={Users}
                                desc="探索健全人格的构建路径，培养自尊、自律与同理心，构建和谐社会关系。"
                            />
                            <PillarCard
                                title="国家认同"
                                icon={Landmark}
                                desc="深度理解国家权力运行机制，感悟民族精神，增强作为国家公民的归属感。"
                            />
                        </div>

                        {/* Social Logic Info */}
                        <div className="bg-slate-900/40 rounded-[3rem] p-12 md:p-20 text-center relative overflow-hidden border border-white/5">
                            <div className="absolute inset-0 grid-pattern opacity-10"></div>
                            <h2 className="text-4xl font-serif-cn font-bold mb-6">实践是最好的课堂</h2>
                            <p className="text-slate-400 mb-10 max-w-2xl mx-auto text-lg leading-relaxed">
                                我们整合了丰富的社会热点互动专题，让你在复杂的利益博弈与道德困境中，学会判断、学会抉择、学会承担。
                            </p>
                            <div className="flex flex-wrap justify-center gap-6">
                                <div className="glass-card px-6 py-4 rounded-xl text-red-400 font-bold border border-red-500/20">民法典实验室</div>
                                <div className="glass-card px-6 py-4 rounded-xl text-red-400 font-bold border border-red-500/20">社会治理模拟</div>
                                <div className="glass-card px-6 py-4 rounded-xl text-red-400 font-bold border border-red-500/20">道德两难剧场</div>
                            </div>
                        </div>
                    </main>

                    <footer className="mt-24 py-16 border-t border-white/5 text-center text-slate-500 text-sm font-bold tracking-widest uppercase">
                        © 2025 POLITICS & RULE OF LAW HUB | Cultivating Conscious Citizens
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
