                <div className="max-w-[1920px] mx-auto px-6 h-20 flex items-center justify-between">
                    <a href="learn.html" className="flex items-center gap-4 hover:opacity-80 transition-opacity">
                        <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-vex to-blue-600 flex items-center justify-center text-black font-bold text-xl shadow-[0_0_15px_rgba(0,240,255,0.4)]">
                            🦄
                        </div>
                        <div>
                            <h1 className="text-xl font-bold text-white tracking-tight leading-none">
                                成电创客<span className="text-vex">瞪羚</span>俱乐部
                            </h1>
                            <div className="text-[10px] text-gray-500 font-mono tracking-[0.25em] uppercase mt-1">
                                Chengdian Maker Gazelle Club
                            </div>
                        </div>
                    </a>

                    {/* Core Value Badge */}
                    <div className="flex items-center gap-2 md:gap-4">
                        <a href="wiki.html" className="flex items-center gap-2 px-3 py-2 md:px-4 md:py-2 rounded-full bg-indigo-500/20 border border-indigo-500/30 text-indigo-300 hover:bg-indigo-500/40 hover:text-white transition-all group">
                            <span className="text-lg group-hover:animate-spin">🌌</span>
                            <span className="hidden sm:inline text-xs font-bold uppercase tracking-wider">Knowledge Galaxy</span>
                        </a>

                        <div className="hidden md:flex items-center gap-3 bg-core/10 px-5 py-2 rounded-full border border-core/30">
                            <Icon path={icons.manage} className="w-4 h-4 text-core animate-pulse" />
                            <span className="text-xs text-gray-300 font-mono uppercase tracking-widest">
                                Core Philosophy: <span className="text-white font-bold">Self-Management</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        );

        // SVG Connecting Lines
        const ConnectingLine = ({ startId, endId, color }) => {
            const [coords, setCoords] = useState(null);

            useEffect(() => {
                const update = () => {
                    const start = document.getElementById(startId);
                    const end = document.getElementById(endId);
                    const container = document.getElementById('roadmap-container');

                    if (start && end && container) {
                        const startRect = start.getBoundingClientRect();
                        const endRect = end.getBoundingClientRect();
                        const containerRect = container.getBoundingClientRect();

                        setCoords({
                            x1: startRect.right - containerRect.left,
                            y1: startRect.top + startRect.height / 2 - containerRect.top,
                            x2: endRect.left - containerRect.left,
                            y2: endRect.top + endRect.height / 2 - containerRect.top
                        });
                    }
                };

                setTimeout(update, 500); // Allow render time
                window.addEventListener('resize', update);
                return () => window.removeEventListener('resize', update);
            }, []);

            if (!coords) return null;

            return (
                <svg className="absolute top-0 left-0 w-full h-full pointer-events-none z-0 overflow-visible">
                    <path
                        d={`M ${coords.x1} ${coords.y1} C ${(coords.x1 + coords.x2) / 2} ${coords.y1}, ${(coords.x1 + coords.x2) / 2} ${coords.y2}, ${coords.x2} ${coords.y2}`}
                        stroke={color === '#00F0FF' ? '#00F0FF' : '#FFD600'}
                        strokeWidth="1.5"
                        fill="none"
                        strokeDasharray="4 4"
                        className="opacity-40"
                    />
                </svg>
            );
        };

        const ProcessSteps = ({ method }) => {
            if (!method) return null;
            const colors = method.type === 'mit' ? 'text-pink-500 border-pink-500' : 'text-purple-500 border-purple-500';

            return (
                <div className="mt-4">
                    <div className="flex justify-between items-center mb-3">
                        <span className={`text-[10px] font-bold uppercase tracking-widest ${method.type === 'mit' ? 'text-pink-500' : 'text-purple-500'}`}>
                            {method.title}
                        </span>
                    </div>
                    <div className="flex items-center justify-between relative">
                        <div className="absolute top-1/2 w-full h-px bg-white/10 -z-10"></div>
                        {method.steps.map((step, i) => (
                            <div key={i} className="flex flex-col items-center gap-2 bg-[#1a1e26] px-1">
                                <div className={`w-6 h-6 rounded-full border flex items-center justify-center text-[10px] font-bold ${colors} bg-black/50`}>
                                    {i + 1}
                                </div>
                                <span className="text-[9px] text-gray-400 uppercase">{step}</span>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const DetailModal = ({ data, track, age, onClose }) => {
            if (!data) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-black/90 backdrop-blur-md animate-in fade-in duration-200" onClick={onClose}></div>
                    <div className="relative w-full max-w-5xl bg-[#1A1D26] border border-white/10 rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200">

                        {/* Header */}
                        <div className="p-6 border-b border-white/10 bg-gradient-to-r from-white/5 to-transparent flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center shadow-lg border border-white/10 ${track.id === 'alpha' ? 'bg-alpha/10 text-alpha' : 'bg-beta/10 text-beta'}`}>
                                    <Icon path={track.id === 'alpha' ? icons.vex : icons.maker} className="w-6 h-6" />
                                </div>
                                <div>
                                    <div className="flex items-center gap-2 mb-1">
                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${track.id === 'alpha' ? 'border-alpha/30 text-alpha bg-alpha/5' : 'border-beta/30 text-beta bg-beta/5'}`}>{track.title}</span>
                                        <span className="text-[10px] text-gray-500 font-mono">/ {age.label}</span>
                                    </div>
                                    <h2 className="text-2xl font-bold text-white tracking-tight">{data.title}</h2>
                                </div>
                            </div>
                            <button onClick={onClose} className="p-2 rounded-full hover:bg-white/10 text-gray-500 hover:text-white transition-colors">✕</button>
                        </div>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-6">

                                {/* Col 1: Core & Method */}
                                <div className="md:col-span-4 flex flex-col gap-6">
                                    <div className="bento-card p-5 rounded-xl border-l-4 border-core">
                                        <div className="flex items-center gap-2 mb-2 text-core">
                                            <Icon path={icons.manage} className="w-4 h-4" />
                                            <h3 className="text-xs font-bold uppercase tracking-widest">Self-Management</h3>
                                        </div>
                                        <p className="text-white font-medium">{data.self_mgmt}</p>
                                    </div>
                                    <div className="bento-card p-5 rounded-xl">
                                        <ProcessSteps method={data.methodology} />
                                    </div>
                                    <div className="bento-card p-5 rounded-xl border-l-4 border-blue-500">
                                        <h3 className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Academic Basis</h3>
                                        <h4 className="text-white font-bold text-sm mb-1">{data.academic.theory}</h4>
                                        <p className="text-xs text-gray-400 leading-relaxed mb-2">{data.academic.desc}</p>
                                    </div>
                                </div>

                                {/* Col 2: Tri-Dimension & Project */}
                                <div className="md:col-span-8 flex flex-col gap-6">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bento-card p-4 rounded-xl hover:bg-blue-500/5 transition-colors">
                                            <div className="text-blue-400 mb-2"><Icon path={icons.brain} className="w-5 h-5" /></div>
                                            <h4 className="text-xs font-bold text-blue-400 uppercase mb-1">Cognitive</h4>
                                            <p className="text-xs text-gray-300">{data.axis.cognitive}</p>
                                        </div>
                                        <div className="bento-card p-4 rounded-xl hover:bg-emerald-500/5 transition-colors">
                                            <div className="text-emerald-400 mb-2"><Icon path={icons.subject} className="w-5 h-5" /></div>
                                            <h4 className="text-xs font-bold text-emerald-400 uppercase mb-1">Subject</h4>
                                            <p className="text-xs text-gray-300">{data.axis.subject}</p>
                                        </div>
                                        <div className="bento-card p-4 rounded-xl hover:bg-purple-500/5 transition-colors">
                                            <div className="text-purple-400 mb-2"><Icon path={icons.skill} className="w-5 h-5" /></div>
                                            <h4 className="text-xs font-bold text-purple-400 uppercase mb-1">Skills</h4>
                                            <p className="text-xs text-gray-300">{data.axis.skills}</p>
                                        </div>
                                    </div>

                                    <div className="bento-card p-6 rounded-xl border-t-4 border-white/20">
                                        <div className="flex justify-between items-start mb-4">
                                            <div>
                                                <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Signature Project</div>
                                                <h3 className="text-xl font-bold text-white">{data.project}</h3>
                                            </div>
                                            <div className="p-3 bg-white/5 rounded-full"><Icon path={icons.trophy} className="w-6 h-6 text-white" /></div>
                                        </div>
                                        <div className="h-px w-full bg-white/10 my-3"></div>
                                        <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Outcome</div>
                                        <p className="text-sm text-gray-300">{data.outcome}</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">

                                            <ul className="space-y-2">{data.mastery.map((m, i) => <li key={i} className="text-xs text-gray-400 flex gap-2"><span>✓</span>{m}</li>)}</ul>
                                        </div>
                                        <div className="bento-card p-4 rounded-xl bg-pink-500/5">
                                            <div className="flex items-center gap-2 mb-2 text-pink-400"><Icon path={icons.heart} className="w-3 h-3" /><h3 className="text-xs font-bold uppercase">Parent Guide</h3></div>
                                            <p className="text-xs text-gray-300 italic">"{data.parentTips}"</p>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedNode, setSelectedNode] = useState(null);

            return (
                <div className="min-h-screen font-sans text-gray-200 pb-20">
                    <div className="bg-grid-pattern"></div>
                    <NavHeader />

                    <main className="max-w-[1600px] mx-auto pt-28 px-6 lg:px-12">

                        {/* Timeline Header - Hidden on Mobile */}
                        <div className="hidden md:grid grid-cols-[200px_1fr_120px] gap-8 mb-8">
                            <div className="flex flex-col justify-end pb-4 border-b border-white/10">

                            </div>
                            <div className="flex flex-col justify-end pb-4 border-b border-white/10">

                        {/* Tracks Container */}
                        <div id="roadmap-container" className="flex flex-col gap-12 relative">

                                        <div className="hidden md:block absolute inset-0 pointer-events-none">
                                            <ConnectingLine startId={`node-${track.id}-5-7`} endId={`node-${track.id}-15+`} color={track.hex} />
                                        </div>

                                        {ageGroups.map((age, i) => {
                                            const nodeData = roadmapData[track.id][age.id];
                                            const id = `node-${track.id}-${age.id}`;
                                            return (
                                                <div
                                                    key={age.id}
                                                    id={id}
                                                    onClick={() => setSelectedNode({ data: nodeData, track, age })}
                                                    className="node-card min-w-[200px] md:min-w-0 min-h-[160px] md:h-[200px] rounded-xl p-5 flex flex-col justify-between cursor-pointer snap-center"
                                                    style={{ '--theme-color': track.hex, '--theme-rgb': track.rgb }}
                                                >
                                                    <div>
                                                        <div className="flex justify-between items-start mb-3">
                                                            <div className="flex items-center gap-2">
                                                                <div className={`p-1.5 rounded-lg border border-white/5 ${track.id === 'alpha' ? 'bg-vex/10 text-vex' : 'bg-maker/10 text-maker'}`}>
                                                                    <Icon path={icons[track.icon]} className="w-4 h-4" />
                                                                </div>
                                                                {/* Mobile Age Label */}
                                                                <span className={`md:hidden text-xs font-bold ${age.color}`}>{age.label}</span>
                                                            </div>
                                                            <Icon path={icons.arrowRight} className="w-4 h-4 text-gray-600 -rotate-45 group-hover:text-white transition-colors" />
                                                        </div>
                                                        <h4 className="text-sm font-bold text-white mb-2 leading-snug group-hover:text-[var(--theme-color)] transition-colors">

                                                        <div className="flex flex-wrap gap-1 mb-2">

                                                                <span key={idx} className="text-[9px] px-1.5 py-0.5 rounded border border-white/5 bg-black/30 text-gray-400">{t}</span>
                                                            ))}
                                                        </div>
                                                    </div>

                                                    {/* Self Mgmt Pill */}
                                                    <div className="mt-auto pt-3 border-t border-white/5 flex items-center gap-2 opacity-70 group-hover:opacity-100 transition-opacity">
                                                        <Icon path={icons.manage} className="w-3 h-3 text-core" />
                                                        <span className="text-[9px] text-gray-500 font-mono truncate">{nodeData.self_mgmt}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Exit Portal */}
                                    <div className="flex flex-row md:flex-col items-center justify-start md:justify-center pl-0 md:pl-4 pt-4 md:pt-0 border-t md:border-t-0 md:border-l border-white/5 border-dashed gap-4 md:gap-0">
                                        <div className="md:hidden text-xs font-mono text-gray-500 uppercase tracking-widest">Exit Strategy</div>
                                        <div className="flex flex-row md:flex-col items-center gap-3 group cursor-default">
                                            <div className="hidden md:block text-[9px] text-gray-600 font-mono uppercase tracking-widest" style={{ writingMode: 'vertical-rl' }}>Exit Strategy</div>
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center border border-white/10 shadow-lg transition-transform group-hover:scale-110 ${track.id === 'alpha' ? 'bg-vex/10 text-vex shadow-vex/20' : 'bg-maker/10 text-maker shadow-maker/20'}`}>
                                                <Icon path={track.exit.icon === 'trophy' ? icons.trophy : icons.camp} className="w-6 h-6" />
                                            </div>
                                            <div className="text-[10px] font-bold text-gray-300 text-left md:text-center leading-tight">{track.exit.title}</div>
                                        </div>
                                    </div>

                                </div>
                            ))}
                        </div>

                    </main>

                    {selectedNode && (
                        <DetailModal
                            data={selectedNode.data}
                            track={selectedNode.track}
                            age={selectedNode.age}
                            onClose={() => setSelectedNode(null)}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
