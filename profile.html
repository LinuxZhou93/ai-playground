<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学员个人中心 | Student Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/subscription.css?v=final">
    <style>
        /* --- VISUAL UPGRADE 2.0 --- */
        :root {
            --primary: #00f0ff;
            --secondary: #7000ff;
            --glass-bg: rgba(10, 15, 30, 0.65);
            --glass-border: rgba(0, 240, 255, 0.3);
            --neon-glow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        body {
            background-color: #050510;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000 100%);
        }

        /* Dynamic Background Canvas */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* Behind everything */
        }

        /* --- GLASSMORPHISM CARDS --- */
        .dash-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }

        .dash-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 240, 255, 0.15);
            border-color: rgba(0, 240, 255, 0.6);
        }

        /* Subtle Inner Glow */
        .dash-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(255, 255, 255, 0.05), transparent 60%);
            pointer-events: none;
        }

        /* Typography */
        .dash-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Dashboard Specific Styles */
        .dashboard-container {
            max-width: 1200px;
            margin: 80px auto 40px;
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            width: 95%;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }



        /* Profile Sidebar */
        .profile-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .user-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #fbbf24;
            /* VIP Gold */
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            margin-bottom: 15px;
            background: url('assets/images/avatar_placeholder.png') center/cover;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
        }

        .vip-tag {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #5a3804;
            font-size: 12px;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.6);
            border: 3px solid #050a14;
            z-index: 10;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .user-name {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .user-role {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 5px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .profile-stats {
            margin-top: 30px;
            width: 100%;
        }

        .p-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: #94a3b8;
        }

        .p-stat-val {
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
        }

        .logout-btn {
            margin-top: 40px;
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* Course Progress */
        .course-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .course-item:hover {
            border-color: rgba(0, 243, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .c-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .c-info {
            flex: 1;
        }

        .c-title {
            font-size: 14px;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 5px;
        }

        .progress-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--mc-cyan);
            width: 0%;
            transition: width 1s ease-out;
        }

        .c-meta {
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }

        /* Badges */
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .badge-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.5;
            filter: grayscale(1);
            transition: 0.3s;
        }

        .badge-item.unlocked {
            opacity: 1;
            filter: grayscale(0);
        }

        .badge-icon {
            font-size: 32px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
        }

        .badge-name {
            font-size: 11px;
            color: #cbd5e1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Back Button */
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-back:hover {
            color: var(--mc-cyan);
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas" style="position: fixed; top:0; left:0; z-index:-1;"></canvas>

    <a href="index.html" class="nav-back">
        <span>←</span> 返回首页
    </a>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="dash-card profile-sidebar">
            <div class="user-avatar" id="uAvatar">👤</div>
            <div class="user-name" id="uName">未登录</div>

            <div class="profile-stats">
                <div class="p-stat-row">

                </div>
                <div class="p-stat-row">
                    <span>学习时长</span>
                    <span class="p-stat-val">12h 45m</span>

                </div>
            </div>

            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-grid">

                <!-- Recent Courses -->
                <div class="dash-card" style="grid-column: span 2;">
                    <h3>📚 正在学习</h3>
                    <div id="courseList">

                    </div>
                </div>

                <!-- Achievements -->
                <div class="dash-card">
                    <h3>🏆 成就勋章</h3>
                    <div class="badge-grid">
                        <div class="badge-item unlocked">
                            <div class="badge-icon">🥚</div>
                            <span class="badge-name">初生牛犊</span>
                        </div>
                        <div class="badge-item unlocked">
                            <div class="badge-icon">🚀</div>
                            <span class="badge-name">启航者</span>
                        </div>
                        <div class="badge-item unlocked">
                            <div class="badge-icon">💻</div>
                            <span class="badge-name">代码小白</span>
                        </div>
                        <div class="badge-item">
                            <div class="badge-icon">🪐</div>
                            <span class="badge-name">星际探索</span>
                        </div>
                        <div class="badge-item">
                            <div class="badge-icon">🤖</div>
                            <span class="badge-name">机甲大师</span>
                        </div>
                        <div class="badge-item">
                            <div class="badge-icon">🧠</div>
                            <span class="badge-name">最强大脑</span>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div class="dash-card">
                    <h3>⚙️ 账号服务</h3>

                    <!-- Voucher Redemption -->
                    <div class="paywall-input-group"
                        style="border: 1px dashed rgba(0,243,255,0.3); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.3);">
                        <label class="paywall-label" style="color: #fbbf24; font-weight: bold;">💎 会员卡密兑换</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="voucher-code" class="paywall-input" placeholder="输入卡密 VIP-xxxx..."
                                style="text-transform: uppercase;">
                            <button class="paywall-btn" onclick="redeem()"
                                style="width: auto; padding: 0 20px; font-size: 14px; margin: 0;">兑换</button>
                        </div>
                        <div id="redeemMsg" style="font-size: 12px; margin-top: 10px; min-height: 15px;"></div>

                        <div
                            style="font-size: 11px; color: #94a3b8; margin-top: 15px; line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                            <div style="color: #cbd5e1; margin-bottom: 5px;">ℹ️ <strong>兑换说明</strong></div>
                            卡密兑换请对接您的负责老师，先注册后兑换会员。<br>
                            会员有 7天 / 半年 / 全年 三个等级。
                        </div>
                    </div>

                    <div style="height: 20px;"></div>


                </div>

            </div>
        </div>
        <div class="dashboard-container">
            <!-- Content... -->
        </div>

        <!-- Supabase Core -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="assets/js/supabase-config.js?v=final"></script>

        <script src="assets/js/subscription.js?v=final"></script>
        <script>
            // --- Sync with SubscriptionManager ---

            // 1. Listen for Updates & Force Check
            // 1. Listen for Updates & Force Check
            function checkState() {
                const manager = window.SubscriptionManager;

                // --- FALLBACK: Direct LocalStorage Check (If Manager is slow) ---
                if (!manager || !manager.user) {
                    const localEmail = localStorage.getItem('current_user_email');
                    const sbToken = localStorage.getItem('sb-znmbkxmnwuurzhevfxtq-auth-token');

                    if (localEmail || sbToken) {
                        // We have local evidence of login!
                        const email = localEmail || (sbToken ? JSON.parse(sbToken).user.email : 'User');
                        const simpleName = email.split('@')[0];

                        document.getElementById('uName').innerText = simpleName;
                        document.getElementById('uID').innerText = 'ONLINE';
                        document.getElementById('uRole').innerText = '普通学员'; // Default to Regular instead of 'Validating'
                        document.getElementById('uRole').style.color = '#94a1b2';
                        document.querySelector('.logout-btn').innerText = '退出登录';

                        // Unlock UI partially
                        const grid = document.querySelector('.content-grid');
                        if (grid) grid.style.opacity = '0.8';
                    }
                }
                // -----------------------------------------------------------

                if (!manager) return;

                const user = manager.user;
                const profile = manager.profile;
                const isVIP = manager.isSubscribed();

                console.log('Profile CheckState:', { user, profile, isVIP }); // Debug Log

                if (user) {
                    // Update Sidebar
                    const avatarImg = isVIP ? 'assets/images/bot_avatar_vip.png' : 'assets/images/bot_avatar_guest.png';
                    const vipBadgeHTML = isVIP ? '<div class="vip-tag">VIP</div>' : '';
                    document.getElementById('uAvatar').innerHTML = `<img src="${avatarImg}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">${vipBadgeHTML}`;

                    // Display Name Logic: Profile Name -> Email Prefix -> Phone
                    let displayName = 'User';
                    if (profile?.username) displayName = profile.username;
                    else if (user.email) displayName = user.email.split('@')[0];

                    document.getElementById('uName').innerText = displayName;
                    document.getElementById('uRole').innerText = isVIP ? '尊享会员 VIP' : '普通学员';
                    document.getElementById('uRole').style.color = isVIP ? '#fbbf24' : '#94a1b2';
                    document.getElementById('uID').innerText = '#' + user.id.substring(0, 6).toUpperCase();

                    const expiry = profile?.expiry_date ? new Date(profile.expiry_date).toLocaleDateString() : '未开通';
                    document.getElementById('uExpiry').innerText = expiry;
                    document.getElementById('uExpiry').style.color = isVIP ? '#fbbf24' : '#64748b';

                    // Update Logout Button Text
                    document.querySelector('.logout-btn').innerText = '退出登录';

                    // Unlock UI
                    const grid = document.querySelector('.content-grid');
                    if (grid) {
                        grid.style.opacity = '1';
                        grid.style.pointerEvents = 'auto';
                    }
                } else {
                    // Only show "Not Logged In" if we fail the fallback check too
                    if (!localStorage.getItem('current_user_email')) {
                        document.getElementById('uAvatar').innerHTML = `<img src="assets/images/bot_avatar_guest.png" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                        document.getElementById('uName').innerText = '游客 (未登录)';
                        document.getElementById('uRole').innerText = '点击兑换登录';

                        const btn = document.querySelector('.logout-btn');
                        btn.innerText = '去登录 / 注册';
                        btn.onclick = function () {
                            // If SubscriptionManager is available, show modal
                            if (window.SubscriptionManager) {
                                window.SubscriptionManager.showAuthModal();
                            } else {
                                window.location.href = 'index.html';
                            }
                        };

                        const grid = document.querySelector('.content-grid');
                        if (grid) grid.style.opacity = '0.5';
                    }
                }
            }

            window.addEventListener('subscription_updated', checkState);

            // Also check immediately in case we missed the event
            document.addEventListener('DOMContentLoaded', () => {
                checkState(); // Run strict check
                setTimeout(checkState, 500); // Wait a bit for Supabase to init
                setInterval(checkState, 2000); // Polling backup just in case
            });

            // 2. Button Actions
            async function redeem() {
                const btn = document.querySelector('.paywall-btn');
                const origText = btn.innerText;

                try {
                    btn.innerText = '处理中...';
                    btn.disabled = true;

                    if (!window.SubscriptionManager) {
                        alert('系统组件未加载，请刷新页面重试');
                        return;
                    }

                    // If not logged in, prompt login first
                    if (!window.SubscriptionManager.user) {
                        window.SubscriptionManager.showPaywall();
                        return;
                    }

                    await window.SubscriptionManager.redeemVoucher();
                } catch (e) {
                    alert('出错: ' + e.message);
                } finally {
                    btn.innerText = origText;
                    btn.disabled = false;
                }
            }

            function logout() {
                // Force UI Feedback immediately
                const btn = document.querySelector('.logout-btn');
                btn.innerText = '正在退出...';
                btn.disabled = true;

                // Clear all local storage credentials immediately
                localStorage.removeItem('current_user_email');
                localStorage.removeItem('local_dashboard_data');
                // Also clear Supabase tokens if possible (by key prefix)
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('sb-') && key.endsWith('-token')) localStorage.removeItem(key);
                });

                if (window.SubscriptionManager) {
                    // Tell manager to sign out properly from Supabase
                    window.SubscriptionManager.handleLogout();
                }

                // Hard Redirect to Index after short delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            }

            // 3. Dynamic Data Rendering (Cloud Sync Enabled)
            async function renderProfileData() {
                let d = null;

                // 1. Try Local Bridge First (Fast Preview)
                const localData = localStorage.getItem('local_dashboard_data');
                if (localData) {
                    try { d = JSON.parse(localData); } catch (e) { }
                }

                // 2. Fetch Cloud Data (Single Source of Truth)
                if (window.SubscriptionManager && window.SubscriptionManager.user) {
                    const uEmail = window.SubscriptionManager.user.email;
                    try {
                        const { data, error } = await window.SubscriptionManager.client
                            .from('user_dashboard_data')
                            .select('*')
                            .eq('username', uEmail)
                            .single();

                        if (data) {
                            d = data; // Override local with cloud
                            // Update local cache
                            localStorage.setItem('local_dashboard_data', JSON.stringify(data));
                            console.log('Profile synced from Cloud:', data);
                        }
                    } catch (err) { console.warn('Cloud Fetch Err:', err); }
                }

                // Default Mock if completely empty
                if (!d) {
                    d = {
                        prog_self: 0, prog_basic: 0, prog_subject: 0, prog_tech: 0, // Reset to 0 to indicate valid fetch needed
                        skill_math: false, skill_physics: false, skill_info: false,
                        skill_ai: false, skill_english: false, skill_reading: false
                    };
                }

                // 2. Render Core Growth
                const list = document.getElementById('courseList');
                const titleEl = document.querySelector('.dash-card h3');
                if (titleEl && titleEl.innerText.includes('正在学习')) titleEl.innerText = '📊 核心素养成长 | Core Growth';

                const dimensions = [
                    { name: 'Self Management / 自我管理', val: d.prog_self || 0, icon: '🧠', color: '#3b82f6' },
                    { name: 'Cognition / 基础思维', val: d.prog_basic || 0, icon: '💡', color: '#a855f7' },
                    { name: 'Academic / 学科知识', val: d.prog_subject || 0, icon: '📚', color: '#22c55e' },
                    { name: 'Tech Stack / 技术栈', val: d.prog_tech || 0, icon: '🛠️', color: '#f59e0b' }
                ];

                if (list) {
                    list.innerHTML = '';
                    dimensions.forEach(c => {
                        const div = document.createElement('div');
                        div.className = 'course-item';
                        div.innerHTML = `
                        <div class="c-icon" style="background:${c.color}20; color:${c.color}">${c.icon}</div>
                        <div class="c-info">
                            <div class="c-title">${c.name}</div>
                            <div class="progress-track">
                                <div class="progress-fill" style="width: ${c.val}%; background:${c.color}"></div>
                            </div>
                            <div class="c-meta">
                                <span>已完成 ${c.val}%</span>
                                <span>Status: Active</span>
                            </div>
                        </div>
                     `;
                        list.appendChild(div);
                    });
                }

                // 3. Render Achievements
                const badgeGrid = document.querySelector('.badge-grid');
                if (badgeGrid) {
                    const badges = [
                        { name: '初生牛犊', img: 'assets/images/badge_novice.png', unlocked: true },
                        { name: '星际探索', img: 'assets/images/badge_explorer.png', unlocked: true },
                        { name: '代码猎手', img: 'assets/images/badge_coder.png', unlocked: true },
                        { name: 'AI 觉醒', img: 'assets/images/badge_locked.png', unlocked: false },
                        { name: '深度学习', img: 'assets/images/badge_locked.png', unlocked: false },
                        { name: '机器视觉', img: 'assets/images/badge_locked.png', unlocked: false },
                        { name: '自然语言', img: 'assets/images/badge_locked.png', unlocked: false },
                        { name: '强化学习', img: 'assets/images/badge_locked.png', unlocked: false },
                        { name: '数据挖掘', img: 'assets/images/badge_locked.png', unlocked: false },
                        { name: '全栈大师', img: 'assets/images/badge_locked.png', unlocked: false }
                    ];

                    badgeGrid.innerHTML = '';
                    badges.forEach(b => {
                        const div = document.createElement('div');
                        div.className = `badge-item ${b.unlocked ? 'unlocked' : ''}`;
                        div.innerHTML = `
                             <img src="${b.img}" style="width: 50px; height: 50px; object-fit: contain; margin-bottom: 8px; filter: drop-shadow(0 0 5px rgba(0,240,255,0.3));">
                             <span class="badge-name">${b.name}</span>
                        `;
                        badgeGrid.appendChild(div);
                    });
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                renderProfileData();
            });
        </script>

        <!-- Baground Effect (Simple Starfield) -->
        <!-- Dynamic Background & Tilt Effect -->
        <script>
            // 1. Neural Network Background
            const canvas = document.getElementById('bg-canvas') || (() => {
                const c = document.createElement('canvas');
                c.id = 'bg-canvas';
                c.style.position = 'fixed';
                c.style.top = '0';
                c.style.left = '0';
                c.style.width = '100%';
                c.style.height = '100%';
                c.style.zIndex = '-1';
                document.body.prepend(c);
                return c;
            })();

            const ctx = canvas.getContext('2d');
            let w, h, particles = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                initParticles();
            }
            window.addEventListener('resize', resize);

            class Particle {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * 0.5;
                    this.vy = (Math.random() - 0.5) * 0.5;
                    this.size = Math.random() * 2;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0 || this.x > w) this.vx *= -1;
                    if (this.y < 0 || this.y > h) this.vy *= -1;
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < 80; i++) particles.push(new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = 'rgba(0,0,0,0)'; // Transparent clear

                // Draw connections
                ctx.lineWidth = 0.5;
                for (let i = 0; i < particles.length; i++) {
                    let p1 = particles[i];
                    p1.update();

                    // Draw particle
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.5)'; // Cyan particles
                    ctx.beginPath();
                    ctx.arc(p1.x, p1.y, p1.size, 0, Math.PI * 2);
                    ctx.fill();

                    // Connect
                    for (let j = i + 1; j < particles.length; j++) {
                        let p2 = particles[j];
                        let dx = p1.x - p2.x;
                        let dy = p1.y - p2.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < 120) {
                            ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 - dist / 800})`;
                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(animate);
            }

            resize();
            animate();

            // 2. 3D Tilt Effect for Cards
            document.querySelectorAll('.dash-card').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    // Calculate rotation (max 3 degrees)
                    const rotateX = ((y - centerY) / centerY) * -3;
                    const rotateY = ((x - centerX) / centerX) * 3;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
                });
            });

            // 3. Initial Animation Trigger for Graphs
            setTimeout(() => {
                const tracks = document.querySelectorAll('.progress-fill');
                tracks.forEach(track => {
                    // Force reflow to ensure transition plays if it was customized
                    const w = track.style.width;
                    track.style.width = '0';
                    setTimeout(() => track.style.width = w, 50);
                });
            }, 600);
        </script>
</body>

</html>
