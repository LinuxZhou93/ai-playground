<!DOCTYPE html>

<head>

        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        /* --- VISUAL UPGRADE 5.2: FIXED AUTH BUTTONS & SIDEBAR --- */
        :root {
            --primary: #00f0ff;
            --primary-dim: rgba(0, 240, 255, 0.1);
            --secondary: #7000ff;
            --accent: #fbbf24;
            --success: #10b981;
            --bg-dark: #02040a;
            --glass-bg: rgba(13, 17, 28, 0.9);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            color: #cbd5e1;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            margin: 0;
            overflow: hidden;
            /* Main scroll handled by containers */
            height: 100vh;
            background: radial-gradient(circle at 50% -20%, #1a1a40 0%, #000 70%);
        }

        /* --- LAYOUT: SIDEBAR + SCROLLABLE WALL --- */
        .app-container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: rgba(5, 5, 10, 0.95);
            border-right: 1px solid var(--glass-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .main-wall {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            position: relative;
        }

        /* --- DATA WALL SCROLL TRACK --- */
        .data-track-container {
            flex: 1;
            display: flex;
            align-items: center;
            /* Center Vertically if needed, or flex-start */
            padding: 40px;
            overflow-x: auto;
            /* Hide scrollbar for sleek look but allow scroll */
            scrollbar-width: thin;
            scrollbar-color: var(--primary) #111;
        }

        .data-grid-wall {
            display: grid;
            grid-template-rows: repeat(2, 320px);
            /* 2 Rows fix height */
            grid-template-columns: repeat(8, 420px);
            /* 8 Cols -> Total 16 Charts */
            gap: 20px;
            padding-right: 40px;
            /* Spacer at end */
        }

        /* Card Panel */
        .chart-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .chart-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
            z-index: 5;
            transform: scale(1.02);
        }

        .card-header {
            font-family: 'Noto Sans SC', sans-serif;
            font-weight: bold;
            font-size: 13px;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            margin-right: 8px;
            box-shadow: 0 0 5px var(--primary);
        }

        .chart-box {
            flex: 1;
            width: 100%;
            height: 100%;
            min-height: 200px;
        }

        /* --- SIDEBAR COMPONENTS --- */
        .profile-hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar-glow {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-dim);
            padding: 3px;
            background: url('assets/images/bot_avatar_vip.png') center/cover;
        }

        .user-title {
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            font-family: 'Noto Sans SC';
        }

        .user-tag {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-top: 5px;
            display: inline-block;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .nav-item {
            padding: 12px;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-icon {
            width: 20px;
            text-align: center;
        }

        .redeem-mini {
            background: linear-gradient(135deg, #111, #222);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 12px;
            margin-top: auto;
        }

        /* --- SCROLL HINT --- */
        .scroll-hint {
            position: absolute;
            bottom: 20px;
            right: 40px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid var(--primary-dim);
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: translateX(0);
            }

            50% {
                opacity: 1;
                transform: translateX(10px);
            }

            100% {
                opacity: 0.5;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- FIXED SIDEBAR -->
        <aside class="sidebar">
            <a href="index.html"
                style="color:#64748b; text-decoration:none; font-size:12px; margin-bottom:20px; display:block;">←
                返回首页</a>

            <div class="profile-hero">

            <div class="sidebar-nav">

                <div class="nav-item"><span class="nav-icon">🏆</span> 勋章墙 (12/50)</div>
                <div class="nav-item"><span class="nav-icon">📅</span> 学习日历</div>

            <!-- REDEEM AREA -->
            <div class="redeem-mini">

                <input type="text" id="voucher-code" placeholder="输入卡密..."

            <button id="authBtn" onclick="handleAuth()"

        </aside>

        <!-- HORIZONTAL SCROLL WALL -->
        <main class="main-wall">
            <div class="data-track-container">
                <div class="data-grid-wall">

                    <!-- 1. Radar -->
                    <div class="chart-card">
                        <div class="card-header"><span>核心素养模型</span><span>01</span></div>
                        <div id="c1" class="chart-box"></div>
                    </div>

                    <!-- 2. Thinking Rose -->
                    <div class="chart-card">
                        <div class="card-header"><span>编程思维维度</span><span>02</span></div>
                        <div id="c2" class="chart-box"></div>
                    </div>

                    <!-- 3. Tech Bar -->
                    <div class="chart-card">
                        <div class="card-header"><span>技术栈掌握度</span><span>03</span></div>
                        <div id="c3" class="chart-box"></div>
                    </div>

                    <!-- 4. Trend Line -->
                    <div class="chart-card">
                        <div class="card-header"><span>学习投入趋势</span><span>04</span></div>
                        <div id="c4" class="chart-box"></div>
                    </div>

                    <!-- 5. Subject Treemap -->
                    <div class="chart-card">
                        <div class="card-header"><span>学科融合分析</span><span>05</span></div>

                    </div>

                    <!-- 6. AI Radar (Skill Tree) -->
                    <div class="chart-card">
                        <div class="card-header"><span>AI 人工智能能力</span><span>06</span></div>
                        <div id="c6" class="chart-box"></div>
                    </div>

                    <!-- 7. Code Heatmap -->
                    <div class="chart-card">
                        <div class="card-header"><span>代码提交热力</span><span>07</span></div>
                        <div id="c7" class="chart-box"></div>

                    <!-- 8. Debug Funnel -->
                    <div class="chart-card">
                        <div class="card-header"><span>Debug 问题解决漏斗</span><span>08</span></div>
                        <div id="c8" class="chart-box"></div>
                    </div>

                    <!-- 9. Knowledge Graph -->
                    <div class="chart-card">
                        <div class="card-header"><span>动态知识图谱</span><span>09</span></div>
                        <div id="c9" class="chart-box"></div>
                    </div>

                    <!-- 10. Focus Sunburst -->
                    <div class="chart-card">
                        <div class="card-header"><span>精力分配占比</span><span>10</span></div>
                        <div id="c10" class="chart-box"></div>
                    </div>

                    <!-- 11. Project Gantt -->
                    <div class="chart-card">
                        <div class="card-header"><span>项目开发里程碑</span><span>11</span></div>
                        <div id="c11" class="chart-box"></div>
                    </div>

                    <!-- 12. Score Scatter -->
                    <div class="chart-card">
                        <div class="card-header"><span>效能分析(速度vs质量)</span><span>12</span></div>
                        <div id="c12" class="chart-box"></div>
                    </div>

                    <!-- 13. Vocab Area -->
                    <div class="chart-card">
                        <div class="card-header"><span>知识量积累趋势</span><span>13</span></div>
                        <div id="c13" class="chart-box"></div>
                    </div>

                    <!-- 14. Team Bar -->
                    <div class="chart-card">
                        <div class="card-header"><span>团队协作贡献</span><span>14</span></div>

                    </div>

                    <!-- 15. Rank Gauge -->
                    <div class="chart-card">

                    </div>

                    <!-- 16. Badge Grid (Visual) -->
                    <div class="chart-card">
                        <div class="card-header"><span>🔥 荣誉勋章墙</span><span>16</span></div>

                </div>
            </div>

            <div class="scroll-hint">向右滑动查看更多 >>></div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js?v=final"></script>
    <script src="assets/js/subscription.js?v=final"></script>

    <script>
        // --- 16 CHART CONFIGURATIONS (CHINESE) ---
        const Colors = {
            cyan: '#00f0ff', purple: '#7000ff', yellow: '#fbbf24', green: '#10b981', red: '#ef4444',
            blue: '#3b82f6', grid: 'rgba(255,255,255,0.05)', text: '#94a3b8'
        };

        const CommonTooltip = {
            trigger: 'axis',
            backgroundColor: 'rgba(5, 5, 10, 0.9)',
            borderColor: '#333',
            textStyle: { color: '#fff' }
        };

        function initAllCharts(data) {

            // 1. Core Radar
            const c1 = echarts.init(document.getElementById('c1'));
            c1.setOption({
                tooltip: { trigger: 'item' },
                radar: {
                    indicator: [{ name: '自我管理', max: 100 }, { name: '逻辑思维', max: 100 }, { name: '创新创造', max: 100 }, { name: '技术实践', max: 100 }, { name: '团队协作', max: 100 }],
                    splitArea: { show: true, areaStyle: { color: ['rgba(255,255,255,0.01)', 'rgba(255,255,255,0.05)'] } },
                    axisName: { color: Colors.cyan, fontFamily: 'Noto Sans SC', fontWeight: 'bold' }
                },
                series: [{
                    type: 'radar',
                    data: [
                        { value: [85, 92, 78, 95, 80], name: '我的数据', itemStyle: { color: Colors.cyan }, areaStyle: { color: new echarts.graphic.RadialGradient(0.5, 0.5, 1, [{ offset: 0, color: 'rgba(0,240,255,0.1)' }, { offset: 1, color: 'rgba(0,240,255,0.5)' }]) } },
                        { value: [60, 60, 60, 60, 60], name: '班级平均', itemStyle: { color: 'rgba(255,255,255,0.3)' }, lineStyle: { type: 'dashed' } }
                    ]
                }]
            });

            // 2. Thinking Rose
            const c2 = echarts.init(document.getElementById('c2'));
            c2.setOption({
                tooltip: { trigger: 'item', formatter: '{b}: {c}%' },
                series: [{
                    type: 'pie', roseType: 'area', radius: [20, 100], center: ['50%', '55%'],
                    itemStyle: { borderRadius: 5, borderColor: '#111', borderWidth: 2 },
                    label: { color: Colors.text, fontFamily: 'Noto Sans SC' },
                    data: [
                        { value: 45, name: '抽象思维', itemStyle: { color: Colors.purple } },
                        { value: 38, name: '算法设计', itemStyle: { color: Colors.blue } },
                        { value: 32, name: '模式识别', itemStyle: { color: Colors.cyan } },
                        { value: 28, name: '问题分解', itemStyle: { color: Colors.green } },
                        { value: 25, name: '评估优化', itemStyle: { color: Colors.yellow } },
                        { value: 20, name: '调试纠错', itemStyle: { color: Colors.red } }
                    ]
                }]
            });

            // 3. Tech Bar
            const c3 = echarts.init(document.getElementById('c3'));
            c3.setOption({
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                grid: { top: 30, bottom: 20, left: 20, right: 40, containLabel: true },
                xAxis: { type: 'value', splitLine: { show: false }, axisLabel: { show: false } },
                yAxis: { type: 'category', data: ['Python', 'Web前端', 'C++', '数据库', 'Linux', 'Git版本', 'Docker'], axisLabel: { color: '#fff', fontFamily: 'Noto Sans SC' } },
                series: [{
                    type: 'bar', data: [95, 80, 50, 60, 45, 70, 30],
                    barWidth: 12,
                    itemStyle: { color: new echarts.graphic.LinearGradient(1, 0, 0, 0, [{ offset: 0, color: Colors.cyan }, { offset: 1, color: Colors.purple }]) },
                    label: { show: true, position: 'right', color: '#fff', formatter: '{c}%' },
                    showBackground: true, backgroundStyle: { color: 'rgba(255,255,255,0.05)', borderRadius: 6 }
                }]
            });

            // 4. Trend Line
            const c4 = echarts.init(document.getElementById('c4'));
            c4.setOption({
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(5,5,10,0.9)', borderColor: '#333', textStyle: { color: '#fff' } },
                grid: { left: 10, right: 10, bottom: 10, containLabel: true },
                xAxis: { type: 'category', boundaryGap: false, data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'], axisLine: { lineStyle: { color: '#333' } }, axisLabel: { fontFamily: 'Noto Sans SC' } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: Colors.grid } } },
                series: [{
                    name: '专注时长 (h)', type: 'line', smooth: true, showSymbol: false,
                    data: [4, 5, 3, 6, 8, 12, 10],
                    lineStyle: { width: 4, color: Colors.green },
                    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(16,185,129,0.5)' }, { offset: 1, color: 'transparent' }]) },
                    markPoint: { data: [{ type: 'max', name: '峰值' }] }
                }]
            });

            // 5. Subject Treemap
            const c5 = echarts.init(document.getElementById('c5'));
            c5.setOption({
                tooltip: { formatter: '{b}: {c}' },
                series: [{
                    type: 'treemap', width: '90%', height: '80%', top: '10%', breadcrumb: { show: false },
                    itemStyle: { borderColor: '#000', borderWidth: 2, gapWidth: 2 },
                    data: [
                        { name: '数学 Math', value: 40, itemStyle: { color: Colors.blue }, children: [{ name: '代数', value: 20 }, { name: '几何', value: 10 }, { name: '统计', value: 10 }] },
                        { name: '物理 Physics', value: 25, itemStyle: { color: Colors.purple }, children: [{ name: '力学', value: 15 }, { name: '光学', value: 10 }] },
                        { name: '艺术 Art', value: 20, itemStyle: { color: Colors.red }, children: [{ name: '设计', value: 10 }, { name: '色彩', value: 10 }] },
                        { name: '语文/英语', value: 15, itemStyle: { color: Colors.cyan }, children: [{ name: '科技英语', value: 15 }] }
                    ]
                }]
            });

            // 6. AI Radar
            const c6 = echarts.init(document.getElementById('c6'));
            c6.setOption({
                radar: {
                    indicator: [{ name: '提示词工程', max: 100 }, { name: '模型微调', max: 100 }, { name: 'RAG 架构', max: 100 }, { name: 'AIGC 工具', max: 100 }, { name: '部署落地', max: 100 }],
                    shape: 'circle', splitNumber: 5,
                    axisName: { color: Colors.red, fontWeight: 'bold', fontFamily: 'Noto Sans SC' },
                    splitLine: { lineStyle: { color: 'rgba(239, 68, 68, 0.2)' } },
                    splitArea: { show: false }
                },
                series: [{
                    type: 'radar',
                    data: [{ value: [90, 40, 60, 95, 30], name: 'AI 能力值', itemStyle: { color: Colors.red }, areaStyle: { color: 'rgba(239, 68, 68, 0.4)' } }]
                }]
            });

            // 7. Heatmap
            const c7 = echarts.init(document.getElementById('c7'));
            const c7Data = [];
            for (let i = 0; i < 7; i++) {
                for (let j = 0; j < 24; j++) {
                    c7Data.push([i, j, Math.random() > 0.7 ? Math.floor(Math.random() * 10) : 0]);
                }
            }
            c7.setOption({
                tooltip: { position: 'top' },
                grid: { height: '80%', top: '5%' },
                xAxis: { type: 'category', data: ['一', '二', '三', '四', '五', '六', '日'], axisLine: { show: false }, axisLabel: { color: '#666', fontFamily: 'Noto Sans SC' } },
                yAxis: { type: 'category', data: ['0点', '', '', '4点', '', '', '8点', '', '', '12点', '', '', '16点', '', '', '20点', '', '', ''], axisLine: { show: false }, axisLabel: { color: '#666', fontSize: 9 } },
                visualMap: { min: 0, max: 10, show: false, inRange: { color: ['#1a1a1a', '#0e4a4d', Colors.cyan] } },
                series: [{
                    type: 'heatmap', data: c7Data,
                    itemStyle: { borderColor: '#000', borderWidth: 1, borderRadius: 2 }
                }]
            });

            // 8. Funnel
            const c8 = echarts.init(document.getElementById('c8'));
            c8.setOption({
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'funnel', sort: 'descending', gap: 2, left: '10%', width: '80%',
                    label: { show: true, position: 'inside', fontFamily: 'Noto Sans SC' },
                    data: [
                        { value: 100, name: '发现 Bug', itemStyle: { color: Colors.red } },
                        { value: 80, name: '定位根源', itemStyle: { color: '#f97316' } },
                        { value: 60, name: '尝试修复', itemStyle: { color: Colors.yellow } },
                        { value: 40, name: '验证通过', itemStyle: { color: Colors.blue } },
                        { value: 20, name: '举一反三', itemStyle: { color: Colors.green } }
                    ]
                }]
            });

            // 9. Knowledge Graph
            const c9 = echarts.init(document.getElementById('c9'));
            c9.setOption({
                tooltip: {},
                series: [{
                    type: 'graph', layout: 'force',
                    draggable: true,
                    symbolSize: (val) => val * 1.5,
                    roam: true,
                    label: { show: true, color: '#fff', fontFamily: 'Noto Sans SC' },
                    edgeSymbol: ['circle', 'arrow'], edgeSymbolSize: [4, 10],
                    force: { repulsion: 200, edgeLength: 50 },
                    lineStyle: { color: 'source', curveness: 0.3 },
                    data: [
                        { name: 'root', value: 40, itemStyle: { color: Colors.cyan } },
                        { name: 'Python', value: 30, itemStyle: { color: Colors.blue } },
                        { name: 'Web开发', value: 30, itemStyle: { color: Colors.purple } },
                        { name: '人工智能', value: 35, itemStyle: { color: Colors.red } },
                        { name: 'Django', value: 20, itemStyle: { color: Colors.blue } },
                        { name: 'React', value: 20, itemStyle: { color: Colors.purple } },
                        { name: 'LLM大模型', value: 25, itemStyle: { color: Colors.red } }
                    ],
                    links: [
                        { source: 'root', target: 'Python' }, { source: 'root', target: 'Web开发' }, { source: 'root', target: '人工智能' },
                        { source: 'Python', target: 'Django' }, { source: 'Web开发', target: 'React' }, { source: '人工智能', target: 'LLM大模型' },
                        { source: 'Python', target: '人工智能' }
                    ]
                }]
            });

            // 10. Sunburst
            const c10 = echarts.init(document.getElementById('c10'));
            c10.setOption({
                series: [{

        // --- BOOT Logic (Updated Auth) ---
        function checkState() {
            const manager = window.SubscriptionManager;
            VanillaTilt.init(document.querySelector(".redeem-mini"), { max: 50, speed: 400, glare: false });

            let user = manager?.user;
            let profile = manager?.profile;
            let isVIP = manager?.isSubscribed();

            const authBtn = document.getElementById('authBtn');

            if (!user) {
                // GUEST MODE
                const local = localStorage.getItem('current_user_email');
                if (local) {
                    document.getElementById('uName').innerText = local.split('@')[0];
                    document.getElementById('uRole').innerText = '离线模式';
                    if (authBtn) {
                        authBtn.innerText = '安全退出 / LOGOUT';
                        authBtn.onclick = logout;
                    }
                } else {
                    document.getElementById('uName').innerText = '访客 (Guest)';
                    document.getElementById('uRole').innerText = '未注册';
                    // Show Login Button
                    if (authBtn) {
                        authBtn.innerText = '立即登录 / 注册';
                        authBtn.onclick = handleAuth;
                        authBtn.style.background = 'var(--primary)';
                        authBtn.style.color = '#000';
                        authBtn.style.fontWeight = 'bold';
                        authBtn.style.borderColor = 'transparent';
                    }
                }
            } else {
                // USER MODE
                document.getElementById('uName').innerText = profile?.username || user.email.split('@')[0];
                document.getElementById('uRole').innerText = isVIP ? '尊享会员 VIP' : '普通用户';
                if (isVIP) document.getElementById('uAvatar').style.backgroundImage = `url('assets/images/bot_avatar_vip.png')`;

                if (authBtn) {
                    authBtn.innerText = '安全退出系统';
                    authBtn.onclick = logout;
                    authBtn.style.background = 'rgba(255,255,255,0.05)';
                    authBtn.style.color = '#fff';
                }
            }

            // Allow charts to init
            setTimeout(() => initAllCharts(profile), 100);
        }

        async function redeem() {
            const code = document.getElementById('voucher-code').value;
            const btn = document.querySelector('.redeem-mini button');
            if (!code) return alert('请输入卡密');
            btn.innerText = '正在验证...';
            try {
                if (window.SubscriptionManager) await window.SubscriptionManager.redeemVoucher();
                alert('兑换成功!'); location.reload();
            } catch (e) { alert(e.message); btn.innerText = '立即激活'; }
        }

        function handleAuth() {
            if (window.SubscriptionManager) {
                window.SubscriptionManager.showAuthModal();
            } else {
                window.location.href = 'index.html';
            }
        }

        function logout() { localStorage.clear(); location.href = 'index.html'; }

        document.addEventListener('DOMContentLoaded', checkState);

    </script>
