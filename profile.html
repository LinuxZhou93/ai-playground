<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学员个人中心 | Student Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <link rel="stylesheet" href="assets/css/subscription.css">
    <style>
        /* Dashboard Specific Styles */
        body {
            background: #050a14;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 80px auto 40px;
            padding: 20px;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            width: 95%;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cards */
        .dash-card {
            background: rgba(16, 23, 41, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .dash-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--mc-cyan);
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px dashed rgba(0, 243, 255, 0.2);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Profile Sidebar */
        .profile-sidebar {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .user-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #fbbf24;
            /* VIP Gold */
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            margin-bottom: 15px;
            background: url('assets/images/avatar_placeholder.png') center/cover;
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .user-name {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
        }

        .user-role {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 5px;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .profile-stats {
            margin-top: 30px;
            width: 100%;
        }

        .p-stat-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: #94a3b8;
        }

        .p-stat-val {
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
        }

        .logout-btn {
            margin-top: 40px;
            width: 100%;
            padding: 12px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        /* Course Progress */
        .course-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .course-item:hover {
            border-color: rgba(0, 243, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .c-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .c-info {
            flex: 1;
        }

        .c-title {
            font-size: 14px;
            font-weight: bold;
            color: #e2e8f0;
            margin-bottom: 5px;
        }

        .progress-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--mc-cyan);
            width: 0%;
            transition: width 1s ease-out;
        }

        .c-meta {
            font-size: 11px;
            color: #64748b;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
        }

        /* Badges */
        .badge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            text-align: center;
        }

        .badge-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.5;
            filter: grayscale(1);
            transition: 0.3s;
        }

        .badge-item.unlocked {
            opacity: 1;
            filter: grayscale(0);
        }

        .badge-icon {
            font-size: 32px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
        }

        .badge-name {
            font-size: 11px;
            color: #cbd5e1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Back Button */
        .nav-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #94a3b8;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            transition: 0.3s;
        }

        .nav-back:hover {
            color: var(--mc-cyan);
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas" style="position: fixed; top:0; left:0; z-index:-1;"></canvas>

    <a href="index.html" class="nav-back">
        <span>←</span> 返回首页
    </a>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="dash-card profile-sidebar">
            <div class="user-avatar" id="uAvatar">👤</div>
            <div class="user-name" id="uName">未登录</div>
            <div class="user-role" id="uRole">游客</div>

            <div class="profile-stats">
                <div class="p-stat-row">
                    <span>账号ID</span>
                    <span class="p-stat-val" id="uID">---</span>
                </div>
                <div class="p-stat-row">
                    <span>会员有效期</span>
                    <span class="p-stat-val" id="uExpiry" style="color: #fbbf24;">---</span>
                </div>
                <div class="p-stat-row">
                    <span>学习时长</span>
                    <span class="p-stat-val">12h 45m</span>
                </div>
                <div class="p-stat-row">
                    <span>已获勋章</span>
                    <span class="p-stat-val">3 / 12</span>
                </div>
            </div>

            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="content-grid">

                <!-- Recent Courses -->
                <div class="dash-card" style="grid-column: span 2;">
                    <h3>📚 正在学习</h3>
                    <div id="courseList">
                        <!-- Items injected by JS -->
                    </div>
                </div>

                <!-- Achievements -->
                <div class="dash-card">
                    <h3>🏆 成就勋章</h3>
                    <div class="badge-grid">
                        <div class="badge-item unlocked">
                            <div class="badge-icon">🥚</div>
                            <span class="badge-name">初生牛犊</span>
                        </div>
                        <div class="badge-item unlocked">
                            <div class="badge-icon">🚀</div>
                            <span class="badge-name">启航者</span>
                        </div>
                        <div class="badge-item unlocked">
                            <div class="badge-icon">💻</div>
                            <span class="badge-name">代码小白</span>
                        </div>
                        <div class="badge-item">
                            <div class="badge-icon">🪐</div>
                            <span class="badge-name">星际探索</span>
                        </div>
                        <div class="badge-item">
                            <div class="badge-icon">🤖</div>
                            <span class="badge-name">机甲大师</span>
                        </div>
                        <div class="badge-item">
                            <div class="badge-icon">🧠</div>
                            <span class="badge-name">最强大脑</span>
                        </div>
                    </div>
                </div>

                <!-- Settings -->
                <div class="dash-card">
                    <h3>⚙️ 账号服务</h3>

                    <!-- Voucher Redemption -->
                    <div class="paywall-input-group"
                        style="border: 1px dashed rgba(0,243,255,0.3); padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.3);">
                        <label class="paywall-label" style="color: #fbbf24; font-weight: bold;">💎 会员卡密兑换</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="voucherCode" class="paywall-input" placeholder="输入卡密 VIP-xxxx..."
                                style="text-transform: uppercase;">
                            <button class="paywall-btn" onclick="redeem()"
                                style="width: auto; padding: 0 20px; font-size: 14px; margin: 0;">兑换</button>
                        </div>
                        <div id="redeemMsg" style="font-size: 12px; margin-top: 10px; min-height: 15px;"></div>
                    </div>

                    <div style="height: 20px;"></div>

                    <div class="paywall-input-group">
                        <label class="paywall-label">修改密码</label>
                        <input type="password" class="paywall-input" placeholder="********" disabled>
                        <div style="font-size: 11px; color: #64748b; margin-top: 5px;">* 请联系管理员重置密码</div>
                    </div>
                </div>

            </div>
        </div>
        <div class="dashboard-container">
            <!-- Content... -->
        </div>

        <!-- Supabase Core -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="assets/js/supabase-config.js"></script>

        <script src="assets/js/subscription.js"></script>
        <script>
            // Init Logic
            document.addEventListener('DOMContentLoaded', () => {
                // 1. Check Login
                const storedUser = localStorage.getItem('vip_user');
                if (storedUser) {
                    const user = JSON.parse(storedUser);
                    document.getElementById('uName').textContent = user.username === 'student01' ? 'Demonstration User' : user.username;
                    document.getElementById('uID').textContent = '#' + Math.random().toString(36).substr(2, 6).toUpperCase();
                    document.getElementById('uRole').textContent = '尊享会员 VIP';
                    document.getElementById('uExpiry').textContent = user.expiry;
                    document.getElementById('uAvatar').innerHTML = '🎓';
                } else {
                    // Not logged in UI
                    document.querySelector('.content-grid').style.opacity = '0.3';
                    document.querySelector('.content-grid').style.pointerEvents = 'none';
                    // Prompt login
                    setTimeout(() => SubscriptionManager.showPaywall(), 500);
                }

                // 2. Render Courses
                const courses = [
                    { name: 'Python 基础入门', icon: '🐍', progress: 85, last: '2小时前' },
                    { name: '天文宇宙探索', icon: '🪐', progress: 40, last: '1天前' },
                    { name: '无人机飞行原理', icon: '🚁', progress: 15, last: '3天前' }
                ];

                const list = document.getElementById('courseList');
                courses.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'course-item';
                    div.innerHTML = `
                    <div class="c-icon">${c.icon}</div>
                    <div class="c-info">
                        <div class="c-title">${c.name}</div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width: ${c.progress}%"></div>
                        </div>
                        <div class="c-meta">
                            <span>已学 ${c.progress}%</span>
                            <span>上次: ${c.last}</span>
                        </div>
                    </div>
                 `;
                    list.appendChild(div);
                });
            });

            function logout() {
                if (confirm('确定要退出登录吗？\n退出后将无法访问会员课程。')) {
                    localStorage.removeItem('vip_user');
                    localStorage.removeItem('is_vip_member'); // Clean old key just in case
                    window.location.href = 'index.html';
                }
            }
        </script>

        <!-- Baground Effect (Simple Starfield) -->
        <script>
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resize);
            resize();

            const stars = Array(100).fill().map(() => ({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 2,
                speed: Math.random() * 0.5 + 0.1
            }));

            function animate() {
                ctx.fillStyle = '#050a14';
                ctx.fillRect(0, 0, width, height);
                ctx.fillStyle = '#fff';

                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > height) s.y = 0;
                    ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                requestAnimationFrame(animate);
            }
            animate();
        </script>
</body>

</html>
