<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Psyche-X Junior | 未来创客多维测评</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lottie Web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <!-- Chart.js for Radar Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2canvas for saving report -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts for Kids (Fredoka) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Fredoka', 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .screen { visibility: hidden; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; position: absolute; inset: 0; }
        .screen.active { visibility: visible; opacity: 1; pointer-events: auto; }
        /* Card hover effects */
        .opt-card { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .opt-card:active { transform: scale(0.95); }
        .opt-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        /* Memory Grid */
        .mem-cell { transition: all 0.2s; border-radius: 12px; }
        .mem-cell.active { transform: scale(0.9); box-shadow: inset 0 0 0 4px rgba(0,0,0,0.2); }
        .mem-cell.flash { background-color: #fcd34d !important; transform: scale(1.1); box-shadow: 0 0 20px rgba(251,191,36,0.6); }
        
        /* Particle Background */
        .particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; pointer-events: none; }
        @keyframes floatUp { from { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 100% { transform: translateY(-20vh); opacity: 0; } }
        /* Pulse */
        @keyframes customPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .animate-custom-pulse { animation: customPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-800 overflow-hidden flex flex-col items-center justify-center p-4">

    <!-- Back to Hub Button -->
    <button onclick="window.location.href='hub.html'" class="fixed top-4 left-4 z-50 w-12 h-12 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center text-white hover:bg-white/20 transition group border border-white/20">
        <i data-lucide="arrow-left" class="w-6 h-6 group-hover:-translate-x-1 transition-transform"></i>
    </button>

    <!-- App Container -->
    <main id="app-container" class="relative z-10 w-full max-w-5xl h-[90vh] bg-white rounded-[2rem] shadow-2xl border-4 border-slate-200 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header id="quiz-header" class="hidden shrink-0 flex items-center justify-between p-4 sm:p-6 border-b-2 border-slate-100 bg-white/80 backdrop-blur-sm z-20">
            <div class="flex-1 mr-4">
                <div class="h-4 bg-slate-200 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-400 to-indigo-500 w-0 transition-all duration-300"></div>
                </div>
                <div class="text-sm font-bold mt-2 flex justify-between">
                    <span id="module-title" class="text-blue-600 tracking-wide">加载中...</span>
                    <span id="progress-text" class="text-slate-500">0/0</span>
                </div>
            </div>
            <div class="score-badge px-4 py-2 bg-yellow-100 text-yellow-600 rounded-xl font-bold border-2 border-yellow-200 flex items-center gap-2">
                <i data-lucide="star" class="w-4 h-4 fill-yellow-500"></i>
                <span id="combo-text">Combo x0</span>
            </div>
        </header>

        <!-- Screens wrapper -->
        <div class="flex-1 relative bg-slate-50">
            
            <!-- 1. Start Screen -->
            <section id="screen-start" class="screen active flex flex-col items-center justify-center p-8 bg-gradient-to-b from-blue-900 to-indigo-900 text-white">
                <div id="lottie-start" class="w-64 h-64 mb-4"></div> <!-- Placeholder for Lottie -->
                <h1 class="text-4xl sm:text-6xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 text-center drop-shadow-lg">
                    Psyche-X Junior
                </h1>
                <p class="text-lg text-blue-200 mb-10 font-medium tracking-wider">未来科技特长生多维能力评测 2.0</p>
                
                <div class="w-full max-w-sm space-y-4">
                    <input type="text" id="student-name" placeholder="请输入参与者姓名" class="w-full text-center px-6 py-4 rounded-2xl border-4 border-indigo-500/50 bg-indigo-900/50 text-xl font-bold text-white outline-none focus:border-cyan-400 placeholder-indigo-300 backdrop-blur-md">
                    <button id="btn-start" class="w-full px-8 py-5 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-2xl border-b-4 border-blue-700 text-white font-bold text-2xl flex items-center justify-center gap-3 transform active:translate-y-1 active:border-b-0 hover:brightness-110 transition-all shadow-[0_0_30px_rgba(34,211,238,0.3)]">
                        <span>启动测评</span>
                        <i data-lucide="rocket" class="w-6 h-6"></i>
                    </button>
                </div>
            </section>

            <!-- 2. Interstitial / Lottie Screen -->
            <section id="screen-cutscene" class="screen flex flex-col items-center justify-center p-8 bg-blue-50">
                <div id="lottie-cutscene" class="w-64 h-64 sm:w-80 sm:h-80 mb-8"></div>
                <h2 id="cutscene-title" class="text-3xl font-bold text-slate-800 mb-2">准备进入</h2>
                <p id="cutscene-desc" class="text-lg text-slate-500">即将开始新的挑战模块...</p>
            </section>

            <!-- 3. Standard Quiz Screen -->
            <section id="screen-quiz" class="screen flex flex-col p-4 sm:p-8 overflow-y-auto">
                <div class="w-full max-w-4xl mx-auto flex flex-col items-center flex-1">
                    <h2 id="question-prompt" class="text-2xl sm:text-4xl font-bold text-slate-800 text-center mb-8 leading-relaxed">
                        题目加载中
                    </h2>
                    
                    <!-- Dynamic Question Area (Image, Emojis, Memory Grid etc.) -->
                    <div id="question-display-area" class="w-full max-w-2xl min-h-[16rem] bg-white rounded-[2rem] shadow-sm border-4 border-slate-100 flex items-center justify-center mb-8 p-4 relative overflow-hidden text-center">
                    </div>

                    <!-- AI Media Area (Camera / Audio) -->
                    <div id="ai-media-area" class="hidden w-full max-w-xl mx-auto flex-col items-center justify-center gap-6 mb-8">
                        <div class="relative w-full aspect-video bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-indigo-200">
                            <!-- Video feed -->
                            <video id="camera-feed" class="w-full h-full object-cover hidden" autoplay playsinline></video>
                            
                            <!-- Audio visualizer fake or canvas -->
                            <div id="audio-visualizer" class="hidden absolute inset-0 flex items-center justify-center gap-2 bg-slate-800">
                                <div class="w-3 h-12 bg-indigo-500 rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
                                <div class="w-3 h-20 bg-cyan-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
                                <div class="w-3 h-16 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0.3s;"></div>
                                <div class="w-3 h-24 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.4s;"></div>
                                <div class="w-3 h-14 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.5s;"></div>
                            </div>
                            
                            <!-- Captured image preview -->
                            <img id="photo-preview" class="w-full h-full object-cover hidden" />
                        </div>
                        
                        <!-- AI Controls -->
                        <div id="ai-controls" class="flex items-center gap-4">
                            <button id="btn-capture-photo" class="hidden px-8 py-4 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold rounded-2xl shadow-lg border-b-4 border-rose-700 active:border-b-0 active:translate-y-1 transition text-xl flex items-center gap-2">
                                <i data-lucide="camera" class="w-6 h-6"></i> 拍张特工照！
                            </button>
                            
                            <button id="btn-record-audio" class="hidden px-8 py-4 bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-bold rounded-2xl shadow-lg border-b-4 border-indigo-700 active:border-b-0 active:translate-y-1 transition text-xl flex items-center gap-2">
                                <i data-lucide="mic" class="w-6 h-6"></i> 按住说话
                            </button>
                            <button id="btn-next-ai" class="hidden px-8 py-4 bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold rounded-2xl shadow-lg border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1 transition text-xl flex items-center gap-2">
                                继续探险 <i data-lucide="arrow-right" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Options Grid -->
                    <div id="options-grid" class="grid w-full max-w-3xl gap-4 sm:gap-6 pb-8">
                    </div>
                </div>
            </section>

            <!-- 4. Report Screen -->
            <section id="screen-report" class="screen flex flex-col p-6 sm:p-10 bg-gradient-to-br from-indigo-50 to-purple-50 overflow-y-auto">
                <div id="report-content" class="w-full max-w-4xl mx-auto bg-white rounded-[2rem] shadow-xl border-4 border-indigo-100 p-8">
                    <div class="text-center mb-10">
                        <h1 class="text-4xl font-extrabold text-indigo-900 mb-4 tracking-tight">多维能力评定总单</h1>
                        <p class="text-xl text-slate-600">评测对象：<span id="report-name" class="font-bold text-indigo-600"></span></p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-10 items-center mb-10">
                        <!-- Radar Context -->
                        <div class="bg-slate-50 rounded-3xl p-6 shadow-inner border border-slate-200 aspect-square relative">
                            <canvas id="radarChart"></canvas>
                        </div>
                        
                        <!-- Analysis Context -->
                        <div class="space-y-6">
                            <div class="bg-indigo-50 border-2 border-indigo-200 rounded-3xl p-6 relative">
                                <h3 class="font-bold text-indigo-800 text-xl mb-3 flex items-center gap-2">
                                    <i data-lucide="brain-circuit" class="w-6 h-6"></i> 核心大脑侧写
                                </h3>
                                <p id="report-comment" class="text-slate-700 text-lg leading-relaxed font-medium">分析中...</p>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-blue-50 p-5 rounded-2xl border border-blue-200">
                                    <div class="text-blue-500 font-bold uppercase mb-2 flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4"></i> 绝对优势</div>
                                    <div id="report-strength" class="text-2xl font-extrabold text-slate-800">-</div>
                                </div>
                                <div class="bg-purple-50 p-5 rounded-2xl border border-purple-200">
                                    <div class="text-purple-500 font-bold uppercase mb-2 flex items-center gap-2"><i data-lucide="target" class="w-4 h-4"></i> 赋能潜力</div>
                                    <div id="report-potential" class="text-2xl font-extrabold text-slate-800">-</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-900 rounded-[2rem] p-8 text-center" data-html2canvas-ignore>
                        <h3 class="text-2xl font-bold text-white mb-6">Psyche-X 数据已加密入库</h3>
                        <div class="flex justify-center gap-4">
                            <button id="btn-save-report" class="px-8 py-4 bg-gradient-to-r from-cyan-400 to-blue-500 text-white rounded-xl font-bold flex items-center gap-2 hover:scale-105 transition shadow-[0_0_20px_rgba(34,211,238,0.4)]">
                                <i data-lucide="download" class="w-5 h-5"></i> 导出长图报告
                            </button>
                            <button onclick="window.location.href='hub.html'" class="px-8 py-4 bg-white/10 text-white rounded-xl font-bold hover:bg-white/20 transition">
                                返回中枢
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        
        <!-- Generic Success Visualizer -->
        <div id="overlay-success" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center opacity-0">
            <div class="w-48 h-48 bg-green-400 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(74,222,128,0.8)] transform scale-50" id="success-circle">
                <i data-lucide="check" class="w-24 h-24 text-white"></i>
            </div>
        </div>
        <!-- Generic Error Visualizer -->
        <div id="overlay-error" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center opacity-0">
            <div class="w-48 h-48 bg-red-400 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(248,113,113,0.8)] transform scale-50" id="error-circle">
                <i data-lucide="x" class="w-24 h-24 text-white"></i>
            </div>
        </div>

    </main>

    <script src="js/assessment_junior.js"></script>
    <script>
        lucide.createIcons();
        for (let i = 0; i < 20; i++) {
            let p = document.createElement('div');
            p.className = 'particle bg-white/5';
            p.style.width = Math.random() * 50 + 10 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 5 + 5 + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
