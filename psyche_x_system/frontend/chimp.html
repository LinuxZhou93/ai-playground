<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Chimp Test</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="kernel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/data_manager.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .grid-area {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            width: 600px;
            height: 400px;
        }

        .cell {
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }

        .cell.active {
            border-color: white;
            background: white;
            color: black;
        }

        .cell.hidden-num {
            background: white;
            color: transparent;
            border-color: white;
        }

        .cell.correct {
            background: transparent;
            border-color: transparent;
            color: transparent;
            pointer-events: none;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="flex flex-col h-screen p-8 items-center justify-center">

    <div class="fixed top-8 left-8 flex gap-4">
        <button onclick="history.back()" class="p-3 bg-white/10 rounded-full hover:bg-white/20"><i
                data-lucide="arrow-left"></i></button>
        <div>
            <h1 class="text-xl font-bold" id="title-text">Chimp Test</h1>
            <p class="text-xs text-gray-500">LEVEL <span id="level-num">4</span></p>
        </div>
    </div>

    <div class="grid-area" id="grid">
        <!-- JS Injected -->
    </div>

    <div id="msg" class="absolute bottom-20 text-xl font-mono text-gray-400">Click the numbers in order</div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const TITLE = urlParams.get('title') || "Chimp Test";
        document.getElementById('title-text').innerText = decodeURIComponent(TITLE);

        let level = 4;
        let lives = 3;
        let sequence = [];
        let clicked = 0;
        let isHidden = false;

        function initLevel() {
            document.getElementById('level-num').innerText = level;
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            // Create 40 slots (8x5 roughly) logic
            const positions = new Set();
            while (positions.size < level) {
                positions.add(Math.floor(Math.random() * 32)); // using 32 slots for 8x4 layout
            }

            sequence = [];

            // Render
            let count = 1;
            for (let i = 0; i < 32; i++) {
                const el = document.createElement('div');
                el.className = 'cell';
                if (positions.has(i)) {
                    el.classList.add('active');
                    el.innerText = count;
                    el.dataset.num = count;
                    el.onclick = () => handleClick(el, parseInt(el.dataset.num));
                    count++;
                } else {
                    el.style.opacity = 0;
                    el.style.pointerEvents = 'none';
                }
                grid.appendChild(el);
            }

            clicked = 0;
            isHidden = false;
        }

        function handleClick(el, num) {
            if (num === 1) {
                // Hide all mechanics
                isHidden = true;
                document.querySelectorAll('.cell.active').forEach(c => c.classList.add('hidden-num'));
            }

            if (num === clicked + 1) {
                // Correct
                el.classList.remove('hidden-num');
                el.classList.add('correct');
                clicked++;

                if (clicked === level) {
                    level++;
                    setTimeout(initLevel, 500);
                }
            } else {
                // Wrong
                lives--;
                if (lives <= 0) {
                    finishSession();
                } else {
                    alert(`Strike! ${lives} lives remaining.`);
                    initLevel(); // Retry same level
                }
            }
        }

        function finishSession() {
            if (window.DataManager) {
                window.DataManager.submitResult({
                    title: decodeURIComponent(TITLE),
                    domain: 'MEMORY',
                    score: (level * 100),
                    metrics: { maxLevel: level }
                });
            }
            if (confirm(`Game Over. Level Reached: ${level}\n\nView Analytics?`)) {
                window.location.href = 'report_global.html';
            } else {
                initLevel();
                level = 4;
                lives = 3;
            }
        }

        initLevel();

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.22_2"></script>
</body>

</html>
