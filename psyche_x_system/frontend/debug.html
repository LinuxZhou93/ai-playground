<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Debug Test</title>
    <style>
        body {
            font-family: Arial;
            padding: 50px;
            background: #f0f0f0;
        }

        button {
            padding: 20px 40px;
            font-size: 18px;
            background: #0066CC;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }

        .panel {
            background: white;
            padding: 40px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .hidden {
            display: none;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body>
    <h1>Psyche-X Debug Test</h1>

    <div id="panel1" class="panel">
        <h2>Panel 1 - Login</h2>
        <input type="text" id="name" value="Test" style="padding: 10px; font-size: 16px;">
        <br><br>
        <button onclick="testInit()">Click to Start Game</button>
        <p id="status">Status: Ready</p>
    </div>

    <div id="panel2" class="panel hidden">
        <h2>Panel 2 - Game</h2>
        <p>Game is running!</p>
        <p>Score: <span id="score">0</span></p>
        <button onclick="alert('Game works!')">Test Button</button>
    </div>

    <div id="console-log"
        style="background: #000; color: #0f0; padding: 20px; margin-top: 20px; font-family: monospace; max-height: 300px; overflow-y: auto;">
        <div>Console Log:</div>
    </div>

    <script>
        function log(msg) {
            const logDiv = document.getElementById('console-log');
            logDiv.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + msg + '</div>';
            console.log(msg);
        }

        log('Script loaded');

        function testInit() {
            log('testInit called');

            try {
                document.getElementById('status').innerText = 'Status: Initializing...';
                log('Status updated');

                setTimeout(() => {
                    log('Hiding panel1');
                    document.getElementById('panel1').classList.add('hidden');

                    log('Showing panel2');
                    document.getElementById('panel2').classList.remove('hidden');

                    log('Panel switch complete');
                    document.getElementById('status').innerText = 'Status: Game Started!';
                }, 1000);

            } catch (e) {
                log('ERROR: ' + e.message);
                alert('Error: ' + e.message);
            }
        }

        log('Functions defined');
        log('Ready to test');
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js"></script>
</body>

</html>
