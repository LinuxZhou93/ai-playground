<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Go/No-Go</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="kernel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/data_manager.js"></script>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .stimulus {
            font-size: 15rem;
            font-weight: bold;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="flex flex-col items-center justify-center" onclick="handlePress()">

    <div class="fixed top-8 left-8 flex gap-4">
        <button onclick="event.stopPropagation(); history.back()"
            class="p-3 bg-white/10 rounded-full hover:bg-white/20"><i data-lucide="arrow-left"></i></button>
        <div>
            <h1 class="text-xl font-bold" id="title-text">Go/No-Go Task</h1>
            <p class="text-xs text-gray-500">Tap for 'P'. Ignore 'R'.</p>
        </div>
    </div>

    <div id="game-container" class="flex items-center justify-center w-full h-full cursor-pointer">
        <div id="stimulus" class="stimulus"></div>
    </div>

    <div id="feedback" class="fixed bottom-20 text-red-500 font-bold opacity-0 transition-opacity">MISTAKE</div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const TITLE = urlParams.get('title') || "Inhibition Test";
        document.getElementById('title-text').innerText = decodeURIComponent(TITLE);

        let active = false;
        let trials = 0;
        const MAX_TRIALS = 20;
        let currentLetter = null;
        let responded = false;
        let score = 0;
        let errors = 0;

        // P = Go (80%), R = No-Go (20%)

        function start() {
            active = true;
            nextTrial();
        }

        function nextTrial() {
            if (trials >= MAX_TRIALS) {
                finishSession();
                return;
            }
            trials++;
            responded = false;

            // Logic: 0.8 chance for P (Go), 0.2 chance for R (NoGo)
            const isGo = Math.random() < 0.8;
            currentLetter = isGo ? 'P' : 'R';

            const stim = document.getElementById('stimulus');
            stim.style.opacity = 0;

            setTimeout(() => {
                stim.innerText = currentLetter;
                stim.style.opacity = 1;

                // Show for 500ms
                setTimeout(() => {
                    stim.style.opacity = 0;
                    // Wait 500ms before next
                    setTimeout(() => {
                        // Check omission error if it was a Go trial and no response
                        if (currentLetter === 'P' && !responded) {
                            errors++;
                            flashFeedback("MISS");
                        }
                        nextTrial();
                    }, 500);
                }, 500); // 500ms stimulus duration
            }, 500 + Math.random() * 500); // jitter
        }

        function handlePress() {
            if (!active) {
                if (trials === 0) start();
                return;
            }
            if (responded || document.getElementById('stimulus').style.opacity == 0) return; // Too late or double press

            responded = true;
            document.getElementById('stimulus').style.opacity = 0; // Immediate feedback visually

            if (currentLetter === 'P') {
                // Correct Hit
                score++;
                if (window.Kernel) window.Kernel.audio.playTone(600, 'sine', 0.1);
            } else {
                // Commission Error (Pressed on R)
                errors++;
                flashFeedback("WRONG");
                if (window.Kernel) window.Kernel.audio.playTone(200, 'sawtooth', 0.2);
            }
        }

        function flashFeedback(text) {
            const f = document.getElementById('feedback');
            f.innerText = text;
            f.style.opacity = 1;
            setTimeout(() => f.style.opacity = 0, 300);
        }

        // Spacebar support
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') handlePress();
        });

        function finishSession() {
            active = false;
            document.getElementById('stimulus').innerText = "DONE";
            document.getElementById('stimulus').style.opacity = 1;

            if (window.DataManager) {
                window.DataManager.submitResult({
                    title: decodeURIComponent(TITLE),
                    domain: 'ATTENTION',
                    score: Math.max(0, 100 - (errors * 10)),
                    metrics: { trials: MAX_TRIALS, errors: errors }
                });
            }

            if (confirm(`Session Complete.\nErrors: ${errors}\n\nView Analytics?`)) {
                window.location.href = 'report_global.html';
            } else {
                window.history.back();
            }
        }

        // Initial State
        document.getElementById('stimulus').innerText = "START";

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.22_2"></script>
</body>

</html>
