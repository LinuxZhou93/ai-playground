    <script>
        // --- 1. KERNEL INTEGRATION ---
        const kernel = window.Kernel; // From kernel.js
        const playHover = () => kernel ? kernel.audio.playTone(800, 'triangle', 0.05) : null;
        const playClick = () => kernel ? kernel.audio.playTone(400, 'sine', 0.1) : null;

        // --- 2. THREE.JS BACKGROUND (Neural Starfield) ---
        const initBg = () => {
            const container = document.getElementById('bg-canvas');
            const scene = new THREE.Scene();
            // Default deep space fog
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setClearColor(0x000000, 0); // FORCE TRANSPARENT
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // STARS (Particles)
            const isMobile = window.innerWidth < 768;
            const particleCount = isMobile ? 600 : 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];

            const color = new THREE.Color();
            const range = 40;

            for (let i = 0; i < particleCount; i++) {
                const x = (Math.random() - 0.5) * range;
                const y = (Math.random() - 0.5) * range;
                const z = (Math.random() - 0.5) * range;
                positions.push(x, y, z);

                const vx = (x / range) + 0.5;
                const vy = (y / range) + 0.5;
                const vz = (z / range) + 0.5;

                color.setRGB(0.1 + vx * 0.5, 0.2 + vy * 0.5, 0.5 + vz);
                colors.push(color.r, color.g, color.b);
            }

            const pGeometry = new THREE.BufferGeometry();
            pGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            pGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const pMaterial = new THREE.PointsMaterial({
                size: isMobile ? 0.25 : 0.15, // Slightly larger on mobile to compensate for fewer count
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(pGeometry, pMaterial);
            scene.add(particles);

            // SYNAPSES (Lines)
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0x3b82f6,
                transparent: true,
                opacity: isMobile ? 0.1 : 0.15,
                blending: THREE.AdditiveBlending
            });

            // Pre-calculate connections
            const linePositions = [];
            const connectDistance = isMobile ? 3.0 : 4.5; // Stricter distance for fewer lines

            for (let i = 0; i < particleCount; i++) {
                for (let j = i + 1; j < particleCount; j++) {
                    const dx = positions[i * 3] - positions[j * 3];
                    const dy = positions[i * 3 + 1] - positions[j * 3 + 1];
                    const dz = positions[i * 3 + 2] - positions[j * 3 + 2];
                    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

                    if (dist < connectDistance) {
                        linePositions.push(
                            positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2],
                            positions[j * 3], positions[j * 3 + 1], positions[j * 3 + 2]
                        );
                    }
                }
            }

            const lineGeometry = new THREE.BufferGeometry();
            lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
            const lines = new THREE.LineSegments(lineGeometry, lineMaterial);
            scene.add(lines);

            camera.position.z = 15;

            // ANIMATION LOOP
            let mouseX = 0;
            let mouseY = 0;
            let targetRotationX = 0;
            let targetRotationY = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX - window.innerWidth / 2) * 0.001;
                mouseY = (e.clientY - window.innerHeight / 2) * 0.001;
            });

            function animate() {
                requestAnimationFrame(animate);

                const time = Date.now() * 0.0005;
                particles.rotation.y = time * 0.2;
                lines.rotation.y = time * 0.2;

                // Smooth Parallax
                targetRotationX += (mouseY - targetRotationX) * 0.05;
                targetRotationY += (mouseX - targetRotationY) * 0.05;

                particles.rotation.x = targetRotationX;
                particles.rotation.y += targetRotationY;
                lines.rotation.x = targetRotationX;
                lines.rotation.y = particles.rotation.y;

                renderer.render(scene, camera);
            }

                // Hide legacy CSS BG if present
                const juniorBg = document.getElementById('junior-bg');
                if (juniorBg) juniorBg.style.display = 'none';

            } else {
                // RESET TO NORMAL Mode (Deep Space)
                document.body.classList.remove('mode-junior');
                btn.classList.remove('bg-cyan-950', 'text-cyan-400', 'border-cyan-500/50');
                // btn.classList.add('bg-amber-400', 'text-black', 'border-transparent'); // No, revert to ghost
                btn.innerHTML = `<span>🎒</span> ${modeText}`;

                // Update 3D Theme for Researchers (Deep Black)
                if (window.updateBgTheme) window.updateBgTheme(false);
            }
            // Re-render
            filter('ALL');
        };

        // Hacker Trigger
        window.addEventListener('keydown', (e) => {
            if (e.key === 'h') {
                toggleHacker();
            }
        });

        function toggleHacker() {
            window.isHacker = !window.isHacker;
            if (window.isHacker) {
                document.body.classList.add('font-mono');
                // Inject classified
                const hackedTasks = CLASSIFIED.map(t => ({ ...t, baseUrl: '#', params: '', desc: 'RESTRICTED ACCESS', isNew: true, color: 'rose', icon: 'shield-alert' }));
                renderGrid([...hackedTasks, ...ALL_TASKS]);
                if (window.Kernel) window.Kernel.audio.playTone(100, 'sawtooth', 0.5);
                alert('// ROOT ACCESS GRANTED');
            } else {
                document.body.classList.remove('font-mono');
                renderGrid(ALL_TASKS);
            }
        }

        // Filter Logic
        window.filter = (type) => {
            activeDomain = type; // Update active domain
            // Update active state in nav
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            // Find the clicked nav-link and add 'active' class
            const clickedLink = document.querySelector(`.nav-link[onclick*="filter('${type}')"]`);
            if (clickedLink) {
                clickedLink.classList.add('active');
            }

            // Clear search when filtering
            const s = document.getElementById('search-input');
            if (s) s.value = '';

            if (type === 'ALL') renderGrid(ALL_TASKS);
            else if (type === 'NEW') renderGrid(ALL_TASKS.filter(t => t.isNew)); // Basic NEW filter assumption
            else renderGrid(ALL_TASKS.filter(t => t.domain === type));
        };

        // ENHANCED SEARCH LOGIC
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = (e.target.value || '').toLowerCase().trim();

            if (!term) {
                // Restore current filter view
                filter(activeDomain);
                return;
            }

            const res = ALL_TASKS.filter(t => {
                const n = (t.name || '').toLowerCase();
                const d = (t.desc || '').toLowerCase();
                const nc = (t.name_cn || '').toLowerCase();
                return n.includes(term) || d.includes(term) || nc.includes(term);
            });
            renderGrid(res);
        });

        // INIT
        window.addEventListener('DOMContentLoaded', () => {
            initHub();
            setLanguage('CN'); // Force Chinese on load
        });
    </script>
</body>

</html>
