<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Logic Matrices</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="kernel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/data_manager.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .matrix-grid {
            display: grid;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tile {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .shape {
            width: 60%;
            height: 60%;
            transition: all 0.3s;
        }

        .option-tile {
            width: 80px;
            height: 80px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .option-tile:hover {
            background: #222;
            border-color: #666;
            transform: translateY(-5px);
        }

        .option-tile:active {
            transform: scale(0.95);
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="flex flex-col h-screen p-8">

    <header class="flex justify-between items-center mb-4">
        <div class="flex items-center gap-4">
            <button onclick="history.back()" class="p-2 rounded-full hover:bg-white/10"><i
                    data-lucide="arrow-left"></i></button>
            <div>
                <h1 class="text-2xl font-bold">Logic Matrices</h1>
                <p class="text-xs text-gray-500 font-mono">FLUID INTELLIGENCE • PATTERN COMPLETION</p>
            </div>
        </div>
        <div class="text-right">
            <div class="text-xl text-blue-400 font-bold" id="level-display">LVL 1</div>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center gap-10">

        <!-- Problem Area -->
        <div class="matrix-grid" id="problem-grid"
            style="grid-template-columns: repeat(2, 100px); grid-template-rows: repeat(2, 100px);">
            <!-- Inject JS -->
        </div>

        <!-- Options -->
        <div class="flex gap-4" id="options-container">
            <!-- Inject JS -->
        </div>

    </main>

    <script>
        lucide.createIcons();

        const urlParams = new URLSearchParams(window.location.search);
        const DIM = parseInt(urlParams.get('dim')) || 2;
        const TITLE = urlParams.get('title') || `Logic Matrices (${DIM}x${DIM})`;

        // Update Title
        document.querySelector('h1').innerText = decodeURIComponent(TITLE);

        let level = 1;

        const SHAPES = [
            (color) => `<div class="shape" style="background:${color}; border-radius: 50%"></div>`,
            (color) => `<div class="shape" style="background:${color};"></div>`,
            (color) => `<div class="shape" style="background:${color}; clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div>`
        ];

        const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#eab308'];

        function init() {
            const grid = document.getElementById('problem-grid');
            grid.style.gridTemplateColumns = `repeat(${DIM}, 100px)`;
            grid.style.gridTemplateRows = `repeat(${DIM}, 100px)`;
            generateProblem();
        }

        function generateProblem() {
            if (level > 10) {
                endGame();
                return;
            }

            const grid = document.getElementById('problem-grid');
            const opts = document.getElementById('options-container');
            grid.innerHTML = '';
            opts.innerHTML = '';

            // Logic: Rotate Colors
            const baseShapeIdx = Math.floor(Math.random() * SHAPES.length);
            const startColorIdx = Math.floor(Math.random() * COLORS.length);

            let correctHTML = '';

            for (let r = 0; r < DIM; r++) {
                for (let c = 0; c < DIM; c++) {
                    const isTarget = (r === DIM - 1 && c === DIM - 1);
                    const color = COLORS[(startColorIdx + r + c) % COLORS.length];
                    const shape = SHAPES[baseShapeIdx](color);

                    const el = document.createElement('div');
                    el.className = 'tile';

                    if (isTarget) {
                        el.innerText = '?';
                        el.style.fontSize = '2rem';
                        el.style.fontWeight = 'bold';
                        correctHTML = shape;
                    } else {
                        el.innerHTML = shape;
                    }
                    grid.appendChild(el);
                }
            }

            // Options
            let options = [correctHTML];
            while (options.length < 4) {
                const rndC = COLORS[Math.floor(Math.random() * COLORS.length)];
                const rndS = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                options.push(rndS(rndC));
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'tile option-tile';
                btn.innerHTML = opt;
                btn.onclick = () => {
                    if (opt === correctHTML) {
                        level++;
                        document.getElementById('level-display').innerText = 'LVL ' + level;
                        generateProblem();
                    } else {
                        btn.style.borderColor = 'red';
                    }
                };
                opts.appendChild(btn);
            });
        }

        function endGame() {
            // Data Submit
            const finalScore = (level - 1) * 100;
            if (window.DataManager) {
                window.DataManager.submitResult({
                    title: decodeURIComponent(TITLE),
                    domain: 'LOGIC',
                    score: finalScore,
                    metrics: { level: level - 1, dim: DIM }
                });
            }

            if (confirm(`Logic Assessment Complete.\nScore: ${finalScore}\n\nView Analytics?`)) {
                window.location.href = 'report_global.html';
            } else {
                location.reload();
            }
        }

        init();
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.24_1"></script>
</body>

</html>
