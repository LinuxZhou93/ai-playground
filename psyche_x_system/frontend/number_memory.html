<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Number Memory</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="kernel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/data_manager.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .progress-bar {
            height: 4px;
            background: white;
            transition: width 0.1s linear;
            width: 0%;
        }

        input {
            background: transparent;
            border-bottom: 2px solid white;
            color: white;
            font-size: 2rem;
            text-align: center;
            outline: none;
            width: 300px;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="flex flex-col items-center justify-center">

    <div class="fixed top-8 left-8 flex gap-4">
        <button onclick="history.back()" class="p-3 bg-white/10 rounded-full hover:bg-white/20"><i
                data-lucide="arrow-left"></i></button>
        <div>
            <h1 class="text-xl font-bold" id="title-text">Number Memory</h1>
            <p class="text-xs text-gray-500">LEVEL <span id="level">1</span></p>
        </div>
    </div>

    <!-- Phase 1: Memorize -->
    <div id="phase-memo" class="flex flex-col items-center transition-opacity duration-300">
        <div class="text-8xl font-black mb-8" id="number-display">...</div>
        <div class="w-64 bg-gray-800 rounded-full h-1 overflow-hidden">
            <div id="timer-bar" class="h-full bg-blue-500" style="width: 100%"></div>
        </div>
    </div>

    <!-- Phase 2: Input -->
    <div id="phase-input" class="hidden flex flex-col items-center">
        <div class="text-xl text-gray-400 mb-4">What was the number?</div>
        <input type="number" id="user-input" autocomplete="off">
        <button onclick="check()" class="mt-8 px-8 py-2 bg-blue-600 rounded hover:bg-blue-500 font-bold">SUBMIT</button>
    </div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const TITLE = urlParams.get('title') || "Number Memory";
        document.getElementById('title-text').innerText = decodeURIComponent(TITLE);

        let level = 1;
        let currentNumber = "";

        function startLevel() {
            document.getElementById('level').innerText = level;
            document.getElementById('phase-input').classList.add('hidden');
            document.getElementById('phase-memo').classList.remove('hidden');

            // Gen Number
            currentNumber = "";
            for (let i = 0; i < level; i++) {
                currentNumber += Math.floor(Math.random() * 10);
            }
            document.getElementById('number-display').innerText = currentNumber;

            // Timer (Level * 1000ms roughly, or standardized fixed time + small scale)
            const time = 1000 + (level * 500);
            const bar = document.getElementById('timer-bar');

            bar.style.transition = `width ${time}ms linear`;
            bar.style.width = '100%';

            // Reset width logic hack for animation restart
            requestAnimationFrame(() => {
                bar.style.width = '100%';
                requestAnimationFrame(() => {
                    bar.style.width = '0%';
                });
            });

            setTimeout(() => {
                document.getElementById('phase-memo').classList.add('hidden');
                document.getElementById('phase-input').classList.remove('hidden');
                document.getElementById('user-input').value = '';
                document.getElementById('user-input').focus();
            }, time);
        }

        function check() {
            const input = document.getElementById('user-input').value;
            if (input === currentNumber) {
                level++;
                startLevel();
            } else {
                finishSession(currentNumber, input);
            }
        }

        // Enter key support
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') check();
        });

        function finishSession(ans, usr) {
            if (window.DataManager) {
                window.DataManager.submitResult({
                    title: decodeURIComponent(TITLE),
                    domain: 'MEMORY', // Numeric
                    score: (level * 10),
                    metrics: { level: level }
                });
            }

            if (confirm(`Failed at Level ${level}.\nNumber: ${ans}\nYou said: ${usr}\n\nView Analytics?`)) {
                window.location.href = 'report_global.html';
            } else {
                level = 1;
                startLevel();
            }
        }

        setTimeout(startLevel, 1000);

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.24_3"></script>
</body>

</html>
