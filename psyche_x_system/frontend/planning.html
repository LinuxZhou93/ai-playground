<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Spatial Planning</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="kernel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/data_manager.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Game Container */
        .game-stage {
            display: flex;
            gap: 4rem;
            align-items: flex-end;
            justify-content: center;
            height: 400px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 300px;
        }

        .panel-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #64748b;
            margin-bottom: 2rem;
            font-weight: bold;
        }

        /* Pillars Container */
        .pillars {
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            height: 200px;
            /* Max height for stack */
            position: relative;
        }

        /* Individual Pillar/Rod */
        .rod {
            width: 60px;
            height: 100%;
            display: flex;
            flex-direction: column-reverse;
            /* Stack from bottom */
            align-items: center;
            justify-content: flex-start;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .rod:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .rod.selected {
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        /* The Block */
        .block {
            width: 50px;
            height: 30px;
            border-radius: 6px;
            margin-bottom: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        /* Block Colors (Neon) */
        .block-1 {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .block-2 {
            background: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        .block-3 {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .block.floating {
            transform: translateY(-20px) scale(1.1);
            z-index: 10;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="flex flex-col h-screen items-center justify-center bg-gray-950">

    <!-- Header -->
    <div class="fixed top-8 left-8 flex gap-4 z-50">
        <button onclick="history.back()" class="p-3 bg-white/10 rounded-full hover:bg-white/20 backdrop-blur">
            <i data-lucide="arrow-left"></i>
        </button>
        <div>
            <h1 class="text-xl font-bold text-white">Recursive Path Planning</h1>
            <p class="text-xs text-blue-400 font-mono tracking-wider">EXECUTIVE TRAJECTORY OPTIMIZATION</p>
        </div>
    </div>

    <!-- Stats -->
    <div class="fixed top-8 right-8 text-right font-mono">
        <div class="text-4xl font-bold text-white" id="level-disp">LVL 1</div>
        <div class="text-sm text-gray-500">MOVES: <span id="move-disp" class="text-white">0</span></div>
    </div>

    <!-- Main Game Stage -->
    <div class="game-stage">
        <!-- Target (Reference) -->
        <div class="panel">
            <div class="panel-title">Target Configuration</div>
            <div class="pillars" id="target-ui">
                <!-- Generated by JS -->
            </div>
        </div>

        <!-- Interactive (Player) -->
        <div class="panel" style="border-color: rgba(59, 130, 246, 0.3);">
            <div class="panel-title text-blue-400">Your System</div>
            <div class="pillars" id="player-ui">
                <!-- Generated by JS -->
            </div>
        </div>
    </div>

    <!-- Instructions -->
    <div class="fixed bottom-12 text-center text-gray-400 text-sm font-mono animate-pulse" id="hint-text">
        Rearrange your blocks to match the target. <br>
        Click a column to pick up, click another to drop.
    </div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const TITLE = urlParams.get('title') || "Spatial Planning";

        // Logic
        // We have 3 rods.
        // We have N blocks (colors 1, 2, 3...).
        // State is represented as array of arrays: [[1,2], [], [3]] means rod 0 has 1(bottom),2(top).

        const COLORS = 3; // Max colors/blocks
        const RODS = 3;
        const MAX_HEIGHT = 4;

        let level = 1;
        let moves = 0;
        let minMoves = 0; // Ideal solution steps (hard to calc perfectly on fly, we approximate difficulty)

        let playerState = [];
        let targetState = [];
        let selectedRod = -1; // -1 means nothing selected

        // --- 1. CORE LOGIC ---

        function initGame() {
            moves = 0;
            selectedRod = -1;
            updateUI();

            // Difficulty:
            // Level 1: 2 blocks, 3 moves away
            // Level 2: 3 blocks, random
            // ...

            const blockCount = Math.min(3 + Math.floor(level / 2), 4); // Max 4 blocks eventually

            // 1. Generate a valid Random State (Target)
            targetState = generateRandomState(blockCount);

            // 2. Generate Player State by shuffling Target State
            // We simulate random moves backwards from target to ensure solvability?
            // Actually, any state is reachable from any state in Tower of London if height enough.
            // Let's just generate another random state.
            do {
                playerState = generateRandomState(blockCount);
            } while (JSON.stringify(playerState) === JSON.stringify(targetState));

            render(document.getElementById('target-ui'), targetState, false);
            render(document.getElementById('player-ui'), playerState, true);
            updateStats();
        }

        function generateRandomState(numBlocks) {
            // Blocks: 1, 2, 3...
            // Randomly distribute them into RODS piles
            // But order matters (1 on top of 2 is diff from 2 on top of 1? No, block IDs are unique colors)

            // Let's say we have blocks [1, 2, 3].
            // We place them one by one into random rods, checking height limit.

            let state = Array.from({ length: RODS }, () => []);
            let availableBlocks = [];
            for (let i = 1; i <= numBlocks; i++) availableBlocks.push(i);

            // Shuffle blocks? No, block 1 is Red, 2 is Blue.
            // We want random positions.

            // Actually, "Tower of London" usually has specific balls.
            // Let's randomize which rod gets which block, and the vertical order.

            // Shuffle the insertion order
            availableBlocks.sort(() => Math.random() - 0.5);

            availableBlocks.forEach(b => {
                // Pick a random rod that isn't full
                let r;
                do { r = Math.floor(Math.random() * RODS); }
                while (state[r].length >= MAX_HEIGHT);
                state[r].push(b);
            });

            return state;
        }

        // --- 2. RENDER ---

        function render(container, state, isInteractive) {
            container.innerHTML = '';
            state.forEach((rodStack, rodIdx) => {
                const rodEl = document.createElement('div');
                rodEl.className = 'rod';
                if (isInteractive) {
                    rodEl.onclick = () => handleRodClick(rodIdx);
                    if (selectedRod === rodIdx) rodEl.classList.add('selected');
                }

                // Render Blocks
                rodStack.forEach((blockId, idx) => {
                    const blockEl = document.createElement('div');
                    blockEl.className = `block block-${blockId}`;
                    // If this is top block of selected rod, float it
                    if (isInteractive && selectedRod === rodIdx && idx === rodStack.length - 1) {
                        blockEl.classList.add('floating');
                    }
                    rodEl.appendChild(blockEl);
                });

                container.appendChild(rodEl);
            });
        }

        // --- 3. INTERACTION ---

        function handleRodClick(rodIdx) {
            if (selectedRod === -1) {
                // SELECT: Can only select if rod has blocks
                if (playerState[rodIdx].length > 0) {
                    selectedRod = rodIdx;
                    playSound('pop');
                }
            } else {
                // MOVE or DESELECT
                if (selectedRod === rodIdx) {
                    // Deselect
                    selectedRod = -1;
                } else {
                    // Try to move to new rod
                    if (playerState[rodIdx].length < MAX_HEIGHT) {
                        // VALID MOVE
                        const block = playerState[selectedRod].pop();
                        playerState[rodIdx].push(block);
                        moves++;
                        selectedRod = -1;
                        playSound('woosh');
                        checkWin();
                    } else {
                        // Invalid (Full)
                        playSound('error');
                    }
                }
            }
            // Re-render
            render(document.getElementById('player-ui'), playerState, true);
            updateStats();
        }

        // --- 4. ENGINE ---

        function checkWin() {
            // Compare Deeply
            const isMatch = JSON.stringify(playerState) === JSON.stringify(targetState);
            if (isMatch) {
                playSound('success');

                // Track Progress
                const finalScore = Math.max(0, 1000 - (moves * 50));

                if (window.DataManager) {
                    window.DataManager.submitResult({
                        title: decodeURIComponent(TITLE),
                        domain: 'LOGIC',
                        score: finalScore,
                        metrics: { level: level, moves: moves }
                    });
                }

                if (level >= 3) { // Show debrief after 3 levels of planning
                    if (window.Kernel && window.Kernel.ui) {
                        window.Kernel.ui.showMissionDebrief({
                            title: "SPATIAL PLANNING",
                            score: finalScore * level,
                            xp: 150,
                            accuracy: Math.round(100 / (moves / 5)), // Mock accuracy
                            rank: window.DataManager.getRank(),
                            highscore: 5000
                        });
                        return;
                    }
                }

                setTimeout(() => {
                    alert(`Level ${level} Complete!\nMoves: ${moves}\n\nProceeding to next sequence.`);
                    level++;
                    initGame();
                }, 100);
            }
        }

        function updateStats() {
            document.getElementById('level-disp').innerText = `LVL ${level}`;
            document.getElementById('move-disp').innerText = moves;
        }

        function updateUI() {
            // Clear classes if needed   
        }

        function playSound(type) {
            if (window.Kernel) {
                if (type === 'pop') window.Kernel.audio.playTone(600, 'sine', 0.1);
                if (type === 'woosh') window.Kernel.audio.playTone(400, 'triangle', 0.1);
                if (type === 'success') window.Kernel.audio.playTone(800, 'square', 0.2);
                if (type === 'error') window.Kernel.audio.playTone(150, 'sawtooth', 0.2);
            }
        }

        // INIT
        initGame();

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.24_3"></script>
</body>

</html>
