<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Research Profile</title>

    <!-- WORLD CLASS STACK -->
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>

    <script src="kernel.js"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .badge-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
        }

        .badge-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        .badge-card.locked {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="min-h-screen">

    <div id="bg-canvas"></div>

    <div class="relative z-10 w-full min-h-screen flex flex-col">

        <!-- Navbar -->
        <nav class="h-20 px-8 flex items-center justify-between glass-panel sticky top-0 z-50 border-x-0 border-t-0">
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.location.href='hub.html'">
                <div class="p-2 bg-blue-600/20 rounded-lg text-blue-400">
                    <i data-lucide="arrow-left"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight">Psyche-X <span
                            class="text-blue-500 text-sm align-super">TM</span></h1>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="hidden md:flex gap-2">
                    <button
                        class="bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2"
                        onclick="setLanguage('EN')">EN</button>
                    <button
                        class="bg-white/5 hover:bg-white/10 px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2"
                        onclick="setLanguage('CN')">CN</button>
                </div>
                <button onclick="handleLogout()"
                    class="border border-red-500/30 text-red-400 hover:bg-red-500/10 px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> LOGOUT
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-1 max-w-6xl w-full mx-auto p-8">

            <!-- Hero Profile Section -->
            <div class="glass-panel rounded-3xl p-12 mb-12 relative overflow-hidden group">
                <div
                    class="absolute top-0 right-0 w-96 h-96 bg-blue-600/20 blur-[150px] rounded-full -translate-y-1/2 translate-x-1/2">
                </div>

                <div class="relative z-10 flex flex-col md:flex-row items-center gap-12">
                    <!-- Avatar / Rank Orb -->
                    <div class="relative group cursor-pointer" onclick="alert('Avatar editing coming soon')">
                        <div
                            class="w-40 h-40 rounded-full bg-black border-4 border-blue-500/30 flex items-center justify-center relative z-20 shadow-2xl shadow-blue-500/20 overflow-hidden">
                            <i data-lucide="brain-circuit"
                                class="w-20 h-20 text-blue-400 group-hover:scale-110 transition duration-500"></i>
                        </div>
                        <div class="absolute bottom-0 right-0 z-30 bg-blue-600 p-2 rounded-full border-2 border-black">
                            <i data-lucide="edit-2" class="w-4 h-4 text-white"></i>
                        </div>
                        <!-- Orbit Rings using CSS borders -->
                        <div
                            class="absolute inset-0 rounded-full border border-dashed border-white/20 scale-125 animate-[spin_10s_linear_infinite]">
                        </div>
                        <div
                            class="absolute inset-0 rounded-full border border-dotted border-blue-500/30 scale-150 animate-[spin_20s_linear_infinite_reverse]">
                        </div>
                    </div>

                    <div class="flex-1 text-center md:text-left">
                        <div class="inline-block px-3 py-1 rounded bg-blue-500/20 text-blue-300 text-xs font-bold tracking-widest mb-4"
                            data-i18n="profile.level">CURRENT LEVEL</div>

                        <div id="user-identity" class="mb-4">
                            <!-- Injected JS -->
                        </div>

                        <h1 class="text-5xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-white to-blue-200"
                            id="rank-name-hero">LOADING...</h1>
                        <p class="text-gray-400 mb-6 max-w-lg" data-i18n="profile.desc">Your neural profile suggests
                            significant potential for cognitive expansion. Continue training to unlock advanced
                            protocols.</p>

                        <!-- XP Bar -->
                        <div class="w-full max-w-md bg-white/10 h-4 rounded-full overflow-hidden mx-auto md:mx-0">
                            <div class="bg-gradient-to-r from-blue-600 to-purple-600 h-full w-0 transition-all duration-1000"
                                id="xp-bar-hero"></div>
                        </div>
                        <div class="flex justify-between max-w-md mx-auto md:mx-0 mt-2 text-xs font-mono text-gray-500">
                            <span id="current-xp">0 XP</span>
                            <span id="next-rank-xp">1000 XP</span>
                        </div>
                    </div>

                    <!-- Stats -->
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-white/5 p-4 rounded-xl border border-white/10 text-center w-32">
                            <div class="text-3xl font-bold stat-value text-blue-400" id="stat-sessions">0</div>
                            <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1"
                                data-i18n="stats.sessions">Sessions</div>
                        </div>
                        <div class="bg-white/5 p-4 rounded-xl border border-white/10 text-center w-32">
                            <div class="text-3xl font-bold stat-value text-green-400" id="stat-badges">0</div>
                            <div class="text-[10px] text-gray-400 uppercase tracking-wider mt-1"
                                data-i18n="stats.badges">Badges</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Achievements Grid -->
            <div class="flex items-center gap-4 mb-8">
                <div class="p-2 bg-purple-500/20 rounded-lg text-purple-400"><i data-lucide="award"></i></div>
                <h2 class="text-2xl font-bold" data-i18n="section.milestones">Neural Milestones</h2>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="badge-grid">
                <!-- JS Populated -->
            </div>

        </main>

    </div>

    <!-- SCRIPTS -->
    <script src="js/gamification.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/auth_manager.js"></script>
    <script src="js/data_manager.js"></script>

    <script>
        // --- 1. LOCALIZATION ---
        const I18N = {
            EN: {
                "profile.level": "CURRENT DESIGNATION",
                "profile.desc": "Your neural profile suggests significant potential for cognitive expansion.",
                "stats.sessions": "SESSIONS",
                "stats.badges": "BADGES",
                "section.milestones": "Neural Milestones",
                "badge.locked": "LOCKED",
                // Badge Names
                "speed_demon": "Speed Demon",
                "sniper": "Sniper",
                "memory_palace": "Memory Palace",
                "zen_master": "Zen Master",
                "typing_god": "Typing God",
                "hawk_eye": "Hawk Eye",
                "iron_mind": "Iron Mind",
                // Badge Desc
                "desc.speed_demon": "Reaction Time < 200ms",
                "desc.sniper": "Aim Trainer Score > 1000",
                "desc.memory_palace": "Digit Span Level 10+",
                "desc.zen_master": "Breath Hold > 30s",
                "desc.typing_god": "WPM > 100",
                "desc.hawk_eye": "Matrix Level 10+",
                "desc.iron_mind": "Dual N-Back Level 4+"
            },
            CN: {
                "profile.level": "当前称号",
                "profile.desc": "您的神经档案显示出巨大的认知扩展潜力。继续训练以解锁高级协议。",
                "stats.sessions": "训练场次",
                "stats.badges": "勋章数",
                "section.milestones": "神经里程碑",
                "badge.locked": "未解锁",
                // Badge Names
                "speed_demon": "极速恶魔",
                "sniper": "神射手",
                "memory_palace": "记忆宫殿",
                "zen_master": "禅宗大师",
                "typing_god": "打字之神",
                "hawk_eye": "鹰眼",
                "iron_mind": "钢铁意志",
                // Badge Desc
                "desc.speed_demon": "反应时间 < 200ms",
                "desc.sniper": "瞄准得分 > 1000",
                "desc.memory_palace": "数字记忆等级 10+",
                "desc.zen_master": "屏息超过 30秒",
                "desc.typing_god": "打字速度 > 100 WPM",
                "desc.hawk_eye": "矩阵等级 10+",
                "desc.iron_mind": "双重 N-Back 等级 4+"
            }
        };

        window.currentLang = 'EN';

        window.setLanguage = (lang) => {
            window.currentLang = lang;
            const dict = I18N[lang];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });

            renderBadges();
        };

        // --- 2. RENDER LOGIC ---
        async function initProfile() {
             // 1. Check Auth (Strict Mode)
            const session = window.AuthManager ? window.AuthManager.getSession() : null;
            if (!session) {
                // If not logged in, redirect to login
                window.location.href = 'login.html';
                return;
            }

            // 2. Fetch User Profile
            let profile = {};
            if (window.DataClient) {
                try {
                    profile = await window.DataClient.getProfile() || {};
                    // Also sync gaming data
                    await window.DataManager.sync(); 
                } catch(e) { console.error(e); }
            }
            
            // Render Identity
            const identityEl = document.getElementById('user-identity');
            if (identityEl) {
                const displayName = profile.username || profile.nickname || session.email.split('@')[0];
                identityEl.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-2xl font-mono text-blue-300 font-bold tracking-tight uppercase">${displayName}</span>
                        <span class="text-xs text-gray-500 font-mono mt-1">${session.email}</span>
                        <div class="mt-2 flex gap-2">
                            <span class="px-2 py-0.5 rounded bg-blue-900/40 border border-blue-500/30 text-[10px] text-blue-400">ID: ${session.id.slice(0,8)}</span>
                            <span class="px-2 py-0.5 rounded bg-green-900/40 border border-green-500/30 text-[10px] text-green-400">FREE TIER</span>
                        </div>
                    </div>
                `;
            }

            // 3. Load Stats
            const xp = DataManager.getXP();
            const rank = DataManager.getRank(); 
            const history = DataManager.getHistory();
            const unlockedBadges = DataManager.getBadges();
            
            // Render Hero Stats
            document.getElementById('rank-name-hero').innerText = rank.current.name.toUpperCase();
            document.getElementById('xp-bar-hero').style.width = `${rank.progress}%`;
            document.getElementById('current-xp').innerText = `${xp} XP`;
            document.getElementById('next-rank-xp').innerText = rank.next ? `${rank.next.minXP} XP` : 'MAX';

            document.getElementById('stat-sessions').innerText = history.length;
            document.getElementById('stat-badges').innerText = unlockedBadges.length;

            renderBadges();

            // Auto-detect lang
            const urlLang = new URLSearchParams(window.location.search).get('lang');
            if (urlLang) setLanguage(urlLang);
        }

        async function handleLogout() {
            if (window.AuthManager) {
                await window.AuthManager.logout();
                window.location.href = 'login.html';
            }
        }

        function renderBadges() {
            const unlockedBadges = DataManager.getBadges().map(b => b.id);
            const allBadges = Gamification.BADGES; // from gamification.js
            const grid = document.getElementById('badge-grid');
            grid.innerHTML = '';

            const dict = I18N[window.currentLang];

            allBadges.forEach(badge => {
                const isUnlocked = unlockedBadges.includes(badge.id);

                // Localized Text
                const name = dict[badge.id] || badge.name;
                const desc = dict['desc.' + badge.id] || badge.desc;

                const card = document.createElement('div');
                card.className = `badge-card rounded-xl p-6 relative group ${isUnlocked ? '' : 'locked'}`;
                card.setAttribute('data-tilt', '');
                card.setAttribute('data-tilt-max', '10');

                card.innerHTML = `
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 rounded-lg ${isUnlocked ? 'bg-gradient-to-br from-blue-500 to-indigo-600' : 'bg-white/5'} border border-white/10 flex items-center justify-center shadow-lg">
                            <i data-lucide="${badge.icon}" class="${isUnlocked ? 'text-white' : 'text-gray-500'} w-6 h-6"></i>
                        </div>
                        <div>
                             <h3 class="font-bold text-lg mb-1 ${isUnlocked ? 'text-white' : 'text-gray-500'}">${name}</h3>
                             <p class="text-xs ${isUnlocked ? 'text-blue-300' : 'text-gray-600'}">${desc}</p>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            if (window.VanillaTilt) VanillaTilt.init(document.querySelectorAll("[data-tilt]"));
            lucide.createIcons();
        }

        // --- 3. BACKGROUND ---
        // Simple Particle Mesh
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('bg-canvas').appendChild(renderer.domElement);

        const geo = new THREE.BufferGeometry();
        const pos = [];
        for (let i = 0; i < 1000; i++) {
            pos.push((Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 30);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        const mat = new THREE.PointsMaterial({ size: 0.03, color: 0x4f46e5 }); // Indigo
        const mesh = new THREE.Points(geo, mat);
        scene.add(mesh);
        camera.position.z = 10;

        function animate() {
            requestAnimationFrame(animate);
            mesh.rotation.y += 0.0005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // INIT
        window.onload = initProfile;

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js"></script>
</body>

</html>
