<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Global Analytics</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- SYSTEM CORE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/auth_manager.js"></script>
    <script src="js/data_manager.js"></script>
    <script src="js/gamification.js"></script>
    <script src="js/coach.js"></script>

    <style>
        body {
            background: #050505;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="p-8 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8 shrink-0">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='hub.html'"
                class="p-2 rounded-full hover:bg-white/10 transition group">
                <i data-lucide="arrow-left" class="group-hover:-translate-x-1 transition"></i>
            </button>
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Global Analytics</h1>
                <p class="text-xs text-gray-500 font-mono">DATA CENTER • ID: <span id="user-id">LOADING...</span></p>
            </div>
        </div>
        <div class="flex gap-4">
            <button onclick="exportPDF()"
                class="px-4 py-2 border border-white/20 rounded-lg hover:bg-white/5 flex items-center gap-2 text-sm transition text-gray-300">
                <i data-lucide="file-text"></i> PDF
            </button>
            <button onclick="window.DataClient.sync().then(()=>location.reload())"
                class="px-4 py-2 border border-blue-900/50 text-blue-400 rounded-lg hover:bg-blue-900/20 flex items-center gap-2 text-sm transition">
                <i data-lucide="refresh-cw"></i> Sync Cloud
            </button>
        </div>
    </header>

    <!-- Dashboard Grid -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 overflow-hidden">

        <!-- Left: Stats & Charts -->
        <div class="col-span-2 flex flex-col gap-6 h-full overflow-y-auto pr-2 pb-10">

            <!-- KPIs -->
            <div class="grid grid-cols-3 gap-4 shrink-0">
                <div class="glass-panel p-6">
                    <div class="text-gray-400 text-xs uppercase tracking-wider mb-1">Total Assessments</div>
                    <div class="text-4xl font-bold" id="total-count">0</div>
                </div>
                <div class="glass-panel p-6">
                    <div class="text-gray-400 text-xs uppercase tracking-wider mb-1">Global Avg Score</div>
                    <div class="text-4xl font-bold text-blue-400" id="avg-score">0</div>
                </div>
                <div class="glass-panel p-6">
                    <div class="text-gray-400 text-xs uppercase tracking-wider mb-1">Active Streak</div>
                    <div class="text-4xl font-bold text-green-400" id="streak-count">0 <span
                            class="text-sm text-gray-500 font-normal">Days</span></div>
                </div>
            </div>

            <!-- COACH INSIGHT -->
            <div
                class="glass-panel p-6 rounded-xl bg-gradient-to-br from-blue-900/10 to-purple-900/10 border-blue-500/20">
                <h3 class="text-blue-400 text-xs font-bold mb-2 flex items-center gap-2">
                    <i data-lucide="bot" class="w-4 h-4"></i> CORTEX AI COACH ANALYSIS
                </h3>
                <div class="text-xl font-light italic opacity-90 leading-relaxed" id="coach-insight">
                    "Connecting to neural database..."
                </div>
            </div>

            <!-- TREND CHART -->
            <div class="glass-panel p-6 flex-1 min-h-[300px]">
                <h3 class="text-gray-400 text-xs font-bold mb-4">PERFORMANCE TREND (LAST 20)</h3>
                <div class="h-full w-full">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- HISTORY TABLE -->
            <div class="glass-panel p-6">
                <h3 class="text-gray-400 text-xs font-bold mb-4">RECENT DATA LOGS</h3>
                <table class="w-full text-sm text-left text-gray-400">
                    <tbody id="history-body">
                        <!-- Injected -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right: Radar & Profile -->
        <div class="col-span-1 flex flex-col gap-6 h-full overflow-y-auto">

            <!-- RADAR CHART -->
            <div class="glass-panel p-6 aspect-square flex flex-col">
                <div class="mb-2 text-center text-gray-400 text-xs font-bold">COGNITIVE PROFILE</div>
                <div class="flex-1 relative">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <!-- BADGES -->
            <div class="glass-panel p-6 flex-1">
                <h3 class="text-gray-400 text-xs font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="award" class="w-4 h-4"></i> EARNED BADGES
                </h3>
                <div class="grid grid-cols-3 gap-3" id="badge-grid">
                    <!-- Injected -->
                </div>
            </div>

        </div>

    </main>

    <script>
        lucide.createIcons();

        // --- CHART CONFIG ---
        const CHART_COLORS = {
            blue: 'rgba(59, 130, 246, 0.5)',
            blueBorder: '#3b82f6',
            purple: 'rgba(147, 51, 234, 0.5)',
            grid: 'rgba(255, 255, 255, 0.05)'
        };

        let radarChart, trendChart;

        async function initDashboard() {
            // 1. User Info
            const session = window.AuthManager ? window.AuthManager.getSession() : null;
            document.getElementById('user-id').innerText = session ? (session.username || session.email).toUpperCase() : 'GUEST';

            // 2. Fetch Data (Hybrid Strategy: Cloud + Local Overlay)
            let cloudHistory = [];
            let localHistory = JSON.parse(localStorage.getItem('psyche_x_db_v1') || '[]');

            if (window.DataClient && window.DataClient.useCloud) {
                try {
                    cloudHistory = await window.DataClient.getHistory(); // Should return array
                    if (!Array.isArray(cloudHistory)) cloudHistory = [];
                } catch (e) {
                    console.error("Cloud fetch err", e);
                }
            }

            // Merge & Deduplicate
            // Strategy: Trust Cloud, append Local items that haven't been synced yet
            const combined = [...cloudHistory];
            localHistory.forEach(localItem => {
                // Check if this local item is already in cloud (match by ID or exact timestamp)
                const exists = cloudHistory.find(c => c.id === localItem.id || c.created_at === localItem.timestamp);
                if (!exists) {
                    // Mark as unsynced locally
                    localItem._offline = true;
                    combined.push(localItem);
                }
            });

            // Sort by date desc
            combined.sort((a, b) => new Date(b.timestamp || b.created_at || 0) - new Date(a.timestamp || a.created_at || 0));

            console.log(`[Analytics] Loaded ${combined.length} records (${cloudHistory.length} cloud, ${localHistory.length} local).`);

            // 3. Process Metrics
            updateKPIs(combined);
            renderRadar(combined);
            renderTrend(combined);
            renderHistoryTable(combined);
            updateBadges(combined);

            // 4. Coach & Tier Check
            const coach = window.Coach || new Coach();
            const profile = (await window.DataClient?.getProfile()) || {};
            const tier = profile.tier || 'FREE';

            const coachEl = document.getElementById('coach-insight');
            const coachParent = coachEl.parentElement;

            if (tier === 'FREE') {
                // LOCK IT
                coachEl.innerText = "Hidden Pro Insight...";
                coachEl.style.filter = "blur(6px)";
                coachParent.style.position = "relative";
                coachParent.style.overflow = "hidden";
                
                // Overlay
                const overlay = document.createElement('div');
                overlay.className = "absolute inset-0 flex flex-col items-center justify-center bg-black/40 z-10";
                overlay.innerHTML = `
                    <div class="text-xs font-bold text-white mb-2 uppercase tracking-widest">Premium Feature</div>
                    <button onclick="window.location.href='subscription.html'" class="px-4 py-2 bg-gradient-to-r from-blue-600 to-purple-600 text-white text-xs font-bold rounded-full hover:scale-105 transition shadow-lg border border-white/20">
                        UNLOCK AI COACH
                    </button>
                `;
                coachParent.appendChild(overlay);
            } else {
                // UNLOCKED
                try {
                    coachEl.innerText = `"${coach.getInsight(combined)}"`;
                } catch(e) { console.warn("Coach error", e); }
            }
        }

        function updateKPIs(history) {
            document.getElementById('total-count').innerText = history.length;

            if (history.length > 0) {
                const avg = Math.round(history.reduce((a, b) => a + (b.score || 0), 0) / history.length);
                document.getElementById('avg-score').innerText = avg;

                // Mock Streak Logic (Real logic needs dates)
                // document.getElementById('streak-count').innerText = calculateStreak(history);
            }
        }

        function calculateDomainScores(history) {
            const domains = {
                'MEMORY': { sum: 0, count: 0 },
                'ATTENTION': { sum: 0, count: 0 },
                'SPEED': { sum: 0, count: 0 },
                'FLEXIBILITY': { sum: 0, count: 0 },
                'LOGIC': { sum: 0, count: 0 }
            };

            history.forEach(h => {
                let d = (h.domain || 'MEMORY').toUpperCase();
                // Map domains if needed
                if (d === 'REACTION') d = 'SPEED';
                if (d === 'PERCEPTION') d = 'ATTENTION';

                if (domains[d]) {
                    domains[d].sum += (h.score || 0);
                    domains[d].count++;
                }
            });

            return Object.keys(domains).map(k => {
                return domains[k].count > 0 ? Math.round(domains[k].sum / domains[k].count) : 0;
            }); // Returns array [mem, att, spd, flex, log]
        }

        function renderRadar(history) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            const data = calculateDomainScores(history);

            if (radarChart) radarChart.destroy();

            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['Memory', 'Attention', 'Speed', 'Flexibility', 'Logic'],
                    datasets: [{
                        label: 'Current Profile',
                        data: data,
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: '#60a5fa',
                        pointBackgroundColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: CHART_COLORS.grid },
                            grid: { color: CHART_COLORS.grid },
                            pointLabels: { color: '#9ca3af', font: { size: 10 } },
                            ticks: { display: false, backdropColor: 'transparent' },
                            suggestedMin: 0,
                            suggestedMax: 100
                        }
                    },
                    plugins: { legend: { display: false } },
                    maintainAspectRatio: false
                }
            });
        }

        function renderTrend(history) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            // Take last 20, reverse for chrono order
            const recent = history.slice(0, 20).reverse();

            const labels = recent.map(h => {
                const d = new Date(h.timestamp || h.created_at);
                return `${d.getMonth() + 1}/${d.getDate()}`;
            });
            const scores = recent.map(h => h.score);

            if (trendChart) trendChart.destroy();

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Score',
                        data: scores,
                        borderColor: '#22c55e',
                        backgroundColor: 'rgba(34, 197, 94, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    scales: {
                        y: {
                            grid: { color: CHART_COLORS.grid },
                            ticks: { color: '#6b7280' }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#6b7280' }
                        }
                    },
                    plugins: { legend: { display: false } },
                    maintainAspectRatio: false
                }
            });
        }

        function renderHistoryTable(history) {
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';

            history.slice(0, 10).forEach(h => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-800 hover:bg-white/5 transition';
                tr.innerHTML = `
                    <td class="py-3 pl-2 font-bold text-white">${h.title || h.game_title}</td>
                    <td class="py-3 text-xs opacity-70">${h.domain || h.game_domain}</td>
                    <td class="py-3 text-right font-mono text-blue-400 font-bold pr-2">${h.score}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateBadges(history) {
            const container = document.getElementById('badge-grid');
            container.innerHTML = '';

            // Simple Badge Logic for Demo
            // In real app, import BadgeManager
            const badges = [
                { name: 'Novice', icon: 'zap', earned: history.length > 0 },
                { name: 'Regular', icon: 'calendar', earned: history.length > 5 },
                { name: 'Pro', icon: 'trophy', earned: history.some(h => h.score > 80) },
                { name: 'Master', icon: 'crown', earned: history.some(h => h.score > 95) },
                { name: 'Scholar', icon: 'book', earned: history.length > 20 },
                { name: 'Elite', icon: 'star', earned: false } // Placeholder
            ];

            badges.forEach(b => {
                const el = document.createElement('div');
                el.className = `flex flex-col items-center justify-center p-3 rounded-lg border ${b.earned ? 'bg-blue-900/20 border-blue-500/50 text-blue-300' : 'bg-white/5 border-transparent text-gray-600 opacity-50'}`;
                el.innerHTML = `
                    <i data-lucide="${b.icon}" class="w-6 h-6 mb-2"></i>
                    <span class="text-[10px] uppercase font-bold">${b.name}</span>
                 `;
                container.appendChild(el);
            });
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', initDashboard);

        async function exportPDF() {
            const btn = document.querySelector('button[onclick="exportPDF()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Generating...';

            try {
                const { jsPDF } = window.jspdf;
                // Capture main instead of body to avoid layout issues with height
                const element = document.body;
                const canvas = await html2canvas(element, {
                    scale: 2,
                    backgroundColor: '#050505',
                    useCORS: true
                });

                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                const pdf = new jsPDF('l', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                const imgProps = pdf.getImageProperties(imgData);
                const ratio = pageWidth / imgProps.width;
                const imgHeight = imgProps.height * ratio;

                // If content is taller than A4, maybe cut or scale? For dashboard, scaling to fit width is usually fine unless very long.
                // If imgHeight > pageHeight, scale to fit height instead
                if (imgHeight > pageHeight) {
                    const ratioH = pageHeight / imgProps.height;
                    const imgWidth = imgProps.width * ratioH;
                    pdf.addImage(imgData, 'JPEG', (pageWidth - imgWidth) / 2, 0, imgWidth, pageHeight);
                } else {
                    pdf.addImage(imgData, 'JPEG', 0, 0, pageWidth, imgHeight);
                }

                pdf.save(`PsycheX_Report_${new Date().toISOString().slice(0, 10)}.pdf`);
            } catch (e) {
                console.error(e);
                alert("Export failed. See console.");
            } finally {
                btn.innerHTML = originalText;
                lucide.createIcons();
            }
        }
    </script>
