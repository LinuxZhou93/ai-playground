<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Visual Sequence</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="kernel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/data_manager.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            width: 360px;
            height: 360px;
        }

        .tile {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .tile:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }

        /* Flash Animation */
        .tile.flash {
            background: #fff;
            box-shadow: 0 0 30px #fff;
            border-color: #fff;
            transform: scale(1.05);
        }

        .tile.wrong {
            background: #ef4444;
            box-shadow: 0 0 30px #ef4444;
            animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .locked {
            pointer-events: none;
            cursor: default;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="flex flex-col h-screen items-center justify-center">

    <!-- Header -->
    <div class="fixed top-8 left-8 flex gap-4 z-50">
        <button onclick="history.back()" class="p-3 bg-white/10 rounded-full hover:bg-white/20 backdrop-blur">
            <i data-lucide="arrow-left"></i>
        </button>
        <div>
            <h1 class="text-xl font-bold text-white">Visual Sequence</h1>
            <p class="text-xs text-purple-400 font-mono tracking-wider">WORKING MEMORY PROTOCOL</p>
        </div>
    </div>

    <!-- Stats -->
    <div class="fixed top-8 right-8 text-right font-mono">
        <div class="text-4xl font-bold text-white" id="level-disp">LVL 1</div>
        <div class="text-sm text-gray-500">SCORE: <span id="score-disp" class="text-white">0</span></div>
    </div>

    <!-- Game -->
    <div class="grid-container" id="grid">
        <!-- JS Generates Tiles -->
    </div>

    <div class="fixed bottom-20 text-center font-mono text-gray-500 text-sm animate-pulse" id="status-text">
        Watch the pattern...
    </div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const TITLE = urlParams.get('title') || "Visual Sequence";

        const grid = document.getElementById('grid');
        const TILES = 9;

        // State
        let level = 1;
        let sequence = [];
        let playerStep = 0;
        let isPlayerTurn = false;

        // Init Grid
        for (let i = 0; i < TILES; i++) {
            const el = document.createElement('div');
            el.className = 'tile locked';
            el.dataset.id = i;
            el.onclick = () => handleTileClick(i);
            grid.appendChild(el);
        }

        function initGame() {
            level = 1;
            sequence = [];
            document.getElementById('score-disp').innerText = "0";
            startLevel();
        }

        function startLevel() {
            inputActive = false;
            document.getElementById('status').innerText = "WATCH";
            document.getElementById('level').innerText = level;
            playerSeq = [];

            // Add new step
            sequence.push(Math.floor(Math.random() * 9));

            playSequence();
        }

        function playSequence() {
            let i = 0;
            const interval = setInterval(() => {
                const id = sequence[i];
                highlight(id);
                i++;
                if (i >= sequence.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        inputActive = true;
                        document.getElementById('status').innerText = "REPEAT";
                    }, 500);
                }
            }, 600);
        }

        function highlight(id) {
            const el = document.getElementById('c' + id);
            el.classList.add('highlight');
            if (window.Kernel) window.Kernel.audio.playTone(300 + (id * 50), 'sine', 0.1);
            setTimeout(() => el.classList.remove('highlight'), 300);
        }

        // Setup clicks
        for (let i = 0; i < 9; i++) {
            document.getElementById('c' + i).onclick = () => {
                if (!inputActive) return;

                highlight(i);
                playerSeq.push(i);

                // Check
                const currentIdx = playerSeq.length - 1;
                if (playerSeq[currentIdx] !== sequence[currentIdx]) {
                    finishSession();
                    return;
                }

                if (playerSeq.length === sequence.length) {
                    inputActive = false;
                    document.getElementById('status').innerText = "GOOD";
                    level++;
                    setTimeout(startLevel, 1000);
                }
            };
        }

        function finishSession() {
            if (window.DataManager) {
                window.DataManager.submitResult({
                    title: decodeURIComponent(TITLE),
                    domain: 'MEMORY',
                    score: (level * 100),
                    metrics: { level: level }
                });
            }

            if (confirm(`Game Over at Level ${level}\n\nView Analytics?`)) {
                window.location.href = 'report_global.html';
            } else {
                level = 1;
                sequence = [];
                startLevel();
            }
        }

        setTimeout(startLevel, 1000);

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.26_10"></script>
</body>

</html>
