<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Grid | Psyche-X™</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            user-select: none;
        }

        .grid-cell {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .grid-cell:active {
            transform: scale(0.95);
        }

        .grid-cell.active {
            background: #3b82f6;
            border-color: #60a5fa;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
        }

        .grid-cell.user-correct {
            background: #10b981;
            border-color: #34d399;
        }

        .grid-cell.user-wrong {
            background: #ef4444;
            border-color: #f87171;
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="h-screen flex flex-col overflow-hidden text-white bg-slate-900">

    <!-- Header -->
    <nav class="border-b border-gray-800 bg-gray-900/50 backdrop-blur z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='working.html'" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </button>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
                    Spatial Grid
                </h1>
                <span class="px-2 py-0.5 rounded text-xs bg-cyan-900/30 text-cyan-200 border border-cyan-800">Visual
                    Memory</span>
            </div>
            <div class="flex items-center gap-6 text-sm font-mono">
                <div class="text-gray-400">LENGTH: <span id="length-indicator" class="text-white font-bold">3</span>
                </div>
                <div class="text-gray-400">SCORE: <span id="score-indicator" class="text-white font-bold">0</span></div>
            </div>
        </div>
    </nav>

    <!-- Game Container -->
    <div id="game-container" class="flex-1 flex flex-col items-center justify-center p-4">

        <div class="text-center mb-8 h-8">
            <span id="instruction-text" class="text-xl font-medium text-gray-300">Watch the pattern...</span>
        </div>

        <!-- The 5x5 Grid -->
        <div class="grid grid-cols-5 gap-3 sm:gap-4 p-4 bg-slate-800/50 rounded-2xl border border-slate-700 shadow-2xl"
            id="spatial-grid" style="width: min(90vw, 500px); height: min(90vw, 500px);">
            <!-- Generated by JS -->
        </div>

    </div>

    <!-- Intro Screen -->
    <div id="intro-screen" class="absolute inset-0 z-40 bg-gray-900 flex flex-col items-center justify-center p-4">
        <div
            class="max-w-2xl w-full bg-gray-800 border border-gray-700 rounded-2xl p-12 text-center shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-500"></div>
            <div
                class="w-20 h-20 bg-cyan-900/20 rounded-2xl flex items-center justify-center mx-auto mb-8 border border-cyan-500/30">
                <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
                    </path>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-white mb-4 tracking-tight">Spatial Memory Protocol</h1>
            <p class="text-cyan-100/70 text-lg mb-8 leading-relaxed">
                A sequence of squares will light up. Memorize the order and repeat it back.<br>
                This measures your <strong>Visuospatial Sketchpad</strong> capacity.
            </p>
            <button onclick="startGame()"
                class="bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-4 px-12 rounded-xl text-lg transition-all transform hover:scale-105 shadow-lg shadow-cyan-900/50">
                Initialize Protocol
            </button>
        </div>
    </div>

    <!-- Results Modal -->
    <div id="results-modal"
        class="fixed inset-0 z-50 bg-black/90 backdrop-blur hidden flex items-center justify-center p-4">
        <div
            class="max-w-md w-full bg-gray-800 rounded-2xl p-8 border border-gray-700 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-500"></div>
            <h2 class="text-3xl font-bold text-white mb-2">Memory Span Analysis</h2>

            <div class="py-8">
                <div class="text-sm text-gray-500 uppercase tracking-widest mb-1">Max Span Reached</div>
                <div class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-br from-cyan-400 to-blue-500"
                    id="result-span">0</div>
            </div>

            <button onclick="window.location.href='working.html'"
                class="w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                Return to Dashboard
            </button>
        </div>
    </div>

    <script src="spatial.js"></script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.24_3"></script>
</body>

</html>
