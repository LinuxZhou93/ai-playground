<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN 八维认知测评舱</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts for Kids (Fredoka) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Fredoka', 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .screen { visibility: hidden; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; position: absolute; inset: 0; }
        .screen.active { visibility: visible; opacity: 1; pointer-events: auto; }
        
        .opt-card { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); cursor: pointer; }
        .opt-card:active { transform: scale(0.95); }
        .opt-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border-color: #6366f1; }
        
        .mem-cell { transition: all 0.2s; border-radius: 12px; }
        .mem-cell.flash { background-color: #fcd34d !important; transform: scale(1.1); box-shadow: 0 0 20px rgba(251,191,36,0.6); }

        .particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; pointer-events: none; }
        @keyframes floatUp { from { transform: translateY(100vh); opacity: 0; } 20% { opacity: 0.6; } 100% { transform: translateY(-20vh); opacity: 0; } }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-800 overflow-hidden flex flex-col items-center justify-center p-4">

    <!-- Back to Hub Button -->
    <button onclick="window.location.href='../hub.html'" class="fixed top-4 left-4 z-50 w-12 h-12 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center text-white hover:bg-white/20 transition group border border-white/20 shadow-lg">
        <i data-lucide="arrow-left" class="w-6 h-6 group-hover:-translate-x-1 transition-transform"></i>
    </button>

    <!-- App Container -->
    <main id="app-container" class="relative z-10 w-full max-w-5xl h-[90vh] bg-white rounded-[2rem] shadow-2xl border-4 border-slate-200 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header id="quiz-header" class="hidden shrink-0 flex items-center justify-between p-4 sm:p-6 border-b-2 border-slate-100 bg-white/80 backdrop-blur-sm z-20">
            <div class="flex-1 mr-4">
                <div class="h-4 bg-slate-200 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-400 to-indigo-500 w-0 transition-all duration-300"></div>
                </div>
                <div class="text-sm font-bold mt-2 flex justify-between">
                    <span id="module-title" class="text-blue-600 tracking-wide">加载舱位...</span>
                    <span id="progress-text" class="text-slate-500">0/40</span>
                </div>
            </div>
            <div class="score-badge px-4 py-2 bg-indigo-100 text-indigo-600 rounded-xl font-bold border-2 border-indigo-200 flex items-center gap-2 shadow-sm">
                <i data-lucide="zap" class="w-4 h-4 text-indigo-500"></i>
                <span id="mode-text">标准评估模式</span>
            </div>
        </header>

        <!-- Screens wrapper -->
        <div class="flex-1 relative bg-slate-50">
            
            <!-- 1. Start Screen -->
            <section id="screen-start" class="screen active flex flex-col items-center justify-center p-8 bg-gradient-to-b from-indigo-900 to-slate-900 text-white">
                <h1 class="text-5xl sm:text-7xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400 text-center drop-shadow-lg tracking-widest uppercase">
                    TITAN
                </h1>
                <p id="deck-label" class="text-2xl text-blue-200 mb-10 font-medium tracking-wider bg-blue-900/50 px-6 py-2 rounded-full border border-blue-500/30">八维认知智能评测舱</p>
                
                <div class="w-full max-w-sm space-y-4">
                    <input type="text" id="student-name" placeholder="请输入特工代号 (姓名)" class="w-full text-center px-6 py-4 rounded-2xl border-4 border-indigo-500/50 bg-indigo-900/50 text-xl font-bold text-white outline-none focus:border-cyan-400 placeholder-indigo-300 backdrop-blur-md">
                    <button id="btn-start" class="w-full px-8 py-5 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-2xl border-b-4 border-blue-700 text-white font-bold text-2xl flex items-center justify-center gap-3 transform active:translate-y-1 active:border-b-0 hover:brightness-110 transition-all shadow-[0_0_30px_rgba(34,211,238,0.3)]">
                        <span>启动舱门</span>
                        <i data-lucide="rocket" class="w-6 h-6"></i>
                    </button>
                    <p class="text-center text-slate-400 text-sm font-mono mt-4">请允许使用麦克风与摄像头以完成全面评估</p>
                </div>
            </section>

            <!-- 2. Standard Quiz Screen -->
            <section id="screen-quiz" class="screen flex flex-col p-4 sm:p-8 overflow-y-auto">
                <div class="w-full max-w-4xl mx-auto flex flex-col items-center flex-1">
                    <h2 id="question-prompt" class="text-2xl sm:text-4xl font-bold text-slate-800 text-center mb-8 leading-relaxed">
                        题目加载中
                    </h2>
                    
                    <!-- Dynamic Question Area (Image, Emojis, Memory Grid etc.) -->
                    <div id="question-display-area" class="w-full max-w-2xl min-h-[16rem] bg-white rounded-[2rem] shadow-sm border-4 border-slate-100 flex items-center justify-center mb-8 p-4 relative overflow-hidden text-center">
                    </div>

                    <!-- AI Media Area (Camera / Audio) -->
                    <div id="ai-media-area" class="hidden w-full max-w-xl mx-auto flex-col items-center justify-center gap-6 mb-8">
                        <div class="relative w-full aspect-video bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-indigo-200">
                            <!-- Video feed -->
                            <video id="camera-feed" class="w-full h-full object-cover hidden" autoplay playsinline></video>
                            
                            <!-- Captured image preview -->
                            <img id="photo-preview" class="w-full h-full object-cover hidden" />
                        </div>
                        
                        <!-- AI Controls -->
                        <div id="ai-controls" class="flex items-center gap-4">
                            <button id="btn-capture-photo" class="hidden px-8 py-4 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-bold rounded-2xl shadow-lg border-b-4 border-rose-700 active:border-b-0 active:translate-y-1 transition text-xl flex items-center gap-2">
                                <i data-lucide="camera" class="w-6 h-6"></i> 拍一张大头照！
                            </button>
                            <button id="btn-next-ai" class="hidden px-8 py-4 bg-gradient-to-r from-green-400 to-emerald-500 text-white font-bold rounded-2xl shadow-lg border-b-4 border-emerald-700 active:border-b-0 active:translate-y-1 transition text-xl flex items-center gap-2">
                                继续探测 <i data-lucide="arrow-right" class="w-6 h-6"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Options Grid -->
                    <div id="options-grid" class="grid w-full max-w-3xl gap-4 sm:gap-6 pb-8">
                    </div>
                </div>
            </section>

            <!-- 3. Final Pre-Report Screen -->
            <section id="screen-report-loader" class="screen flex flex-col items-center justify-center p-8 bg-slate-900 text-white">
                <i data-lucide="radar" class="w-24 h-24 text-indigo-400 animate-spin" style="animation-duration: 3s;"></i>
                <h2 class="text-3xl font-black mt-8 mb-4 tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-400">正在生成八维认知诊断档案...</h2>
                <p class="text-slate-400 font-mono">数据已采集完毕，即将为您跳转至深度解读大盘。</p>
            </section>

        </div>
        
        <!-- Generic Success Visualizer -->
        <div id="overlay-success" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center opacity-0">
            <div class="w-48 h-48 bg-green-400 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(74,222,128,0.8)] transform scale-50" id="success-circle">
                <i data-lucide="check" class="w-24 h-24 text-white"></i>
            </div>
        </div>
        <!-- Generic Error Visualizer -->
        <div id="overlay-error" class="fixed inset-0 pointer-events-none z-50 flex items-center justify-center opacity-0">
            <div class="w-48 h-48 bg-red-400 rounded-full flex items-center justify-center shadow-[0_0_50px_rgba(248,113,113,0.8)] transform scale-50" id="error-circle">
                <i data-lucide="x" class="w-24 h-24 text-white"></i>
            </div>
        </div>

    </main>

    <script src="engine_ques_v3.js"></script>
    <script>
        lucide.createIcons();
        for (let i = 0; i < 30; i++) {
            let p = document.createElement('div');
            p.className = 'particle bg-white/5';
            p.style.width = Math.random() * 40 + 10 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 6 + 4 + 's';
            p.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(p);
        }
    </script>
</body>
</html>
