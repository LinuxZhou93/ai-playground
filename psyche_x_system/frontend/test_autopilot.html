<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Psyche-X | Autopilot Verification</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SYSTEM CORE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/auth_manager.js"></script>
    <script src="js/data_manager.js"></script>

    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }

        .log-line {
            margin-bottom: 4px;
            display: flex;
            gap: 10px;
            opacity: 0;
            animation: fadeIn 0.1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .ts {
            color: #555;
            min-width: 80px;
        }

        .type-info {
            color: #60a5fa;
        }

        .type-success {
            color: #4ade80;
            font-weight: bold;
        }

        .type-error {
            color: #f87171;
            font-weight: bold;
            background: rgba(248, 113, 113, 0.1);
        }

        .type-step {
            color: #fbbf24;
            font-weight: bold;
            border-top: 1px solid #333;
            margin-top: 10px;
            padding-top: 10px;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="p-8 max-w-4xl mx-auto">

    <header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-blue-500">PSYCHE-X AUTOPILOT <span
                    class="text-xs bg-blue-900/30 px-2 py-1 rounded ml-2">v1.0</span></h1>
            <p class="text-gray-500 text-xs mt-1">Full SaaS Lifecycle Verification Protocol</p>
        </div>
        <div id="status" class="text-sm font-bold text-yellow-500 animate-pulse">
            INITIALIZING
        </div>
    </header>

    <div id="console"
        class="bg-[#0a0a0a] border border-gray-800 rounded p-6 h-[600px] overflow-y-auto font-sm shadow-2xl shadow-blue-900/10">
        <!-- Logs go here -->
    </div>

    <script>
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        const logEl = document.getElementById('console');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-line type-${type}`;
            const time = new Date().toISOString().split('T')[1].replace('Z', '');
            div.innerHTML = `<span class="ts">[${time}]</span> <span>${msg}</span>`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function verifyStep(name, action) {
            log(`STEP: ${name}`, 'step');
            await wait(500);
            try {
                const res = await action();
                if (res === false) throw new Error("Check failed");
                log(`✓ PASS: ${name}`, 'success');
                return res;
            } catch (e) {
                log(`✘ FAIL: ${e.message || e}`, 'error');
                throw e;
            }
        }

        async function runAutopilot() {
            document.getElementById('status').innerText = 'RUNNING...';
            document.getElementById('status').className = 'text-sm font-bold text-blue-400 animate-pulse';

            try {
                // VARIABLES
                let licenseCode = null;
                const testUserEmail = `autopilot_${Date.now()}@test.io`;
                const testUserPass = 'password123';
                const testUserName = `Bot_${Math.floor(Math.random() * 9999)}`;

                // --- PHASE 1: SYSTEM CHECK ---
                await verifyStep('Initial System Diagnostics', () => {
                    if (!window.AuthManager) throw new Error("AuthManager missing");
                    if (!window.DataClient) throw new Error("DataClient missing");
                    log("Libraries loaded.");
                    return true;
                });

                // --- PHASE 2: ADMIN ACTIONS ---
                await verifyStep('Admin: Generate SaaS License', async () => {
                    // Force admin logic locally if needed, but we used AuthManager which calls DataClient
                    const keys = await AuthManager.generateLicense('MONTHLY', 1);
                    if (!keys || keys.length === 0) throw new Error("No keys returned");
                    licenseCode = keys[0].code;
                    log(`Generated Key: ${licenseCode}`);
                    return true;
                });

                // --- PHASE 3: USER REGISTRATION ---
                await verifyStep(`User: Register New Account (${testUserName})`, async () => {
                    // Register
                    // IMPORTANT: We need to sign out any current user first?
                    // Yes, but let's assume we are running this fresh or we force logout.
                    await AuthManager.logout();

                    const res = await AuthManager.register(testUserEmail, testUserPass, testUserName);
                    if (!res.success) throw new Error(res.message);

                    // Supabase auto-logins after register if confirmed? 
                    // Or we might need to login explicitly if register doesn't return session.
                    // AuthManager.register tries to return success. Let's try explicit login to be sure.
                    const loginRes = await AuthManager.login(testUserEmail, testUserPass);
                    if (!loginRes.success) throw new Error("Login after register failed: " + loginRes.message);

                    log(`Logged in as ID: ${loginRes.user.id}`);
                    return true;
                });

                // --- PHASE 4: DATA UPLOAD ---
                await verifyStep('User: Play Game & Upload Data', async () => {
                    const record = {
                        title: 'Autopilot Test',
                        domain: 'MEMORY',
                        score: 95,
                        metrics: { accuracy: 100, reaction_time: 250 },
                        difficulty: 'Hard'
                    };
                    await DataManager.submitResult(record);
                    log("Local submission done. Syncing...");

                    await DataManager.sync();
                    log("Cloud sync requested.");
                    return true;
                });

                // --- PHASE 5: VERIFY FREE TIER ---
                await verifyStep('User: Verify Free Tier Status', async () => {
                    const profile = await DataClient.getProfile();
                    log(`Current Tier: ${profile.tier || 'FREE'}`);
                    if (profile.tier !== 'FREE' && profile.tier !== undefined && profile.tier !== null) {
                        // It might be null if default value issue, but typically FREE
                        // Acceptable if it's FREE or null
                    }
                    return true;
                });

                // --- PHASE 6: REDEMPTION ---
                await verifyStep(`User: Redeem License (${licenseCode})`, async () => {
                    const res = await AuthManager.redeemLicense(licenseCode);
                    if (!res.success) throw new Error(res.message);
                    log(`Redemption Success! Plan: ${res.plan}`);
                    return true;
                });

                // --- PHASE 7: VERIFY UPGRADE ---
                await verifyStep('User: Verify PRO/ELITE Upgrade', async () => {
                    // Refetch profile
                    const profile = await DataClient.getProfile();
                    log(`New Tier: ${profile.tier}`);
                    if (profile.tier !== 'PRO' && profile.tier !== 'ELITE') throw new Error("Tier did not update!");
                    return true;
                });

                // DONE
                document.getElementById('status').innerText = 'SUCCESS';
                document.getElementById('status').className = 'text-sm font-bold text-green-500';
                log("ALL SYSTEMS GO. PSYCHE-X IS FULLY OPERATIONAL.", 'success');

            } catch (e) {
                document.getElementById('status').innerText = 'FAILED';
                document.getElementById('status').className = 'text-sm font-bold text-red-500';
                console.error(e);
            }
        }

        // Start automatically 
        setTimeout(runAutopilot, 1000);

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js"></script>
</body>

</html>
