<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Grammatical Reasoning</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="kernel.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data_client.js"></script>
    <script src="js/data_manager.js"></script>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        .statement-box {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 3rem;
            text-align: center;
            line-height: 1.4;
            max-width: 800px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .visual-stage {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            align-items: center;
            justify-content: center;
            height: 200px;
        }

        .shape {
            transition: all 0.2s;
        }

        .btn-choice {
            padding: 1.5rem 4rem;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 16px;
            transition: all 0.1s;
            border: 2px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
        }

        .btn-true {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border-color: #059669;
        }

        .btn-true:hover {
            background: rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .btn-false {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border-color: #b91c1c;
        }

        .btn-false:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .timer-bar {
            width: 100%;
            height: 4px;
            background: #333;
            position: fixed;
            top: 0;
            left: 0;
        }

        .timer-fill {
            height: 100%;
            background: #f472b6;
            width: 100%;
            transition: width 1s linear;
        }
    </style>

    <link rel="stylesheet" href="../../assets/css/titan-core.css">
</head>

<body class="flex flex-col h-screen items-center justify-center">

    <div class="timer-bar">
        <div class="timer-fill" id="timer"></div>
    </div>

    <!-- Header -->
    <div class="fixed top-8 left-8 flex gap-4 z-50">
        <button onclick="history.back()" class="p-3 bg-white/10 rounded-full hover:bg-white/20 backdrop-blur">
            <i data-lucide="arrow-left"></i>
        </button>
        <div>
            <h1 class="text-xl font-bold text-white">Grammatical Reasoning</h1>
            <p class="text-xs text-pink-400 font-mono tracking-wider">VERBAL LOGIC PROTOCOL</p>
        </div>
    </div>

    <!-- Stats -->
    <div class="fixed top-8 right-8 text-right font-mono">
        <div class="text-4xl font-bold text-white" id="score-disp">0</div>
        <div class="text-sm text-gray-500">TIME: <span id="time-disp" class="text-white">90</span>s</div>
    </div>

    <!-- Game -->
    <div class="statement-box" id="statement">
        The Square is bigger than the Circle.
    </div>

    <div class="visual-stage" id="visuals">
        <!-- Injected -->
    </div>

    <div class="flex gap-8">
        <button class="btn-choice btn-true" onclick="handleChoice(true)">TRUE</button>
        <button class="btn-choice btn-false" onclick="handleChoice(false)">FALSE</button>
    </div>

    <script>
        lucide.createIcons();
        const urlParams = new URLSearchParams(window.location.search);
        const TITLE = urlParams.get('title') || "Grammatical Reasoning";

        let score = 0;
        let timeLeft = 90;
        let timerInterval;
        let currentTruth = false;

        function initGame() {
            score = 0;
            timeLeft = 90;
            updateStats();
            startTimer();
            nextRound();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateStats();
                document.getElementById('timer').style.width = (timeLeft / 90 * 100) + '%';
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    finishGame();
                }
            }, 1000);
        }

        function nextRound() {
            const scenario = Math.floor(Math.random() * 4); // 0,1,2,3
            renderVisual(scenario);
            const statement = generateStatement(scenario);
            currentTruth = statement.isTrue;
            document.getElementById('statement').innerText = statement.text;
        }

        function renderVisual(scenario) {
            const visual = document.getElementById('visuals');
            visual.innerHTML = '';
            const colSq = '#3b82f6';
            const colCirc = '#eab308';
            if (scenario === 0) {
                visual.innerHTML = `<div class="shape" style="width:120px; height:120px; background:${colSq}; border-radius:4px;"></div><div class="shape" style="width:60px; height:60px; background:${colCirc}; border-radius:50%;"></div>`;
            } else if (scenario === 1) {
                visual.innerHTML = `<div class="shape" style="width:60px; height:60px; background:${colSq}; border-radius:4px;"></div><div class="shape" style="width:120px; height:120px; background:${colCirc}; border-radius:50%;"></div>`;
            } else if (scenario === 2) {
                visual.innerHTML = `<div class="shape flex items-center justify-center" style="width:140px; height:140px; background:${colSq}; border-radius:4px;"><div class="shape" style="width:80px; height:80px; background:${colCirc}; border-radius:50%;"></div></div>`;
            } else if (scenario === 3) {
                visual.innerHTML = `<div class="shape flex items-center justify-center" style="width:140px; height:140px; background:${colCirc}; border-radius:50%;"><div class="shape" style="width:80px; height:80px; background:${colSq}; border-radius:4px;"></div></div>`;
            }
        }

        function generateStatement(scenario) {
            const S = "Square";
            const C = "Circle";
            const sqBigger = (scenario === 0 || scenario === 2);
            const circBigger = (scenario === 1 || scenario === 3);
            const sqEncloses = (scenario === 2);
            const circEncloses = (scenario === 3);
            const type = Math.floor(Math.random() * 4);
            let text = "";
            let isTrue = false;
            const subjectIsSquare = Math.random() > 0.5;
            const sub = subjectIsSquare ? S : C;
            const obj = subjectIsSquare ? C : S;

            if (type === 0 || type === 1) {
                const useBigger = Math.random() > 0.5;
                const verb = useBigger ? "bigger than" : "smaller than";
                if (type === 0) text = `${sub} is ${verb} the ${obj}`;
                if (type === 1) text = `${sub} is not ${verb} the ${obj}`;
                let fact = false;
                if (subjectIsSquare) {
                    if (useBigger) fact = sqBigger;
                    else fact = !sqBigger;
                } else {
                    if (useBigger) fact = circBigger;
                    else fact = !circBigger;
                }
                isTrue = (type === 0) ? fact : !fact;
            } else {
                const verb = "encloses";
                if (type === 2) text = `${sub} ${verb} the ${obj}`;
                if (type === 3) text = `${sub} does not ${verb} the ${obj}`;
                let fact = false;
                if (subjectIsSquare) fact = sqEncloses;
                else fact = circEncloses;
                isTrue = (type === 2) ? fact : !fact;
            }
            return { text, isTrue };
        }

        function handleChoice(userTrue) {
            if (userTrue === currentTruth) {
                score += 10;
                playSound('pop');
            } else {
                score = Math.max(0, score - 10);
                playSound('error');
            }
            nextRound();
            updateStats();
        }

        function updateStats() {
            document.getElementById('score-disp').innerText = score;
            document.getElementById('time-disp').innerText = timeLeft;
        }

        function playSound(type) {
            if (window.Kernel) {
                if (type === 'pop') window.Kernel.audio.playTone(600, 'sine', 0.1);
                if (type === 'error') window.Kernel.audio.playTone(150, 'sawtooth', 0.2);
            }
        }

        function finishGame() {
            if (window.DataManager) {
                window.DataManager.submitResult({
                    title: decodeURIComponent(TITLE),
                    domain: 'LOGIC',
                    score: score,
                    metrics: { correct: score / 10 }
                });
            }
            if (confirm(`Time's Up!\nScore: ${score}\n\nView Analytics?`)) {
                window.location.href = 'report_global.html';
            } else {
                initGame();
            }
        }

        setTimeout(initGame, 100);

    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../../assets/js/titan-ai-assistant.js?v=2026.03.24_3"></script>
</body>

</html>
