<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>君子之境 | 数字化修身系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;600;900&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f0f0f0;
            --text-dim: rgba(255, 255, 255, 0.6);
            --accent: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Noto Serif SC', serif;
            background-color: #000;
            color: var(--text-main);
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80') no-repeat center center;
            background-size: cover;
            filter: brightness(0.5);
            z-index: -1;
        }

        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: grid;
            grid-template-columns: 350px 1fr 350px;
            gap: 20px;
            padding: 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .header { grid-column: 1 / -1; text-align: center; margin-bottom: 20px; }
        .title { font-size: 3rem; font-weight: 900; letter-spacing: 0.5rem; background: linear-gradient(to bottom, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .main-content { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .purity-clock { font-size: 5rem; font-weight: 200; margin: 20px 0; text-shadow: 0 0 30px rgba(255,255,255,0.2); }
        .rule-item { padding: 15px 0; border-bottom: 1px solid var(--glass-border); }
        .rule-tag { font-size: 0.7rem; color: var(--accent); margin-bottom: 5px; display: block; }
        .reflection-area { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 1.1rem; line-height: 1.8; resize: none; outline: none; margin-top: 20px; font-family: 'Noto Serif SC', serif; }
        .btn { margin-top: 30px; padding: 12px 40px; background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 50px; cursor: pointer; transition: all 0.3s; letter-spacing: 2px; }
        .btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

    </style>
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <header class="header">
            <h1 class="title">君子之境</h1>
        </header>

        <aside class="card">
            <h3 style="color: var(--accent);">修身十二条</h3>
            <div class="rule-item"><span class="rule-tag">其一</span><p>主敬：整齐严肃，无时或懈。</p></div>
            <div class="rule-item"><span class="rule-tag">其二</span><p>静坐：每日不拘何时，静坐四刻。</p></div>
            <div class="rule-item"><span class="rule-tag">其三</span><p>早起：黎明即起，醒后勿沾恋。</p></div>
            <div class="rule-item"><span class="rule-tag">其五</span><p>谨言：刻刻留心，不妄发议论。</p></div>
        </aside>

        <main class="main-content">
            <p style="color: var(--accent); letter-spacing: 5px;">正气积累时长</p>
            <div id="counter" class="purity-clock">00:00:00</div>
            <button class="btn" onclick="resetCounter()">重新立志</button>
        </main>

        <aside class="card">
            <h3 style="color: var(--accent);">日知其所亡</h3>
            <textarea id="reflection" class="reflection-area" placeholder="在此静心输入..."></textarea>
        </aside>
    </div>

    <script>
        let startTime = localStorage.getItem('gentleman_start_time') || Date.now();
        localStorage.setItem('gentleman_start_time', startTime);

        function update() {
            const diff = Date.now() - startTime;
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('counter').innerText = 
                `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }
        function resetCounter() { if(confirm('立志如山，确认重置？')) { startTime = Date.now(); localStorage.setItem('gentleman_start_time', startTime); } }
        setInterval(update, 1000); update();
        
        const area = document.getElementById('reflection');
        area.value = localStorage.getItem('gentleman_reflection') || '';
        area.oninput = () => localStorage.setItem('gentleman_reflection', area.value);
    </script>
</body>
</html>
