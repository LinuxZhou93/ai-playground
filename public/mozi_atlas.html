<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字化科教资源馆 | 墨子实验室</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #050a14;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; padding: 2rem; margin: 0; }
        h1, h2, h3 { font-family: 'Outfit', sans-serif; }

        .header { margin-bottom: 3rem; text-align: center; padding: 4rem 1rem; }
        .header h1 { font-size: 3.5rem; font-weight: 800; background: linear-gradient(135deg, #fff, var(--primary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        .header p { font-size: 1.1rem; color: rgba(255, 255, 255, 0.4); max-width: 700px; margin: 0 auto; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 4rem;
        }
        .stat-item {
            background: var(--glass);
            padding: 1.5rem 2.5rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-value { display: block; font-size: 2rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }

        .filter-container {
            max-width: 1200px;
            margin: 0 auto 3rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .search-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 1rem 2rem;
            border-radius: 40px;
            color: #fff;
            width: 400px;
            outline: none;
            transition: all 0.3s;
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }

        .atlas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .atlas-item {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .atlas-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            transform: translateY(-5px);
        }

        .item-category { font-size: 0.7rem; color: var(--primary); font-weight: 800; text-transform: uppercase; margin-bottom: 0.5rem; display: block; }
        .item-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.4; }
        .item-path { font-size: 0.7rem; color: rgba(255,255,255,0.2); font-family: monospace; }

        .back-nav {
            position: fixed;
            top: 2rem;
            left: 2rem;
            padding: 0.8rem 1.5rem;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 40px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            z-index: 100;
        }
    </style>
</head>
<body>
    <a href="mozi_lab.html" class="back-nav">← 返回门户</a>

    <header class="header">
        <h1>数字化科教资源馆</h1>
        <p>墨子实验室全量科创资产图谱。涵盖前沿新材料、航空航天、具身智能及生命科学等 700+ 交互式科研专题。</p>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <span class="stat-value" id="total-count">0</span>
            <span class="stat-label">总计资源</span>
        </div>
        <div class="stat-item">
            <span class="stat-value">4</span>
            <span class="stat-label">核心学科</span>
        </div>
        <div class="stat-item">
            <span class="stat-value">BGI</span>
            <span class="stat-label">科研背书</span>
        </div>
    </div>

    <div class="filter-container">
        <input type="text" class="search-box" id="atlas-search" placeholder="在全量资源中即时搜索...">
    </div>

    <div class="atlas-grid" id="atlas-grid">
        <!-- Items injected by JS -->
    </div>

    <script src="mozi_index.js"></script>
    <script>
        const grid = document.getElementById('atlas-grid');
        const searchInput = document.getElementById('atlas-search');
        const totalCount = document.getElementById('total-count');
        const index = window.moziIndex || [];

        totalCount.textContent = index.length;

        function renderItems(items) {
            grid.innerHTML = items.map(item => `
                <a href="${item.path}" class="atlas-item">
                    <div>
                        <span class="item-category">${item.category || 'Science Asset'}</span>
                        <h3 class="item-title">${item.title}</h3>
                    </div>
                    <span class="item-path">${item.path}</span>
                </a>
            `).join('');
        }

        renderItems(index);

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = index.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.path.toLowerCase().includes(query)
            );
            renderItems(filtered);
        });
    </script>
</body>
</html>
