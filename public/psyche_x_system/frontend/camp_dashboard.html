<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>机甲争锋机器人营 · 多维评价管理台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fredoka', 'Noto Sans SC', sans-serif; background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Modal Style */
        .modal { transition: opacity 0.25s ease; }
        .modal-active { overflow-x: hidden; overflow-y: hidden !important; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-slate-800/50 p-6 rounded-3xl border border-slate-700 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-indigo-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i data-lucide="layout-dashboard" class="w-7 h-7 text-white"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wider">机甲争锋机器人营评价管理台</h1>
                    <p class="text-slate-400 text-sm">成电研学 · 2026未来科技营 · 八维成长记录</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="camp_input.html" class="px-5 py-3 bg-emerald-500/20 text-emerald-400 font-bold rounded-xl border border-emerald-500/30 hover:bg-emerald-500/30 transition flex items-center gap-2">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    新增评测反馈
                </a>
                <button id="exportCsvBtn" class="px-5 py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 hover:bg-blue-500 transition flex items-center gap-2">
                    <i data-lucide="sheet" class="w-5 h-5"></i>
                    导出总表 (CSV)
                </button>
            </div>
        </header>

        <!-- Table Container -->
        <div class="bg-slate-800 rounded-3xl border border-slate-700 shadow-xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full whitespace-nowrap text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900 border-b border-slate-700 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-4 font-bold">时间</th>
                            <th class="p-4 font-bold">学号</th>
                            <th class="p-4 font-bold">姓名</th>
                            <!-- Dimensions -->
                            <th class="p-4 font-bold text-center">专注</th>
                            <th class="p-4 font-bold text-center">动手</th>
                            <th class="p-4 font-bold text-center">逻辑</th>
                            <th class="p-4 font-bold text-center">抗挫</th>
                            <th class="p-4 font-bold text-center">情绪</th>
                            <th class="p-4 font-bold text-center">破冰</th>
                            <th class="p-4 font-bold text-center">创新</th>
                            <th class="p-4 font-bold text-center">协作</th>
                            <!-- Actions -->
                            <th class="p-4 font-bold text-right">档案操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="12" class="p-8 text-center text-slate-500">
                                <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                                正在连接 Supabase 获取数据列阵...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- QR Code Modal -->
    <div id="qrModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-900 opacity-80" onclick="closeModal()"></div>
        <div class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-[2rem] shadow-2xl z-50 overflow-y-auto">
            <div class="modal-content py-6 text-left px-8 text-slate-800 flex flex-col items-center">
                <div class="flex justify-between items-center pb-3 w-full border-b border-slate-100 mb-6">
                    <p class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-blue-500">一键分享电子档案</p>
                    <div class="modal-close cursor-pointer p-2 rounded-full hover:bg-slate-100 transition" onclick="closeModal()">
                        <i data-lucide="x" class="w-5 h-5 text-slate-500"></i>
                    </div>
                </div>
                
                <p id="qrStudentName" class="font-black text-2xl text-slate-700 mb-2">学员姓名</p>
                <p class="text-sm text-slate-500 mb-6 font-mono text-center">机甲争锋·AI全向移动格斗机器人创造挑战</p>

                <!-- QRCode container -->
                <div id="qrcode-container" class="p-4 bg-slate-50 rounded-3xl border border-slate-200 shadow-inner mb-6"></div>
                
                <p class="text-xs text-slate-400 text-center">家长可以通过微信扫码直接查看深度的评估图谱和AI生成导师评语。</p>
                
                <button class="mt-6 w-full py-4 bg-slate-900 border-2 border-slate-900 text-white font-bold rounded-2xl hover:bg-slate-800 transition" onclick="closeModal()">关闭窗口</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let globalData = [];
        const ROBOT_CAMP_PATTERN = /机器人|机甲争锋|麦克纳姆/;

        async function fetchRecords() {
            try {
                const res = await fetch('/api/camp_report');
                const { success, data } = await res.json();
                
                if(success) {
                    // The table is the working console for the current robot camp.
                    // Historical records remain in storage and can still be opened by ID.
                    globalData = data.filter(item => ROBOT_CAMP_PATTERN.test(item.camp_name || ''));
                    renderTable(globalData);
                } else {
                    document.getElementById('table-body').innerHTML = `<tr><td colspan="12" class="p-4 text-center text-rose-400">数据拉取失败</td></tr>`;
                }
            } catch(e) {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="12" class="p-4 text-center text-rose-400">网络错误: ${e.message}</td></tr>`;
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-slate-500">暂无录入数据。请先导师录入。</td></tr>`;
                return;
            }

            data.forEach(item => {
                const dateSplit = new Date(item.created_at).toLocaleString().split(' ');
                const dateStr = `<div class="text-xs">${dateSplit[0]}</div><div class="text-[10px] text-slate-500">${dateSplit[1]||''}</div>`;
                
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition border-transparent border-l-4 hover:border-indigo-500';
                
                tr.innerHTML = `
                    <td class="p-4 text-slate-400">${dateStr}</td>
                    <td class="p-4 font-mono text-cyan-300">#${item.student_id}</td>
                    <td class="p-4 font-bold text-slate-200">${item.student_name}</td>
                    
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.focus_score}</span></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.dexterity_score}</span></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.logic_score}</span></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.resilience_score}</span></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.self_management_score}</span></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.social_score}</span></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.creativity_score}</span></td>
                    <td class="p-4 text-center"><span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-700">${item.collaboration_score}</span></td>
                    
                    <td class="p-4 text-right flex items-center justify-end gap-2">
                        <button onclick="openQrModal('${item.id}', '${item.student_name}')" title="生成二维码" class="p-2 bg-indigo-500/20 text-indigo-400 rounded-lg hover:bg-indigo-500 hover:text-white transition cursor-pointer">
                            <i data-lucide="qr-code" class="w-4 h-4"></i>
                        </button>
                        <button onclick="goToReport('${item.id}')" title="查看报告(可下载PDF)" class="p-2 bg-emerald-500/20 text-emerald-400 rounded-lg hover:bg-emerald-500 hover:text-white transition cursor-pointer">
                            <i data-lucide="external-link" class="w-4 h-4"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // CSV Export
        document.getElementById('exportCsvBtn').addEventListener('click', () => {
            if(globalData.length === 0) return alert('没有数据可供导出！');
            
            const headers = [
                '生成时间', '数据ID', '学号', '姓名', '营地名称', 
                '专注度', '动手操作精细度', '科学逻辑理解力', '抗挫折恢复力',
                '工具收纳情绪管理', '社会化融入表现', '创新发散想象力', '同伴协作沟通力',
                '高光亮点', '待提升点', 'AI智能总评'
            ];
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // BOM for excel utf-8
            csvContent += headers.join(',') + "\r\n";
            
            globalData.forEach(row => {
                const arr = [
                    new Date(row.created_at).toLocaleString(), row.id, row.student_id, row.student_name, row.camp_name,
                    row.focus_score, row.dexterity_score, row.logic_score, row.resilience_score,
                    row.self_management_score, row.social_score, row.creativity_score, row.collaboration_score,
                    `"${(row.highlights||'').replace(/"/g, '""')}"`,
                    `"${(row.potential_improvements||'').replace(/"/g, '""')}"`,
                    `"${(row.ai_overall_report||'').replace(/"/g, '""')}"`
                ];
                csvContent += arr.join(',') + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `机甲争锋机器人营_八维测评总表_${new Date().getTime()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        function goToReport(id) {
            console.info('🚀 正在由仪表盘跳转至报告页面...', id);
            // 生产环境下直接使用主域名以保证稳定性
            const targetUrl = window.location.origin + '/psyche_x_system/frontend/camp_report.html?id=' + id;
            console.log('🔗 跳转目标地址:', targetUrl);
            window.location.href = targetUrl;
        }

        // Modal Logic
        function openQrModal(id, studentName) {
            document.getElementById('qrStudentName').innerText = studentName;
            
            const url = window.location.origin + '/psyche_x_system/frontend/camp_report.html?id=' + id;
            
            // clear old qr code
            document.getElementById('qrcode-container').innerHTML = '';
            
            // generate new qr code
            QRCode.toCanvas(url, { errorCorrectionLevel: 'H', width: 200, margin: 1, color: { dark:"#1e293b", light:"#ffffff" } }, function (err, canvas) {
                if (err) throw err;
                document.getElementById('qrcode-container').appendChild(canvas);
            });

            const modal = document.getElementById('qrModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function closeModal() {
            const modal = document.getElementById('qrModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        fetchRecords();
    </script>
</body>
</html>
