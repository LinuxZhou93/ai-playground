<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psyche-X | Hub</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    <style>
        body {
            background: radial-gradient(circle at 10% 20%, rgb(0, 0, 0) 0%, rgb(30, 30, 30) 90.2%);
            height: 100vh;
            display: grid;
            grid-template-rows: 60px 1fr;
            padding: 20px;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-weight: 900;
            letter-spacing: -1px;
            font-size: 1.5rem;
        }

        .user-status {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        main {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: 100%;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            overflow-y: auto;
            align-content: start;
        }

        .module-card {
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        .module-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.8));
            z-index: 1;
        }

        .module-title {
            font-size: 1.5rem;
            font-weight: 700;
            z-index: 2;
            position: relative;
        }

        .module-desc {
            font-size: 0.8rem;
            color: #ddd;
            z-index: 2;
            position: relative;
            margin-top: 5px;
            opacity: 0.8;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            border-radius: 2px;
            transition: width 1s ease;
        }
    </style>

    <link rel="stylesheet" href="../assets/css/titan-core.css">
</head>

<body>
    <header class="glass-panel">
        <div class="logo">PSYCHE-X</div>
        <div class="user-status">
            <button onclick="location.href='../index.html'"
                style="background:none; border: 1px solid rgba(255,255,255,0.2); color:#aaa; padding:2px 10px; border-radius:4px; cursor:pointer; margin-right: 15px;">Exit
                to Base</button>
            System Online | <span id="user-name">XG</span>
        </div>
    </header>

    <main>
        <aside class="sidebar">
            <div class="glass-panel stats-card">
                <h3>Cognitive load</h3>
                <div class="stat-row">
                    <span>Memory</span>
                    <span id="stat-mem">Level 1</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 20%"></div>
                </div>

                <div class="stat-row" style="margin-top: 15px;">
                    <span>Focus</span>
                    <span id="stat-focus">Level 1</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 15%"></div>
                </div>

                <div class="stat-row" style="margin-top: 15px;">
                    <span>Speed</span>
                    <span id="stat-speed">Level 1</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 30%"></div>
                </div>
            </div>

            <div class="glass-panel">
                <h3>Daily Targets</h3>
                <ul style="padding-left: 20px; font-size: 0.9rem; color: #aaa; line-height: 1.6;">
                    <li>N-Back: 15 mins</li>
                    <li>Meditation: 10 mins</li>
                    <li>Speed Read: 5 pages</li>
                </ul>
            </div>
        </aside>

        <section class="content-grid">
            <div class="glass-panel module-card" data-tilt>
                <div class="module-title">N-Back</div>
                <div class="module-desc">Working Memory Training</div>
            </div>
            <div class="glass-panel module-card" data-tilt>
                <div class="module-title">Runner</div>
                <div class="module-desc">Focus & Reaction</div>
            </div>
            <div class="glass-panel module-card" data-tilt>
                <div class="module-title">Schulte</div>
                <div class="module-desc">Peripheral Vision</div>
            </div>
            <div class="glass-panel module-card" data-tilt>
                <div class="module-title">Meditation</div>
                <div class="module-desc">Alpha Wave Sync</div>
            </div>
        </section>
    </main>

    <script src="js/kernel.js"></script>
    <script>
        // Init Tilt
        VanillaTilt.init(document.querySelectorAll(".module-card"), {
            max: 10,
            speed: 400,
            glare: true,
            "max-glare": 0.2
        });

        // Load Kernel State
        document.getElementById('user-name').innerText = sys.state.user || 'User';

        // Animate Entry
        gsap.from('.glass-panel', {
            duration: 0.8,
            y: 30,
            opacity: 0,
            stagger: 0.1,
            ease: "power2.out"
        });
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="../assets/js/titan-ai-assistant.js?v=2026.03.26_10"></script>
</body>

</html>
