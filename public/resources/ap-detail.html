<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP 课程详解 | Advanced Placement Detailed Guide</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    

    <!-- Google Fonts -->
    <link
        href="https://fonts.loli.net/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent: #fbbf24;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-bg {
            background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent),
                radial-gradient(circle at 20% 80%, rgba(251, 191, 36, 0.05), transparent);
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .scroll-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes scan-line {
            0% {
                transform: translateY(-100%);
            }

            100% {
                transform: translateY(100%);
            }
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            position: absolute;
            animation: scan-line 4s linear infinite;
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconBase>;
        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></IconBase>;
        const Award = (props) => <IconBase {...props}><circle cx="12" cy="8" r="7" /><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" /></IconBase>;
        const Activity = (props) => <IconBase {...props}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></IconBase>;
        const ArrowLeft = (props) => <IconBase {...props}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></IconBase>;

        const DetailSection = ({ title, subtitle, children }) => (
            <section className="mb-24 scroll-reveal">
                <div className="flex items-center gap-4 mb-8">
                    <div className="h-0.5 w-12 bg-blue-500"></div>
                    <div>
                        <h2 className="text-3xl font-orbitron font-bold text-white uppercase tracking-tighter">{title}</h2>
                        <span className="text-xs font-mono text-blue-400/60 uppercase tracking-widest">{subtitle}</span>
                    </div>
                </div>
                {children}
            </section>
        );

        const App = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);

            return (
                <div className="min-h-screen hero-bg">
                    {/* Header/Nav */}
                    <nav className="fixed top-0 w-full z-50 p-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
                        <a href="international-hub.html" className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
                            <div className="p-2 rounded-lg bg-white/5 border border-white/10 group-hover:border-blue-500/50 transition-all">
                                <ArrowLeft className="w-5 h-5" />
                            </div>
                            <span className="text-xs font-bold tracking-widest uppercase">返回全球智慧中心</span>
                        </a>
                        <div className="text-[10px] font-mono text-blue-400 animate-pulse tracking-widest">SYSTEM_VERSION: AP.DETAILED.V1.0</div>
                    </nav>

                    <main className="container mx-auto px-6 pt-40 pb-20">
                        {/* Hero Section */}
                        <div className="max-w-4xl mb-32">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] font-bold uppercase tracking-widest mb-8">
                                <Award className="w-3 h-3" /> College Board Authorized
                            </div>
                            <h1 className="text-7xl md:text-9xl font-orbitron font-bold text-white mb-8 leading-none">
                                AP<br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-600">Advanced Placement</span>
                            </h1>
                            <p className="text-xl text-slate-400 leading-relaxed font-light max-w-2xl border-l-2 border-blue-500/30 pl-8">
                                美国大学先修课程，是由美国大学理事会（College Board）主办的在高中阶段开设的大学水平课程。它不仅是通往北美顶级学府的“金砖”，更是学生挑战自我学术极限、提前适应大学高强度研究能力的终极赛道。
                            </p>
                        </div>

                        {/* Core Features Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-40">
                            {[
                                { title: "全球认可", desc: "超过60个国家的数千所大学在录取中将AP作为重要的参考。建议优秀的科技特长生完成4-6门核心科目。" },
                                { title: "换取学分", desc: "在大多数北美大学，AP 4分及以上即可抵扣相应大学学分，为您节省数万美金的留学开支。" },
                                { title: "GPA 权重", desc: "AP课程在大多数高中的GPA计算中具有加权作用，是提升学术背景吸引力的核心手段。" }
                            ].map((item, idx) => (
                                <div key={idx} className="glass-card rounded-2xl p-8 group hover:-translate-y-2 transition-all">
                                    <div className="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-400 mb-6 group-hover:scale-110 transition-transform">
                                        <CheckCircle className="w-6 h-6" />
                                    </div>
                                    <h3 className="text-xl font-bold text-white mb-3 tracking-widest">{item.title}</h3>
                                    <p className="text-slate-400 text-sm leading-relaxed">{item.desc}</p>
                                </div>
                            ))}
                        </div>

                        {/* Detailed Content: Course Matrix */}
                        <DetailSection title="学科矩阵" subtitle="THE_38_SUBJECTS_ARCHITECTURE">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                                <div className="space-y-6">
                                    <h4 className="text-lg font-bold text-blue-400 flex items-center gap-3">
                                        <div className="w-2 h-2 rounded-full bg-blue-500"></div>
                                        STEM 工程与计算
                                    </h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {[
                                            "AP Computer Science A",
                                            "AP CS Principles",
                                            "AP Physics C: Mechanics",
                                            "AP Physics C: E & M",
                                            "AP Calculus BC",
                                            "AP Biology & Chemistry"
                                        ].map(cur => (
                                            <div key={cur} className="p-4 rounded-xl bg-white/5 border border-white/10 hover:border-blue-500/30 transition-colors text-xs text-slate-300 font-mono italic">
                                                {cur}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="space-y-6">
                                    <h4 className="text-lg font-bold text-indigo-400 flex items-center gap-3">
                                        <div className="w-2 h-2 rounded-full bg-indigo-500"></div>
                                        Humanities & Research
                                    </h4>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {[
                                            "AP English Lang & Comp",
                                            "AP Seminar",
                                            "AP Research (Capstone)",
                                            "AP Micro/Macroeconomics",
                                            "AP US/World History",
                                            "AP Psychology"
                                        ].map(cur => (
                                            <div key={cur} className="p-4 rounded-xl bg-white/5 border border-white/10 hover:border-indigo-500/30 transition-colors text-xs text-slate-300 font-mono italic">
                                                {cur}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </DetailSection>

                        {/* Learning Path */}
                        <DetailSection title="备考与评估体系" subtitle="ASSESSMENT_LOGIC_AND_TIMELINE">
                            <div className="glass-card rounded-[2.5rem] p-12 border border-blue-500/10 overflow-hidden relative">
                                <div className="scan-line"></div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-16 relative z-10">
                                    <div>
                                        <h4 className="text-4xl font-bold mb-6">5分评价制</h4>
                                        <div className="space-y-4">
                                            {[
                                                { score: "5", label: "Extremely Qualified", freq: "极具竞争力的成绩，常春藤盟校门槛" },
                                                { score: "4", label: "Well Qualified", freq: "优秀的成绩，可兑换绝大多数名校学分" },
                                                { score: "3", label: "Qualified", freq: "合格成绩，展示了大学层级的学习潜力" }
                                            ].map(s => (
                                                <div key={s.score} className="flex gap-6 items-center">
                                                    <span className="text-5xl font-orbitron font-bold text-blue-500">{s.score}</span>
                                                    <div>
                                                        <div className="text-white font-bold text-sm tracking-widest">{s.label}</div>
                                                        <div className="text-slate-500 text-xs">{s.freq}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <h4 className="text-2xl font-bold mb-6">年度规划建议</h4>
                                        <div className="border-l border-white/10 ml-4 space-y-8 py-2">
                                            {[
                                                { grade: "10年级", task: "确定专业方向，完成1-2门基础科目（如AP 计算机原理、AP 物理1）" },
                                                { grade: "11年级", task: "黄金备考期，完成3-4门核心科目考试。这是申请季最重要的学术筹码。" },
                                                { grade: "12年级", task: "进阶学科学习（如物理C、微积分BC），为大一课程衔接做准备。" }
                                            ].map((g, i) => (
                                                <div key={i} className="relative pl-8">
                                                    <div className="absolute left-[-5px] top-1.5 w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_10px_#3b82f6]"></div>
                                                    <div className="text-blue-400 font-bold mb-1">{g.grade}</div>
                                                    <div className="text-slate-400 text-sm leading-relaxed">{g.task}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </DetailSection>

                        {/* Resource Links */}
                        <div className="flex flex-col md:flex-row gap-6 mt-20">
                            <a href="ap-learning.html" className="flex-1 glass-card p-8 rounded-2xl border-l-4 border-blue-500 hover:bg-blue-600/10 transition-all group flex flex-col justify-between">
                                <div>
                                    <div className="text-blue-500 mb-2">
                                        <Activity className="w-8 h-8" />
                                    </div>
                                    <h4 className="text-xl font-bold text-white mb-2">进入深度学习中心</h4>
                                    <p className="text-slate-500 text-xs leading-relaxed">集成 5 倍密度的名师视频、深度讲义、智能刷题与官方资源。开启全速备考模式。</p>
                                </div>
                                <div className="mt-6 flex items-center gap-2 text-[10px] font-bold text-blue-400 uppercase tracking-widest">
                                    Launch_Learning_Portal <svg className="w-3 h-3 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                                </div>
                            </a>
                            <a href="https://apstudents.collegeboard.org/course-index-page" target="_blank" className="flex-1 glass-card p-8 rounded-2xl border-l-4 border-slate-700 hover:bg-white/5 transition-all group flex flex-col justify-between">
                                <div>
                                    <div className="text-slate-400 mb-2">
                                        <BookOpen className="w-8 h-8" />
                                    </div>
                                    <h4 className="text-xl font-bold text-white mb-2">Official Syllabus</h4>
                                    <p className="text-slate-500 text-xs leading-relaxed">访问 College Board 官方大纲。确保您的学习路径与最新的考试要求百分之百对齐。</p>
                                </div>
                                <div className="mt-6 flex items-center gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest">
                                    External_Official_Site <svg className="w-3 h-3 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                                </div>
                            </a>
                        </div>
                    </main>

                    <footer className="py-20 border-t border-white/5 text-center">
                        <p className="text-slate-600 text-[10px] font-mono tracking-[0.4em] uppercase">Titan OS | Academic Intelligence Division | 2025</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=20260524_02"></script>
</body>

</html>
