<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可穿戴生物传感 | TITAN OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/titan-core.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { background-color: #030712; color: #ffffff; overflow-x: hidden; font-family: 'Noto Sans SC', sans-serif; }
        .glass-panel { background: rgba(0,0,0,0.5); backdrop-filter: blur(16px); border: 1px solid rgba(99, 102, 241, 0.2); }
        .bg-grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.1;
            background-image: linear-gradient(rgba(99, 102, 241,1) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 102, 241,1) 1px, transparent 1px);
            background-size: 50px 50px; transform: perspective(1000px) rotateX(45deg) scale(2);
            animation: grid-scroll 20s linear infinite; }
        @keyframes grid-scroll { 0% { transform: perspective(1000px) rotateX(45deg) scale(2) translateY(0); } 100% { transform: perspective(1000px) rotateX(45deg) scale(2) translateY(50px); } }
        
        .matrix-fall { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: 0.15; color: #818cf8; line-height: 1; font-size: 14px; white-space: pre; z-index: 0; font-family: monospace; }
        
        .hexa-cube { width: 100px; height: 100px; transform-style: preserve-3d; animation: spin-cube 15s infinite linear; }
        .hexa-face { position: absolute; width: 100%; height: 100%; border: 2px solid #818cf8; opacity: 0.6; background: rgba(99, 102, 241, 0.1); }
        .f-front { transform: translateZ(50px); } .f-back { transform: rotateY(180deg) translateZ(50px); }
        .f-right { transform: rotateY(90deg) translateZ(50px); } .f-left { transform: rotateY(-90deg) translateZ(50px); }
        .f-top { transform: rotateX(90deg) translateZ(50px); } .f-bottom { transform: rotateX(-90deg) translateZ(50px); }
        @keyframes spin-cube { 0% { transform: rotateX(0deg) rotateY(0deg); } 100% { transform: rotateX(360deg) rotateY(360deg); } }
    </style>
</head>
<body class="bg-[#030712] text-white">
    <div class="bg-grid"></div>
    <div class="matrix-fall" id="matrix-canvas"></div>
    
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-8">
        <a href="hub-auto-85.html" class="font-orbitron fixed top-8 left-8 text-xs px-4 py-2 rounded uppercase border bg-black bg-opacity-50 gs-rev transition-colors" style="color: #818cf8; border-color: rgba(99, 102, 241,0.3);">
            ← [ ABORT NODE & RETURN TO 柔性电子学 ]
        </a>
        
        <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center gs-rev">
            <div class="space-y-8">
                <div class="inline-flex items-center gap-3 px-4 py-1.5 rounded border w-fit font-mono" style="border-color: rgba(99, 102, 241,0.3); background: rgba(99, 102, 241,0.1)">
                    <span class="w-2 h-2 rounded bg-white animate-ping" style="background-color: #818cf8"></span>
                    <span class="text-xs font-bold tracking-widest" style="color: #818cf8">SUB-SYSTEM 02: SECURE</span>
                </div>
                
                <h1 class="text-5xl md:text-6xl font-black leading-tight bg-clip-text text-transparent font-orbitron" style="background-image: linear-gradient(to right, white, #818cf8)">
                    可穿戴生物传感
                </h1>
                
                <div class="glass-panel p-6 border-l-4" style="border-left-color: #818cf8">
                    <p class="text-lg text-gray-300 font-light leading-relaxed">
                        研究柔性导电水凝胶与皮肤贴附式传感器，实现连续生理指标监测。
                    </p>
                </div>
            </div>
            
            <div class="relative h-[400px] flex justify-center items-center gs-rev">
                <div style="perspective: 800px;">
                    <div class="hexa-cube">
                        <div class="hexa-face f-front"></div>
                        <div class="hexa-face f-back"></div>
                        <div class="hexa-face f-right"></div>
                        <div class="hexa-face f-left"></div>
                        <div class="hexa-face f-top"></div>
                        <div class="hexa-face f-bottom"></div>
                    </div>
                </div>
                <div class="absolute w-[300px] h-[300px] rounded-full border border-opacity-20 animate-[spin_10s_linear_infinite]" style="border-color: rgba(99, 102, 241,0.2);"></div>
                <div class="absolute w-[200px] h-[200px] rounded-full border border-dashed border-opacity-40 animate-[spin_8s_linear_infinite_reverse]" style="border-color: rgba(99, 102, 241,0.4);"></div>
            </div>
        </div>
    </div>
    
    <!-- TITAN AI ASSISTANT -->
    <script src="assets/js/titan-ai-assistant.js?v=20260524_02"></script>

    <script>
        gsap.from(".gs-rev", { y: 30, opacity: 0, duration: 1, stagger: 0.2, ease: "power3.out", delay: 0.5 });
        
        const canvas = document.getElementById('matrix-canvas');
        let txt = "";
        for(let i=0; i<40; i++) {
            for(let j=0; j<80; j++) {
                txt += Math.random() > 0.5 ? "1" : "0";
                txt += Math.random() > 0.8 ? " " : "";
            }
            txt += "\n";
        }
        canvas.textContent = txt;
        setInterval(() => {
            const arr = canvas.textContent.split("\n");
            arr.unshift(arr.pop());
            canvas.textContent = arr.join("\n");
        }, 50);
    </script>
</body>
</html>
