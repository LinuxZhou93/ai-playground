<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨子实验室基地“精英学者计划”招募通知</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    
    <!-- Google Fonts -->
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        /* Apple Glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }
        
        .glass-card-hover {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .glass-card-hover:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }
        
        /* Gradient Text (Apple Style) */
        .text-gradient {
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Google Colors Orbs */
        .orb-blue { background: #4285F4; }
        .orb-red { background: #EA4335; }
        .orb-yellow { background: #FBBC05; }
        .orb-green { background: #34A853; }
        
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            animation: float 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -50px) scale(1.2); }
            100% { transform: translate(-50px, 50px) scale(0.9); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        
        .scroll-animate {
            opacity: 0;
            transform: translateY(30px);
        }
        
        .animate-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        /* Interactive Tab */
        .tab-active {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid;
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>
<body class="custom-scrollbar">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ path, className, style, ...props }) => (

                {path}

        const BookOpen = (props) => <Icon path={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} {...props} />;
        const Rocket = (props) => <Icon path={<><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></>} {...props} />;
        const Lightbulb = (props) => <Icon path={<><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></>} {...props} />;
        const Cpu = (props) => <Icon path={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></>} {...props} />;
        const Trophy = (props) => <Icon path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>} {...props} />;
        const Microscope = (props) => <Icon path={<><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></>} {...props} />;
        const Target = (props) => <Icon path={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} {...props} />;
        const MapPin = (props) => <Icon path={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>} {...props} />;
        const Clock = (props) => <Icon path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} {...props} />;
        const CheckCircle = (props) => <Icon path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} {...props} />;
        const Layers = (props) => <Icon path={<><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></>} {...props} />;
        const ChevronRight = (props) => <Icon path={<><polyline points="9 18 15 12 9 6"/></>} {...props} />;
        const X = (props) => <Icon path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} {...props} />;

        const Modal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-in" style={{animationDuration: '0.3s'}}>
                    <div className="bg-[#111] border border-white/10 rounded-2xl max-w-md w-full p-8 relative shadow-2xl overflow-hidden glass-card">
                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-[#4285F4]/30 blur-3xl rounded-full"></div>
                        <button onClick={onClose} className="absolute top-4 right-4 text-white/50 hover:text-white transition-colors">
                            <X className="w-6 h-6" />
                        </button>
                        <h3 className="text-2xl font-bold mb-4 flex items-center gap-2">

                                <option value="j13" className="bg-[#111]">初中 一至三年级</option>

        };

        const App = () => {
            const [activeTab, setActiveTab] = useState(0);
            const [isModalOpen, setIsModalOpen] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('animate-in');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.1 });
                
                document.querySelectorAll('.scroll-animate').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);

            const goals = [
                { title: "科学探究", desc: "引导孩子开展探究性学习，培养科学兴趣，探索世界本质。", icon: Microscope, color: "text-[#4285F4]", bg: "bg-[#4285F4]/10", shadow: "shadow-[#4285F4]/20" },
                { title: "项目实践", desc: "通过PBL项目教学法，提升孩子解决实际问题的能力。", icon: Target, color: "text-[#EA4335]", bg: "bg-[#EA4335]/10", shadow: "shadow-[#EA4335]/20" },
                { title: "创新思维", desc: "激发孩子的创新潜能，培养设计思维和科学理论深度。", icon: Lightbulb, color: "text-[#FBBC05]", bg: "bg-[#FBBC05]/10", shadow: "shadow-[#FBBC05]/20" },
                { title: "STEM全栈", desc: "针对不同年龄段，提供全栈式的STEM深度结构课程。", icon: Layers, color: "text-[#34A853]", bg: "bg-[#34A853]/10", shadow: "shadow-[#34A853]/20" },
                { title: "专业课程", desc: "必修与辅修结合，涵盖机械、电子、计算机编程等硬核领域。", icon: Cpu, color: "text-[#4285F4]", bg: "bg-[#4285F4]/10", shadow: "shadow-[#4285F4]/20" },
                { title: "竞赛培养", desc: "参与各类科创竞赛，以赛促学，立足竞赛冲击奖牌。", icon: Trophy, color: "text-[#EA4335]", bg: "bg-[#EA4335]/10", shadow: "shadow-[#EA4335]/20" }
            ];

            const modules = [
                { id: "A", name: "模块 - 主线课程 (主修)", desc: "VEX机器人综合课程（融合机械结构、电子电路、计算机编程）", detail: "作为精英学者计划的最核心主轴，A模块要求学生掌握 VEX 体系中的构建艺术与赛事逻辑。", style: "border-[#4285F4]", color: "text-[#4285F4]", img: "https://images.unsplash.com/photo-1561557944-6e7860d1a7ef?auto=format&fit=crop&w=800&q=80" },
                { id: "B", name: "模块 - 技能树 (辅修)", desc: "计算机科学、电子信息、机械工程", detail: "三大分支辅修，包含程序设计/算法/数据结构，电子电路/通信，以及物理/三维建模/3D成型，构建复合型知识网络。", style: "border-[#FBBC05]", color: "text-[#FBBC05]", img: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80" },
                { id: "C", name: "模块 - 竞赛集训 (选修)", desc: "各项机器人及创客顶尖赛事集训", detail: "专注世界、国家、省、市级各类科创竞赛，分为学期中常态化特训与寒暑假封闭式强化。", style: "border-[#EA4335]", color: "text-[#EA4335]", img: "https://images.unsplash.com/photo-1581090464777-f3220bbe1b8b?auto=format&fit=crop&w=800&q=80" },
                { id: "D", name: "模块 - 技术工程营 (必修)", desc: "寒暑期核心课题研究项目", detail: "专注于长周期的重度工程实践与产出，跨学科融合，学生将以团队形式挑战真实的科研课题。", style: "border-[#34A853]", color: "text-[#34A853]", img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=800&q=80" }
            ];

            return (
                <div className="relative min-h-screen pb-24 overflow-hidden">
                    <Modal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} />
                    
                    {/* Google Orbs Background Filters */}
                    <div className="bg-orb orb-blue w-[600px] h-[600px] top-[-100px] left-[-200px]"></div>
                    <div className="bg-orb orb-red w-[500px] h-[500px] top-[20%] right-[-100px]"></div>
                    <div className="bg-orb orb-yellow w-[700px] h-[700px] bottom-[10%] left-[-300px]" style={{ animationDuration: '25s' }}></div>
                    <div className="bg-orb orb-green w-[600px] h-[600px] bottom-[-200px] right-[-100px]" style={{ animationDuration: '22s' }}></div>
                    
                    {/* Hero Section (Split Layout with Image) */}

                        <div className="flex flex-col md:flex-row items-center justify-between gap-12">
                            <div className="flex-1 scroll-animate z-10 w-full relative">

                                <div className="inline-block mb-6 px-5 py-2 rounded-full border border-white/10 bg-white/5 backdrop-blur-md text-sm font-semibold tracking-wide text-[#34A853]">
                                    <span className="flex items-center gap-2"><Rocket className="w-4 h-4" /> 2026年春季学期 招募启动</span>
                                </div>
                                <h1 className="text-6xl md:text-8xl font-black tracking-tighter mb-6 text-gradient py-2 leading-[1.1]">
                                    精英学者计划
                                </h1>
                                <p className="text-xl md:text-2xl text-white/70 font-light mb-8 leading-relaxed max-w-xl">
                                    选拔品学兼优、热爱科技的青少年，通过高能培养系统，造就未来的创新领军者。
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4">
                                    <button onClick={() => setIsModalOpen(true)} className="px-8 py-4 rounded-full bg-white text-black font-bold text-lg hover:bg-gray-200 transition-colors shadow-[0_0_30px_rgba(255,255,255,0.3)]">
                                        立即加入俱乐部
                                    </button>
                                    <a href="#details" className="px-8 py-4 rounded-full glass-card border border-white/20 text-white font-medium text-lg text-center hover:bg-white/10 transition-colors">
                                        了解课程详情
                                    </a>
                                </div>
                            </div>
                            
                            <div className="flex-1 scroll-animate delay-200 w-full relative">
                                <div className="relative w-full aspect-[4/3] rounded-3xl overflow-hidden glass-card border-none shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
                                    <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=1200" alt="Robotics Lab" className="absolute inset-0 w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-700" />
                                    <div className="absolute inset-0 bg-gradient-to-tr from-[#000000] via-transparent to-transparent opacity-80"></div>
                                    <div className="absolute bottom-6 left-6 right-6">

                                                <Trophy className="text-[#4285F4]" />
                                            </div>
                                            <div>

                                                <p className="text-white/60 text-sm">已培养超过 300 名精英学员</p>
                                            </div>

                            </div>

                            <h2 className="text-3xl font-bold mb-8 text-white flex items-center gap-3">
                                <BookOpen className="text-[#4285F4] w-8 h-8" />
                                致家长的邀请函
                            </h2>
                            <div className="space-y-6 text-white/70 text-lg leading-relaxed font-light relative z-10">
                                <p><strong className="text-white text-xl">尊敬的各位家长：</strong></p>
                                <p>墨子实验室基地启动第六批<strong className="text-white font-medium">“精英学者计划”</strong>，旨在选拔品学兼优、对科学技术有浓厚兴趣的学生，参与到学期常态化的系统培养，激发他们的科学兴趣，提升创新能力，培养具有科技特长的青少年科技后备人才。</p>
                                <p>墨子实验室自2023年暑期开始启动第一批培养计划，目前已有近 <strong className="text-white text-3xl font-black text-[#FBBC05]">300</strong> 名学员参与到墨子实验室精英学者科创俱乐部。本批次面向 <strong>2026年春季学期</strong> 新计划加入墨子实验室墨子学者的非在读学员。</p>
                                
                                <div className="mt-8 flex flex-col sm:flex-row gap-4">
                                    <div className="flex-1 p-6 rounded-2xl bg-white/5 border border-white/5 transition-transform hover:-translate-y-1">
                                        <h3 className="text-white font-semibold mb-2 flex items-center gap-2">
                                            <Clock className="w-5 h-5 text-[#34A853]" /> 课程总览
                                        </h3>
                                        <p className="text-sm">涵盖 VEX 机器人常规课、竞赛课程、项目制技能课程等，半年度总计约 <strong className="text-white text-xl">90</strong> 小时深度学习。</p>
                                    </div>
                                    <div className="flex-1 p-6 rounded-2xl bg-white/5 border border-white/5 transition-transform hover:-translate-y-1">
                                        <h3 className="text-white font-semibold mb-2 flex items-center gap-2">
                                            <Target className="w-5 h-5 text-[#EA4335]" /> 招募对象/条件
                                        </h3>
                                        <p className="text-sm">面向小学 <strong className="text-white">一至九年级</strong>，需对科学技术有浓厚兴趣，具备科技特长与创新潜质。</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Goals Matrix with images */}
                        <div className="mb-24 scroll-animate">
                            <h2 className="text-4xl font-bold mb-4 text-center">综合培养目标</h2>
                            <p className="text-center text-white/50 mb-12 max-w-2xl mx-auto text-lg hover:text-white/80 transition-colors">
                                助力学生在学业成就与硬核能力成就上的同步爆发发展。
                            </p>
                            
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {goals.map((g, idx) => (
                                    <div key={idx} className="glass-card glass-card-hover p-8 flex flex-col group overflow-hidden relative">
                                        {/* Subtle background glow on hover */}
                                        <div className={`absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-300 ${g.bg.replace('/10', '/30')}`}></div>
                                        
                                        <div className={`w-14 h-14 rounded-full ${g.bg} flex items-center justify-center mb-6 shadow-lg ${g.shadow} transition-transform duration-500 group-hover:scale-110 group-hover:rotate-12`}>
