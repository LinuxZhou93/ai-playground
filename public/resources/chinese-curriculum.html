                    <div className="bg-gray-900 border border-red-500/20 rounded-3xl w-full max-w-2xl overflow-hidden shadow-2xl transition-all max-h-[90vh] overflow-y-auto custom-scrollbar" onClick={e => e.stopPropagation()}>
                        <div className={`p-8 ${stage.color.replace('bg-', 'bg-')} bg-opacity-20 border-b border-red-500/20 flex justify-between items-start sticky top-0 backdrop-blur-xl z-20`}>
                            <div>
                                <h3 className="text-3xl font-chinese text-red-500 text-glow-red truncate">{data.title}</h3>
                                <p className="text-gray-400 mt-2 text-sm">{stage.label} · {stage.subtitle}</p>
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full transition-colors">
                                <X className="w-8 h-8 text-gray-500" />
                            </button>
                        </div>
                        <div className="p-8 space-y-8">
                            <section>
                                <h4 className="text-red-400 font-bold mb-4 flex items-center gap-2">
                                    <BookOpen className="w-5 h-5" /> 核心教纲与素养
                                </h4>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {data.core.map((item, i) => (
                                        <div key={i} className="flex items-center gap-3 bg-white/5 p-4 rounded-xl border border-white/5">
                                            <div className={`w-2 h-2 rounded-full ${stage.color}`}></div>
                                            <span className="text-gray-300 text-sm">{item}</span>
                                        </div>
                                    ))}
                                </div>
                            </section>
                            <section className="bg-gray-800/50 p-6 rounded-2xl border border-white/5">
                                <h4 className="text-blue-400 font-bold mb-3 italic">课程导引 Desc</h4>
                                <p className="text-gray-400 leading-relaxed">{data.desc}</p>
                            </section>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-purple-500/10 p-5 rounded-2xl border border-purple-500/20">
                                    <h4 className="text-purple-400 font-bold mb-3 flex items-center gap-2">
                                        <Zap className="w-4 h-4" /> 科技特长生赋能
                                    </h4>
                                    <p className="text-purple-300/80 text-sm font-mono leading-relaxed">{data.tech_tip}</p>
                                </div>
                                <div className="bg-emerald-500/10 p-5 rounded-2xl border border-emerald-500/20">
                                    <h4 className="text-emerald-400 font-bold mb-3 flex items-center gap-2">
                                        <Feather className="w-4 h-4" /> 未来愿景 Future
                                    </h4>
                                    <p className="text-emerald-300/80 text-sm leading-relaxed">{data.future}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedNode, setSelectedNode] = useState(null);
            const [selectedStage, setSelectedStage] = useState(null);

            // Filter logic
            const queryParams = new URLSearchParams(window.location.search);
            const stageFilter = queryParams.get('stage'); // 'p', 'j', 's'

            let filteredStages = stages;
            let stageTitle = "";

            if (stageFilter === 'p') {
                filteredStages = stages.filter(s => s.id.startsWith('p_'));
                stageTitle = " - 小学阶段";
            } else if (stageFilter === 'j') {
                filteredStages = stages.filter(s => s.id.startsWith('j_'));
                stageTitle = " - 初中阶段";
            } else if (stageFilter === 's') {
                filteredStages = stages.filter(s => s.id.startsWith('s_'));
                stageTitle = " - 高中阶段";
            }

            const gridClass = `grid grid-cols-[200px_repeat(${filteredStages.length},300px)] gap-8`;

            useEffect(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, []);

            return (
                <div className="min-h-screen relative selection:bg-red-500/30">
                    {/* Background decor */}
                    <div className="fixed inset-0 pointer-events-none opacity-20">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-red-900/40 blur-[150px] rounded-full"></div>
                        <div className="absolute bottom-[10%] right-[-5%] w-[30%] h-[30%] bg-orange-900/30 blur-[130px] rounded-full"></div>
                    </div>

                    {/* Navigation */}
                    <nav className="fixed top-8 left-0 right-0 z-50 px-8 flex justify-between items-center">
                        <div className="flex items-center gap-6">
                            <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-red-600 to-amber-600 flex items-center justify-center text-2xl font-bold shadow-lg shadow-red-900/20">
                                漢
                            </div>
                            <div className="hidden md:block">
                                <h2 className="text-xl font-chinese font-bold tracking-widest text-white">大语文芯体系</h2>
                                <p className="text-[10px] text-gray-500 font-mono tracking-widest uppercase">High-Fidelity Humanities Engine</p>
                            </div>
                        </div>

                        <div className="flex gap-4">
                            <a href="subject-synergy.html" className="group h-12 px-6 flex items-center gap-3 glass-card rounded-2xl hover:bg-white/10 transition-all border border-red-900/30">
                                <Home className="w-4 h-4 text-red-500" />
                                <span className="text-xs font-chinese text-gray-400 group-hover:text-white transition-colors">学科协同中心</span>
                            </a>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="pt-40 pb-20 px-8 text-center">
                        <div className="inline-flex items-center gap-3 px-4 py-2 rounded-full border border-red-500/20 bg-red-500/5 text-red-400 text-[10px] font-mono tracking-[0.3em] uppercase mb-8">
                            <div className="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                            K12 Spectrum System
                        </div>
                        <h1 className="text-6xl md:text-8xl font-chinese font-bold text-white tracking-tighter mb-8 glow-text">
                            人文底座{stageTitle}
                        </h1>
                        <p className="max-w-3xl mx-auto text-xl text-gray-500 font-chinese leading-relaxed">
                            构建科技特长生的文化脊梁。从识字识词到哲学思辨，打造全息认知的母语根基。
                        </p>
                    </header>

                    {/* Main Interface */}
                    <main className="px-8 pb-40">
                        <div className="glass-card rounded-[3rem] p-12 overflow-x-auto custom-scrollbar">
                            <div className="w-fit">
                                <div className={`${gridClass} mb-12 border-b border-white/5 pb-12`}>
                                    <div className="flex flex-col justify-end p-6 border-r border-white/5 pr-8">
                                        <h3 className="text-3xl font-chinese font-bold text-gray-200">全景路径</h3>
                                        <p className="text-[10px] text-gray-600 font-mono mt-2 tracking-widest uppercase">Learning Stages</p>
                                    </div>
                                    {filteredStages.map(stage => (
                                        <div key={stage.id} className="p-8 rounded-[2.5rem] bg-white/5 border border-white/10 flex flex-col items-center justify-center text-center group hover:border-red-500/30 transition-all">
                                            <div className="text-sm font-mono text-gray-500 mb-2">{stage.id.toUpperCase()}</div>
                                            <h4 className="text-2xl font-chinese font-bold text-white mb-2">{stage.label}</h4>
                                            <p className="text-[10px] text-gray-500 tracking-widest uppercase">{stage.subtitle}</p>
                                        </div>
                                    ))}
                                </div>

                                {tracks.map(track => (
                                    <div key={track.id} className={`${gridClass} gap-8 group`}>
                                        <div className="flex flex-col items-end justify-center p-6 text-right border-r border-white/5 pr-8">
                                            <track.icon className={`w-8 h-8 ${track.color} mb-4`} />
                                            <h4 className="text-2xl font-chinese text-white mb-2">{track.title}</h4>
                                            <p className="text-[10px] text-gray-500 font-mono tracking-widest uppercase">{track.desc}</p>
                                        </div>
                                        {filteredStages.map(stage => {
                                            const data = curriculumData[track.id]?.[stage.id];
                                            return (
                                                <div
                                                    key={`${track.id}-${stage.id}`}
                                                    onClick={() => { setSelectedNode(data); setSelectedStage(stage); }}
                                                    className="glass-card rounded-[2rem] p-8 cursor-pointer relative overflow-hidden group/card"
                                                >
                                                    <div className={`absolute top-0 right-0 w-24 h-24 bg-gradient-to-br ${stage.glow} to-transparent opacity-0 group-hover/card:opacity-100 transition-opacity`}></div>
                                                    <h5 className="text-xl font-bold text-gray-100 mb-4 group-hover/card:text-red-400 transition-colors">{data?.title || "规划中..."}</h5>
                                                    <div className="space-y-4">
                                                        <div className="flex flex-wrap gap-2">
                                                            {data?.core.slice(0, 2).map((c, i) => (
                                                                <span key={i} className="text-[10px] bg-white/5 px-2 py-1 rounded-md text-gray-400 border border-white/5">{c}</span>
                                                            ))}
                                                        </div>
                                                        <p className="text-xs text-gray-500 line-clamp-3 leading-loose">{data?.desc}</p>
                                                    </div>
                                                    <div className="mt-8 flex items-center justify-between">
                                                        <div className="flex gap-1.5">
                                                            <div className="w-1.5 h-1.5 rounded-full bg-red-500"></div>
                                                            <div className="w-1.5 h-1.5 rounded-full bg-blue-500 opacity-30"></div>
                                                            <div className="w-1.5 h-1.5 rounded-full bg-amber-500 opacity-30"></div>
                                                        </div>
                                                        <span className="text-[10px] text-gray-600 font-mono">EXPLORE →</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>

                    <DetailModal
                        isOpen={!!selectedNode}
                        onClose={() => { setSelectedNode(null); setSelectedStage(null); }}
                        data={selectedNode}
                        stage={selectedStage}
                    />

                    <footer className="py-20 border-t border-white/5 bg-black/50 backdrop-blur-md">
                        <div className="max-w-7xl mx-auto px-6 text-center">
                            <p className="text-gray-600 text-sm mb-4">© TITAN OS ACADEMIC CENTER · 科技特长生人文底座规划</p>
                            <div className="flex justify-center gap-8 text-gray-400 text-xs font-chinese">
                                <span>博学之</span><span>审问之</span><span>慎思之</span><span>明辨之</span><span>笃行之</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.26_10"></script>
