        }

            from {

                transform: translateY(10px);
            }

            }
        }

            transform: translateY(-4px);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .competition-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 0.75rem;
            padding: 2px;
            background: linear-gradient(45deg, transparent, rgba(56, 189, 248, 0.3), transparent);

            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .competition-card:hover::after {
            opacity: 1;
        }

        /* Modal Animation */
        .modal-enter {

            transform: scale(1);
        }

        .modal-exit-active {
            opacity: 0;
            transform: scale(0.95);

                            </h3>
                            <div class="flex flex-wrap gap-2">

                        </section>

                            <h3 class="text-lg font-bold text-white mb-3 flex items-center gap-2">

            void modalBackdrop.offsetWidth;

            modalBackdrop.classList.remove('opacity-0');

        function closeModal() {
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalContent = document.getElementById('modal-content');

            modalBackdrop.classList.add('opacity-0');
            modalContent.classList.add('scale-95');

                document.body.style.overflow = '';
            }, 300);
        }

        // --- White List Logic ---
        let currentWhiteListTab = 'science';
        let currentWhiteDetail = null; // Store current detail item

        function openWhiteList() {
            const modal = document.getElementById('white-list-modal');
            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');

            // Generate descriptions if not present (Lazy Polyfill)
            polyfillDescriptions();

            renderWhiteList();
        }

        function closeWhiteList() {
            const modal = document.getElementById('white-list-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                currentWhiteDetail = null; // Reset
            }, 300);
        }

        function switchWhiteListTab(tab) {
            currentWhiteListTab = tab;
            currentWhiteDetail = null; // Back to list when switching tabs
            renderWhiteList();
        }

        function openWhiteDetail(id) {
            const items = whiteListData[currentWhiteListTab];
            const item = items.find(i => i.id === id);
            if (item) {
                currentWhiteDetail = item;
                renderWhiteDetail();
            }
        }

        function backToWhiteList() {
            currentWhiteDetail = null;
            renderWhiteList();
        }

            const container = document.getElementById('white-list-content');

                renderWhiteDetail();
                return;

            const items = whiteListData[currentWhiteListTab];

                    <button onclick="switchWhiteListTab('humanities')" class="px-6 py-2 rounded-lg font-bold transition-all ${currentWhiteListTab === 'humanities' ? 'bg-purple-900/50 text-purple-300 border border-purple-500/50 shadow-[0_0_15px_rgba(192,132,252,0.2)]' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">人文综合类</button>
                    <button onclick="switchWhiteListTab('arts')" class="px-6 py-2 rounded-lg font-bold transition-all ${currentWhiteListTab === 'arts' ? 'bg-emerald-900/50 text-emerald-300 border border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.2)]' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">艺术体育类</button>

                             <div>
                                <div class="flex justify-between items-start mb-2 pl-3">
                                    <span class="text-xs font-mono text-slate-500">NO.${item.id}</span>
                                    ${item.tag ? `<span class="px-2 py-0.5 text-[10px] rounded border shadow ${item.tag === '推荐' || item.tag === 'AI创无界' ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-white/10 text-white border-white/20'}">${item.tag}</span>` : ''}

                        <div class="relative z-10">

                                <span class="px-3 py-1 bg-slate-700/50 text-slate-300 border border-slate-600 rounded-lg text-xs">${item.scope}</span>
                                ${item.tag ? `<span class="px-3 py-1 rounded-lg text-xs font-bold border ${item.tag === '推荐' || item.tag === 'AI创无界' ? 'bg-amber-500/20 text-amber-300 border-amber-500/30' : 'bg-white/10 text-white border-white/20'}">${item.tag}</span>` : ''}

                            <h1 class="text-2xl md:text-3xl font-black text-white mb-8 leading-tight tracking-tight">

                                <button onclick="alert('暂无官网链接')" class="px-6 py-3 bg-slate-700/50 text-slate-400 rounded-xl font-bold cursor-not-allowed">

                                </button>

                                    收藏赛事
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Helper to add dummy descriptions (Idempotent)
        function polyfillDescriptions() {
            Object.keys(whiteListData).forEach(key => {
                whiteListData[key].forEach(item => {
                    if (!item.description) {
                        // Basic template based on type
                        let type = key === 'science' ? '科技创新与科学探究' :
                            key === 'humanities' ? '人文素养与社会实践' : '艺术审美与体育竞技';

                        item.description = `
                            <strong>${item.name}</strong> 是由 <strong>${item.organizer}</strong> 主办的面向 <strong>${item.scope}</strong> 的国家级竞赛活动。<br><br>
                            该赛事属于教育部"白名单"中的${type}类项目，具有极高的权威性和认可度。
                            通过参与该赛事，学生不仅能够锻炼专业技能，还能在综合素质评价、名校申请（强基计划/综合评价）中获得重要优势。<br><br>
                            适合希望在 ${item.name.includes("奥林匹克") ? "学科竞赛" : item.name.includes("创新") ? "科技发明" : "综合素养"} 领域深入发展的同学参与。
                         `;
                    }
                });
            });
        }



        // Close modal on click outside
        // Close modal on click outside
        document.getElementById('modal-backdrop').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal-backdrop')) {
                closeModal();

        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('robotics');
        });

    </script>
