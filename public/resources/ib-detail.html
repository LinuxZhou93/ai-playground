<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IB DP 课程详解 | IB Diploma Program Detailed Guide</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    

    <!-- Google Fonts -->
    <link
        href="https://fonts.loli.net/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #fbbf24;
            --primary-glow: rgba(251, 191, 36, 0.4);
        }

        body {
            background-color: #0c0a09;
            /* Slightly warmer dark bg */
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-card {
            background: rgba(41, 37, 36, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

        .hero-bg {
            background: radial-gradient(circle at top right, rgba(251, 191, 36, 0.12), transparent),
                radial-gradient(circle at 10% 90%, rgba(168, 85, 247, 0.08), transparent);
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .scroll-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .stat-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid rgba(251, 191, 36, 0.1);
            border-top-color: var(--primary);
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Compass = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10" /><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" /></IconBase>;
        const BookOpen = (props) => <IconBase {...props}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></IconBase>;
        const Award = (props) => <IconBase {...props}><circle cx="12" cy="8" r="7" /><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" /></IconBase>;
        const Users = (props) => <IconBase {...props}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="19" cy="11" r="4" /></IconBase>;
        const ArrowLeft = (props) => <IconBase {...props}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></IconBase>;

        const DetailSection = ({ title, subtitle, children }) => (
            <section className="mb-24 scroll-reveal">
                <div className="flex items-center gap-4 mb-8">
                    <div className="h-0.5 w-12 bg-amber-500"></div>
                    <div>
                        <h2 className="text-3xl font-orbitron font-bold text-white uppercase tracking-tighter">{title}</h2>
                        <span className="text-xs font-mono text-amber-400/60 uppercase tracking-widest">{subtitle}</span>
                    </div>
                </div>
                {children}
            </section>
        );

        const App = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);

            return (
                <div className="min-h-screen hero-bg">
                    {/* Header/Nav */}
                    <nav className="fixed top-0 w-full z-50 p-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
                        <a href="international-hub.html" className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
                            <div className="p-2 rounded-lg bg-white/5 border border-white/10 group-hover:border-amber-500/50 transition-all">
                                <ArrowLeft className="w-5 h-5" />
                            </div>
                            <span className="text-xs font-bold tracking-widest uppercase">返回全球智慧中心</span>
                        </a>
                        <div className="text-[10px] font-mono text-amber-400 tracking-widest">ECOSYSTEM: IB_DP_QUALIFICATION</div>
                    </nav>

                    <main className="container mx-auto px-6 pt-40 pb-20">
                        {/* Hero Section */}
                        <div className="max-w-4xl mb-32">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-500 text-[10px] font-bold uppercase tracking-widest mb-8">
                                <Award className="w-3 h-3" /> International Baccalaureate Organization
                            </div>
                            <h1 className="text-7xl md:text-9xl font-orbitron font-bold text-white mb-8 leading-none">
                                IB / DP<br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-600">The Gold Standard</span>
                            </h1>
                            <p className="text-xl text-slate-400 leading-relaxed font-light max-w-2xl border-l-2 border-amber-500/30 pl-8">
                                国际文凭大学预科项目（IB Diploma Programme），被公认为目前全球认可度最高、难度最大、培养体系最为完善的精英教育体系。它不只是关于课本知识，更致力于培养具备批判性思维、跨文化理解力和社会责任感的“终身学习者”。
                            </p>
                        </div>

                        {/* Core Pillars (The Hexagon Pattern Inspired) */}
                        <DetailSection title="核心体系 (The Core)" subtitle="STRUCTURE_OF_ELITE_EDUCATION">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {[
                                    { icon: Compass, title: "TOK", fullName: "Theory of Knowledge", desc: "知识论：核心中的核心，探索“我们如何知道我们所知道的”，培养终身受用的思辨能力。" },
                                    { icon: BookOpen, title: "EE", fullName: "Extended Essay", desc: "拓展论文：在导师指导下完成一篇4000字的独立研究论文，提前对接大学学术研究强度。" },
                                    { icon: Users, title: "CAS", fullName: "Creativity, Activity, Service", desc: "课外实践：通过创意发明、体育锻炼和社会服务，平衡学术与身心，建立真实世界的联结。" }
                                ].map((item, idx) => (
                                    <div key={idx} className="glass-card rounded-[2rem] p-8 border-t-2 border-amber-500/30">
                                        <item.icon className="w-8 h-8 text-amber-500 mb-6" />
                                        <h3 className="text-4xl font-orbitron font-bold text-white mb-2">{item.title}</h3>
                                        <h4 className="text-xs font-bold text-amber-500 uppercase tracking-widest mb-4">{item.fullName}</h4>
                                        <p className="text-slate-400 text-sm leading-relaxed">{item.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </DetailSection>

                        {/* Subject Groups */}
                        <DetailSection title="学科组矩阵" subtitle="THE_6_ACADEMIC_GROUPS">
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                {[
                                    { group: "Group 1", title: "语言与文学", items: "母语探究 · 文化认同" },
                                    { group: "Group 2", title: "语言习得", items: "第二语言 · 跨文化沟通" },
                                    { group: "Group 3", title: "人文与社会", items: "经济 · 哲学 · 心理学 · 历史" },
                                    { group: "Group 4", title: "实验科学", items: "物理 · 化学 · 生物 · 设计" },
                                    { group: "Group 5", title: "数学", items: "AA(分析) · AI(应用)" },
                                    { group: "Group 6", title: "艺术", items: "视觉艺术 · 戏剧 · 音乐" }
                                ].map((g, i) => (
                                    <div key={i} className="p-8 rounded-3xl bg-white/5 border border-white/10 hover:border-amber-500/30 group transition-all">
                                        <span className="text-[10px] font-bold text-amber-500/50 uppercase tracking-widest">{g.group}</span>
                                        <h3 className="text-xl font-bold text-white mt-1 mb-3">{g.title}</h3>
                                        <p className="text-slate-500 text-xs font-mono">{g.items}</p>
                                    </div>
                                ))}
                            </div>
                            <div className="mt-12 p-8 glass-card rounded-2xl flex flex-col md:flex-row gap-8 items-center justify-between border-dashed border-2 border-amber-500/20">
                                <div className="max-w-xl">
                                    <h4 className="text-lg font-bold text-white mb-2">HL (High Level) vs SL (Standard Level)</h4>
                                    <p className="text-slate-400 text-sm italic">学生需从上述组别中选择6门课（3门高水平HL，3门标准水平SL），确保学术的广度与专业深度的平衡。</p>
                                </div>
                                <div className="flex-shrink-0 bg-amber-500 text-stone-900 px-8 py-3 rounded-full font-bold text-xs uppercase tracking-widest">Balanced Excellence</div>
                            </div>
                        </DetailSection>

                        {/* Scoring Logic */}
                        <DetailSection title="评分与评估" subtitle="THE_45_POINTS_MATRIX">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                                <div className="space-y-8">
                                    <div className="flex gap-10 items-center">
                                        <div className="stat-ring flex items-center justify-center font-orbitron font-bold text-2xl text-amber-500">45</div>
                                        <div>
                                            <h4 className="text-xl font-bold">最高满分 45分</h4>
                                            <p className="text-slate-500 text-xs">6门课 x 7分 + 核心课程(TOK/EE) 3分奖分</p>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="flex justify-between border-b border-white/10 pb-2">
                                            <span className="text-slate-400">常春藤录取线参考</span>
                                            <span className="text-amber-500 font-bold">40+</span>
                                        </div>
                                        <div className="flex justify-between border-b border-white/10 pb-2">
                                            <span className="text-slate-400">知名大学基准线</span>
                                            <span className="text-amber-500 font-bold">36+</span>
                                        </div>
                                        <div className="flex justify-between border-b border-white/10 pb-2">
                                            <span className="text-slate-400">文凭获取合格线</span>
                                            <span className="text-amber-500 font-bold">24+</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="glass-card p-10 rounded-[2rem] border-l-4 border-amber-500">
                                    <h4 className="text-xl font-bold mb-4 uppercase tracking-widest">IA (Internal Assessment)</h4>
                                    <p className="text-slate-400 text-sm leading-relaxed mb-6">
                                        不同于AP的单次考试定终身，IB强调 **持续评估**。每门课都有20%-30%的成绩来源于“内部评估”——即由学生在校内完成的实验报告、学术调研或论文。这极大锻炼了学生真实的研究能力。
                                    </p>
                                    <div className="flex gap-2">
                                        <div className="h-1 flex-1 bg-amber-500/20"></div>
                                        <div className="h-1 flex-1 bg-amber-500/40"></div>
                                        <div className="h-1 flex-1 bg-amber-500"></div>
                                    </div>
                                </div>
                            </div>
                        </DetailSection>

                        {/* Footer call to action */}
                        <div className="mt-32 text-center p-20 glass-card rounded-[3rem] border border-amber-500/10">
                            <h3 className="text-3xl font-orbitron font-bold text-white mb-6">准备好接受精英教育的洗礼了吗？</h3>
                            <div className="flex flex-wrap justify-center gap-6">
                                <a href="https://www.ibo.org" target="_blank" className="px-10 py-4 bg-amber-600 hover:bg-amber-500 text-stone-900 font-bold rounded-2xl transition-all shadow-xl shadow-amber-600/20">访问 IBO 官网</a>
                                <button className="px-10 py-4 glass-card text-white font-bold rounded-2xl border border-white/10">获取选课咨询</button>
                            </div>
                        </div>
                    </main>

                    <footer className="py-20 border-t border-white/5 text-center">
                        <p className="text-slate-600 text-[10px] font-mono tracking-[0.4em] uppercase">Titan OS | Global Elite Education Protocol | 2025</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=20260524_02"></script>
</body>

</html>
