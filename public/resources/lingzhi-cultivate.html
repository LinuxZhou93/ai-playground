<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云雾培芝 | 体感互动体验</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;700&family=Outfit:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #D4AF37;
            --primary-rgb: 212, 175, 55;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --font-main: 'Outfit', sans-serif;
            --font-title: 'Noto Serif SC', serif;
        }
        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            background: var(--dark);
            font-family: var(--font-main); color: var(--text);
            overflow: hidden; user-select: none;
        }

        /* --- Dynamic Atmosphere Background --- */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            background: 
                radial-gradient(circle at 30% 20%, rgba(80, 200, 120, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
            filter: blur(80px);
        }

        .mist-container {
            position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
            opacity: 0.3;
        }
        .mist {
            position: absolute; width: 200%; height: 200%;
            background: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
            filter: invert(1) opacity(0.1);
            animation: drift 80s linear infinite;
        }
        @keyframes drift {
            from { transform: translate(-20%, -10%); }
            to { transform: translate(0%, 0%); }
        }

        #container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative;
        }

        .header {
            position: absolute; top: 80px; text-align: center;
            z-index: 10;
        }
        .title { 
            font-family: var(--font-title); font-size: 42px; 
            color: var(--primary); letter-spacing: 6px; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 14px; opacity: 0.5; margin-top: 15px; letter-spacing: 3px; text-transform: uppercase;}
        
        .stage-indicator {
            position: absolute; top: 180px;
            display: flex; gap: 15px;
            background: rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        .stage-dot {
            width: 10px; height: 10px; border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stage-dot.active { 
            background: var(--primary); border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transform: scale(1.3);
        }

        #lingzhi-plant {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 120px; transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(212, 175, 55, 0.1);
            position: relative;
            box-shadow: inset 0 0 50px rgba(212, 175, 55, 0.05);
        }

        #lingzhi-plant::before {
            content: ''; position: absolute; inset: -20px;
            border: 1px dashed rgba(212, 175, 55, 0.2);
            border-radius: 50%; animation: rotate 20s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .actions {
            position: absolute; bottom: 100px; display: flex; gap: 30px;
            z-index: 100;
        }
        .btn {
            background: var(--glass); color: #fff;
            border: 1px solid rgba(255,255,255,0.1); padding: 18px 45px;
            font-size: 14px; letter-spacing: 2px; cursor: pointer; border-radius: 100px;
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            backdrop-filter: blur(10px);
            text-transform: uppercase; font-weight: 700;
        }
        .btn.hovered { 
            background: var(--primary); color: #000; 
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            transform: translateY(-5px);
        }
        
        #message {
            position: absolute; bottom: 210px;
            font-size: 16px; color: var(--primary);
            letter-spacing: 2px;
            font-weight: 300;
            opacity: 0; transition: opacity 0.5s, transform 0.5s;
            transform: translateY(10px);
        }

        .back-btn {
            position: absolute; top: 40px; left: 40px;
            color: rgba(255,255,255,0.6); text-decoration: none; 
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 25px; border-radius: 100px; 
            font-size: 12px; letter-spacing: 1px;
            transition: 0.4s; z-index: 100;
            backdrop-filter: blur(10px);
        }
        .back-btn.hovered { 
            background: #fff; color: #000; border-color: #fff; 
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        
        /* Particle effects */
        .particle {
            position: absolute; pointer-events: none;
            background: #fff; border-radius: 50%;
            animation: float-up 1.5s ease-out forwards;
        }
        @keyframes float-up {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        .input_video { display: none; }
        
        /* --- Sophisticated Hand Cursor --- */
        #hand-cursor {
            position: fixed;
            width: 50px; height: 50px;
            margin-left: -25px; margin-top: -25px;
            pointer-events: none;
            z-index: 10000;
            display: flex;
            align-items: center; justify-content: center;
        }
        .cursor-ring { position: absolute; width: 100%; height: 100%; transform: rotate(-90deg); }
        .cursor-ring circle { fill: none; stroke-width: 3; stroke-linecap: round; }
        .cursor-ring-bg { stroke: rgba(255, 255, 255, 0.1); }
        .cursor-ring-progress {
            stroke: var(--primary); stroke-dasharray: 126; stroke-dashoffset: 126;
            transition: stroke-dashoffset 0.1s linear; filter: drop-shadow(0 0 5px var(--primary));
        }
        .cursor-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px #fff; }

        #camera-status { 
            position: fixed; bottom: 30px; right: 40px; 
            color: rgba(255,255,255,0.3); font-size: 11px; 
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="mist-container"><div class="mist"></div></div>

    <div id="hand-cursor" style="display:none;">
        <svg class="cursor-ring" viewBox="0 0 50 50">
            <circle class="cursor-ring-bg" cx="25" cy="25" r="20"></circle>
            <circle class="cursor-ring-progress" cx="25" cy="25" r="20"></circle>
        </svg>
        <div class="cursor-dot"></div>
    </div>

    <video class="input_video" autoplay playsinline></video>
    <div id="camera-status">📷 初始化体感系统...</div>

    <div class="back-btn interactive-obj" data-action="exit">← 返回元宇宙大厅</div>
    <div id="container">
        <div class="header">
            <h1 class="title">云雾培芝模拟器</h1>
            <div class="subtitle">Mist-Cultivation Simulator / Huangcunba Forest</div>
        </div>
        
        <div class="stage-indicator">
            <div class="stage-dot active" id="dot-0"></div>
            <div class="stage-dot" id="dot-1"></div>
            <div class="stage-dot" id="dot-2"></div>
            <div class="stage-dot" id="dot-3"></div>
            <div class="stage-dot" id="dot-4"></div>
        </div>

        <div id="lingzhi-plant">🌱</div>
        <div id="message">请悬停光标浇灌纯净山泉水...</div>

        <div class="actions">
            <div class="btn interactive-obj" data-action="water" id="btn-water">💧 浇灌泉水 / WATER</div>
            <div class="btn interactive-obj" data-action="sun" id="btn-sun">☀️ 补充光照 / LIGHT</div>
            <div class="btn interactive-obj" data-action="harvest" id="btn-harvest" style="display:none; background: var(--primary); color: black;">✨ 采摘灵芝 / HARVEST</div>
        </div>
    </div>

    <script>
        let stage = 0;
        const stages = ['🌱', '🌿', '🍄 (幼体)', '🍄 (成体)', '✨ 金边灵芝 ✨'];
        const requirements = [
            { type: 'water', msg: '孢子萌发需要水分...' },
            { type: 'sun', msg: '幼苗需要温和的光照...' },
            { type: 'water', msg: '子实体生长需要高湿度...' },
            { type: 'sun', msg: '积累有效物质需要光照...' }
        ];

        const plant = document.getElementById('lingzhi-plant');
        const msg = document.getElementById('message');
        const btnWater = document.getElementById('btn-water');
        const btnSun = document.getElementById('btn-sun');
        const btnHarvest = document.getElementById('btn-harvest');
        const progressCircle = document.querySelector('.cursor-ring-progress');
        const CIRCUMFERENCE = 126;

        function updateProgress(percent) {
            const offset = CIRCUMFERENCE - (percent * CIRCUMFERENCE);
            progressCircle.style.strokeDashoffset = offset;
        }

        function showMessage(text) {
            msg.innerText = text;
            msg.style.opacity = 1;
            msg.style.transform = 'translateY(0)';
            setTimeout(() => { 
                msg.style.opacity = 0; 
                msg.style.transform = 'translateY(10px)';
            }, 3000);
        }

        function createParticles(color) {
            for(let i=0; i<20; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 8 + 4;
                p.style.width = `${size}px`; 
                p.style.height = `${size}px`;
                p.style.left = '50%'; p.style.top = '50%';
                p.style.background = color;
                p.style.boxShadow = `0 0 10px ${color}`;
                
                const dx = (Math.random() - 0.5) * 400;
                const dy = (Math.random() - 0.5) * 400;
                p.style.setProperty('--dx', `${dx}px`);
                p.style.setProperty('--dy', `${dy}px`);
                
                plant.appendChild(p);
                setTimeout(() => p.remove(), 1500);
            }
        }

        function advance(action) {
            if (stage >= 4) return;
            if (requirements[stage].type === action) {
                stage++;
                plant.innerText = stages[stage];
                plant.style.transform = `scale(${1 + stage * 0.15})`;
                document.getElementById(`dot-${stage}`).classList.add('active');
                
                if (stage < 4) {
                    showMessage(`生长阶段提升！现在需要：${requirements[stage].type === 'water'? '水分' : '光照'}`);
                } else {
                    showMessage('培育成功！品质极佳的纯正灵芝！');
                    btnHarvest.style.display = 'block';
                    btnWater.style.display = 'none';
                    btnSun.style.display = 'none';
                    plant.style.boxShadow = '0 0 50px rgba(212, 175, 55, 0.4)';
                }
            } else {
                showMessage(`当前阶段不需要${action === 'water' ? '浇水' : '光照'}哦~`);
            }
        }

        function water() {
            createParticles('#4fc3f7');
            advance('water');
        }

        function sunlight() {
            createParticles('#ffee58');
            advance('sun');
        }

        function harvest() {
            plant.innerText = '🏆 获得极品灵芝';
            plant.style.fontSize = '40px';
            plant.style.color = '#D4AF37';
            plant.style.border = 'none';
            btnHarvest.style.display = 'none';
            showMessage('恭喜！已收集至资产库。');
            setTimeout(() => window.location.href = 'lingzhi-hub.html', 4000);
        }

        // Camera Hover Interaction Logic
        const videoElement = document.querySelector('.input_video');
        const cursor = document.getElementById('hand-cursor');
        const statusEl = document.getElementById('camera-status');
        
        let interactables = document.querySelectorAll('.interactive-obj');
        let currentHoveredObj = null;
        let hoverStartTime = 0;
        let HOVER_TRIGGER_DELAY = 1500;
        let cursorX = window.innerWidth / 2, cursorY = window.innerHeight / 2;

        function refreshInteractables() {
            interactables = document.querySelectorAll('.interactive-obj');
        }

        function onResults(results) {
            statusEl.innerText = '🟢 体感追踪就绪 / SYSTEM ACTIVE';
            cursor.style.display = 'flex';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const pt = results.multiHandLandmarks[0][8];
                let targetX = (1 - pt.x) * window.innerWidth;
                let targetY = pt.y * window.innerHeight;

                cursorX += (targetX - cursorX) * 0.4;
                cursorY += (targetY - cursorY) * 0.4;

                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';

                checkCollision(cursorX, cursorY);
            } else {
                updateProgress(0);
                if (currentHoveredObj) currentHoveredObj.classList.remove('hovered');
                currentHoveredObj = null;
            }
        }

        function checkCollision(cx, cy) {
            refreshInteractables();
            let found = null;
            interactables.forEach(obj => {
                if (window.getComputedStyle(obj).display === 'none') return;
                const rect = obj.getBoundingClientRect();
                if (cx >= rect.left && cx <= rect.right && cy >= rect.top && cy <= rect.bottom) {
                    found = obj;
                }
            });

            if (found !== currentHoveredObj) {
                if(currentHoveredObj) currentHoveredObj.classList.remove('hovered');
                currentHoveredObj = found;
                if (found) {
                    found.classList.add('hovered');
                    hoverStartTime = Date.now();
                } else {
                    updateProgress(0);
                }
            } else if (found) {
                let elapsed = Date.now() - hoverStartTime;
                let percent = Math.min(elapsed / HOVER_TRIGGER_DELAY, 1);
                updateProgress(percent);

                if (elapsed >= HOVER_TRIGGER_DELAY) {
                    hoverStartTime = Date.now() + 5000;
                    updateProgress(0);
                    found.classList.remove('hovered');
                    
                    const action = found.dataset.action;
                    if (action === 'exit') {
                        window.location.href = 'lingzhi-hub.html';
                    } else if (action === 'water') {
                        water();
                    } else if (action === 'sun') {
                        sunlight();
                    } else if (action === 'harvest') {
                        harvest();
                    }
                    currentHoveredObj = null;
                }
            }
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.5 });
        hands.onResults(onResults);
        const camera = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, width: 640, height: 480 });
        camera.start().catch(() => {
            statusEl.innerText = '⚠️ 摄像头不可用，切换至模拟模式';
            statusEl.style.color = '#ff5252';
        });

        // Mouse Fallback
        document.addEventListener('mousemove', (e) => {
            if(statusEl.innerText.includes('不可用') || statusEl.innerText.includes('初始化')) {
                cursor.style.display = 'flex';
                cursorX = e.clientX; cursorY = e.clientY;
                cursor.style.left = cursorX + 'px'; cursor.style.top = cursorY + 'px';
                checkCollision(cursorX, cursorY);
            }
        });
    </script>
</body>
</html>
