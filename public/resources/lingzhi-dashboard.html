<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臻博园 | 全产业链数字化管理平台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2E7D32; /* 森林绿 */
            --accent: #D4AF37;  /* 臻博金 */
            --bg: #f8f9fa;
            --text: #333;
            --text-light: #666;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        .dashboard-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            padding: 20px 0;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--primary);
            letter-spacing: 2px;
            font-weight: 600;
        }

        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(46, 125, 50, 0.1);
            border-color: var(--primary);
        }

        .card-icon {
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 15px;
            width: 60px;
            height: 60px;
            background: rgba(46, 125, 50, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .card-info h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #333;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 11px;
            background: #f0f2f0;
            color: var(--text-light);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Modal Redesign */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .modal.active {
            display: flex;
        }

        .modal-body {
            background: var(--white);
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            border-radius: 24px;
            position: relative;
            padding: 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .modal-header h2 {
            margin: 0;
            color: var(--primary);
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            flex: 1;
        }

        .chart-container {
            background: #fafafa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #eee;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: var(--white);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <div class="header">
        <h1>臻博园 | 全产业链数字化管理平台</h1>
    </div>

    <div class="grid-container">
        <!-- Module 1 -->
        <div class="card" onclick="openModule('灵芝数智种植平台', 'fa-seedling')">
            <div class="card-icon"><i class="fas fa-seedling"></i></div>
            <div class="card-info">
                <h3>数智种植平台</h3>
                <div class="tag-list">
                    <span class="tag">种植计划</span>
                    <span class="tag">农事管理</span>
                    <span class="tag">遥感监测</span>
                </div>
            </div>
        </div>

        <!-- Module 2 -->
        <div class="card" onclick="openModule('仿野生林下管护', 'fa-tree')">
            <div class="card-icon"><i class="fas fa-tree"></i></div>
            <div class="card-info">
                <h3>仿野生管护</h3>
                <div class="tag-list">
                    <span class="tag">林长管理</span>
                    <span class="tag">环境监测</span>
                    <span class="tag">物联设备</span>
                </div>
            </div>
        </div>

        <!-- Module 3 -->
        <div class="card" onclick="openModule('物联感知设备', 'fa-microchip')">
            <div class="card-icon"><i class="fas fa-microchip"></i></div>
            <div class="card-info">
                <h3>物联感知中心</h3>
                <div class="tag-list">
                    <span class="tag">视频监控</span>
                    <span class="tag">气象监测</span>
                    <span class="tag">土壤墒情</span>
                </div>
            </div>
        </div>

        <!-- Module 4 -->
        <div class="card" onclick="openModule('区块链溯源管理', 'fa-link')">
            <div class="card-icon"><i class="fas fa-link"></i></div>
            <div class="card-info">
                <h3>全程溯源系统</h3>
                <div class="tag-list">
                    <span class="tag">上链存证</span>
                    <span class="tag">防伪管理</span>
                    <span class="tag">扫码追溯</span>
                </div>
            </div>
        </div>

        <!-- Module 5 -->
        <div class="card" onclick="openModule('社会化服务平台', 'fa-hands-helping')">
            <div class="card-icon"><i class="fas fa-hands-helping"></i></div>
            <div class="card-info">
                <h3>社会化服务</h3>
                <div class="tag-list">
                    <span class="tag">专家咨询</span>
                    <span class="tag">检测服务</span>
                    <span class="tag">金融保险</span>
                </div>
            </div>
        </div>

        <!-- Module 6 -->
        <div class="card" onclick="openModule('全产业链大数据', 'fa-database')">
            <div class="card-icon"><i class="fas fa-database"></i></div>
            <div class="card-info">
                <h3>产业大数据</h3>
                <div class="tag-list">
                    <span class="tag">种质资源</span>
                    <span class="tag">市场行情</span>
                    <span class="tag">仓储动态</span>
                </div>
            </div>
        </div>

        <!-- Module 7 -->
        <div class="card" onclick="openModule('灵芝产业地图', 'fa-map-marked-alt')">
            <div class="card-icon"><i class="fas fa-map-marked-alt"></i></div>
            <div class="card-info">
                <h3>产业分布地图</h3>
                <div class="tag-list">
                    <span class="tag">分布雷达</span>
                    <span class="tag">交易流向</span>
                    <span class="tag">供需监测</span>
                </div>
            </div>
        </div>

        <!-- Module 8 -->
        <div class="card" onclick="openModule('品牌战略规划', 'fa-bullseye')">
            <div class="card-icon"><i class="fas fa-bullseye"></i></div>
            <div class="card-info">
                <h3>品牌战略规划</h3>
                <div class="tag-list">
                    <span class="tag">形象系统</span>
                    <span class="tag">全球拓展</span>
                    <span class="tag">文化宣传</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal" id="moduleModal">
    <div class="modal-body">
        <i class="fas fa-times close-btn" onclick="closeModal()"></i>
        <div class="loading-overlay" id="loader">
            <div class="spinner"></div>
            <div style="color:var(--primary); letter-spacing:1px;">正在同步实时数据...</div>
        </div>
        <div class="modal-header">
            <i id="m-icon" class="fas fa-seedling" style="font-size:30px; color:var(--primary);"></i>
            <h2 id="m-title">模块详情</h2>
        </div>
        <div class="chart-grid">
            <div class="chart-container"><canvas id="c1"></canvas></div>
            <div class="chart-container"><canvas id="c2"></canvas></div>
            <div class="chart-container" style="grid-column: 1 / -1;"><canvas id="c3"></canvas></div>
        </div>
    </div>
</div>

<script>
    let charts = [];

    function openModule(title, icon) {
        document.getElementById('m-title').innerText = title;
        document.getElementById('m-icon').className = 'fas ' + icon;
        document.getElementById('moduleModal').classList.add('active');
        document.getElementById('loader').style.display = 'flex';

        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            renderCharts(title);
        }, 1200);
    }

    function closeModal() {
        document.getElementById('moduleModal').classList.remove('active');
    }

    function renderCharts(title) {
        charts.forEach(c => c.destroy());
        charts = [];

        const ctx1 = document.getElementById('c1').getContext('2d');
        const ctx2 = document.getElementById('c2').getContext('2d');
        const ctx3 = document.getElementById('c3').getContext('2d');

        charts.push(new Chart(ctx1, {
            type: 'line',
            data: {
                labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                datasets: [{
                    label: '数据趋势',
                    data: [65, 59, 80, 81, 56, 55, 40],
                    borderColor: '#2E7D32',
                    backgroundColor: 'rgba(46, 125, 50, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        }));

        charts.push(new Chart(ctx2, {
            type: 'doughnut',
            data: {
                labels: ['正常', '预警', '待检'],
                datasets: [{
                    data: [300, 50, 100],
                    backgroundColor: ['#2E7D32', '#D4AF37', '#ddd']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        }));

        charts.push(new Chart(ctx3, {
            type: 'bar',
            data: {
                labels: ['节点A', '节点B', '节点C', '节点D', '节点E', '节点F'],
                datasets: [{
                    label: '设备运行状态',
                    data: [12, 19, 3, 5, 2, 3],
                    backgroundColor: '#2E7D32'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        }));
    }
</script>

</body>
</html>
