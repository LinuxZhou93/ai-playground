<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Preview</title>
    <style>
        body {
            background-color: #2c2c2c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .smartphone-frame {
            width: 375px;
            height: 812px;
            border: 16px solid #111;
            border-top-width: 60px;
            border-bottom-width: 60px;
            border-radius: 36px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            position: relative;
            background: #000;
        }
        /* Top Notch */
        .smartphone-frame::before {
            content: '';
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 20px;
            background: #222;
            border-radius: 10px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 2px;
            background: #fff;
        }
        .header-title {
            position: absolute;
            top: -55px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="smartphone-frame">
        <div class="header-title">iPhone X (375x812) Mobile Simulator</div>
        <iframe src="http://localhost:8089/index.html" id="mobilePreviewFrame"></iframe>
    </div>

</body>
</html>
