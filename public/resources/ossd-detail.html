<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSSD 课程详解 | OSSD Detailed Guide</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    

    <!-- Google Fonts -->
    <link
        href="https://fonts.loli.net/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #fbbf24;
            --primary-glow: rgba(251, 191, 36, 0.4);
        }

        body {
            background-color: #0c0a09;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-card {
            background: rgba(41, 37, 36, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

        .hero-bg {
            background: radial-gradient(circle at top right, rgba(251, 191, 36, 0.1), transparent),
                radial-gradient(circle at 10% 90%, rgba(20, 184, 166, 0.05), transparent);
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease-out;
        }

        .scroll-reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .credit-dot {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background: rgba(251, 191, 36, 0.2);
            transition: all 0.3s ease;
        }

        .credit-dot.active {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const GraduationCap = (props) => <IconBase {...props}><path d="M22 10v6M2 10l10-5 10 5-10 5z" /><path d="M6 12v5c3 3 9 3 12 0v-5" /></IconBase>;
        const CheckCircle = (props) => <IconBase {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></IconBase>;
        const Award = (props) => <IconBase {...props}><circle cx="12" cy="8" r="7" /><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" /></IconBase>;
        const Map = (props) => <IconBase {...props}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6" /><line x1="8" x2="8" y1="2" y2="18" /><line x1="16" x2="16" y1="6" y2="22" /></IconBase>;
        const ArrowLeft = (props) => <IconBase {...props}><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></IconBase>;

        const DetailSection = ({ title, subtitle, children }) => (
            <section className="mb-24 scroll-reveal">
                <div className="flex items-center gap-4 mb-8">
                    <div className="h-0.5 w-12 bg-amber-500"></div>
                    <div>
                        <h2 className="text-3xl font-orbitron font-bold text-white uppercase tracking-tighter">{title}</h2>
                        <span className="text-xs font-mono text-amber-400/60 uppercase tracking-widest">{subtitle}</span>
                    </div>
                </div>
                {children}
            </section>
        );

        const App = () => {
            useEffect(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                        }
                    });
                }, { threshold: 0.1 });

                document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));
                return () => observer.disconnect();
            }, []);

            return (
                <div className="min-h-screen hero-bg">
                    {/* Header/Nav */}
                    <nav className="fixed top-0 w-full z-50 p-6 flex justify-between items-center backdrop-blur-md border-b border-white/5">
                        <a href="international-hub.html" className="flex items-center gap-2 text-slate-400 hover:text-white transition-colors group">
                            <div className="p-2 rounded-lg bg-white/5 border border-white/10 group-hover:border-amber-500/50 transition-all">
                                <ArrowLeft className="w-5 h-5" />
                            </div>
                            <span className="text-xs font-bold tracking-widest uppercase">返回全球智慧中心</span>
                        </a>
                        <div className="text-[10px] font-mono text-amber-400 tracking-widest">REGISTRY: ONTARIO_SECONDARY_SYSTEM</div>
                    </nav>

                    <main className="container mx-auto px-6 pt-40 pb-20">
                        {/* Hero Section */}
                        <div className="max-w-4xl mb-32">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-500 text-[10px] font-bold uppercase tracking-widest mb-8">
                                <Map className="w-3 h-3" /> Ontario Education Asset
                            </div>
                            <h1 className="text-7xl md:text-9xl font-orbitron font-bold text-white mb-8 leading-none">
                                OSSD<br />
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-yellow-600">The Power of Process</span>
                            </h1>
                            <p className="text-xl text-slate-400 leading-relaxed font-light max-w-2xl border-l-2 border-amber-500/30 pl-8">
                                加拿大安大略省高中文凭（Ontario Secondary School Diploma）是世界顶级的非考试导向型教育体系。它以“70%平时表现 + 30%期末评估”的科学配比，将学习重心从应对标准化考试转移到真实世界能力的培养，被全球顶级大学全面认可。
                            </p>
                        </div>

                        {/* Graduation Requirements */}
                        <DetailSection title="毕业要求" subtitle="GRADUATION_REQUIREMENTS_SUMMARY">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="glass-card p-10 rounded-3xl flex flex-col justify-between">
                                    <div>
                                        <h4 className="text-4xl font-orbitron font-bold text-amber-500 mb-2">30</h4>
                                        <div className="text-white font-bold mb-4">学分要求 (Credits)</div>
                                        <p className="text-slate-500 text-xs">包含18门必修课与12门选修课，支持国内高中成绩转换学分。</p>
                                    </div>
                                    <div className="mt-8 flex flex-wrap gap-1.5">
                                        {Array.from({ length: 30 }).map((_, i) => (
                                            <div key={i} className={`credit-dot ${i < 18 ? 'active' : ''}`}></div>
                                        ))}
                                    </div>
                                </div>
                                <div className="glass-card p-10 rounded-3xl">
                                    <h4 className="text-4xl font-orbitron font-bold text-amber-500 mb-2">40h</h4>
                                    <div className="text-white font-bold mb-4">社区参与 (Community)</div>
                                    <p className="text-slate-500 text-xs leading-relaxed">必须完成40小时的志愿者服务，旨在培养学生的社会责任感、同情心以及在非工作环境下的沟通能力。</p>
                                </div>
                                <div className="glass-card p-10 rounded-3xl border-r-4 border-amber-500">
                                    <h4 className="text-4xl font-orbitron font-bold text-amber-500 mb-2">OSSLT</h4>
                                    <div className="text-white font-bold mb-4">文学水平测试</div>
                                    <p className="text-slate-500 text-xs leading-relaxed">通过安大略省统一的高中英语读写能力测试，确保学生具备进入大学和职场的基本素养。</p>
                                </div>
                            </div>
                        </DetailSection>

                        {/* Assessment Philosophy */}
                        <DetailSection title="评估逻辑：非“一考定终身”" subtitle="70_PERCENT_PROCESS_EVALUATION">
                            <div className="relative">
                                <div className="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
                                    <h5 className="text-[15rem] font-bold">70/30</h5>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 relative z-10">
                                    <div className="space-y-6">
                                        <div className="p-8 rounded-2xl bg-amber-500/5 border border-amber-500/20">
                                            <h4 className="text-amber-500 font-bold mb-2">平时表现 (70%)</h4>
                                            <p className="text-slate-400 text-sm italic">
                                                包括课堂测验、实验报告、多媒体演示、协作研究及课堂参与。这种模式让每一个努力的瞬间都被记录并计入最终成绩。
                                            </p>
                                        </div>
                                        <div className="p-8 rounded-2xl bg-white/5 border border-white/10">
                                            <h4 className="text-slate-300 font-bold mb-2">期末总结评价 (30%)</h4>
                                            <p className="text-slate-500 text-sm">
                                                通常为一个综合性的期末考试或终结性项目。压力远低于传统高考或其他统考体系。
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex flex-col justify-center">
                                        <h4 className="text-3xl font-bold text-white mb-6">显著优势</h4>
                                        <ul className="space-y-6">
                                            {[
                                                { t: "升学通道通畅", d: "以安省本地生源身份申请北美、英国及香港大学，极具录取优势。" },
                                                { t: "灵活选课", d: "学生可以根据大学专业目标，针对性选择相应课程（如ENG4U/MHF4U等）。" },
                                                { t: "无痛转学", d: "能够无缝衔接国内高中课程，通过转分大大缩短毕业路径。" }
                                            ].map((adv, i) => (
                                                <li key={i} className="flex gap-4">
                                                    <div className="w-6 h-6 rounded bg-amber-500/10 flex items-center justify-center text-amber-500">
                                                        <CheckCircle className="w-4 h-4" />
                                                    </div>
                                                    <div>
                                                        <div className="text-white font-bold text-sm tracking-wide">{adv.t}</div>
                                                        <div className="text-slate-500 text-xs">{adv.d}</div>
                                                    </div>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </DetailSection>

                        {/* University Admission Map */}
                        <div className="mt-32 glass-card rounded-[3rem] p-16 text-center overflow-hidden relative">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-500 to-transparent"></div>
                            <GraduationCap className="w-20 h-20 text-amber-500/20 mx-auto mb-8" />
                            <h3 className="text-4xl font-orbitron font-bold text-white mb-6">OSSD：通往世界名校的快车道</h3>
                            <p className="text-slate-400 mb-10 max-w-2xl mx-auto">
                                被加拿大多伦多大学、英国牛津、美国加州大学系统等认可。在安大略省高中系统下，你不再是千万考生中的分数值，而是一个拥有多元能力的独立个体。
                            </p>
                            <a href="https://www.ontario.ca/page/high-school-graduation-requirements" target="_blank" className="inline-block px-12 py-4 bg-amber-600 hover:bg-amber-500 text-stone-900 font-bold rounded-2xl transition-all shadow-xl shadow-amber-600/20 uppercase tracking-widest">访问安省教育厅指南</a>
                        </div>
                    </main>

                    <footer className="py-20 border-t border-white/5 text-center">
                        <p className="text-slate-600 text-[10px] font-mono tracking-[0.4em] uppercase">Titan OS | North American Academic Division | 2025</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=20260524_02"></script>
</body>

</html>
