    <style>
        :root {
            --tech-cyan: #00f3ff;
            --tech-purple: #7000ff;
            --tech-pink: #ff00ff;
            --tech-green: #00ff88;
            --bg-dark: #020205;
            --panel-glass: rgba(10, 15, 30, 0.95);
            --border-glass: rgba(0, 243, 255, 0.25);
            --glow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.1;
        }

        /* --- NAVIGATION --- */
        .top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2000;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent);
            border-bottom: 1px solid var(--border-glass);
        }

        .icon-btns {
            display: flex;
            gap: 12px;
        }

        .circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1.5px solid var(--border-glass);
            background: var(--panel-glass);
            color: var(--tech-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .circle-btn:hover {
            background: var(--tech-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--tech-cyan);
            transform: translateY(-3px);
        }

        .view-toggle {
            background: var(--panel-glass);
            border: 1.5px solid var(--border-glass);
            border-radius: 30px;
            padding: 4px;
            display: flex;
            gap: 4px;
            pointer-events: auto;
        }

        .toggle-tab {
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Orbitron';
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .toggle-tab.active {
            background: var(--tech-cyan);
            color: #000;
            font-weight: 800;
            box-shadow: 0 0 10px var(--tech-cyan);
        }

        /* --- VIEWS --- */
        .view-frame {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            padding-top: 100px;
            opacity: 0;
        }

        .view-frame.active {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }

        /* CAROUSEL */
        #view-carousel {
            display: none;
            align-items: center;
            justify-content: center;
            height: 100vh;
            perspective: 3000px;
            overflow: hidden;
        }

        #view-carousel.active {
            display: flex;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 550px;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            position: absolute;
            width: 340px;
            height: 520px;
            background: var(--panel-glass);
            border: 1.5px solid var(--border-glass);
            border-radius: 24px;
            padding: 35px;
            cursor: pointer;
            transition: transform 0.6s, opacity 0.6s;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .card.focused {
            border-color: var(--tech-cyan);
            border-width: 2.5px;
            box-shadow: 0 0 30px var(--tech-cyan);
            z-index: 100;
        }

        .logo-box {
            width: 100%;
            height: 90px;
            background: #fff;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid #000;
            overflow: hidden;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* GRID MATRIX */
        #view-grid {
            padding: 130px 60px 60px;
            overflow-y: scroll;
            scroll-behavior: smooth;
            height: 100%;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }

        .filter-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-family: 'Orbitron';
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--tech-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--tech-cyan);
        }

        .grid-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1800px;
            margin: 0 auto;
        }

        .grid-item {
            background: var(--panel-glass);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
        }

        .grid-item:hover {
            transform: translateY(-10px);
            border-color: var(--tech-cyan);
            box-shadow: 0 15px 40px rgba(0, 243, 255, 0.2);
        }

        .grid-item .logo-box {
            height: 75px;
            margin-bottom: 15px;
            background: #f8f9fa;
        }

        /* ATLAS MAP */
        #view-map {
            padding-top: 0;
            background: radial-gradient(circle at center, #0a1128 0%, #000 100%);
            position: relative;
        }

        #canvas-map {
            width: 100%;
            height: 100%;
        }

        .pin {
            position: absolute;
            width: 36px;
            height: 36px;
            transform: translate(-50%, -50%);
            cursor: pointer;
            pointer-events: auto;
            z-index: 100;
            transition: 0.3s;
        }

        .pin-dot {
            width: 100%;
            height: 100%;
            border: 2px solid var(--tech-cyan);
            border-radius: 50%;
            background: #000;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--tech-cyan);
        }

        .pin-dot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #fff;
            border-radius: 50%;
        }

        .pin:hover {
            z-index: 1000;
        }

        .pin:hover .pin-dot {
            transform: scale(1.8);
            background: #fff;
            box-shadow: 0 0 25px var(--tech-cyan);
        }

        /* --- DEEP DIVE OVERLAY --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 3000;
            opacity: 0;
            visibility: hidden;
            display: grid;
            grid-template-rows: auto 1fr;
            transform: translateY(50px);
            transition: 0.5s;
        }

        .overlay.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .ov-head {
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--tech-cyan);
            background: #050510;
        }

        .ov-body {
            display: grid;
            grid-template-columns: 1.3fr 1.7fr;
            height: 100%;
            overflow: hidden;
        }

        .ov-l {
            padding: 40px 60px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            background: #080a1c;
        }

        .ov-r {
            padding: 40px 60px;
            overflow-y: auto;
            background: #030308;
        }

        .ov-lbl {
            font-family: 'Orbitron';
            font-size: 11px;
            color: var(--tech-purple);
            margin-top: 25px;
            margin-bottom: 8px;
            display: block;
            letter-spacing: 2px;
            text-transform: uppercase;

        .ov-val {

            font-weight: 900;
            color: #fff;
            font-family: 'Space Grotesk';

            margin-bottom: 10px;

            border-radius: 20px;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 20px;
            margin-bottom: 30px;
            overflow: hidden;
            transition: 0.3s;
        }

        .p-card:hover {
            border-color: var(--tech-cyan);
            transform: scale(1.02);
        }

        .p-img {
            width: 100%;
            height: 200px;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        .p-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 1s;
        }

        .p-card:hover .p-img img {
            transform: scale(1.15);
            filter: contrast(1.1);
        }

        .p-info {
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .job-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;

            padding: 6px 14px;
            background: rgba(255, 0, 255, 0.1);
            border: 1px solid var(--tech-pink);
            color: var(--tech-pink);
            border-radius: 15px;
            font-size: 11px;
            font-family: 'Orbitron';
        }

        .controls {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 1000;
            pointer-events: none;
        }

        .ctrl-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2.5px solid var(--border-glass);
            background: var(--panel-glass);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.3s;

        .ctrl-btn:hover {
            border-color: var(--tech-cyan);
            color: var(--tech-cyan);
            box-shadow: 0 0 20px var(--tech-cyan);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--tech-cyan);
            border-radius: 10px;
        }

        function initStars() {
            const s = new THREE.Scene(); const c = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
            const r = new THREE.WebGLRenderer({ antialias: true, alpha: true }); r.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('viewport').appendChild(r.domElement);
            const g = new THREE.BufferGeometry(); const v = [];
            for (let i = 0; i < 8000; i++) v.push((Math.random() - 0.5) * 3000, (Math.random() - 0.5) * 3000, (Math.random() - 0.5) * 3000);
            g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
            const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0x00f3ff, size: 1.5 })); s.add(p); c.position.z = 1000;
            function animate() { requestAnimationFrame(animate); p.rotation.y += 0.0006; r.render(s, c); } animate();

        function renderMap() {
            const canvas = document.getElementById('canvas-map'); const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth; let h = canvas.height = window.innerHeight;
            ctx.clearRect(0, 0, w, h); ctx.fillStyle = "rgba(0, 243, 255, 0.4)";
            const polys = [[[0.1, 0.1], [0.35, 0.1], [0.3, 0.5], [0.1, 0.45]], [[0.25, 0.55], [0.4, 0.55], [0.35, 0.85], [0.2, 0.65]], [[0.42, 0.15], [0.95, 0.15], [0.98, 0.55], [0.75, 0.6], [0.55, 0.5]], [[0.45, 0.55], [0.7, 0.5], [0.65, 0.85], [0.4, 0.7]], [[0.85, 0.75], [0.98, 0.73], [0.95, 0.95], [0.8, 0.92]]];
            for (let x = 0; x < w; x += 18) {
                for (let y = 0; y < h; y += 18) {
                    let inn = false;
                    for (let p of polys) { if (ptIn(x / w, y / h, p)) { inn = true; break; } }
                    if (inn) { ctx.beginPath(); ctx.arc(x, y, 1.5, 0, 7); ctx.fill(); }
                }
            }
        }
        function ptIn(x, y, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
                if (((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
            }
            return inside;
        }
