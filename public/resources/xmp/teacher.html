<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇妙课堂 | XMP</title><link rel="stylesheet" href="/resources/xmp/xmp.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="/xmp"><span class="brand-mark"><i></i></span><span>XMP 奇妙课堂</span></a><a class="back" href="/xmp">返回总览</a></header><section class="page-title"><div class="eyebrow">Teacher Console</div><h1>今天，带孩子看见<br>一颗种子的力量。</h1><p>大班科学领域示范课 · 35 分钟 · 教师主动记录模式</p></section><section class="workspace"><aside class="panel side"><h3>课堂流程</h3><div class="step active"><b>1</b>课程准备</div><div class="step"><b>2</b>趣味导入</div><div class="step"><b>3</b>观察探究</div><div class="step"><b>4</b>表达分享</div><div class="step"><b>5</b>课后小结</div></aside><div class="panel main-panel"><div class="toolbar"><span class="status">设备连接正常</span><a class="btn" href="/xmp/kid" target="_blank">打开幼儿端</a></div><article class="course-card"><div><span class="tag">科学 · 大班</span><h2>种子成长实验室</h2><p>通过观察、预测和排序，引导幼儿理解水、阳光与种子生长的关系。</p></div><button class="btn primary" data-xmp-action="start">启动课堂</button></article><div class="metrics"><div class="metric"><small>课堂进度</small><strong data-xmp-progress>0%</strong></div><div class="metric"><small>完成互动</small><strong><span data-xmp-task-count>0</span>/3</strong></div><div class="metric"><small>观察记录</small><strong data-xmp-observation-count>0</strong></div></div><div class="task-list"><div class="task"><div><strong>互动 01 · 找一找</strong><br><span>从三张图片里找到真正的种子</span></div><button data-xmp-action="task" data-task="find">标记完成</button></div><div class="task"><div><strong>互动 02 · 排一排</strong><br><span>按发芽过程排列生长顺序</span></div><button data-xmp-action="task" data-task="order">标记完成</button></div><div class="task"><div><strong>互动 03 · 想一想</strong><br><span>预测没有阳光时会发生什么</span></div><button data-xmp-action="task" data-task="predict">标记完成</button></div></div><div class="section-head"><div><div class="eyebrow">Teacher observation</div><h2 style="font-size:28px">课堂观察</h2></div></div><div class="choice-grid"><button class="choice" data-xmp-action="observe" data-value="curious">主动提出问题<small>基于教师现场观察</small></button><button class="choice" data-xmp-action="observe" data-value="cooperate">愿意协作分享<small>基于教师现场观察</small></button><button class="choice" data-xmp-action="observe" data-value="sequence">能描述生长顺序<small>基于任务表现与教师确认</small></button><button class="choice" data-xmp-action="observe" data-value="followup">需要后续引导<small>加入下一次教学关注</small></button></div><div class="actions"><button class="btn primary" data-xmp-action="report">生成课堂成长报告</button><button class="btn" onclick="XMP.reset()">重置演示</button></div></div></section></main><script src="/resources/xmp/xmp.js"></script></body></html>
