<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的小画家朋友</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", sans-serif;
    background: #f5dfc0;
    user-select: none;
    -webkit-user-select: none;
  }

  .stage { position: fixed; inset: 0; }
  .stage svg { width: 100%; height: 100%; display: block; }

    /* ---------- 小朋友（2D 卡通，上下浮动） ---------- */
  .kid { cursor: pointer; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  /* 点击后挥手（右臂以肩膀为轴摆动） */
  #armRight { transform-box: view-box; transform-origin: 538px 486px; }
  #armRight.waving { animation: wave .55s ease-in-out 3; }
  @keyframes wave {
    0%, 100% { transform: rotate(-132deg); }
    50%      { transform: rotate(-108deg); }
  }

  /* 整体动作（挂在外层 #kidOuter，不干扰内层 bob 浮动） */
  #kidOuter { transform-box: view-box; transform-origin: 500px 650px; }
  #kidOuter.hop     { animation: hop .7s ease-in-out; }
  #kidOuter.sway    { animation: sway 1.2s ease-in-out; }
  #kidOuter.stretch { animation: stretch 1.1s ease-in-out; }
  #kidOuter.tilt    { animation: tilt 1.2s ease-in-out; }
  @keyframes hop     { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-34px); } 60% { transform: translateY(0); } 78% { transform: translateY(-12px); } }
  @keyframes sway    { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  @keyframes stretch { 0%,100% { transform: scaleY(1) scaleX(1); } 50% { transform: scaleY(1.08) scaleX(.97) translateY(-6px); } }
  @keyframes tilt    { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-7deg); } 70% { transform: rotate(7deg); } }

  /* 右手托腮思考（以肩为轴抬到头部） */
  #armRight.thinking { animation: think .85s ease-in-out 2; }
  @keyframes think {
    0%, 100% { transform: rotate(-150deg); }
    50%      { transform: rotate(-205deg); }
  }

  /* 眼睛（闭眼效果） */
  #eyeL, #eyeR { transform-box: fill-box; transform-origin: center; transition: transform .1s; }
  .blinking #eyeL, .blinking #eyeR { transform: scaleY(.08); }

  /* 说话嘴巴切换 */
  #mouthOpen { opacity: 0; transition: opacity .15s; }
  .talking #mouthNormal { opacity: 0; }
  .talking #mouthOpen   { opacity: 1; }

  /* 画框被点击时晃动（平时略微朝观众倾斜） */
  .paintingWrap { transform-box: fill-box; transform-origin: 50% 100%; transform: rotate(-7deg); }
  .paintingWrap.wiggle { animation: wiggle .7s ease-in-out; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(-2deg); }
  }

  /* 云朵慢飘 */
  .cloud { animation: drift 9s ease-in-out infinite; }
  @keyframes drift {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(14px); }
  }

  /* ---------- 顶部标题 ---------- */
  .title {
    position: fixed; top: 18px; left: 20px; z-index: 30;
    background: rgba(255,255,255,.72);
    padding: 10px 18px; border-radius: 999px;
    font-size: 20px; font-weight: 700; color: #6b4a2b;
    box-shadow: 0 4px 14px rgba(120,70,30,.18);
    backdrop-filter: blur(6px);
  }

  /* ---------- 气泡 ---------- */
  .bubble {
    position: fixed; top: 12%; left: 50%; z-index: 40;
    transform: translateX(-50%) scale(.5);
    opacity: 0; pointer-events: none;
    max-width: min(560px, 86vw);
    background: #fffdf6;
    border: 3px solid #e8cba0;
    border-radius: 22px;
    padding: 16px 22px;
    font-size: 20px; font-weight: 600; color: #5a4030;
    box-shadow: 0 10px 26px rgba(120,70,30,.22);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;
    text-align: center;
  }
  .bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .bubble-tag {
    display: inline-block; vertical-align: 2px;
    background: #3aa8e8; color: #fff;
    font-size: 12px; font-weight: 700;
    border-radius: 999px; padding: 2px 10px;
    margin-right: 8px;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -16px;
    transform: translateX(-50%);
    border: 10px solid transparent;
    border-top-color: #fffdf6;
    filter: drop-shadow(0 2px 1px rgba(120,70,30,.08));
  }

  /* ---------- 底部提示 ---------- */
  .hint {
    position: fixed; bottom: 22px; left: 50%; z-index: 30;
    transform: translateX(-50%);
    background: rgba(255,255,255,.78);
    padding: 10px 20px; border-radius: 999px;
    font-size: 15px; color: #7a5a3a;
    box-shadow: 0 4px 14px rgba(120,70,30,.15);
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  .hint b { color: #e8654f; }

  /* ---------- 撒花粒子 ---------- */
  .star {
    position: fixed; width: 13px; height: 13px; z-index: 50;
    border-radius: 50%; pointer-events: none;
    animation: fly .95s ease-out forwards;
  }
  @keyframes fly {
    to {
      transform: translate(var(--tx), var(--ty)) rotate(var(--r)) scale(.25);
      opacity: 0;
    }
  }

  /* ---------- 换画按钮（“1”） ---------- */
  .switch-btn {
    position: fixed; left: 24px; bottom: 24px; z-index: 40;
    width: 58px; height: 58px; border-radius: 50%;
    border: none; cursor: pointer;
    background: linear-gradient(145deg, #ffb85c, #ff8b5e);
    color: #fff; font-size: 26px; font-weight: 800;
    box-shadow: 0 8px 20px rgba(200,110,40,.4);
    transition: transform .18s;
  }
  .switch-btn:hover { transform: scale(1.1); }
  .switch-btn:active { transform: scale(.92); }
  .switch-btn.second { bottom: 94px; background: linear-gradient(145deg, #9aa7ff, #6a7bd6); box-shadow: 0 8px 20px rgba(90,100,190,.4); }
  .switch-btn.chat { bottom: 164px; background: linear-gradient(145deg, #ff9db0, #ff5e7d); box-shadow: 0 8px 20px rgba(230,80,110,.4); display: flex; align-items: center; justify-content: center; }
  .switch-btn.chat:hover { transform: scale(1.1); }
  .switch-btn.voice { bottom: 234px; background: linear-gradient(145deg, #7ed6a8, #3fae6f); box-shadow: 0 8px 20px rgba(60,170,110,.4); font-size: 22px; }
  .switch-btn.detect { bottom: 304px; background: linear-gradient(145deg, #7ec8ff, #3a8fd6); box-shadow: 0 8px 20px rgba(60,140,210,.4); font-size: 22px; }
  .switch-btn.detect.on { background: linear-gradient(145deg, #ffb85c, #ff8b5e); box-shadow: 0 8px 20px rgba(230,120,60,.5); }

  /* ---------- 动作侦测小窗 ---------- */
  .detect-panel {
    position: fixed; right: 24px; bottom: 100px; z-index: 60;
    width: 224px; background: rgba(20,15,30,.85);
    border: 2px solid #7ec8ff; border-radius: 14px;
    padding: 8px; color: #fff; text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,.4);
  }
  .detect-panel video { width: 100%; border-radius: 8px; background: #000; display: block; }
  .detect-status { font-size: 11px; color: #ffd97a; margin: 6px 0; line-height: 1.4; }
  .detect-panel button {
    border: none; cursor: pointer; width: 100%;
    border-radius: 8px; padding: 6px 0;
    background: #ff6b5e; color: #fff; font-size: 13px; font-weight: 700;
  }

  /* ---------- 换装按钮（右下角） ---------- */
  .outfit-btn {
    position: fixed; right: 24px; bottom: 24px; z-index: 40;
    width: 58px; height: 58px; border-radius: 50%;
    border: none; cursor: pointer;
    background: linear-gradient(145deg, #f2d9a6, #e0b584);
    color: #6b4a2b; font-size: 24px;
    box-shadow: 0 8px 20px rgba(160,120,60,.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform .18s;
  }
  .outfit-btn:hover { transform: scale(1.1); }
  .outfit-btn:active { transform: scale(.92); }

  /* 截图模式按钮激活态 */
  .mic-btn.shot-active { background: #ff5e7d; color: #fff; box-shadow: 0 0 0 3px rgba(255,94,125,.4); }

  /* 快门闪光 */
  .flash {
    position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background: #ffffff; opacity: 0;
  }
  .flash.on { animation: flashAnim .45s ease-out; }
  @keyframes flashAnim { 0% { opacity: .9; } 100% { opacity: 0; } }

  /* ---------- 摄像头拍摄面板 ---------- */
  .camera-modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .camera-modal[hidden] { display: none; }
  .camera-backdrop {
    position: absolute; inset: 0;
    background: rgba(20,15,40,.6); backdrop-filter: blur(3px);
    animation: fadeIn .25s;
  }
  .camera-card {
    position: relative; background: #fff8ec; border-radius: 20px;
    padding: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.4);
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
    text-align: center;
  }
  .camera-card video {
    width: min(480px, 80vw); max-height: 62vh;
    border-radius: 14px; background: #000; display: block;
  }
  .cam-actions { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
  .cam-btn {
    border: none; cursor: pointer;
    border-radius: 999px; padding: 10px 22px;
    font-size: 15px; font-weight: 700; color: #fff;
    transition: transform .15s;
  }
  .cam-btn:hover { transform: scale(1.05); }
  .cam-btn:active { transform: scale(.94); }
  .cam-btn.shoot { background: linear-gradient(145deg, #ffb85c, #ff8b5e); }
  .cam-btn.cancel { background: #b9a88f; }

  /* ---------- 聊天历史面板 ---------- */
  .history-card {
    position: relative; background: #fff8ec; border-radius: 20px;
    padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.4);
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
    width: min(460px, 90vw); max-height: 76vh;
    display: flex; flex-direction: column;
  }
  .history-title { text-align: center; font-weight: 800; color: #6b4a2b; font-size: 18px; margin-bottom: 12px; }
  .history-list { overflow-y: auto; flex: 1; margin-bottom: 12px; padding-right: 4px; text-align: left; }
  .history-item { margin-bottom: 12px; display: flex; flex-direction: column; gap: 3px; }
  .history-role { font-size: 12px; font-weight: 800; }
  .history-role.user { color: #2f8fd6; }
  .history-role.assistant { color: #e0722b; }
  .history-bubble {
    background: #f6ecd9; color: #4a3623; border-radius: 12px;
    padding: 8px 12px; font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .history-empty { text-align: center; color: #9c886e; padding: 30px 0; font-size: 14px; }
  .history-foot { display: flex; gap: 10px; justify-content: center; }

  /* ---------- 音色选择面板 ---------- */
  .voice-card {
    position: relative; background: #fff8ec; border-radius: 20px;
    padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.4);
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
    width: min(420px, 88vw); max-height: 72vh;
    display: flex; flex-direction: column;
  }
  .voice-title { text-align: center; font-weight: 800; color: #6b4a2b; font-size: 18px; margin-bottom: 12px; }
  .voice-list { overflow-y: auto; flex: 1; margin-bottom: 12px; }
  .voice-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 10px 14px; margin-bottom: 8px;
    border: none; border-radius: 12px; cursor: pointer;
    background: #f6ecd9; color: #5a4030; font-size: 14px; font-weight: 600;
    text-align: left; transition: background .15s, transform .1s;
  }
  .voice-item:hover { background: #ffe9c8; transform: scale(1.01); }
  .voice-item.active { background: #ffe0b2; outline: 2px solid #ff8b5e; }
  .voice-item .badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    color: #fff; background: #3fae6f; flex-shrink: 0;
  }
  .voice-item .badge.normal { background: #b9a88f; }

  /* ---------- 装扮面板 ---------- */
  .dress-card {
    position: relative; background: #fff8ec; border-radius: 20px;
    padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.4);
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
    width: min(440px, 90vw); max-height: 76vh;
    display: flex; flex-direction: column;
  }
  .dress-title { text-align: center; font-weight: 800; color: #6b4a2b; font-size: 18px; margin-bottom: 6px; }
  .dress-body { overflow-y: auto; flex: 1; margin-bottom: 12px; }
  .dress-section { font-size: 13px; font-weight: 800; color: #a08a6a; margin: 12px 2px 6px; }
  .dress-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .dress-chip {
    border: none; cursor: pointer; border-radius: 999px;
    padding: 8px 14px; font-size: 13px; font-weight: 700;
    background: #f6ecd9; color: #5a4030;
    transition: transform .12s, box-shadow .12s;
  }
  .dress-chip:hover { transform: scale(1.05); }
  .dress-chip.active { outline: 3px solid #ff8b5e; background: #ffe0b2; }
  .voice-tip { text-align: center; font-size: 12px; color: #8a6a4a; margin: -6px 0 10px; }
  .voice-tip b { color: #3a8fd6; }
  .voice-group-title { font-size: 12px; font-weight: 800; color: #a08a6a; margin: 10px 2px 6px; }
  .voice-foot { display: flex; gap: 8px; justify-content: center; }

  /* ---------- 照片待提问提示条 ---------- */
  .photo-chip {
    position: fixed; left: 50%; bottom: 150px; z-index: 42;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.94);
    border: 2px solid #7ec8ff; border-radius: 999px;
    padding: 8px 8px 8px 16px;
    font-size: 13px; font-weight: 600; color: #4a5a7a;
    box-shadow: 0 8px 20px rgba(60,140,210,.25);
    animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  .photo-chip button {
    border: none; cursor: pointer; width: 24px; height: 24px;
    border-radius: 50%; background: #ff6b5e; color: #fff;
    font-size: 12px; line-height: 1; flex-shrink: 0;
  }

  /* ---------- 右键区域截图 ---------- */
  #shotMask {
    position: fixed; inset: 0; z-index: 80; pointer-events: none;
    background: rgba(0,0,0,.38); display: none;
  }
  #shotMask.on { display: block; }
  #shotRect {
    position: absolute; border: 2px solid #ff8b5e;
    background: rgba(255,255,255,.12);
    box-shadow: 0 0 0 1px #fff inset; display: none;
  }

  /* ---------- 麦克风授权引导条 ---------- */
  .mic-grant {
    position: fixed; left: 50%; bottom: 150px; z-index: 42;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.95);
    border: 2px solid #ff8b5e; border-radius: 999px;
    padding: 8px 8px 8px 18px;
    font-size: 13px; font-weight: 700; color: #8a4a2a;
    box-shadow: 0 8px 20px rgba(255,120,60,.3);
    animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  .mic-grant button {
    border: none; cursor: pointer; flex-shrink: 0;
    background: linear-gradient(145deg, #ff8b5e, #ff6b3f);
    color: #fff; font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 8px 16px;
    transition: transform .15s;
  }
  .mic-grant button:hover { transform: scale(1.06); }
  .mic-grant button:active { transform: scale(.94); }

  /* ---------- 预览框/非安全页面 麦克风不可用 横幅 ---------- */
  .ctx-warn {
    position: fixed; left: 50%; top: 12px; z-index: 60;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px;
    max-width: 92vw;
    background: linear-gradient(145deg, #fff3d6, #ffe2b0);
    border: 2px solid #ff9a3c; border-radius: 14px;
    padding: 10px 12px 10px 16px;
    font-size: 13px; font-weight: 700; color: #8a4a16;
    box-shadow: 0 10px 26px rgba(255,140,40,.35);
    animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  .ctx-warn button {
    border: none; cursor: pointer; flex-shrink: 0; white-space: nowrap;
    background: linear-gradient(145deg, #ff9a3c, #ff6b3f);
    color: #fff; font-size: 13px; font-weight: 700;
    border-radius: 999px; padding: 9px 16px;
    transition: transform .15s;
  }
  .ctx-warn button:hover { transform: scale(1.06); }
  .ctx-warn button:active { transform: scale(.94); }

  /* 提问栏被唤起时的脉冲动画 */
  .ask-bar.ask-pulse { animation: askPulse .7s ease; }
  @keyframes askPulse {
    0%   { transform: translateX(-50%) scale(1);      box-shadow: 0 0 0 0 rgba(255,139,94,.55); }
    40%  { transform: translateX(-50%) scale(1.045);  box-shadow: 0 0 0 14px rgba(255,139,94,0); }
    100% { transform: translateX(-50%) scale(1); }
  }

  /* 换背景淡入 */
  .bg-fade { animation: bgFade .55s ease; }
  @keyframes bgFade { 0% { opacity: .2; } 100% { opacity: 1; } }

  /* ---------- 换画提示条 ---------- */
  .toast {
    position: fixed; bottom: 158px; left: 50%; z-index: 45;
    transform: translateX(-50%) translateY(8px);
    background: rgba(60,40,20,.85); color: #fff;
    padding: 9px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- 提问栏 ---------- */
  .ask-bar {
    position: fixed; left: 50%; bottom: 88px; z-index: 40;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    width: min(600px, 95vw);
    background: rgba(255,255,255,.92);
    border: 2px solid #e8cba0; border-radius: 999px;
    padding: 6px 6px 6px 20px;
    box-shadow: 0 8px 22px rgba(120,70,30,.18);
    backdrop-filter: blur(6px);
  }
  .ask-bar input {
    flex: 1; min-width: 0; border: none; outline: none;
    background: transparent; font-size: 15px; color: #5a4030;
    font-family: inherit;
  }
  .ask-bar input::placeholder { color: #b99a7a; }
  .ask-bar button {
    border: none; cursor: pointer; flex-shrink: 0;
    background: linear-gradient(145deg, #ffb85c, #ff8b5e);
    color: #fff; font-size: 14px; font-weight: 700;
    border-radius: 999px; padding: 9px 18px;
    transition: transform .15s;
  }
  .ask-bar button:hover { transform: scale(1.05); }
  .ask-bar button:active { transform: scale(.94); }

  /* ---------- 麦克风（按住说话） ---------- */
  .mic-btn {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%;
    border: none; cursor: pointer;
    background: #f3e6d3; color: #8a6a4a;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s, color .2s;
  }
  .mic-btn:hover { background: #ffe3c8; transform: scale(1.06); }
  .mic-btn.rec {
    background: #ff5e7d; color: #fff;
    animation: micPulse 1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,94,125,.55); }
    50%      { box-shadow: 0 0 0 11px rgba(255,94,125,0); }
  }
  /* 语种切换键：药丸样式，能显示“🇨🇳 中文 / 🇺🇸 English”文字 */
  #langBtn {
    width: auto; height: auto; border-radius: 999px;
    padding: 0 12px; font-size: 14px; font-weight: 700;
    white-space: nowrap; letter-spacing: .5px;
  }

  /* ---------- 画作放大观看 ---------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox[hidden] { display: none; }
  .lightbox-backdrop {
    position: absolute; inset: 0;
    background: rgba(40,25,12,.55); backdrop-filter: blur(4px);
    animation: fadeIn .25s;
  }
  .lightbox-card {
    position: relative; background: #fff8ec; border-radius: 18px; padding: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .lightbox-card svg { width: min(420px, 82vw); height: auto; display: block; }
  .lb-close {
    position: absolute; top: -14px; right: -14px;
    width: 42px; height: 42px; border-radius: 50%;
    border: none; background: #ff6b5e; color: #fff;
    font-size: 18px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    transition: transform .18s;
  }
  .lb-close:hover { transform: scale(1.12); }
  .lb-label { margin-top: 12px; text-align: center; font-size: 17px; font-weight: 700; color: #6b4a2b; }
  @keyframes popIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  @media (max-width: 700px) {

  const FALLBACKS = [

  const scene    = document.getElementById('scene');

  // ---------- 眼睛跟随鼠标 ----------
  window.addEventListener('mousemove', function (e) {
    const dx = e.clientX / window.innerWidth  - 0.5;
    const dy = e.clientY / window.innerHeight - 0.5;
    const px = Math.max(-4.5, Math.min(4.5, dx * 18));
    const py = Math.max(-3.5, Math.min(3.5, dy * 11));

  // ---------- 随机眨眼 ----------
  function scheduleBlink() {
    setTimeout(function () {
      scene.classList.add('blinking');

  // ---------- 声音（自动选最自然的，也可点左下角 🎵 按钮手动切换） ----------
  // 各语种语音：按语种代码分桶（LANGS 的 key 即语言前缀 zh/en/ja/ko…）
  let voicesByLang = {};        // { zh:[...], en:[...], ja:[...], ko:[...] }，均已按 voiceRank 排序
  let selectedVoice = {};       // 各语种当前选中的 SpeechSynthesisVoice
  let selectedVoiceIdx = {};    // 各语种当前选中的下标
  const SAVED_VOICE_PREFIX = 'xiaoyu_voice_';  // 键：xiaoyu_voice_zh / _en / _ja / _ko
  // 已知高质量“自然/神经”语音（优先置顶）。命中即排到最前。
  const PREFERRED_NATURAL = [
    'xiaoxiao', 'yunxi', 'xiaoyi', 'yaru', 'xiaobei', 'xiaomeng', 'yunyang', 'xiaoxuan', // 中文神经
    'aria', 'jenny', 'guy', 'zira', 'david', 'sara', 'narrator',                          // 英文神经
    'nanami', 'ayumi', 'haruka', 'sakura', 'yuko', 'mai', 'hikari', 'sayaka',             // 日文神经
    'sunhi', 'yuna', 'jihye', 'bomi', 'sora', 'jina', 'seoyeon',                          // 韩文神经
    'denise', 'hortense', 'amelie', 'katja', 'conrad', 'elvira', 'pablo',                 // 法/德/西 神经
    'svetlana', 'dmitry', 'french', 'german', 'spanish', 'russian',                       // 俄 神经 + 语种标记
    'wavenet', 'neural2', 'studio', 'journey', 'premium', 'casual'                         // 通用高质量
  ];
  // 偏“童声/女声”的关键词
  const GIRL_KEYS = ['huihui', 'yaoyao', 'xiaoxiao', 'xiaoyi', 'xiaohan', 'xiaomo',
                     'xiaoxuan', 'meijia', 'lili', 'tingting', 'female', '女', 'child',
                     'kids', 'kid', 'baby', 'yaru', 'aria', 'jenny', 'zira',
                     'nanami', 'ayumi', 'haruka', 'sakura', 'yuko', 'mai', 'hikari', 'sayaka',
                     'sunhi', 'yuna', 'jihye', 'bomi', 'sora', 'jina', 'seoyeon',
                     'denise', 'hortense', 'amelie', 'katja', 'elvira', 'svetlana'];
  // 排序优先级：推荐自然(0) < 自然(1) < 童/女声(2) < 普通(3)
  function voiceRank(v) {
    const n = v.name.toLowerCase();
    if (PREFERRED_NATURAL.some(function (k) { return n.indexOf(k) !== -1; })) return 0;
    const isNatural = /natural|neural|online/i.test(n);
    if (isNatural) return 1;
    return GIRL_KEYS.some(function (k) { return n.indexOf(k) !== -1; }) ? 2 : 3;
  }
  function loadVoices() {
    if (!window.speechSynthesis) return;
    const voices = speechSynthesis.getVoices();
    if (!voices || !voices.length) return;
    voicesByLang = {};
    selectedVoice = {};
    selectedVoiceIdx = {};
    // 每个已支持语种分别筛选 + 排序，并恢复上次选择
    Object.keys(LANGS).forEach(function (lang) {
      const list = voices.filter(function (v) {
        return v.lang && v.lang.toLowerCase().indexOf(lang) === 0;
      }).sort(function (a, b) { return voiceRank(a) - voiceRank(b); });
      voicesByLang[lang] = list;
      let saved = null;
      try { saved = localStorage.getItem(SAVED_VOICE_PREFIX + lang); } catch (e) {}
      let idx = saved ? list.findIndex(function (v) { return v.name === saved; }) : -1;
      if (idx < 0) idx = list.length ? 0 : -1;   // 默认选最自然的第一个
      selectedVoice[lang] = idx >= 0 ? list[idx] : null;
      selectedVoiceIdx[lang] = idx;
    });
  }
  loadVoices();
  if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;

  // 简化显示音色名（去掉厂商前缀、括号语言/地区、“ - ”等噪音）
  function voiceLabel(v) {
    const s = (v.name || '')
      .replace(/Microsoft\s+/gi, '')
      .replace(/Google\s+/gi, '')
      .replace(/Online\s*\(Natural\)/gi, '')
      .replace(/\([^)]*\)/g, '')
      .replace(/\s*-\s*/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
    return s || v.name;
  }

  // 按当前语种取语音列表 / 当前音色
  function getActiveVoices()   { return voicesByLang[currentLang] || []; }
  function getActiveVoice()    { return selectedVoice[currentLang] || null; }
  function getActiveVoiceIdx() { return selectedVoiceIdx[currentLang] != null ? selectedVoiceIdx[currentLang] : -1; }
  function setActiveVoice(i, v){ selectedVoiceIdx[currentLang] = i; selectedVoice[currentLang] = v; }

  // 选择某个音色（保存 + 试讲一句，跟随当前语种）
  function selectVoice(idx) {
    const list = getActiveVoices();
    if (!list.length) return;
    const v = list[idx];
    setActiveVoice(idx, v);
    try { localStorage.setItem(SAVED_VOICE_PREFIX + currentLang, v.name); } catch (e) {}
    const label = currentLang === 'zh' ? ('🔊 声音：' + voiceLabel(v))
               : currentLang === 'en' ? ('🔊 Voice: ' + voiceLabel(v))
               : ('🔊 ' + LANGS[currentLang].label + '：' + voiceLabel(v));
    showToast(label);
    if (window.speechSynthesis) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(LANGS[currentLang].voiceTest);
      u.lang = LANGS[currentLang].code;
      u.rate = 0.98;
      u.pitch = 1.35;
      u.voice = v;
      speechSynthesis.speak(u);
    }
  }

  // 打开音色选择面板（手动挑选，自然音色置顶分组展示，按当前语种）
  function openVoiceModal() {
    let list = getActiveVoices();
    if (!list.length) loadVoices();
    list = getActiveVoices();
    if (!list.length) { showToast('😅 没有找到可用的语音'); return; }
    voiceList.innerHTML = '';
    const curIdx = getActiveVoiceIdx();
    const preferred = [], natural = [], normal = [];
    list.forEach(function (v, i) {
      const n = v.name.toLowerCase();
      if (PREFERRED_NATURAL.some(function (k) { return n.indexOf(k) !== -1; })) preferred.push(i);
      else if (/natural|neural|online/i.test(n)) natural.push(i);
      else normal.push(i);
    });
    function renderGroup(title, idxs, badge) {
      if (!idxs.length) return;
      const g = document.createElement('div');
      g.className = 'voice-group-title';
      g.textContent = title + '（' + idxs.length + ' 个）';
      voiceList.appendChild(g);
      idxs.forEach(function (i) {
        const v = list[i];
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'voice-item' + (i === curIdx ? ' active' : '');
        const n2 = v.name.toLowerCase();
        const isNatural = /natural|neural|online/i.test(n2) ||
          PREFERRED_NATURAL.some(function (k) { return n2.indexOf(k) !== -1; });
        item.innerHTML = '<span>' + voiceLabel(v) + '</span>' +
          '<span class="badge' + (isNatural ? '' : ' normal') + '">' + (isNatural ? badge : '普通') + '</span>';
        item.addEventListener('click', function () {
          selectVoice(i);
          closeVoiceModal();
        });
        voiceList.appendChild(item);
      });
    }
    renderGroup('🌟 推荐自然声', preferred.slice(0, 4), '推荐');
    renderGroup('✨ 自然音色', natural, '自然');
    renderGroup('🎙️ 系统音色', normal, '普通');
    voiceModal.hidden = false;
  }
  function closeVoiceModal() { voiceModal.hidden = true; }

  // ---------- 撒花 ----------
  function burst() {
    const r = painting.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const colors = ['#ffd93d', '#ff8b94', '#7ed6ff', '#a8e063', '#c3a6ff', '#ff9d76'];
    for (let i = 0; i < 16; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = cx + 'px';
      s.style.top  = cy + 'px';
      s.style.background = colors[i % colors.length];
      s.style.setProperty('--tx', (Math.random() * 300 - 150) + 'px');
      s.style.setProperty('--ty', (Math.random() * -200 - 20) + 'px');
      s.style.setProperty('--r', (Math.random() * 360) + 'deg');
      document.body.appendChild(s);
      setTimeout(function () { s.remove(); }, 1000);
    }
  }

  // ---------- 气泡 ----------
  function showBubble(line) {
    bubble.innerHTML =
      '<span class="bubble-tag" style="background:' + TAG_COLORS[line.tag] + '">' + line.tag + '</span>' + line.text;
    bubble.classList.add('show');
  }
  function hideBubble() {
    bubble.classList.remove('show');
  }

  // ---------- 挥手 ----------
  function wave() {
    armRight.classList.remove('waving');
    void armRight.getBoundingClientRect(); // 强制重启动画（连续点击也能重新挥手）
    armRight.classList.add('waving');
    setTimeout(function () { armRight.classList.remove('waving'); }, 1800);
  }

  // ---------- 身体动作（挂在外层 kidOuter / 手臂，不干扰 bob 浮动） ----------
  const ACTIONS = {
    hop:     { el: kidOuter, cls: 'hop',     ms: 750  },  // 蹦跳
    sway:    { el: kidOuter, cls: 'sway',    ms: 1250 },  // 左右摇摆
    stretch: { el: kidOuter, cls: 'stretch', ms: 1150 },  // 伸懒腰
    tilt:    { el: kidOuter, cls: 'tilt',    ms: 1250 },  // 歪头
    think:   { el: armRight, cls: 'thinking', ms: 1750 }   // 托腮思考
  };
  const ACTION_NAMES = Object.keys(ACTIONS);
  function playAction(name) {
    const a = ACTIONS[name];
    if (!a) return;
    if (kid.classList.contains('talking')) return; // 说话时不抢动作
    const el = a.el;
    el.classList.remove(a.cls);
    void el.getBoundingClientRect(); // 强制重启动画
    el.classList.add(a.cls);
    setTimeout(function () { el.classList.remove(a.cls); }, a.ms);
  }

  // ---------- 让小宇说一句话（气泡 + 童声语音 + 挥手） ----------
  function say(text, tag) {
    if (window.speechSynthesis) speechSynthesis.cancel();
    kid.classList.add('talking');
    wave();
    painting.classList.add('wiggle');
    showBubble({ tag: tag, text: text });
    burst();

    const done = function () {
      setTimeout(function () {
        kid.classList.remove('talking');
        hideBubble();
      }, 900);
    };

    if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = LANGS[currentLang].code;   // 跟随当前语种
      u.rate = 0.98;   // 自然语速
      u.pitch = 1.35;  // 略高音调，保留一点童声感但不尖利
      const v = getActiveVoice();
      if (v) u.voice = v;
      u.onend = done;
      u.onerror = done;
      speechSynthesis.speak(u);
    } else {
      done();
    }
  }

  async function aiFetch(url, body) {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + AI.key },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      let detail = '';
      let code = '';
      try {
        const j = await res.json();
        detail = (j.error && j.error.message) || '';
        code = (j.error && j.error.code) || '';
      } catch (e) {}
      const err = new Error('HTTP ' + res.status + (detail ? ' ' + detail : ''));
      err.code = code;
      throw err;
    }
    const data = await res.json();
    const content = data && data.choices && data.choices[0] &&
                    data.choices[0].message && data.choices[0].message.content;
    if (!content) throw new Error('empty reply');
    return content.trim();
  }

  // 把场景 SVG 渲染成 2 倍高清 canvas
  function renderSceneToCanvas(cb) {
    try {
      const clone = document.getElementById('scene').cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const svgData = new XMLSerializer().serializeToString(clone);
      const url = URL.createObjectURL(new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' }));
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = 2000; canvas.height = 1400;
        canvas.getContext('2d').drawImage(img, 0, 0, 2000, 1400);
        URL.revokeObjectURL(url);
        cb(canvas);
      };
      img.onerror = function () { URL.revokeObjectURL(url); showToast('😅 截图失败，请重试'); };
      img.src = url;
    } catch (err) { showToast('😅 截图失败：' + err.message); }
  }

  function updateShotRect() {
    if (!shotState) return;
    const x = Math.min(shotState.sx, shotState.x);
    const y = Math.min(shotState.sy, shotState.y);
    const w = Math.abs(shotState.x - shotState.sx);
    const h = Math.abs(shotState.y - shotState.sy);

  function finishShot() {
    if (!shotState) return;
    const s = shotState;
    shotState = null;
    shotMask.classList.remove('on');
    shotRect.style.display = 'none';
    if (!s.dragging) return; // 单击不截图
    const vw = window.innerWidth, vh = window.innerHeight;
    // SVG 是 slice 填充，把屏幕选区反算回 SVG 坐标系
    const scale = Math.max(vw / 1000, vh / 700);
    const ox = (vw - 1000 * scale) / 2;
    const oy = (vh - 700 * scale) / 2;
    const x = Math.min(s.sx, s.x), y = Math.min(s.sy, s.y);
    const w = Math.abs(s.x - s.sx), h = Math.abs(s.y - s.sy);
    if (w < 3 || h < 3) return;
    const sx = (x - ox) / scale, sy = (y - oy) / scale;
    const sw = w / scale, sh = h / scale;
    renderSceneToCanvas(function (canvas) {
      const out = document.createElement('canvas');
      out.width = Math.max(2, Math.round(sw * 2));
      out.height = Math.max(2, Math.round(sh * 2));
      out.getContext('2d').drawImage(canvas, sx * 2, sy * 2, sw * 2, sh * 2, 0, 0, out.width, out.height);

  const detectBtn = document.getElementById('detectBtn');
  const detectPanel = document.getElementById('detectPanel');
  const detectVideo = document.getElementById('detectVideo');
  const detectStatus = document.getElementById('detectStatus');
  let detectStream = null;
  let detectTimer = null;
  let lastFrame = null;
  let lastCX = 0, lastCY = 0;
  let lastDxSign = 0, waveStreak = 0;
  let yHist = [];
  let cooldown = 0;
  let openStreak = 0, fistStreak = 0;
  const DW = 160, DH = 120;

  function grayOf(img) {
    const d = img.data, out = new Uint8Array(DW * DH);
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      out[j] = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) | 0;
    }
    return out;
  }

  // 肤色掩码（YCrCb 阈值）
  function skinMask(img) {
    const d = img.data;
    const mask = new Uint8Array(DW * DH);
    let n = 0, minX = DW, maxX = 0, minY = DH, maxY = 0;
    for (let i = 0, j = 0; i < d.length; i += 4, j++) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const y = (0.299 * r + 0.587 * g + 0.114 * b) | 0;
      const cb = ((b - y) * 0.564 + 128) | 0;
      const cr = ((r - y) * 0.713 + 128) | 0;
      if (cr >= 133 && cr <= 173 && cb >= 77 && cb <= 127 && y > 80) {
        mask[j] = 1;
        n++;
        if (j % DW < minX) minX = j % DW;
        if (j % DW > maxX) maxX = j % DW;
        if (((j / DW) | 0) < minY) minY = (j / DW) | 0;
        if (((j / DW) | 0) > maxY) maxY = (j / DW) | 0;
      }
    }
    return { mask: mask, n: n, minX: minX, maxX: maxX, minY: minY, maxY: maxY };
  }

  // 手势识别：返回 'open'（张手，≥3 指分开）| 'fist'（握拳，整块紧凑）| null
  function detectHandGesture(img) {
    const s = skinMask(img);
    if (s.n < 60 || s.n > 3500) return null; // 太少=噪声，太多=整张脸
    const w = s.maxX - s.minX + 1, h = s.maxY - s.minY + 1;
    if (w < 14 || h < 14) return null;
    const topRows = Math.max(5, (h * 0.5) | 0);
    let maxSegs = 0, threeRow = 0, oneRow = 0;
    for (let row = 0; row < topRows && row < h; row++) {
      const y = s.minY + row;
      let segs = 0, inSeg = false;
      for (let x = s.minX; x <= s.maxX; x++) {
        const on = s.mask[y * DW + x] === 1;
        if (on && !inSeg) { segs++; inSeg = true; }
        else if (!on) { inSeg = false; }
      }
      if (segs > maxSegs) maxSegs = segs;
      if (segs >= 3) threeRow++;
      if (segs === 1) oneRow++;
    }
    // 张手：顶部多行有 ≥3 段（手指散开）
    if (threeRow >= 4) return 'open';
    // 握拳：紧凑整块、无指缝、面积适中（区分于脸：脸面积大）
    if (s.n < 1400 && h >= 16 && h <= 44 && maxSegs <= 1 && oneRow >= 4) return 'fist';
    return null;
  }

  function startDetect() {
    if (detectStream) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showToast('😅 浏览器不支持摄像头，请用 Chrome / Edge');

    navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'user' }, audio: false }).then(function (stream) {
      detectStream = stream;
      detectVideo.srcObject = stream;
      detectPanel.hidden = false;
      detectStatus.textContent = '侦测中…张手=换衣 握拳=换背景 点头=换发色 挥手=换表情';
      lastFrame = null; yHist = []; cooldown = 0; waveStreak = 0; lastDxSign = 0;
      detectTimer = setInterval(processDetect, 150);
      detectBtn.classList.add('on');
      showToast('🕵️ 动作侦测已开启');
    }).catch(function (err) {
      const n = err && err.name || '';
      if (n === 'NotAllowedError' || n === 'PermissionDeniedError') {
        showToast('🔇 摄像头权限被拒绝：请点地址栏图标允许；若在预览框里请用浏览器新标签页打开');
      } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') {
        showToast('🔍 没有摄像头设备，请检查电脑/手机');
      } else {
        showToast('🎥 无法使用摄像头（' + n + '）');
      }
    });
  }

  function stopDetect() {
    if (detectTimer) { clearInterval(detectTimer); detectTimer = null; }
    if (detectStream) { detectStream.getTracks().forEach(function (t) { t.stop(); }); detectStream = null; }
    detectPanel.hidden = true;
    detectBtn.classList.remove('on');
    showToast('🕵️ 侦测已停止');

  function processDetect() {
    if (!detectVideo.videoWidth) return;
    if (cooldown > 0) { cooldown--; return; }
    const c = document.createElement('canvas');
    c.width = DW; c.height = DH;
    const ctx = c.getContext('2d');
    ctx.drawImage(detectVideo, 0, 0, DW, DH);
    const img = ctx.getImageData(0, 0, DW, DH);

    // ① 张手 / 握拳（静态手势，每帧检测，连续 2 帧确认）
    const gesture = detectHandGesture(img);
    if (gesture === 'open') {
      openStreak++;
      if (openStreak >= 2) { nextOutfit(); cooldown = 20; openStreak = 0; return; }
    } else {
      openStreak = 0;
    }
    if (gesture === 'fist') {
      fistStreak++;
      if (fistStreak >= 2) { nextBg(); cooldown = 20; fistStreak = 0; return; }
    } else {
      fistStreak = 0;
    }

    // 运动检测（点头 / 挥手）
    if (!lastFrame) { lastFrame = grayOf(img); return; }
    const g = grayOf(img);
    let total = 0, sx = 0, sy = 0, count = 0;
    for (let i = 0; i < g.length; i++) {
      const d = Math.abs(g[i] - lastFrame[i]);
      if (d > 24) {
        total += d;
        const px = i % DW, py = (i / DW) | 0;
        sx += px; sy += py; count++;
      }
    }
    lastFrame = g;
    if (count < 8) { lastCX = 0; lastCY = 0; return; } // 没有明显运动
    const cx = sx / count, cy = sy / count;
    const dx = cx - lastCX, dy = cy - lastCY;
    lastCX = cx; lastCY = cy;

    // ② 点头：质心 y 上下反复（up→down→up）→ 换发色
    if (Math.abs(dy) > 2) {
      yHist.push(dy > 0 ? 1 : -1);
      if (yHist.length > 6) yHist.shift();
      if (yHist.length >= 6) {
        let flips = 0;
        for (let i = 1; i < yHist.length; i++) if (yHist[i] !== yHist[i - 1]) flips++;
        if (flips >= 3) {
          nextHairColor(); cooldown = 14; yHist = [];
          return;
        }
      }
    }
    // ③ 挥手：运动量大 + 质心 x 来回快速摆动 → 换表情
    if (total > 5500 && Math.abs(dx) > 3) {
      const sgn = dx > 0 ? 1 : -1;
      if (lastDxSign !== 0 && sgn !== lastDxSign) {
        waveStreak++;
        if (waveStreak >= 3) {
          nextExpression(); cooldown = 14; waveStreak = 0; lastDxSign = 0;
          return;
        }
      }
      lastDxSign = sgn;
    } else if (total <= 5500) {
      waveStreak = 0;
    }
  }

  const micGrant = document.getElementById('micGrant');

  function checkMicPermission() {

      } else if (n === 'NotFoundError' || n === 'DevicesNotFoundError') {

        showToast('🎧 麦克风正被其他程序占用，请关闭后再试');
      } else {
        showToast('🎤 麦克风无法使用（' + n + '）');
      }
    });
  });
  checkMicPermission();

  // ---------- 预览框 / 非安全页面 提示（麦克风在这些环境会被浏览器拦截） ----------
  (function () {
    const inIframe = (window.self !== window.top);
    const insecure = !window.isSecureContext;
    if (!inIframe && !insecure) return; // 正常环境，不打扰
    const warn = document.getElementById('ctxWarn');
    const txt  = document.getElementById('ctxWarnText');
    const btn  = document.getElementById('ctxOpenBtn');
    if (inIframe) {
      txt.textContent = '⚠️ 当前在预览框里，浏览器会拦截麦克风，请点此在浏览器新标签页打开。';
    } else if (insecure) {
      txt.textContent = '⚠️ 直接双击打开的页面不是安全环境，麦克风用不了，请用本地服务器打开。';
    }
    // 独立打开地址：优先本机 8899 服务器（已帮你启动），否则用当前地址
    const standalone = (location.hostname === '127.0.0.1' || location.hostname === 'localhost')
      ? location.href
      : 'http://127.0.0.1:8899/index.html';
    btn.addEventListener('click', function () { window.open(standalone, '_blank'); });
    warn.hidden = false;
  })();

  // ---------- 按住说话（语音识别，推荐 Chrome / Edge） ----------
  const micBtn = document.getElementById('micBtn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let listening = false;
  let currentRec = null;

  function startMic(e) {
    e.preventDefault();
    if (listening) return;
    // 清理可能残留的上一次识别，防止状态卡死
    if (currentRec) {
      try { currentRec.abort(); } catch (x) {}
      currentRec = null;
    }
    if (!SR) {
      say('哎呀，当前浏览器不支持语音，请用 Chrome 或 Edge 打开哦！', '聊天');
      return;
    }
    if (!window.isSecureContext) {
      showToast('🔒 语音需要安全页面（https 或 localhost）才能用，请换一种方式打开页面');
      return;
    }
    listening = true;
    let gotResult = false;
    let started = false;
    if (window.speechSynthesis) speechSynthesis.cancel(); // 先停下小宇正在说的话
    micBtn.classList.add('rec');
    showToast('🎤 我在听，请说话…');

    // 权限状态提示（仅提示，不阻塞）
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'microphone' }).then(function (s) {
        if (s.state === 'denied') showToast('🔇 麦克风权限被拒绝：请点地址栏右侧的麦克风图标，改为「允许」');
        else if (s.state === 'prompt') showToast('🎤 请在浏览器弹出的提示中「允许」使用麦克风');
      }).catch(function () {});
    }

    // 关键：在用户按下的瞬间【同步】启动识别，浏览器才认这个操作
    try {
      currentRec = new SR();
      currentRec.lang = 'zh-CN';
      currentRec.interimResults = false;
      currentRec.maxAlternatives = 1;
      currentRec.onstart = function () { started = true; };
      currentRec.onresult = function (ev) {
        gotResult = true;
        const text = ev.results[0][0].transcript.trim();
        askInput.value = text;
        setTimeout(function () { ask(); }, 400); // 短暂显示识别文字后自动提问
      };
      currentRec.onerror = function (ev) {
        if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
          showToast('🔇 麦克风权限被拒绝：请点地址栏麦克风图标允许；如果在预览框里，请用浏览器新标签页打开');
        } else if (ev.error === 'no-speech') {
          showToast('😅 没听清，再说一次吧！');
        } else if (ev.error === 'audio-capture') {
          showToast('🎧 麦克风设备有问题或正被其他程序占用');
        } else if (ev.error === 'network') {
          showToast('🌐 语音识别连不上：浏览器自带识别走 Google 服务，国内常被墙。可改用下方输入框打字问小宇');
        } else {
          showToast('语音识别出错：' + ev.error);
        }
      };
      currentRec.onend = function () {
        listening = false;
        micBtn.classList.remove('rec');
        if (!gotResult) showToast('没听到声音，再按住试试吧');
      };
      currentRec.start(); // 同步启动

      // 启动守卫：1.6 秒内没有真正开始识别 → 多半是权限/iframe 问题
      setTimeout(function () {
        if (listening && !started && !gotResult) {
          listening = false;
          micBtn.classList.remove('rec');
          try { if (currentRec) currentRec.abort(); } catch (x) {}
          showToast('⚠️ 语音没有启动：请点地址栏麦克风图标允许；若在预览框里，点上方「🧭 在浏览器打开」。国内也可直接打字问小宇');
        }
      }, 1600);

      // 超时保护：12 秒内识别没结束就强制复位，防止“卡死/闪退”表现
      setTimeout(function () {
        if (listening && !gotResult) {
          listening = false;
          micBtn.classList.remove('rec');
          try { if (currentRec) currentRec.abort(); } catch (x) {}
          showToast('⏱️ 识别超时了，请再按一次');
        }
      }, 12000);
    } catch (err) {
      listening = false;
      micBtn.classList.remove('rec');
      showToast('语音启动失败，请重试');
    }
  }

  function stopMic(e) {
    if (!listening) return;
    try { if (currentRec) currentRec.stop(); } catch (err) {}
  }

  micBtn.addEventListener('pointerdown', startMic);
  micBtn.addEventListener('pointerup', stopMic);
  micBtn.addEventListener('pointercancel', stopMic);
  micBtn.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  kid.addEventListener('click', function (e) {
    e.stopPropagation();
    speak();
  });
  // 移动端手势
  kid.addEventListener('touchstart', function (e) {
    if (e.target.closest && e.target.closest('.paintingWrap')) return; // 画作交给“点击放大”
    e.preventDefault();
    speak();
  }, { passive: false });

  // ============================================================
  // 🖼️ 小宇的十幅画（想改画名只改这里）
  // ============================================================
  const ARTS = ['太阳与房子', '小汽车', '彩虹', '海底小鱼', '火箭与星空',
                '花朵草地', '小熊脸', '生日蛋糕', '大恐龙', '苹果树'];

  let artIndex = 0;
  const curArt    = document.getElementById('curArt');
  const lbSvgArt  = document.getElementById('lbArt');
  const lbLabel   = document.getElementById('lbLabel');
  const lightbox  = document.getElementById('lightbox');
  const toast     = document.getElementById('toast');
  const switchBtn = document.getElementById('switchBtn');

  // 显示第 i 幅（循环）
  function showArt(i, silent) {
    artIndex = ((i % ARTS.length) + ARTS.length) % ARTS.length;
    const n = artIndex + 1;
    const href = '#art' + n;
    curArt.setAttribute('href', href);
    lbSvgArt.innerHTML = '<g transform="translate(20,25)"><use href="' + href + '"></use></g>';
    lbLabel.textContent = '第 ' + n + ' 幅 · ' + ARTS[artIndex];
    if (!silent) {
      painting.classList.remove('wiggle');
      void painting.getBoundingClientRect(); // 强制重启动画
      painting.classList.add('wiggle');
      showToast('第 ' + n + ' 幅 · ' + ARTS[artIndex]);
    }
  }

  function showToast(t) {
    toast.textContent = t;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  function nextPainting() { showArt(artIndex + 1, false); playAction('hop'); }

  function openLightbox() {
    showArt(artIndex, true); // 同步放大图与标题
    lightbox.hidden = false;
  }
  function closeLightbox() { lightbox.hidden = true; }

  // 按「1」或点左下角「1」按钮：换下一幅
  switchBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    nextPainting();
  });
  document.addEventListener('keydown', function (e) {
    // 在输入框里打字时不触发换画/换场景快捷键
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === '1') nextPainting();
    if (e.key === '2') nextBg();
    if (e.key === 'Escape') closeLightbox();
  });

  // 点击画作：放大观看（不影响点击小宇自我介绍）
  painting.addEventListener('click', function (e) {
    e.stopPropagation();
    openLightbox();
  });

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbBackdrop').addEventListener('click', closeLightbox);

  // ============================================================
  // 🌆 五个场景背景（想改名字只改这里）
  // ============================================================
  const BGS = ['温馨小屋', '星光卧室', '春日花园', '海边沙滩', '梦幻太空'];
  let bgIndex = 0;
  const bg1Group    = document.getElementById('bg1');
  const curBgEl     = document.getElementById('curBg');
  const switchBgBtn = document.getElementById('switchBgBtn');

  function showBg(i, silent) {
    bgIndex = ((i % BGS.length) + BGS.length) % BGS.length;
    if (bgIndex === 0) {
      bg1Group.style.display = '';
      curBgEl.innerHTML = '';
    } else {
      bg1Group.style.display = 'none';
      curBgEl.innerHTML = '<use href="#bg' + (bgIndex + 1) + '"/>';
    }
    // 切换淡入
    const animEl = (bgIndex === 0) ? bg1Group : curBgEl;
    animEl.classList.remove('bg-fade');
    void animEl.getBoundingClientRect(); // 强制重启动画
    animEl.classList.add('bg-fade');
    if (!silent) showToast('第 ' + (bgIndex + 1) + ' 个场景 · ' + BGS[bgIndex]);
  }

  function nextBg() { showBg(bgIndex + 1, false); playAction('hop'); }

  switchBgBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    nextBg();
  });
  // ---------- 全局错误捕获（防止静默崩溃/卡死，并自动复位麦克风） ----------
  window.addEventListener('error', function (ev) {
    console.error('[页面错误]', ev.error || ev.message);
    try {
      listening = false;
      if (micBtn) micBtn.classList.remove('rec');
      if (cameraModal) cameraModal.hidden = true;
      if (detectPanel) detectPanel.hidden = true;
    } catch (e) {}
  });
  window.addEventListener('unhandledrejection', function (ev) {
    console.error('[未处理的Promise]', ev.reason && (ev.reason.message || ev.reason));
    try {
      listening = false;
      if (micBtn) micBtn.classList.remove('rec');
    } catch (e) {}
  });

  // ============================================================
  // 💬 空闲时偶尔自言自语（本地短句，不耗 AI 额度，增添灵气）
  // ============================================================
  let lastInteract = Date.now();
  function markInteract() { lastInteract = Date.now(); }

  // 任何点击/按键都算“有人互动”，重置空闲计时（避免刚互动完就冒一句）
  document.addEventListener('pointerdown', markInteract, true);
  document.addEventListener('keydown', markInteract, true);

  function idleChat() {
    // 随机 18~40 秒后再考虑是否“做点什么”，制造“偶尔”的感觉
    const wait = 18000 + Math.random() * 22000;
    setTimeout(function () {
      const idleMs = Date.now() - lastInteract;
      const free = !kid.classList.contains('talking') && !listening;
      if (idleMs > 15000 && free) {
        const L = LANGS[currentLang];
        if (Math.random() < 0.6) {
          playAction(ACTION_NAMES[Math.floor(Math.random() * ACTION_NAMES.length)]);
        } else {
          // 一半概率主动提问（拉近互动），一半概率自言自语
          const useQuestion = Math.random() < 0.5;
          const pool = useQuestion ? L.idleQuestions : L.idlePhrases;
          const line = pool[Math.floor(Math.random() * pool.length)];
          say(line, useQuestion ? '主动提问' : '闲聊');
        }
        lastInteract = Date.now(); // 重置，避免连续触发
      }
      idleChat(); // 继续循环监听
    }, wait);
  }
  // 页面加载后先安静一会儿，再开始偶尔活动
  setTimeout(idleChat, 10000);
</script>
</body>
</html>
