<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBTI 2.0 | 下一代人格审判系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Floating Background Elements -->
        <div class="bg-blur"></div>
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>

        <main class="container">
            <!-- Screen: Intro -->
            <section id="screen-intro" class="screen active">
                <div class="glass-card hero-card">
                    <div class="badge-new">NEW GENERATION</div>
                    <h1>SBTI <span class="text-gradient">2.0</span></h1>
                    <p class="subtitle">MBTI 已经过时。欢迎来到电子魂魄审判现场。<br>基于 15 维度的深度解析，揭开你最真实（或阴暗）的一面。</p>
                    
                    <div class="hero-stats">
                        <div class="stat-item">
                            <span class="stat-value">540亿+</span>
                            <span class="stat-label">可能的人格组合</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">15</span>
                            <span class="stat-label">测评维度</span>
                        </div>
                    </div>

                    <div class="actions">
                        <button id="btn-start" class="btn btn-primary">立即开始审判</button>
                    </div>
                    
                    <footer class="intro-footer">
                        灵感源自 B站@蛆肉儿串儿 · 核心算法由 Antigravity 驱动
                    </footer>
                </div>
            </section>

            <!-- Screen: Test -->
            <section id="screen-test" class="screen">
                <div class="test-header">
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div id="progress-fill" class="progress-fill"></div>
                        </div>
                        <div class="progress-text">
                            <span id="current-index">1</span> <span class="muted">/</span> <span id="total-count">0</span>
                        </div>
                    </div>
                </div>

                <div id="question-container" class="question-container">
                    <!-- Questions will be injected here -->
                </div>

                <div class="test-footer">
                    <p id="test-hint" class="hint">请跟随直觉，世界已经够乱了，别再对自己撒谎。</p>
                </div>
            </section>

            <!-- Screen: Result -->
            <section id="screen-result" class="screen">
                <div id="capture-area" class="result-card glass-card">
                    <div class="result-header">
                        <div class="result-badge" id="res-mode-kicker">你的主类型</div>
                        <h2 id="res-type-name" class="type-name">CTRL <span class="cn-name">（拿捏者）</span></h2>
                        <div class="match-percentage" id="res-match-badge">匹配度 92%</div>
                    </div>

                    <div class="result-content">
                        <div class="radar-container">
                            <div id="radar-chart" style="width: 100%; height: 300px;"></div>
                        </div>

                        <div class="analysis-section">
                            <h3>人格深层解读</h3>
                            <p id="res-desc" class="description"></p>
                        </div>

                        <div class="dimensions-detail">
                            <h3>维度明细评分</h3>
                            <div id="res-dim-list" class="dim-grid"></div>
                        </div>

                        <footer class="result-footer">
                            <div class="footer-logo">SBTI 2.0</div>
                            <div class="footer-note">本结果仅供娱乐。你可以笑，但别太当真。</div>
                        </footer>
                    </div>
                </div>

                <div class="result-actions no-print">
                    <button id="btn-restart" class="btn btn-secondary">重新开始</button>
                    <button id="btn-share" class="btn btn-primary">生成分享图片</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Component -->
    <div id="toast" class="toast"></div>

    <script type="module" src="main.js"></script>
</body>
</html>
