        };

            if (!isOpen || !data) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in" onClick={onClose}>

                                </div>

                                    <p className="text-slate-400 text-sm leading-relaxed">{data.detail}</p>

                                    <h4 className="text-cyan-300 font-bold mb-2">🧪 探究活动</h4>
                                    <p className="text-cyan-200/80 text-sm font-mono">{data.example}</p>

                                        <p className="text-orange-200/80 text-sm">{data.engineering}</p>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedNode, setSelectedNode] = useState(null);
            const [selectedStageColor, setSelectedStageColor] = useState("");

            // Filter logic
            const queryParams = new URLSearchParams(window.location.search);
            const stageFilter = queryParams.get('stage'); // 'p', 'j', 's'

            let filteredStages = stages;
            let stageTitle = "";

            if (stageFilter === 'p') {
                filteredStages = stages.filter(s => s.id.startsWith('p_'));
                stageTitle = " - 小学阶段";
            } else if (stageFilter === 'j') {
                filteredStages = stages.filter(s => s.id.startsWith('j_'));
                stageTitle = " - 初中阶段";
            } else if (stageFilter === 's') {
                filteredStages = stages.filter(s => s.id.startsWith('s_'));
                stageTitle = " - 高中阶段";
            }

            const gridClass = `grid grid-cols-[200px_repeat(${filteredStages.length},300px)] gap-6`;

            useEffect(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, []);

                <div className="min-h-screen bg-[#020617] text-slate-100 pb-20">
                    {/* Navigation */}
                    <a href="subject-synergy.html" className="fixed top-4 right-4 md:top-6 md:right-6 z-40 p-2 md:p-3 bg-slate-800/80 backdrop-blur border border-slate-700 rounded-full text-slate-400 hover:text-white hover:bg-emerald-600 transition-all shadow-lg group">

                        <p className="text-slate-400 max-w-2xl mx-auto text-sm md:text-lg">

                        </div>
                        <div className="overflow-x-auto custom-scrollbar pb-4">

                                        <div key={stage.id} className={`flex flex-col items-center p-4 rounded-xl ${stage.bgSoft} border ${stage.borderColor}`}>

                                            <span className="text-xs text-slate-400 mt-1">{stage.subtitle}</span>
                                        </div>
                                    ))}
                                </div>

                                    {tracks.map(track => (
                                        <div key={track.id} className={`${gridClass} group`}>

                                                <p className="text-xs text-slate-500 font-medium">{track.desc}</p>
                                            </div>

                                            {/* Stage Nodes */}
                                            {filteredStages.map(stage => {
                                                const data = curriculumData[track.id][stage.id];
                                                return (
                                                    <div
                                                        key={`${track.id}-${stage.id}`}

                                                            setSelectedNode(data);

                                                                {data.title}

                                                            <div className="space-y-1.5 mb-4 flex-grow text-xs text-slate-400">
                                                                {data.core.slice(0, 3).map((item, i) => (
                                                                    <div key={i} className="flex items-center gap-2">
                                                                        <div className={`w-1.5 h-1.5 rounded-full ${stage.color}`}></div>

                                                            </div>

                        </div>
                    </main>

                    <DetailModal
                        isOpen={!!selectedNode}
                        onClose={() => setSelectedNode(null)}
                        data={selectedNode}
                        stageColor={selectedStageColor}

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

</body>
