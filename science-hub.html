<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科学发现中心 | Science Discovery Hub</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        .font-mono-code {
            font-family: 'JetBrains+Mono', monospace;
        }

        .font-space {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px var(--primary-glow);
        }

        .nebula-bg {
            background: radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        @keyframes atom-rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .atom-path {
            animation: atom-rotate 10s linear infinite;
        }

        .circuit-pattern {
            background-image: radial-gradient(rgba(16, 185, 129, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const IconBase = ({ children, className, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        const Atom = (props) => <IconBase {...props}><circle cx="12" cy="12" r="1" /><path d="M20.2 20.2c2.04-2.03.02-9.17-4.5-15.89-4.52-6.72-10.23-10.12-12.27-8.09-2.04 2.03-.02 9.17 4.5 15.89 4.52 6.72 10.23 10.12 12.27 8.09z" /><path d="M3.8 3.8c-2.04 2.03-.02 9.17 4.5 15.89 4.52 6.72 10.23 10.12 12.27 8.09 2.04-2.03.02-9.17-4.5-15.89-4.52-6.72-10.23-10.12-12.27-8.09z" /></IconBase>;
        const Beaker = (props) => <IconBase {...props}><path d="M4.5 3h15" /><path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3" /><path d="M6 14h12" /></IconBase>;
        const Telescope = (props) => <IconBase {...props}><path d="m10 10 3 3" /><path d="m18.5 5.5-4.5 4.5" /><path d="m3 21 8-8" /><path d="m9.5 15.5 4.5-4.5" /><path d="M20 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h2Z" /></IconBase>;
        const Microscope = (props) => <IconBase {...props}><path d="M6 18h8" /><path d="M3 22h18" /><path d="M14 22a7 7 0 1 0 0-14h-1" /><path d="M9 14h2" /><path d="M9 12a2 2 0 1 0-2 2h2V9a2 2 0 1 0-4 0v5a2 2 0 0 0 2 2h1" /><path d="M12 6V3l3 1" /></IconBase>;
        const Home = (props) => <IconBase {...props}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></IconBase>;
        const LayoutGrid = (props) => <IconBase {...props}><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></IconBase>;

        const DiscoveryCard = ({ title, category, icon: Icon, color }) => (
            <div className="glass-card rounded-3xl p-6 group cursor-pointer overflow-hidden relative">
                <div className={`absolute -bottom-4 -right-4 w-24 h-24 opacity-10 group-hover:opacity-20 transition-all duration-500 ${color}`}>
                    <Icon className="w-full h-full" />
                </div>
                <div className="flex flex-col h-full relative z-10">
                    <span className={`text-[10px] font-bold tracking-widest uppercase mb-2 ${color}`}>{category}</span>
                    <h3 className="text-xl font-bold mb-4">{title}</h3>
                    <div className="mt-auto flex items-center gap-2 text-slate-400 group-hover:text-white transition-colors">
                        <span className="text-sm font-bold">START EXPLORING</span>
                        <Icon className="w-4 h-4" />
                    </div>
                </div>
            </div>
        );

        const App = () => {
            return (
                <div className="min-h-screen relative nebula-bg circuit-pattern pb-20">
                    {/* Floating Nav */}
                    <nav className="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-card rounded-full px-8 py-3 flex items-center gap-6 border border-white/10">
                        <a href="index.html" className="text-slate-400 hover:text-white transition-colors"><Home className="w-5 h-5" /></a>
                        <div className="w-px h-4 bg-slate-700"></div>
                        <a href="#" className="text-emerald-400 font-bold text-sm tracking-widest">OBSERVE</a>
                        <a href="#" className="text-slate-400 hover:text-emerald-400 transition-colors text-sm tracking-widest">EXPERIMENT</a>
                        <a href="#" className="text-slate-400 hover:text-emerald-400 transition-colors text-sm tracking-widest">SIMULATE</a>
                    </nav>

                    {/* Standards Link */}
                    <div className="fixed top-6 right-6 z-50">
                        <a href="science-curriculum.html?stage=p" className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-full font-bold text-sm transition-all group shadow-lg shadow-emerald-500/20">
                            标准课标 <LayoutGrid className="w-4 h-4 group-hover:rotate-90 transition-transform" />
                        </a>
                    </div>

                    <main className="container mx-auto px-6 pt-32">
                        {/* Hero */}
                        <div className="flex flex-col lg:flex-row items-center gap-16 mb-24">
                            <div className="flex-1">
                                <div className="inline-block px-3 py-1 rounded bg-emerald-500/10 border border-emerald-500/20 text-emerald-500 text-xs font-bold mb-6 font-mono-code">
                                    [ SYSTEM STATUS: CURIO_V.1.0_STABLE ]
                                </div>
                                <h1 className="text-6xl md:text-8xl font-space font-bold mb-6 leading-none">
                                    像科学家一样<br />
                                    <span className="gradient-text">思考世界</span>
                                </h1>
                                <p className="text-xl text-slate-400 max-w-xl mb-10 leading-relaxed">
                                    从微观细胞到遥远星系。在这里，我们不只是学习知识，而是重新发现宇宙的运行逻辑。
                                </p>
                                <div className="flex gap-4">
                                    <button className="bg-emerald-600 hover:bg-emerald-500 text-white px-10 py-4 rounded-2xl font-bold flex items-center gap-2 transition-all">
                                        开启探索之旅 <Atom className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>
                            <div className="flex-1 relative">
                                <div className="relative w-full aspect-square max-w-lg mx-auto">
                                    <div className="absolute inset-0 bg-emerald-500/10 blur-[100px] animate-pulse"></div>
                                    <div className="relative z-10 glass-card rounded-[4rem] p-12 flex items-center justify-center overflow-hidden h-full">
                                        <div className="atom-path absolute inset-0 border-2 border-dashed border-emerald-500/20 rounded-full"></div>
                                        <div className="atom-path absolute inset-8 border border-emerald-500/10 rounded-full" style={{ animationDuration: '15s', animationDirection: 'reverse' }}></div>
                                        <Atom className="w-32 h-32 text-emerald-500 animate-pulse" />
                                    </div>
                                    {/* Floating Stats */}
                                    <div className="absolute -top-4 -right-4 glass-card p-4 rounded-2xl border border-emerald-500/30">
                                        <div className="text-xs text-slate-500 font-bold mb-1">DATA FLOW</div>
                                        <div className="text-emerald-400 font-mono-code font-bold">8.42 PB/s</div>
                                    </div>
                                    <div className="absolute -bottom-4 -left-4 glass-card p-4 rounded-2xl border border-sky-500/30">
                                        <div className="text-xs text-slate-500 font-bold mb-1">HYPOTHESIS</div>
                                        <div className="text-sky-400 font-mono-code font-bold">READY_TO_TEST</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Discovery Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-20">
                            <DiscoveryCard
                                category="Observatory"
                                title="星空之眼：探索深空奥秘"
                                icon={Telescope}
                                color="text-emerald-400"
                            />
                            <DiscoveryCard
                                category="Lab"
                                title="物质密语：化学反应仿真"
                                icon={Beaker}
                                color="text-amber-400"
                            />
                            <DiscoveryCard
                                category="Micro-World"
                                title="生命的底层逻辑：细胞探针"
                                icon={Microscope}
                                color="text-sky-400"
                            />
                            <DiscoveryCard
                                category="Physics"
                                title="力与场的终极对决"
                                icon={Atom}
                                color="text-rose-400"
                            />
                        </div>

                        {/* Scientific Method Section */}
                        <section className="bg-slate-900/40 rounded-[3rem] p-8 md:p-16 border border-white/5 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-full h-full circuit-pattern opacity-10"></div>
                            <div className="relative z-10">
                                <h2 className="text-4xl font-space font-bold mb-12 flex items-center gap-4">
                                    <span className="w-2 h-10 bg-emerald-500 rounded-full"></span>
                                    科学方法论
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-12">
                                    {[
                                        { s: "提出假设", d: "通过观察现象，构思可能的因果关系。" },
                                        { s: "实验验证", d: "在受控环境下进行可重复的测试。" },
                                        { s: "得出结论", d: "分析数据，验证假设并形成系统性的理论。" }
                                    ].map((step, i) => (
                                        <div key={i} className="flex flex-col gap-4 group">
                                            <div className="text-6xl font-space font-bold text-slate-800 group-hover:text-emerald-500/20 transition-colors">0{i + 1}</div>
                                            <h4 className="text-xl font-bold">{step.s}</h4>
                                            <p className="text-slate-400 leading-relaxed">{step.d}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="mt-24 py-16 border-t border-white/5">
                        <div className="container mx-auto px-6 text-center text-slate-500 font-bold tracking-widest text-sm uppercase">
                            © 2025 Science Discovery Hub | Building the Scientific Mindset of Tomorrow
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>

</html>
