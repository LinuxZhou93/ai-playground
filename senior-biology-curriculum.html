                        isOpen={!!selectedNode}
                        onClose={() => setSelectedNode(null)}
                        data={selectedNode}
                        stageColor={selectedStageColor}
                    />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
