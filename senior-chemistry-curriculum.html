                            </div>

                                <div className="bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">

                                    <p className="text-teal-200/80 text-sm font-mono">{data.example}</p>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">

                                        <p className="text-lime-200/80 text-sm">{data.math_connection}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [selectedNode, setSelectedNode] = useState(null);
            const [selectedStageColor, setSelectedStageColor] = useState("");

            // Filter logic
            const queryParams = new URLSearchParams(window.location.search);
            const stageFilter = queryParams.get('stage'); // 'p', 'j', 's'

            let filteredStages = stages;
            let stageTitle = "";

            if (stageFilter === 'p') {
                filteredStages = stages.filter(s => s.id.startsWith('p_'));
                stageTitle = " - 小学阶段";
            } else if (stageFilter === 'j') {
                filteredStages = stages.filter(s => s.id.startsWith('j_'));
                stageTitle = " - 初中阶段";
            } else if (stageFilter === 's') {
                filteredStages = stages.filter(s => s.id.startsWith('s_'));
                stageTitle = " - 高中阶段";
            }

            const gridClass = `grid grid-cols-[200px_repeat(${filteredStages.length},300px)] gap-6`;

            useEffect(() => {
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }

                        <p className="text-slate-400 max-w-2xl mx-auto text-sm md:text-lg">

                    </header>

                    <main className="max-w-7xl mx-auto px-4">

                        </div>
                        <div className="overflow-x-auto custom-scrollbar pb-4">
                            <div className="w-fit">
                                {/* Stage Headers */}

                                    </div>
                                    {filteredStages.map(stage => (
                                        <div key={stage.id} className={`flex flex-col items-center p-4 rounded-xl ${stage.bgSoft} border ${stage.borderColor}`}>

                                            <span className="text-xs text-slate-400 mt-1">{stage.subtitle}</span>
                                        </div>
                                    ))}
                                </div>

                                    {tracks.map(track => (
                                        <div key={track.id} className={`${gridClass} group`}>
                                            {/* Track Header */}
                                            <div className={`glass-panel rounded-xl p-6 flex flex-col justify-center items-end text-right border-r-4 ${track.color.replace('text-', 'border-')}`}>

                                                <h3 className={`text-xl font-bold text-white mb-1`}>{track.title}</h3>
                                                <p className="text-xs text-slate-500 font-medium">{track.desc}</p>
                                            </div>

                                            {/* Stage Nodes */}
                                            {filteredStages.map(stage => {
                                                const data = curriculumData[track.id][stage.id];
                                                return (
                                                    <div
                                                        key={`${track.id}-${stage.id}`}
                                                        onClick={() => {
                                                            setSelectedNode(data);
                                                            setSelectedStageColor(stage.color);
                                                        }}
                                                        className={`
                                                            relative h-full min-h-[180px] rounded-xl p-5 cursor-pointer
                                                            bg-slate-900/40 border border-slate-800
                                                            hover:bg-slate-800 hover:border-slate-600 hover:shadow-xl hover:-translate-y-1
                                                            transition-all duration-300 group/card overflow-hidden flex flex-col
                                                        `}
                                                    >
                                                        {/* Hover Glow */}
                                                        <div className={`absolute inset-0 opacity-0 group-hover/card:opacity-10 transition-opacity duration-500 bg-gradient-to-br ${track.gradient}`}></div>

                                                        <div className="relative z-10 h-full flex flex-col">

                                                                {data.title}
                                                            </h4>

                                                            <div className="space-y-1.5 mb-4 flex-grow text-xs text-slate-400">
                                                                {data.core.slice(0, 3).map((item, i) => (
                                                                    <div key={i} className="flex items-center gap-2">
                                                                        <div className={`w-1.5 h-1.5 rounded-full ${stage.color}`}></div>
                                                                        {item}

                                                                ))}

                                                            <div className="mt-auto pt-3 border-t border-slate-700/50 flex items-center justify-between">
                                                                <span className={`text-[10px] font-bold px-2 py-1 rounded bg-slate-950 ${stage.textColor}`}>
                                                                    {stage.label.split(' ')[0]}

                                                                <span className="text-xs text-slate-500 group-hover/card:text-teal-400 transition-colors flex items-center gap-1">

                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </main>

                    <DetailModal
                        isOpen={!!selectedNode}
                        onClose={() => setSelectedNode(null)}
                        data={selectedNode}
                        stageColor={selectedStageColor}
                    />
                </div>
            );

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
