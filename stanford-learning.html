<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanford d.school | 斯坦福设计思维实验室</title>
    <script crossorigin src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #fffcf9;
            color: #1e1e1e;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        .font-space {
            font-family: 'Space Grotesk', sans-serif;
        }

        .stanford-cardinal {
            color: #8C1515;
        }

        .bg-stanford-cardinal {
            background-color: #8C1515;
        }

        .d-school-yellow {
            background-color: #F8B12C;
        }

        .sketch-card {
            border: 3px solid #1e1e1e;
            box-shadow: 8px 8px 0px #1e1e1e;
            transition: all 0.2s ease;
        }

        .sketch-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px #1e1e1e;
        }

        .stage-badge {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 20px 8px;
            font-weight: 700;
            background: #1e1e1e;
            color: #fff;
            text-transform: uppercase;
            font-size: 10px;
            border-radius: 0 12px 12px 0;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        .draw-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2s forwards ease-in-out;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel">
        const App = () => {
            return (
                <div className="min-h-screen pb-20">
                    <nav className="fixed top-0 w-full z-50 bg-[#fffcf9]/80 backdrop-blur-md border-b-2 border-black px-8 py-5 flex justify-between items-center text-sm font-bold">

                        <div className="flex items-center gap-4">
                            <span className="font-space">Stanford d.school K-12</span>
                            <div className="w-8 h-8 d-school-yellow border-2 border-black rotate-3"></div>
                        </div>
                    </nav>

                    <main className="pt-32 px-8 container mx-auto">

                                    <span className="underline decoration-yellow-400">UNEXPECTED</span>.
                                </h1>

                            <div className="w-full md:w-1/3 sketch-card p-10 rounded-2xl d-school-yellow rotate-2">

                                    </div>
                                </div>

                                <div className="absolute top-0 right-0 stage-badge">Stanford cardinal</div>
                                <h3 className="text-4xl font-space font-bold mb-8 stanford-cardinal">Stanford Online</h3>
                                <p className="text-gray-600 mb-10 leading-relaxed">

                                        <p className="text-[10px] text-gray-500 leading-tight">{m.d}</p>
                                    </div>

</body>

</html>
