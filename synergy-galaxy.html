<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学科协同知识星系 | Subject Synergy Galaxy</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Local Libraries (Offline Friendly) -->
    <script src="assets/js/lib/three.min.js"></script>
    <script src="assets/js/lib/three-spritetext.min.js"></script>
    <script src="assets/js/lib/3d-force-graph.min.js"></script>
    <!-- Downloaded D3 Locally -->
    <script src="assets/js/lib/d3.min.js"></script>
    <!-- D3 is needed for force simulation - relying on graph internal or simple D3 if needed. 
         ForceGraph usually bundles key D3 modules. If not, we might need d3.js locally too. 
         But sticking to what worked before: The minified 3d-force-graph usually has it. -->

    <!-- On-Screen Debug Console (Hidden by default, shows on error) -->
    <div id="debug-console"
        class="fixed top-0 left-0 w-full h-32 bg-red-900/90 text-white text-xs font-mono p-2 overflow-y-auto z-[100] hidden pointer-events-none">
    </div>

    <script>
        // Emergency Debugger
        const debugElem = document.getElementById('debug-console');
        window.onerror = function (msg, url, line) {
            debugElem.style.display = 'block';
            debugElem.innerHTML += `<div>[CRITICAL] ${msg} (${line})</div>`;
        };
        const _log = console.log;
        const _warn = console.warn;
        const _error = console.error;
        console.error = (...args) => {
            debugElem.style.display = 'block';
            debugElem.innerHTML += `<div class="text-red-300">[ERROR] ${args.join(' ')}</div>`;
            _error(...args);
        };
        console.warn = (...args) => {
            // debugElem.style.display = 'block'; // Don't show for warnings
            _warn(...args);
        };
        console.log = (...args) => {
            // _log(...args); // Keep console clean for user
        };
    </script>
    <style>
        body {
            background-color: #050b14;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .glass-panel:hover {
            border-color: rgba(56, 189, 248, 0.4);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 3px;
        }

        /* Modal Animation */
        .modal-enter {
            opacity: 0;
            transform: scale(0.9);
        }

        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }

        .modal-exit {
            opacity: 1;
        }

        .modal-exit-active {
            opacity: 0;
            transition: opacity 200ms;
        }
    </style>
</head>

<body>

    <!-- 1. Background Graph Container -->
    <div id="galaxy-area" class="fixed inset-0 z-0 bg-[#050b14]">
        <div id="galaxy-graph" class="w-full h-full"></div>
    </div>

    <!-- 2. Overlay UI -->
    <div class="relative z-10 w-full h-screen flex flex-col pointer-events-none">

        <!-- Header Bar -->
        <div class="pointer-events-auto w-full p-4 md:p-6 flex justify-between items-start">
            <!-- Title -->
            <div class="glass-panel rounded-2xl p-4 md:px-6 md:py-3 flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-cyan-500/20 flex items-center justify-center text-cyan-400">
                    <i data-lucide="network"></i>
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-white font-orbitron tracking-wider">
                        学科协同星系 <span class="text-cyan-400 text-sm block md:inline md:ml-2">SYNERGY GALAXY</span>
                    </h1>
                    <div class="flex gap-4 text-xs text-slate-400 mt-1">
                        <span><i data-lucide="database" class="w-3 h-3 inline"></i> <span id="total-entries">0</span>
                            节点</span>
                    </div>
                </div>
            </div>

            <!-- Top Right Navigation -->
            <div class="flex gap-4">
                <div class="glass-panel rounded-full p-1 flex gap-1">
                    <button onclick="switchView('galaxy')" id="btn-galaxy"
                        class="px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]">
                        <i data-lucide="box" class="w-4 h-4 inline mr-1"></i> 星系视图
                    </button>
                    <button onclick="switchView('grid')" id="btn-grid"
                        class="px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">
                        <i data-lucide="layout-grid" class="w-4 h-4 inline mr-1"></i> 矩阵列表
                    </button>
                </div>

                <a href="subject-synergy.html"
                    class="glass-panel p-3 rounded-full text-slate-300 hover:text-white hover:bg-cyan-900/40 transition-all"
                    title="返回上一页">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
            </div>
        </div>

        <!-- Matrix List View -->
        <div id="wiki-container-wrapper"
            class="pointer-events-auto absolute inset-0 z-20 flex items-center justify-center p-4 md:p-10"
            style="display: none;">
            <div
                class="glass-panel w-full max-w-6xl h-full rounded-3xl overflow-hidden flex flex-col bg-slate-900/90 shadow-2xl">
                <div class="p-6 border-b border-cyan-500/20 flex justify-between items-center bg-slate-900/40">
                    <h2 class="text-xl text-white font-bold flex items-center gap-2">
                        <i data-lucide="list"></i> 知识矩阵数据库
                    </h2>
                    <div class="relative w-64 md:w-96">
                        <i data-lucide="search" class="absolute left-3 top-3 w-4 h-4 text-slate-400"></i>
                        <input type="text" onkeyup="searchWiki()" id="search-input" placeholder="检索学科知识库..."
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-2 pl-10 pr-4 text-white focus:outline-none focus:border-cyan-500 transition-all">
                    </div>
                </div>
                <div id="wiki-container"
                    class="flex-1 overflow-y-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Cards go here -->
                </div>
            </div>
        </div>

        <!-- Galaxy Controls -->
        <div id="galaxy-controls-overlay" class="pointer-events-auto absolute bottom-8 right-8 flex flex-col gap-3">
            <button onclick="resetCamera()"
                class="glass-panel p-3 rounded-xl text-cyan-400 hover:bg-cyan-900/30 hover:scale-105"><i
                    data-lucide="crosshair"></i></button>
        </div>

        <!-- Stage Selector (New) -->
        <div class="pointer-events-auto absolute top-24 left-1/2 transform -translate-x-1/2 flex gap-2">
            <div class="glass-panel p-1 rounded-full flex gap-1 bg-slate-900/80 backdrop-blur-md">
                <button onclick="filterStage('all', this)"
                    class="stage-btn active px-4 py-1.5 rounded-full text-xs font-bold text-white bg-indigo-600 shadow-lg transition-all">全部阶段</button>
                <button onclick="filterStage('elementary', this)"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">小学</button>
                <button onclick="filterStage('middle', this)"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">初中</button>
                <button onclick="filterStage('high', this)"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">高中</button>
                <button onclick="filterStage('university', this)"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">大学</button>
            </div>
        </div>

        <!-- Filter Bar (Subject) -->
        <div id="filter-bar"
            class="pointer-events-auto absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel rounded-full px-2 py-2 flex gap-1 overflow-x-auto max-w-[90vw]">
            <button onclick="filterSubject('all', this)"
                class="subject-btn active px-4 py-2 rounded-full text-xs md:text-sm font-bold text-white bg-cyan-600 shadow-lg shadow-cyan-500/30 transition-all">ALL</button>
            <button onclick="filterSubject('math', this)"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-blue-600 hover:text-white transition-all">MATH</button>
            <button onclick="filterSubject('physics', this)"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-orange-600 hover:text-white transition-all">PHYSICS</button>
            <button onclick="filterSubject('chemistry', this)"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-pink-600 hover:text-white transition-all">CHEMISTRY</button>
            <button onclick="filterSubject('biology', this)"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-green-600 hover:text-white transition-all">BIOLOGY</button>
            <button onclick="filterSubject('cs', this)"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-cyan-600 hover:text-white transition-all">CS</button>
            <button onclick="filterSubject('science', this)"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-purple-600 hover:text-white transition-all">SCIENCE</button>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm"
        onclick="if(event.target===this) closeModal()">
        <div class="glass-panel w-full max-w-2xl m-4 rounded-2xl overflow-hidden transform transition-all scale-95 opacity-0 relative"
            id="modal-content-box">
            <button onclick="closeModal()"
                class="absolute top-4 right-4 p-2 rounded-full bg-slate-800 text-white hover:bg-red-500 transition-all z-10"><i
                    data-lucide="x"></i></button>
            <div class="p-6 border-b border-cyan-500/20 bg-slate-900/60 pt-10 md:pt-6">
                <h2 id="modal-title" class="text-2xl font-bold text-white font-orbitron">Title</h2>
            </div>
            <div class="p-6 max-h-[60vh] overflow-y-auto text-slate-300 leading-relaxed" id="modal-content-text"></div>
            <div class="p-6 border-t border-cyan-500/20 bg-slate-900/60 flex justify-between items-center">
                <div id="modal-tags" class="flex gap-2 flex-wrap"></div>
            </div>
        </div>
    </div>

    <!-- Import Data -->
    <script src="assets/js/synergy-data.js"></script>

    <script>
        lucide.createIcons();
        let Graph = null;

        // 2D Filter State
        let currentSubject = 'all';
        let currentStage = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initGalaxy();
            updateEntryCount();

            // Force Resize Patch for 'File' Protocol Issues
            // Sometimes the canvas initializes with 0 height/width when local.
            setTimeout(() => {
                if (Graph) {
                    Graph.width(window.innerWidth);
                    Graph.height(window.innerHeight);
                    Graph.d3ReheatSimulation();
                }
            }, 500);

            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 1000);
        });

        // Computed Data Getter
        function getFilteredData() {
            return synergyData.filter(item => {
                const matchSubject = currentSubject === 'all' || item.category === currentSubject;
                const matchStage = currentStage === 'all' || item.stage === currentStage;
                return matchSubject && matchStage;
            });
        }

        function updateEntryCount() {
            if (window.synergyData) {
                // Show currently visible count / total
                const visible = getFilteredData().length;
                document.getElementById('total-entries').innerText = `${visible} / ${window.synergyData.length}`;
            }
        }

        /* === VISUAL RESTORATION: PURE DEFAULTS === */
        function initGalaxy() {
            const elem = document.getElementById('galaxy-graph');

            // Revert to Pure Instanced Mesh (Performance & Stability King)
            Graph = ForceGraph3D()
                (elem)
                .backgroundColor('#00000000')
                .showNavInfo(false)
                .nodeLabel('title')
                .nodeColor(node => getCategoryColor(node.group))
                .nodeRelSize(node => node.val || 4)
                .nodeOpacity(0.9)
                .onNodeClick(node => {
                    const distRatio = 1 + 60 / Math.hypot(node.x, node.y, node.z);
                    Graph.cameraPosition(
                        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                        node,
                        2000
                    );
                    setTimeout(() => openModal(node.data), 1500);
                });

            // No Custom Lights, No Custom Objects -> Uses Library Defaults

            // Init Data
            updateGalaxyData();

            // Force Resize Patch
            const resize = () => { Graph.width(window.innerWidth); Graph.height(window.innerHeight); };
            window.addEventListener('resize', resize);
            resize();
        }

        function updateGalaxyData() {
            const data = getFilteredData();
            updateEntryCount();

            const nodes = data.map(i => ({
                id: i.id,
                title: i.title,
                group: i.category,
                val: i.type === 'concept' ? 3 : (i.type === 'lab' ? 2 : 4),
                data: i,
                isHub: false
            }));

            // Create Hubs
            const categories = [...new Set(data.map(d => d.category))];
            const hubNodes = categories.map(cat => ({
                id: `HUB_${cat}`,
                title: cat.toUpperCase(),
                group: cat,
                val: 12,
                isHub: true,
                data: { title: cat.toUpperCase() + " HUB", content: `Center of ${cat}`, tags: [] }
            }));

            const links = [];
            nodes.forEach(n => {
                links.push({ source: n.id, target: `HUB_${n.group}` });
            });

            Graph.graphData({ nodes: [...nodes, ...hubNodes], links: links });

            // Keep Galaxy Forces (They are mostly safe)
            Graph.d3Force('charge', d3.forceManyBody().strength(node => node.isHub ? -800 : -60));

            Graph.d3ReheatSimulation();
        }

        /* === VIEW SWITCHER & MODAL === */
        function switchView(mode) {
            const listWrapper = document.getElementById('wiki-container-wrapper');
            const btnGalaxy = document.getElementById('btn-galaxy');
            const btnGrid = document.getElementById('btn-grid');
            const galaxyControls = document.getElementById('galaxy-controls-overlay');
            const filterBar = document.getElementById('filter-bar');

            if (mode === 'grid') {
                listWrapper.style.display = 'flex';
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'none'; filterBar.style.display = 'none';
                renderList();
            } else {
                listWrapper.style.display = 'none';
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'flex'; filterBar.style.display = 'flex';
                // Trigger update to ensure graph is fresh
                updateGalaxyData();
            }
        }

        function renderList() {
            const container = document.getElementById('wiki-container');
            container.innerHTML = '';
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase();

            // Use filtered Data
            let data = getFilteredData();

            if (searchTerm) {
                data = data.filter(item => item.title.toLowerCase().includes(searchTerm));
            }

            data.slice(0, 200).forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-panel p-4 rounded-xl hover:bg-slate-800/80 cursor-pointer border border-slate-700/50";
                card.onclick = () => openModal(item);
                const color = getCategoryColor(item.category);

                // Show Stage Tag
                card.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-400">${item.stage.toUpperCase()}</span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2" style="color:${color}">${item.title}</h3>
                    <div class="text-sm text-slate-400 overflow-hidden h-12">${item.content.replace(/<[^>]*>?/gm, '').substring(0, 60)}...</div>
                 `;
                container.appendChild(card);
            });
        }
        function searchWiki() { if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList(); }

        // --- 2D Filter Logic ---

        function filterSubject(subject, btn) {
            currentSubject = subject;

            // Visual Update
            document.querySelectorAll('.subject-btn').forEach(b => b.className = "subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-blue-600 hover:text-white transition-all");
            btn.className = "subject-btn active px-4 py-2 rounded-full text-xs md:text-sm font-bold text-white bg-cyan-600 shadow-lg shadow-cyan-500/30 transition-all";

            updateGalaxyData();
            if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList();
        }

        function filterStage(stage, btn) {
            currentStage = stage;

            // Visual Update
            document.querySelectorAll('.stage-btn').forEach(b => b.className = "stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all");
            btn.className = "stage-btn active px-4 py-1.5 rounded-full text-xs font-bold text-white bg-indigo-600 shadow-lg transition-all";

            updateGalaxyData();
            if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList();
        }

        function openModal(data) {
            const m = document.getElementById('detail-modal');
            const c = document.getElementById('modal-content-box');
            m.classList.remove('hidden');
            setTimeout(() => { c.classList.remove('scale-95', 'opacity-0'); c.classList.add('scale-100', 'opacity-100'); }, 10);

            document.getElementById('modal-title').innerText = data.title;
            // Rich Content is already in data.content
            document.getElementById('modal-content-text').innerHTML = data.content;

            document.getElementById('modal-tags').innerHTML =
                (data.tags || []).map(t => `<span class="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300">#${t}</span>`).join('');
        }
        function closeModal() {
            const m = document.getElementById('detail-modal');
            const c = document.getElementById('modal-content-box');
            c.classList.remove('scale-100', 'opacity-100'); c.classList.add('scale-95', 'opacity-0');
            setTimeout(() => m.classList.add('hidden'), 300);
        }
        function resetCamera() { Graph.cameraPosition({ x: 0, y: 0, z: 800 }, { x: 0, y: 0, z: 0 }, 1000); }
    </script>
</body>

</html>
