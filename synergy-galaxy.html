    <script>
        console.log('DEBUG: synergy-galaxy.html Main Script STARTING...');
        lucide.createIcons();
        let Graph = null;

        // 2D Filter State
        let currentSubject = 'all';
        let currentStage = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM Content Loaded. Initializing Galaxy...');
            try {
                initGalaxy();
                updateEntryCount();
            } catch (err) {
                console.error('CRITICAL: Galaxy Init Failed:', err);
                document.getElementById('galaxy-graph').innerHTML = `<div class="flex items-center justify-center h-full text-red-500 font-mono">星系引擎初始化失败: ${err.message}</div>`;
            }
        });

        // Computed Data Getter
        function getFilteredData() {
            if (!window.synergyData) return [];
            return synergyData.filter(item => {
                // Subject Match (Case Insensitive)
                let matchSubject = currentSubject === 'all';
                if (!matchSubject && item.category) {
                    const cat = item.category.toLowerCase();
                    const filter = currentSubject.toLowerCase();
                    matchSubject = cat === filter;
                    // Special case for "Science" general category if needed, or if data differs
                }

                // Stage Match (Chinese Group Logic)
                let matchStage = currentStage === 'all';
                if (!matchStage && item.stage) {
                    const stageName = item.stage; // E.g. "阶段3: 小学低段"
                    if (currentStage === 'elementary') {
                        matchStage = stageName.includes('小学'); // Matches 小学低/中/高
                    } else if (currentStage === 'middle') {
                        matchStage = stageName.includes('初中');
                    } else if (currentStage === 'high') {
                        matchStage = stageName.includes('高中');
                    } else if (currentStage === 'university') {
                        matchStage = stageName.includes('大学');
                    } else {
                        // Fallback partial match
                        matchStage = stageName.includes(currentStage);
                    }
                }

                return matchSubject && matchStage;
            });
        }

        function updateEntryCount() {
            if (window.synergyData) {
                // Show currently visible count / total
                const visible = getFilteredData().length;
                document.getElementById('total-entries').innerText = `${visible} / ${window.synergyData.length}`;
            }
        }

        function initGalaxy() {
            console.log('Initializing 3D Force Graph...');
            const elem = document.getElementById('galaxy-graph');
            if (!elem) {
                console.error('ERROR: galaxy-graph container not found');
                return;
            }

            // NEURAL VISUALS: Custom Objects (Sphere + Text)
            Graph = ForceGraph3D()
                (elem)
                .backgroundColor('#050b14') // Dark slate background
                .showNavInfo(false)
                .nodeLabel(node => `<div class="p-2 bg-slate-900/80 border border-slate-700 rounded text-cyan-400 font-bold">${node.title}</div>`)
                .nodeThreeObject(node => {
                    const group = new THREE.Group();

                    // 1. The Neuron (Sphere/Core)
                    const color = getCategoryColor(node.group);
                    const geometry = new THREE.SphereGeometry(node.val || 1.5, 8, 8);
                    const material = new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: node.isHub ? 1.0 : 0.8
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    group.add(sphere);

                    // 2. The Atmospheric Glow (Point Glow)
                    if (node.isHub || node.level <= 2) {
                        const glowGeometry = new THREE.SphereGeometry((node.val || 1.5) * 2.5, 12, 12);
                        const glowMaterial = new THREE.MeshBasicMaterial({
                            color: color,
                            transparent: true,
                            opacity: 0.2
                        });
                        const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                        group.add(glow);
                    }

                    // 3. The Label (Text)
                    const sprite = new SpriteText(node.title);
                    sprite.material.depthWrite = false;
                    sprite.color = color;
                    sprite.textHeight = node.isHub ? 6 : 2;
                    sprite.position.set(0, node.isHub ? 12 : 5, 0);
                    group.add(sprite);

                    return group;
                })
                .nodeRelSize(4.0)
                .linkWidth(0.3)
                .linkOpacity(0.2) // Subtle connections
                .onNodeClick((node) => {
                    // Double-Click Logic
                    const now = Date.now();
                    const lastClick = node.__lastClick || 0;
                    node.__lastClick = now;

                    if (now - lastClick < 300) {
                        // === DOUBLE CLICK WARP ===
                        const distRatio = 1 + 40 / Math.hypot(node.x, node.y, node.z); // Close up
                        Graph.cameraPosition(
                            { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio }, // Target
                            node, // LookAt
                            1500 // Flight Duration
                        );
                    } else {
                        // Single Click: Focus/Select Logic (Open Modal with delay)
                        // setTimeout(() => openModal(node.data), 500); // Optional: delay to wait for potential double click
                        openModal(node.data);
                    }
                })
                .onNodeDragEnd(node => {
                    if (Graph && Graph.d3AlphaTarget) {
                        Graph.d3AlphaTarget(0.3).d3Restart();
                        setTimeout(() => Graph.d3AlphaTarget(0.01), 3000);
                    }
                });

            // Init Data
            updateGalaxyData();

            // Force Resize Patch
            const resize = () => { Graph.width(window.innerWidth); Graph.height(window.innerHeight); };
            window.addEventListener('resize', resize);
            resize();
        }

        function updateGalaxyData() {
            const data = getFilteredData();
            updateEntryCount();

            // 1. Map Data Nodes (Unified Neural Mesh)
            const nodes = data.map(i => ({
                id: i.id,
                title: i.title,
                group: i.category,
                // Less hierarchy in size, more organic
                val: i.level === 3 ? 1.8 : (i.level === 4 ? 0.6 : (i.level === 1 ? 6 : 3)),
                level: i.level || 2,
                parentId: i.parentId,
                data: i,
                stage: i.stage
            }));

            // 2. Stars (Hubs) - Kept smaller for integration
            const categories = [...new Set(data.map(d => d.category))];
            const starNodes = categories.map(cat => ({
                id: `HUB_${cat}`,
                title: cat.toUpperCase(),
                group: cat,
                val: 8, // Smaller Hubs
                level: 1,
                isHub: true,
                data: { title: cat.toUpperCase() + " HUB", content: `Nexus for ${cat}`, tags: [] }
            }));

            // 3. Generate Links (The Neural Web)
            const links = [];
            const nodeIds = new Set(nodes.map(n => n.id));

            // A. Structural Backbone (Parent-Child)
            nodes.forEach(node => {
                if (node.parentId && nodeIds.has(node.parentId)) {
                    links.push({ source: node.id, target: node.parentId, type: 'structure' });
                } else if (node.level === 2) {
                    links.push({ source: node.id, target: `HUB_${node.group}`, type: 'structure' });
                }
            });

            // B. Neural Synapses (Random Cross-Links for EVERYTHING)
            // This is the key to the "Previous Version" density feel
            nodes.forEach(node => {
                // Link to 1-2 random peers in same Category (Subject)
                // Even L3/L4 nodes get cross-links now!
                if (Math.random() > 0.5) {
                    const sameGroup = nodes.filter(n => n.group === node.group && n.id !== node.id);
                    if (sameGroup.length > 0) {
                        const target = sameGroup[Math.floor(Math.random() * sameGroup.length)];
                        links.push({ source: node.id, target: target.id, type: 'synapse' });
                    }
                }

                // Link to 1 random peer in same Stage (Cross-disciplinary)
                if (Math.random() > 0.8) {
                    const sameStage = nodes.filter(n => n.stage === node.stage && n.id !== node.id);
                    if (sameStage.length > 0) {
                        const target = sameStage[Math.floor(Math.random() * sameStage.length)];
                        links.push({ source: node.id, target: target.id, type: 'synapse' });
                    }
                }
            });

            Graph.graphData({ nodes: [...nodes, ...starNodes], links: links });

            // 4. Neural Physics (Organic) - Use proper 3D Force Graph API
            Graph.d3AlphaDecay(0.01);
            Graph.d3VelocityDecay(0.2);

            Graph.d3Force('charge', d3.forceManyBody().strength(node => {
                if (node.isHub) return -1000; // Galactic Centers push harder
                if (node.level === 2) return -300;
                return -50;
            }));

            // Link Forces (Clustering based on Category)
            Graph.d3Force('link', d3.forceLink().distance(link => {
                if (link.type === 'structure') return 30; // Closer ties for internal structure
                return 100;
            }).strength(0.5));

            // Radial Force (Prevent massive drift)
            Graph.d3Force('radial', d3.forceRadial(300).strength(0.01));

            // Visual Styles (High Contrast Cyber Mode)
            Graph.nodeRelSize(4.0)
                .nodeColor(node => getCategoryColor(node.group))
                .linkWidth(link => link.type === 'structure' ? 3.0 : 1.0)
                .linkOpacity(link => link.type === 'structure' ? 0.9 : 0.2)
                .linkColor(link => {
                    const color = getCategoryColor(link.source.group || link.target.group);
                    return color;
                })
                .linkDirectionalParticles(link => link.type === 'structure' ? 4 : 0) // Neural pulse
                .linkDirectionalParticleSpeed(0.01)
                .linkDirectionalParticleWidth(2);

            console.log('Galaxy Data Loaded. Refreshing simulation...');
            Graph.d3ReheatSimulation();

            // Initial Camera Positioning
            Graph.cameraPosition({ x: 0, y: 0, z: 1200 });
        }
        function getCategoryColor(cat) {
            // Neon Cyber Palette - Expanded for Lifecycle
            const map = {

                'math': '#00dfff',      // Deep Cyan
                'physics': '#ff007f',   // Rose Pink
                'chemistry': '#a000ff', // Vivid Purple
                'biology': '#00ff66',   // Spring Green
                'cs': '#ffea00',        // Gold Yellow
                'science': '#ff4d00',   // Burning Orange
                'Time': '#ffffff',      // Pure White (Center)

                // Stage 1-3 (Warm/Pastel Nursery)
                'Sensory': '#ff71ce',   // Vaporwave Pink
                'Motor': '#ffcf00',     // Sunshine
                'Emotion': '#ff4911',   // Lava
                'Play': '#01cdfe',      // Cyan Blue
                'Language': '#05ffa1',  // Seafoam
                'Nature': '#b967ff',    // Amethyst
                'Literacy': '#fffb96',  // Lemon
                'Social': '#7ed957',    // Apple Green

                // Stage 4-8 (Deep Academic)
                'History': '#C2410C',   // Deep Rust

                'Major': '#D946EF',     // Fuchsia

                // Stage 9-10 (Ashen Legacy)
                'Work': '#2563EB',      // Royal Blue
                'Life': '#BE123C',      // Crimson
                'Wisdom': '#7C3AED',    // Deep Violet

                'Processing': '#334155',// Deep Slate

            return map[cat] || '#FFFFFF'; // White fallbacks
        }

        /* === VIEW SWITCHER & MODAL === */
        function switchView(mode) {
            const listWrapper = document.getElementById('wiki-container-wrapper');
            const btnGalaxy = document.getElementById('btn-galaxy');
            const btnGrid = document.getElementById('btn-grid');
            const galaxyControls = document.getElementById('galaxy-controls-overlay');
            const filterBar = document.getElementById('filter-bar');

            if (mode === 'grid') {
                listWrapper.style.display = 'flex';
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'none'; filterBar.style.display = 'none';
                renderList();
            } else {
                listWrapper.style.display = 'none';
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'flex'; filterBar.style.display = 'flex';
                // Trigger update to ensure graph is fresh
                updateGalaxyData();
            }
        }

        function renderList() {
            const container = document.getElementById('wiki-container');
            container.innerHTML = '';
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase();

            // Use filtered Data
            let data = getFilteredData();

            if (searchTerm) {
                data = data.filter(item => item.title.toLowerCase().includes(searchTerm));
            }

            data.slice(0, 200).forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-panel p-4 rounded-xl hover:bg-slate-800/80 cursor-pointer border border-slate-700/50";
                card.onclick = () => openModal(item);
                const color = getCategoryColor(item.category);

                // Show Stage Tag
                card.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-400">${item.stage.toUpperCase()}</span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2" style="color:${color}">${item.title}</h3>
                    <div class="text-sm text-slate-400 overflow-hidden h-12">${item.content.replace(/<[^>]*>?/gm, '').substring(0, 60)}...</div>
                 `;
                container.appendChild(card);
            });
        }
        function searchWiki() { if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList(); }

        // --- 2D Filter Logic ---

        function filterSubject(subject) {
            currentSubject = subject;

            // Sync UI: Update ALL buttons with matching data-subject
            document.querySelectorAll('.subject-btn').forEach(b => {
                if (b.dataset.subject === subject) {
                    // Active State
                    b.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:bg-blue-600', 'hover:text-white');
                    // Style depends on context (Galaxy Bottom Bar vs List Top Bar)
                    if (b.parentElement.id === 'filter-bar') {
                        b.className = "subject-btn active px-4 py-2 rounded-full text-xs md:text-sm font-bold text-white bg-cyan-600 shadow-lg shadow-cyan-500/30 transition-all";
                    } else {
                        // List View Style
                        b.className = "subject-btn active px-3 py-1 rounded-md text-[10px] font-bold text-white bg-cyan-600 transition-all uppercase tracking-wider";
                    }
                } else {
                    // Inactive State
                    if (b.parentElement.id === 'filter-bar') {
                        b.className = "subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-blue-600 hover:text-white transition-all";
                    } else {
                        // List View Style
                        b.className = "subject-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider";
                    }
                }
            });

            updateGalaxyData();
            if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList();
        }

        function filterStage(stage) {
            currentStage = stage;

            // Sync UI
            document.querySelectorAll('.stage-btn').forEach(b => {
                if (b.dataset.stage === stage) {
                    if (b.parentElement && b.parentElement.classList.contains('glass-panel') && b.parentElement.parentElement === document.body.querySelector('.pointer-events-auto.absolute.top-24')) {
                        // Galaxy View (Top Center)
                        b.className = "stage-btn active px-4 py-1.5 rounded-full text-xs font-bold text-white bg-indigo-600 shadow-lg transition-all";
                    } else { // List View
                        b.className = "stage-btn active px-3 py-1 rounded-md text-[10px] font-bold text-white bg-indigo-600 transition-all uppercase tracking-wider";
                    }
                } else {
                    if (b.parentElement && b.parentElement.classList.contains('glass-panel') && b.parentElement.parentElement === document.body.querySelector('.pointer-events-auto.absolute.top-24')) {
                        // Galaxy View
                        b.className = "stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                    } else {
                        // List View
                        b.className = "stage-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider";
                    }
                }
            });

            updateGalaxyData();
            if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList();
        }

        function openModal(data) {
            const m = document.getElementById('detail-modal');
            const c = document.getElementById('modal-content-box');
            m.classList.remove('hidden');
            setTimeout(() => { c.classList.remove('scale-95', 'opacity-0'); c.classList.add('scale-100', 'opacity-100'); }, 10);

            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-content-text').innerHTML = data.content;

            document.getElementById('modal-tags').innerHTML =
                (data.tags || []).map(t => `<span class="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300">#${t}</span>`).join('');
        }
        function closeModal() {
            const m = document.getElementById('detail-modal');
            const c = document.getElementById('modal-content-box');
            c.classList.remove('scale-100', 'opacity-100'); c.classList.add('scale-95', 'opacity-0');
            setTimeout(() => m.classList.add('hidden'), 300);
        }

        /* === "LIFESPAN ODYSSEY" DEMO DIRECTOR (10 STAGES) === */

        const DemoDirector = {
            currentIndex: -1,
            isPlay: false,
            timer: null,

            scenes: [
                { id: 'stage_1', title: '第一阶段：诞生', headline: '感官觉醒', text: '0-2岁：光影与触碰，构建混沌初开的原子世界。', target: '阶段1: 诞生', color: '#F472B6', duration: 8000 },
                { id: 'stage_2', title: '第二阶段：幼儿园', headline: '万物有灵', text: '3-6岁：想象力爆发，万物皆有生命，云朵亦会微笑。', target: '阶段2: 幼儿园', color: '#FBBF24', duration: 8000 },
                { id: 'stage_3', title: '第三阶段：小学低段', headline: '具象思维', text: '7-9岁：规则建立，逻辑萌芽，数理世界初现端倪。', target: '阶段3: 小学低段', color: '#60A5FA', duration: 8000 },
                { id: 'stage_4', title: '第四阶段：小学中段', headline: '逻辑构建', text: '10-11岁：探究因果，知其然亦知其所以然。', target: '阶段4: 小学中段', color: '#34D399', duration: 8000 },
                { id: 'stage_5', title: '第五阶段：小学高段', headline: '抽象前夜', text: '12岁：思维升维，开始思考公平、正义与抽象概念。', target: '阶段5: 小学高段', color: '#818CF8', duration: 8000 },
                { id: 'stage_6', title: '第六阶段：初中', headline: '自我觉醒', text: '13-15岁：青春风暴，探索自我定义与世界坐标。', target: '阶段6: 初中', color: '#A78BFA', duration: 8000 },
                { id: 'stage_7', title: '第七阶段：高中', headline: '理性批判', text: '16-18岁：世界观重构，理性审视，不再盲从。', target: '阶段7: 高中', color: '#F472B6', duration: 8000 },
                { id: 'stage_8', title: '第八阶段：大学', headline: '专业深耕', text: '19-22岁：垂直深潜，构建专业领域的知识护城河。', target: '阶段8: 大学', color: '#22D3EE', duration: 8000 },
                { id: 'stage_9', title: '第九阶段：成年', headline: '智慧涌现', text: '23-60岁：融会贯通，知识织网，智慧如涌。', target: '阶段9: 成年', color: '#EC4899', duration: 10000 },
                { id: 'stage_10', title: '第十阶段：传承', headline: '返璞归真', text: '60岁+：繁华落尽见真淳，智慧传承永不息。', target: '阶段10: 衰退', color: '#94A3B8', duration: 10000 }
            ],

            start() {
                if (this.isPlay) return;
                this.isPlay = true;
                this.currentIndex = 0;

                document.getElementById('demo-overlay').classList.remove('hidden');
                setTimeout(() => document.getElementById('demo-card').classList.remove('-translate-x-full'), 100);

                this.playScene(0);
            },

            next() {
                if (this.currentIndex < this.scenes.length - 1) {
                    this.currentIndex++;
                    this.playScene(this.currentIndex);
                } else {
                    this.end();
                }
            },

            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.playScene(this.currentIndex);
                }
            },

            end() {
                this.isPlay = false;
                clearTimeout(this.timer);
                // Stop params
                Graph.graphData().links.forEach(l => l.isAnimating = false);
                Graph.refresh(); // Refresh particles

                document.getElementById('demo-card').classList.add('-translate-x-full');
                setTimeout(() => document.getElementById('demo-overlay').classList.add('hidden'), 500);
                resetCamera();
            },

            playScene(index) {
                clearTimeout(this.timer);
                const scene = this.scenes[index];

                // UI Update
                document.getElementById('demo-subtitle').innerText = scene.title;
                document.getElementById('demo-subtitle').style.color = scene.color;
                document.getElementById('demo-title').innerText = scene.headline;
                document.getElementById('demo-text').innerHTML = scene.text;
                document.getElementById('demo-card').style.borderLeftColor = scene.color;

                // Progress Bar
                const pct = ((index + 1) / this.scenes.length) * 100;
                document.getElementById('demo-progress').style.width = `${pct}%`;
                document.getElementById('demo-progress').style.backgroundColor = scene.color;

                // CAM ACTION & DYNAMIC ANIMATION
                this.flyToStage(scene.target, scene.color);
                this.illustrateConnectivity(scene.target);
            },

            flyToStage(stageName, color) {
                // Find node
                const targetNode = Graph.graphData().nodes.find(n => n.id === stageName || n.group === stageName || n.stage === stageName);
                if (targetNode) {
                    // Fly to it
                    const distance = 400; // Close up
                    const distRatio = 1 + distance / Math.hypot(targetNode.x, targetNode.y, targetNode.z);

                    Graph.cameraPosition(
                        { x: targetNode.x * distRatio, y: targetNode.y * distRatio + 50, z: targetNode.z * distRatio }, // Offset View
                        targetNode, // LookAt
                        3000 // Duration
                    );


                    // Dim others, highlight this cluster
                    // (Visual optimization for 10k nodes: don't iterate color per frame, just set global logic if possible, 
                    // but here we just focus camera which is cheaper)
                }
            },

            illustrateConnectivity(stageName) {
                // Reset all
                const links = Graph.graphData().links;
                links.forEach(l => l.isAnimating = false);

                // Find links related to this stage
                // 1. Structure links within this stage
                // 2. Connector links TO this stage from previous

                links.forEach(link => {
                    const sourceNode = link.source;
                    const targetNode = link.target;

                    // Logic: If both in stage, animate hard. If connecting to stage, animate flow.
                    if (sourceNode.stage === stageName || targetNode.stage === stageName) {
                        link.isAnimating = true;
                    }
                });

                // Trigger update
                Graph.refresh();
            },
        };

        function startLearningDemo() { DemoDirector.start(); }
        function resetCamera() { Graph.cameraPosition({ x: 0, y: 0, z: 1200 }, { x: 0, y: 0, z: 0 }, 2000); }
