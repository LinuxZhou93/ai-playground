    <script>
        lucide.createIcons();
        let Graph = null;

        // 2D Filter State
        let currentSubject = 'all';
        let currentStage = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initGalaxy();
            updateEntryCount();
        });

        // Computed Data Getter
        function getFilteredData() {
            return synergyData.filter(item => {
                const matchSubject = currentSubject === 'all' || item.category === currentSubject;
                const matchStage = currentStage === 'all' || item.stage === currentStage;
                return matchSubject && matchStage;
            });
        }

        function updateEntryCount() {
            if (window.synergyData) {
                // Show currently visible count / total
                const visible = getFilteredData().length;
                document.getElementById('total-entries').innerText = `${visible} / ${window.synergyData.length}`;
            }
        }

        /* === NEURAL NETWORK TOPOLOGY === */
        function initGalaxy() {
            const elem = document.getElementById('galaxy-graph');

            // NEURAL VISUALS: Custom Objects (Sphere + Text)
            Graph = ForceGraph3D()
                (elem)
                .backgroundColor('#00000000')
                .showNavInfo(false)
                .nodeLabel('title') // Hover label (keep as backup)
                .nodeThreeObject(node => {
                    const group = new THREE.Group();

                    // 1. The Neuron (Sphere)
                    const color = getCategoryColor(node.group);
                    const geometry = new THREE.SphereGeometry(node.val || 1.5, 8, 8); // Low poly for performance
                    const material = new THREE.MeshLambertMaterial({
                        color: color,
                        transparent: true,
                        opacity: 0.9
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    group.add(sphere);

                    // 2. The Label (Text)
                    const sprite = new SpriteText(node.title);
                    sprite.material.depthWrite = false; // Prevent occlusion issues
                    sprite.color = color;
                    sprite.textHeight = node.isHub ? 4 : 1.5; // Hubs get bigger text
                    sprite.position.set(0, node.isHub ? 10 : 4, 0); // Position above node
                    group.add(sprite);

                    return group;
                })
                .nodeRelSize(node => node.val || 1.5) // Fallback
                .linkWidth(0.3)
                .linkOpacity(0.2) // Subtle connections
                .onNodeClick(node => {
                    const distRatio = 1 + 60 / Math.hypot(node.x, node.y, node.z);
                    Graph.cameraPosition(
                        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                        node,
                        2000
                    );
                    setTimeout(() => openModal(node.data), 1500);
                });

            // Init Data
            updateGalaxyData();

            // Force Resize Patch
            const resize = () => { Graph.width(window.innerWidth); Graph.height(window.innerHeight); };
            window.addEventListener('resize', resize);
            resize();
        }

        function updateGalaxyData() {
            const data = getFilteredData();
            updateEntryCount();

            // Neurons
            const nodes = data.map(i => ({
                id: i.id,
                title: i.title,
                group: i.category,
                val: 1.5, // Uniform neuron size
                data: i,
                stage: i.stage
            }));

            // Nuclei (Hubs) - Optional: Keep them for structure
            const categories = [...new Set(data.map(d => d.category))];
            const hubNodes = categories.map(cat => ({
                id: `HUB_${cat}`,
                title: cat.toUpperCase(),
                group: cat,
                val: 8,
                isHub: true,
                data: { title: cat.toUpperCase() + " NUCLEUS", content: `Central Node for ${cat}`, tags: [] }
            }));

            const links = [];

            // 1. Synaptic Connections (The Mesh)
            // Connect each node to random peers in the same STAGE (Cross-Subject Synergy)
            // and same SUBJECT (Deep Knowledge)
            nodes.forEach(source => {
                // Link to Hub (Gravity)
                links.push({ source: source.id, target: `HUB_${source.group}` });

                // Link to 2 random peers in same Stage (e.g. Elementary Math -> Elementary Science)
                const sameStagePeers = nodes.filter(n => n.stage === source.stage && n.id !== source.id);
                if (sameStagePeers.length > 0) {
                    for (let k = 0; k < 2; k++) {
                        const target = sameStagePeers[Math.floor(Math.random() * sameStagePeers.length)];
                        links.push({ source: source.id, target: target.id });
                    }
                }

                // Link to 1 random peer in same Subject (Knowledge Chain)
                const sameSubjectPeers = nodes.filter(n => n.group === source.group && n.id !== source.id);
                if (sameSubjectPeers.length > 0) {
                    const target = sameSubjectPeers[Math.floor(Math.random() * sameSubjectPeers.length)];
                    links.push({ source: source.id, target: target.id });
                }
            });

            Graph.graphData({ nodes: [...nodes, ...hubNodes], links: links });

            // Neural Physics
            // Tighter mesh, less repulsion for dense brain look
            Graph.d3Force('charge', d3.forceManyBody().strength(node => node.isHub ? -300 : -15));
            Graph.d3Force('link', d3.forceLink().distance(link => link.target.isHub ? 80 : 20).strength(0.5));

            Graph.d3ReheatSimulation();
        }

        function getCategoryColor(cat) {
            const map = { 'math': '#3B82F6', 'physics': '#F59E0B', 'chemistry': '#EC4899', 'biology': '#10B981', 'cs': '#06B6D4', 'science': '#8B5CF6' };
            return map[cat] || '#ffffff';
        }

        /* === VIEW SWITCHER & MODAL === */
        function switchView(mode) {
            const listWrapper = document.getElementById('wiki-container-wrapper');
            const btnGalaxy = document.getElementById('btn-galaxy');
            const btnGrid = document.getElementById('btn-grid');
            const galaxyControls = document.getElementById('galaxy-controls-overlay');
            const filterBar = document.getElementById('filter-bar');

            if (mode === 'grid') {
                listWrapper.style.display = 'flex';
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'none'; filterBar.style.display = 'none';
                renderList();
            } else {
                listWrapper.style.display = 'none';
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'flex'; filterBar.style.display = 'flex';
                // Trigger update to ensure graph is fresh
                updateGalaxyData();
            }
        }

        function renderList() {
            const container = document.getElementById('wiki-container');
            container.innerHTML = '';
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase();

            // Use filtered Data
            let data = getFilteredData();

            if (searchTerm) {
                data = data.filter(item => item.title.toLowerCase().includes(searchTerm));
            }

            data.slice(0, 200).forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-panel p-4 rounded-xl hover:bg-slate-800/80 cursor-pointer border border-slate-700/50";
                card.onclick = () => openModal(item);
                const color = getCategoryColor(item.category);

                // Show Stage Tag
                card.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-400">${item.stage.toUpperCase()}</span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2" style="color:${color}">${item.title}</h3>
                    <div class="text-sm text-slate-400 overflow-hidden h-12">${item.content.replace(/<[^>]*>?/gm, '').substring(0, 60)}...</div>
                 `;
                container.appendChild(card);
            });
        }
        function searchWiki() { if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList(); }

        // --- 2D Filter Logic ---

        function filterSubject(subject) {

            document.querySelectorAll('.subject-btn').forEach(b => {

                    // Active State
                    b.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:bg-blue-600', 'hover:text-white');
                    // Style depends on context (Galaxy Bottom Bar vs List Top Bar)
                    if (b.parentElement.id === 'filter-bar') {
                        b.className = "subject-btn active px-4 py-2 rounded-full text-xs md:text-sm font-bold text-white bg-cyan-600 shadow-lg shadow-cyan-500/30 transition-all";

                        // List View Style
                        b.className = "subject-btn active px-3 py-1 rounded-md text-[10px] font-bold text-white bg-cyan-600 transition-all uppercase tracking-wider";

                    // Inactive State

            if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList();
        }

        function openModal(data) {
            const m = document.getElementById('detail-modal');

            setTimeout(() => { c.classList.remove('scale-95', 'opacity-0'); c.classList.add('scale-100', 'opacity-100'); }, 10);

            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-content-text').innerHTML = data.content;

            document.getElementById('modal-tags').innerHTML =
                (data.tags || []).map(t => `<span class="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300">#${t}</span>`).join('');
        }
        function closeModal() {
            const m = document.getElementById('detail-modal');
            const c = document.getElementById('modal-content-box');
            c.classList.remove('scale-100', 'opacity-100'); c.classList.add('scale-95', 'opacity-0');
            setTimeout(() => m.classList.add('hidden'), 300);
        }

        /* === "ODYSSEY OF MIND" DEMO DIRECTOR === */

        const DemoDirector = {
            currentIndex: -1,
            isPlay: false,
            interval: null,

            scenes: [
                // 1. Elementary Math: Foundation
                {
                    id: 'elem_math',
                    title: '启蒙：数学奠基 (Elementary Math)',

                    text: '当学生掌握 <b>100以内加减法</b> (Prior) 后，思维开始跃迁，为更复杂的 <b>乘法口诀</b> (New) 搭建起坚实的神经桥梁。 <br><span class="text-pink-400 font-bold">1. 奠基 (Foundation)</span>',
                    sourceKey: '100以内加减法',
                    targetKey: '乘法口诀',
                    color: '#EC4899', // Pink
                    duration: 12000
                },
                // 2. Elementary Science: Method (New)
                {

                    sourceKey: '观察与测量',
                    targetKey: '预测与推理',
                    color: '#10B981', // Green
                    duration: 12000
                },
                // 3. Middle Physics: Reasoning (Renamed/Refined)
                {

                    title: '觉醒：理性之光 (Middle School Physics)',
                    headline: '因果律的发现 (Discovery of Causality)',
                    text: '从直观的 <b>力与运动</b> (Force) 现象出发，我们终于触摸到了宇宙的法则——<b>牛顿定律</b> (Laws)。世界不再是混沌的，而是可被理解的。 <br><span class="text-blue-400 font-bold">3. 理性 (Reasoning)</span>',
                    sourceKey: '力与运动',
                    targetKey: '牛顿定律', // Cross-stage link to High School node if needed, or fuzzy match
                    color: '#3B82F6', // Blue
                    duration: 12000
                },
                // 4. Middle Chemistry: Symbolization (New)
                {
                    id: 'mid_chem',

                    text: '我们将看不见的 <b>空气与氧气</b> (Matter) 抽象为通用的 <b>化学方程式</b> (Symbol)。这是人类特有的抽象符号能力。 <br><span class="text-purple-400 font-bold">4. 符号 (Symbolization)</span>',
                    sourceKey: '空气与氧气',
                    targetKey: '化学方程式',
                    color: '#8B5CF6', // Purple
                    duration: 12000
                },
                // 5. High Biology: Micro Insight
                {
                    id: 'high_bio',
                    title: '探微：生命蓝图 (High School Biology)',
                    headline: '生命的编码 (Coding of Life)',
                    text: '透过显微镜下的 <b>细胞结构</b> (Cell)，我们直抵生命的底层逻辑——<b>DNA复制</b> (Replication)。宏观与微观在此完美交汇。 <br><span class="text-green-500 font-bold">5. 洞察 (Insight)</span>',
                    sourceKey: '细胞结构',
                    targetKey: 'DNA', // Fuzzy match for 'DNA复制' or 'DNA分子的结构'
                    color: '#10B981', // Green
                    duration: 12000
                },
                // 6. High Math/CS: Computational Thinking (New)
                {
                    id: 'high_math',
                    title: '探微：计算思维 (Computational Thinking)',
                    headline: '逻辑的自动化 (Automation of Logic)',
                    text: '从抽象的 <b>集合与逻辑</b> (Set Theory) 出发，我们构建了能自动解决问题的 <b>算法初步</b> (Algorithm)。人脑将其算力外包给了机器。 <br><span class="text-cyan-400 font-bold">6. 计算 (Computation)</span>',
                    sourceKey: '集合与逻辑',
                    targetKey: '算法初步',
                    color: '#06B6D4', // Cyan
                    duration: 12000
                },
                // 7. University Physics: Paradigm Shift (New)
                {
                    id: 'uni_physics',
                    title: '进化：范式转移 (Paradigm Shift)',
                    headline: '确定性的终结 (End of Certainty)',
                    text: '曾经完美的 <b>牛顿定律</b> (Classical) 在微观世界失效，<b>量子力学</b> (Quantum) 开启了全新的概率宇宙。学习，就是不断打破旧认知。 <br><span class="text-orange-400 font-bold">7. 突破 (Breakthrough)</span>',
                    sourceKey: '牛顿定律',
                    targetKey: 'Quantum', // Fuzzy match 'Quantum Mechanics'
                    color: '#F59E0B', // Orange
                    duration: 12000
                },
                // 8. Grand Tour
                {
                    id: 'grand_tour',
                    title: '终身学习之旅 (The Odyssey)',
                    headline: '心智的无限进化 (Infinite Evolution)',
                    text: '从童年的好奇，到少年的理性，再到青年的深邃。知识网络不断致密，心智宇宙浩瀚无垠。 <br><span class="text-purple-400 font-bold">8. 无限 (Infinite)</span>',
                    type: 'tour',
                    duration: 20000
                }
            ],

            start() {
                if (this.isPlay) return;
                this.isPlay = true;
                this.currentIndex = 0;

                // Show Overlay with Controls
                document.getElementById('demo-overlay').classList.remove('hidden');
                setTimeout(() => document.getElementById('demo-card').classList.remove('scale-0'), 100);

                // Show Control Bar
                document.getElementById('demo-controls').classList.remove('hidden');

                this.playScene(this.currentIndex);
            },

            next() {
                if (this.currentIndex < this.scenes.length - 1) {
                    this.currentIndex++;
                    this.playScene(this.currentIndex);
                } else {
                    this.end();
                }
            },

            prev() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.playScene(this.currentIndex);
                }
            },

            end() {
                this.isPlay = false;
                clearTimeout(this.interval);

                document.getElementById('demo-card').classList.add('scale-0');
                document.getElementById('demo-controls').classList.add('hidden');
                setTimeout(() => document.getElementById('demo-overlay').classList.add('hidden'), 500);

                // Reset Visuals
                Graph.linkColor(() => 'rgba(255,255,255,0.2)');
                Graph.linkWidth(0.3);
                Graph.linkDirectionalParticles(0);
                resetCamera();
            },

            playScene(index) {
                clearTimeout(this.interval);
                const scene = this.scenes[index];
                if (!scene) return;

                // Update UI
                const titleColor = scene.color || '#fff';
                document.getElementById('demo-subtitle').innerText = scene.title;
                document.getElementById('demo-title').innerHTML = scene.headline;
                document.getElementById('demo-text').innerHTML = scene.text;

                // Update Progress Indicator
                const dots = document.querySelectorAll('.demo-dot');
                dots.forEach((d, i) => d.style.opacity = i === index ? '1' : '0.3');

                // Logic
                if (scene.type === 'tour') {
                    this.runGrandTour();
                } else {
                    this.runConnectionScene(scene);
                }
            },

            runConnectionScene(scene) {
                const nodes = Graph.graphData().nodes;
                const links = Graph.graphData().links;

                // Find Nodes
                // Relaxed Search
                let source = nodes.find(n => n.title.includes(scene.sourceKey));
                let target = nodes.find(n => n.title.includes(scene.targetKey));

                // Fallback Logic
                if (!source) source = nodes.find(n => n.group === (scene.id === 'mid_physics' ? 'physics' : 'math'));
                if (!target) target = nodes.find(n => n.group === (scene.id === 'mid_physics' ? 'physics' : 'math') && n.id !== source.id);

                if (!source || !target) return;

                // Camera
                const midX = (source.x + target.x) / 2;
                const midY = (source.y + target.y) / 2;
                const midZ = (source.z + target.z) / 2;
                const dist = Math.hypot(source.x - target.x, source.y - target.y, source.z - target.z);

                Graph.cameraPosition(
                    { x: midX, y: midY, z: midZ + Math.max(dist * 1.5, 120) },
                    { x: midX, y: midY, z: midZ },
                    2000
                );

                // Link & Effect
                let link = links.find(l => (l.source.id === source.id && l.target.id === target.id) || (l.source.id === target.id && l.target.id === source.id));
                if (!link) {
                    link = { source: source, target: target, __isTemp: true };
                    Graph.graphData({ nodes: nodes, links: [...links, link] });
                }

                // Reset all links first
                Graph.linkColor(l => 'rgba(255,255,255,0.05)');

                // Highlight Target Link
                Graph.linkColor(l => l === link ? scene.color : 'rgba(255,255,255,0.05)');
                Graph.linkWidth(l => l === link ? 3 : 0.1);

                // Particles
                Graph.linkDirectionalParticles(l => l === link ? 4 : 0);
                Graph.linkDirectionalParticleSpeed(l => l === link ? 0.005 : 0);
                Graph.linkDirectionalParticleWidth(l => l === link ? 4 : 0);
                Graph.linkDirectionalParticleColor(l => l === link ? scene.color : '#fff');
            },

            runGrandTour() {
                // Fly through stages
                // 1. Elementary -> 2. Middle -> 3. High -> 4. Uni
                // We define 4 waypoints derived from the average position of nodes in each stage

                // Reset Visuals first
                Graph.linkColor(() => 'rgba(255,255,255,0.15)');
                Graph.linkWidth(0.2);
                Graph.linkDirectionalParticles(1); // Subtle global activity
                Graph.linkDirectionalParticleSpeed(0.001);
                Graph.linkDirectionalParticleWidth(1);

                const nodes = Graph.graphData().nodes;

                const getNavPoint = (stage) => {
                    const staged = nodes.filter(n => n.stage === stage);
                    if (!staged.length) return { x: 0, y: 0, z: 0 };
                    const avgX = staged.reduce((a, b) => a + b.x, 0) / staged.length;
                    const avgY = staged.reduce((a, b) => a + b.y, 0) / staged.length;
                    const avgZ = staged.reduce((a, b) => a + b.z, 0) / staged.length;
                    return { x: avgX, y: avgY, z: avgZ };
                };

                const waypoints = ['elementary', 'middle', 'high', 'university'].map(getNavPoint);

                // Sequence
                let step = 0;
                const fly = () => {
                    if (step >= waypoints.length) return;
                    const pt = waypoints[step];
                    Graph.cameraPosition(
                        { x: pt.x, y: pt.y, z: pt.z + 300 }, // Far view
                        { x: pt.x, y: pt.y, z: pt.z },
                        4000 // Slow glide
                    );
                    step++;
                    if (step < waypoints.length) setTimeout(fly, 5000);
                };
                fly();
            }
        };

        function startLearningDemo() {
            DemoDirector.start();
        }
        function resetCamera() { Graph.cameraPosition({ x: 0, y: 0, z: 800 }, { x: 0, y: 0, z: 0 }, 1000); }
