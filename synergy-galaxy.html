<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Synergy Galaxy - K12 Education Map</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- 3D Libraries (Stable CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-spritetext@1.8.1/dist/three-spritetext.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.1/dist/3d-force-graph.min.js"></script>
    <!-- Note: 3d-force-graph bundles necessary D3 modules internally -->

    <style>
        body {
            background-color: #050b14;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-link {
            position: relative;
            color: #94a3b8;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #38bdf8;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #38bdf8;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.5);
        }
    </style>
</head>

<body class="overflow-hidden">

    <!-- Navigation -->
    <nav class="fixed w-full z-40 top-0 transition-all duration-300 py-4" id="navbar">
        <div class="max-w-7xl mx-auto px-4 md:px-8">
            <div class="glass-panel rounded-2xl px-6 py-3 flex justify-between items-center">
                <a href="index.html" class="flex items-center gap-3 group">
                    <div
                        class="relative w-10 h-10 flex items-center justify-center bg-cyan-500/10 rounded-xl border border-cyan-500/30 group-hover:bg-cyan-500/20 transition-all duration-300">
                        <i data-lucide="network" class="w-6 h-6 text-cyan-400"></i>
                    </div>
                    <span

        <!-- Wiki List Container (Hidden by default) -->

            class="absolute inset-0 z-10 pt-24 pb-20 px-4 md:px-12 flex-col items-center overflow-hidden hidden bg-[#050b14]">
            <div class="w-full max-w-5xl h-full flex flex-col gap-4">
                <!-- Search & Controls -->
                <div
                    class="w-full glass-panel p-4 rounded-xl flex flex-col md:flex-row gap-4 justify-between items-center">
                    <!-- Search -->
                    <div class="flex gap-4 items-center w-full md:w-auto flex-1">
                        <button onclick="switchView('galaxy')"
                            class="p-2 rounded-full bg-slate-800 text-cyan-400 hover:bg-cyan-600 hover:text-white transition-all"><i

                        <div class="relative flex-1">

                                class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                            <input type="text" id="search-input" placeholder="Search knowledge nodes..."

                    </div>

                    <!-- Embedded Filters (List View Only) -->
                    <div class="flex flex-col gap-2 w-full md:w-auto">
                        <!-- Stage Filter -->
                        <div class="flex gap-1 overflow-x-auto pb-1">
                            <button onclick="filterStage('all')" data-stage="all"

                                class="stage-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">Elementary</button>
                            <button onclick="filterStage('middle')" data-stage="middle"
                                class="stage-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">Middle</button>
                            <button onclick="filterStage('high')" data-stage="high"
                                class="stage-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">High</button>
                            <button onclick="filterStage('university')" data-stage="university"
                                class="stage-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">Uni</button>
                        </div>
                        <!-- Subject Filter -->
                        <div class="flex gap-1 overflow-x-auto pb-1">
                            <button onclick="filterSubject('all')" data-subject="all"
                                class="subject-btn active px-3 py-1 rounded-md text-[10px] font-bold text-white bg-cyan-600 transition-all uppercase tracking-wider">All
                                Subjects</button>
                            <button onclick="filterSubject('math')" data-subject="math"
                                class="subject-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">Math</button>
                            <button onclick="filterSubject('physics')" data-subject="physics"
                                class="subject-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">Phys</button>
                            <button onclick="filterSubject('chemistry')" data-subject="chemistry"
                                class="subject-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">Chem</button>
                            <button onclick="filterSubject('biology')" data-subject="biology"
                                class="subject-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">Bio</button>
                            <button onclick="filterSubject('cs')" data-subject="cs"
                                class="subject-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider">CS</button>
                        </div>
                    </div>
                </div>

                <!-- Grid -->
                <div id="wiki-container"
                    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto pr-2 pb-20 custom-scrollbar">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <!-- Stage Selector -->
        <div class="pointer-events-auto absolute top-24 left-1/2 transform -translate-x-1/2 flex gap-2">
            <div class="glass-panel p-1 rounded-full flex gap-1 bg-slate-900/80 backdrop-blur-md">
                <button onclick="filterStage('all')" data-stage="all"
                    class="stage-btn active px-4 py-1.5 rounded-full text-xs font-bold text-white bg-indigo-600 shadow-lg transition-all">全部阶段</button>
                <button onclick="filterStage('elementary')" data-stage="elementary"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">小学</button>
                <button onclick="filterStage('middle')" data-stage="middle"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">初中</button>
                <button onclick="filterStage('high')" data-stage="high"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">高中</button>
                <button onclick="filterStage('university')" data-stage="university"
                    class="stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all">大学</button>
            </div>
        </div>

        <!-- Galaxy HUD -->
        <div id="galaxy-controls-overlay" class="pointer-events-auto absolute bottom-8 right-8 flex flex-col gap-3">
            <div class="glass-panel p-3 rounded-xl flex flex-col gap-1 text-center">
                <span class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Nodes</span>
                <span class="text-xl font-bold text-cyan-400 font-orbitron" id="total-entries">0</span>
            </div>
            <button onclick="resetCamera()"
                class="glass-panel p-3 rounded-xl text-cyan-400 hover:bg-cyan-900/30 hover:scale-105"><i
                    data-lucide="crosshair"></i></button>
        </div>

        <!-- Filter Bar (Subject) -->
        <div id="filter-bar"
            class="pointer-events-auto absolute bottom-8 left-1/2 transform -translate-x-1/2 glass-panel rounded-full px-2 py-2 flex gap-1 overflow-x-auto max-w-[90vw]">
            <button onclick="filterSubject('all')" data-subject="all"
                class="subject-btn active px-4 py-2 rounded-full text-xs md:text-sm font-bold text-white bg-cyan-600 shadow-lg shadow-cyan-500/30 transition-all">ALL</button>
            <button onclick="filterSubject('math')" data-subject="math"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-blue-600 hover:text-white transition-all">MATH</button>
            <button onclick="filterSubject('physics')" data-subject="physics"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-orange-600 hover:text-white transition-all">PHYSICS</button>
            <button onclick="filterSubject('chemistry')" data-subject="chemistry"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-pink-600 hover:text-white transition-all">CHEMISTRY</button>
            <button onclick="filterSubject('biology')" data-subject="biology"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-green-600 hover:text-white transition-all">BIOLOGY</button>
            <button onclick="filterSubject('cs')" data-subject="cs"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-cyan-600 hover:text-white transition-all">CS</button>
            <button onclick="filterSubject('science')" data-subject="science"
                class="subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-purple-600 hover:text-white transition-all">SCIENCE</button>
        </div>

    </div>

    <!-- Detail Modal -->
    <div id="detail-modal"
        class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 backdrop-blur-sm"
        onclick="if(event.target===this) closeModal()">
        <div class="glass-panel w-full max-w-2xl m-4 rounded-2xl overflow-hidden transform transition-all scale-95 opacity-0 relative"
            id="modal-content-box">
            <button onclick="closeModal()"
                class="absolute top-4 right-4 p-2 rounded-full bg-slate-800 text-white hover:bg-red-500 transition-all z-10"><i
                    data-lucide="x"></i></button>
            <div class="p-6 border-b border-cyan-500/20 bg-slate-900/60 pt-10 md:pt-6">
                <h2 id="modal-title" class="text-2xl font-bold text-white font-orbitron">Title</h2>
            </div>
            <div class="p-6 max-h-[60vh] overflow-y-auto text-slate-300 leading-relaxed" id="modal-content-text"></div>
            <div class="p-6 border-t border-cyan-500/20 bg-slate-900/60 flex justify-between items-center">
                <div id="modal-tags" class="flex gap-2 flex-wrap"></div>
            </div>
        </div>
    </div>

    <!-- Import Data -->
    <script src="assets/js/synergy-data.js"></script>

    <script>
        lucide.createIcons();
        let Graph = null;

        // 2D Filter State
        let currentSubject = 'all';
        let currentStage = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initGalaxy();
            updateEntryCount();
        });

        // Computed Data Getter
        function getFilteredData() {
            return synergyData.filter(item => {
                const matchSubject = currentSubject === 'all' || item.category === currentSubject;
                const matchStage = currentStage === 'all' || item.stage === currentStage;
                return matchSubject && matchStage;
            });
        }

        function updateEntryCount() {
            if (window.synergyData) {
                // Show currently visible count / total
                const visible = getFilteredData().length;
                document.getElementById('total-entries').innerText = `${visible} / ${window.synergyData.length}`;
            }
        }

        /* === NEURAL NETWORK TOPOLOGY === */
        function initGalaxy() {
            const elem = document.getElementById('galaxy-graph');

            // NEURAL VISUALS: Custom Objects (Sphere + Text)
            Graph = ForceGraph3D()
                (elem)
                .backgroundColor('#00000000')
                .showNavInfo(false)
                .nodeLabel('title') // Hover label (keep as backup)
                .nodeThreeObject(node => {
                    const group = new THREE.Group();

                    // 1. The Neuron (Sphere)
                    const color = getCategoryColor(node.group);
                    const geometry = new THREE.SphereGeometry(node.val || 1.5, 8, 8); // Low poly for performance
                    const material = new THREE.MeshLambertMaterial({
                        color: color,
                        transparent: true,
                        opacity: 0.9
                    });
                    const sphere = new THREE.Mesh(geometry, material);
                    group.add(sphere);

                    // 2. The Label (Text)
                    const sprite = new SpriteText(node.title);
                    sprite.material.depthWrite = false; // Prevent occlusion issues
                    sprite.color = color;
                    sprite.textHeight = node.isHub ? 4 : 1.5; // Hubs get bigger text
                    sprite.position.set(0, node.isHub ? 10 : 4, 0); // Position above node
                    group.add(sprite);

                    return group;
                })
                .nodeRelSize(node => node.val || 1.5) // Fallback
                .linkWidth(0.3)
                .linkOpacity(0.2) // Subtle connections
                .onNodeClick(node => {
                    const distRatio = 1 + 60 / Math.hypot(node.x, node.y, node.z);
                    Graph.cameraPosition(
                        { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                        node,
                        2000
                    );
                    setTimeout(() => openModal(node.data), 1500);
                });

            // Init Data
            updateGalaxyData();

            // Force Resize Patch
            const resize = () => { Graph.width(window.innerWidth); Graph.height(window.innerHeight); };
            window.addEventListener('resize', resize);
            resize();
        }

        function updateGalaxyData() {
            const data = getFilteredData();
            updateEntryCount();

            // Neurons
            const nodes = data.map(i => ({
                id: i.id,
                title: i.title,
                group: i.category,
                val: 1.5, // Uniform neuron size
                data: i,
                stage: i.stage
            }));

            // Nuclei (Hubs) - Optional: Keep them for structure
            const categories = [...new Set(data.map(d => d.category))];
            const hubNodes = categories.map(cat => ({
                id: `HUB_${cat}`,
                title: cat.toUpperCase(),
                group: cat,
                val: 8,
                isHub: true,
                data: { title: cat.toUpperCase() + " NUCLEUS", content: `Central Node for ${cat}`, tags: [] }
            }));

            const links = [];

            // 1. Synaptic Connections (The Mesh)
            // Connect each node to random peers in the same STAGE (Cross-Subject Synergy)
            // and same SUBJECT (Deep Knowledge)
            nodes.forEach(source => {
                // Link to Hub (Gravity)
                links.push({ source: source.id, target: `HUB_${source.group}` });

                // Link to 2 random peers in same Stage (e.g. Elementary Math -> Elementary Science)
                const sameStagePeers = nodes.filter(n => n.stage === source.stage && n.id !== source.id);
                if (sameStagePeers.length > 0) {
                    for (let k = 0; k < 2; k++) {
                        const target = sameStagePeers[Math.floor(Math.random() * sameStagePeers.length)];
                        links.push({ source: source.id, target: target.id });
                    }
                }

                // Link to 1 random peer in same Subject (Knowledge Chain)
                const sameSubjectPeers = nodes.filter(n => n.group === source.group && n.id !== source.id);
                if (sameSubjectPeers.length > 0) {
                    const target = sameSubjectPeers[Math.floor(Math.random() * sameSubjectPeers.length)];
                    links.push({ source: source.id, target: target.id });
                }
            });

            Graph.graphData({ nodes: [...nodes, ...hubNodes], links: links });

            // Neural Physics
            // Tighter mesh, less repulsion for dense brain look
            Graph.d3Force('charge', d3.forceManyBody().strength(node => node.isHub ? -300 : -15));
            Graph.d3Force('link', d3.forceLink().distance(link => link.target.isHub ? 80 : 20).strength(0.5));

            Graph.d3ReheatSimulation();
        }

        function getCategoryColor(cat) {
            const map = { 'math': '#3B82F6', 'physics': '#F59E0B', 'chemistry': '#EC4899', 'biology': '#10B981', 'cs': '#06B6D4', 'science': '#8B5CF6' };
            return map[cat] || '#ffffff';
        }

        /* === VIEW SWITCHER & MODAL === */
        function switchView(mode) {
            const listWrapper = document.getElementById('wiki-container-wrapper');
            const btnGalaxy = document.getElementById('btn-galaxy');
            const btnGrid = document.getElementById('btn-grid');
            const galaxyControls = document.getElementById('galaxy-controls-overlay');
            const filterBar = document.getElementById('filter-bar');

            if (mode === 'grid') {
                listWrapper.style.display = 'flex';
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'none'; filterBar.style.display = 'none';
                renderList();
            } else {
                listWrapper.style.display = 'none';
                btnGrid.className = "px-4 py-2 rounded-full text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                btnGalaxy.className = "px-4 py-2 rounded-full text-sm font-bold transition-all text-white bg-cyan-600 shadow-[0_0_15px_rgba(8,145,178,0.5)]";
                galaxyControls.style.display = 'flex'; filterBar.style.display = 'flex';
                // Trigger update to ensure graph is fresh
                updateGalaxyData();
            }
        }

        function renderList() {
            const container = document.getElementById('wiki-container');
            container.innerHTML = '';
            const searchTerm = document.getElementById('search-input')?.value.toLowerCase();

            // Use filtered Data
            let data = getFilteredData();

            if (searchTerm) {
                data = data.filter(item => item.title.toLowerCase().includes(searchTerm));
            }

            data.slice(0, 200).forEach(item => {
                const card = document.createElement('div');
                card.className = "glass-panel p-4 rounded-xl hover:bg-slate-800/80 cursor-pointer border border-slate-700/50";
                card.onclick = () => openModal(item);
                const color = getCategoryColor(item.category);

                // Show Stage Tag
                card.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-400">${item.stage.toUpperCase()}</span>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-2" style="color:${color}">${item.title}</h3>
                    <div class="text-sm text-slate-400 overflow-hidden h-12">${item.content.replace(/<[^>]*>?/gm, '').substring(0, 60)}...</div>
                 `;
                container.appendChild(card);
            });
        }
        function searchWiki() { if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList(); }

        // --- 2D Filter Logic ---

        function filterSubject(subject) {
            currentSubject = subject;

            // Sync UI: Update ALL buttons with matching data-subject
            document.querySelectorAll('.subject-btn').forEach(b => {
                if (b.dataset.subject === subject) {
                    // Active State
                    b.classList.remove('text-slate-400', 'hover:bg-slate-800', 'hover:bg-blue-600', 'hover:text-white');
                    // Style depends on context (Galaxy Bottom Bar vs List Top Bar)
                    if (b.parentElement.id === 'filter-bar') {
                        b.className = "subject-btn active px-4 py-2 rounded-full text-xs md:text-sm font-bold text-white bg-cyan-600 shadow-lg shadow-cyan-500/30 transition-all";
                    } else {
                        // List View Style
                        b.className = "subject-btn active px-3 py-1 rounded-md text-[10px] font-bold text-white bg-cyan-600 transition-all uppercase tracking-wider";
                    }
                } else {
                    // Inactive State
                    if (b.parentElement.id === 'filter-bar') {
                        b.className = "subject-btn px-4 py-2 rounded-full text-xs md:text-sm font-bold text-slate-400 hover:bg-blue-600 hover:text-white transition-all";
                    } else {
                        // List View Style
                        b.className = "subject-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider";
                    }
                }
            });

            updateGalaxyData();
            if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList();
        }

        function filterStage(stage) {
            currentStage = stage;

            // Sync UI
            document.querySelectorAll('.stage-btn').forEach(b => {
                if (b.dataset.stage === stage) {
                    if (b.parentElement && b.parentElement.classList.contains('glass-panel') && b.parentElement.parentElement === document.body.querySelector('.pointer-events-auto.absolute.top-24')) {
                        // Galaxy View (Top Center)
                        b.className = "stage-btn active px-4 py-1.5 rounded-full text-xs font-bold text-white bg-indigo-600 shadow-lg transition-all";
                    } else { // List View
                        b.className = "stage-btn active px-3 py-1 rounded-md text-[10px] font-bold text-white bg-indigo-600 transition-all uppercase tracking-wider";
                    }
                } else {
                    if (b.parentElement && b.parentElement.classList.contains('glass-panel') && b.parentElement.parentElement === document.body.querySelector('.pointer-events-auto.absolute.top-24')) {
                        // Galaxy View
                        b.className = "stage-btn px-4 py-1.5 rounded-full text-xs font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all";
                    } else {
                        // List View
                        b.className = "stage-btn px-3 py-1 rounded-md text-[10px] font-bold text-slate-400 hover:bg-slate-800 transition-all uppercase tracking-wider";
                    }
                }
            });

            updateGalaxyData();
            if (document.getElementById('wiki-container-wrapper').style.display !== 'none') renderList();
        }

        function openModal(data) {
            const m = document.getElementById('detail-modal');
            const c = document.getElementById('modal-content-box');
            m.classList.remove('hidden');
            setTimeout(() => { c.classList.remove('scale-95', 'opacity-0'); c.classList.add('scale-100', 'opacity-100'); }, 10);

            document.getElementById('modal-title').innerText = data.title;
            document.getElementById('modal-content-text').innerHTML = data.content;

            document.getElementById('modal-tags').innerHTML =
                (data.tags || []).map(t => `<span class="px-2 py-1 bg-slate-800 rounded text-xs text-slate-300">#${t}</span>`).join('');
        }
        function closeModal() {
            const m = document.getElementById('detail-modal');
            const c = document.getElementById('modal-content-box');
            c.classList.remove('scale-100', 'opacity-100'); c.classList.add('scale-95', 'opacity-0');
            setTimeout(() => m.classList.add('hidden'), 300);
        }
        function resetCamera() { Graph.cameraPosition({ x: 0, y: 0, z: 800 }, { x: 0, y: 0, z: 0 }, 1000); }
    </script>
</body>

</html>
