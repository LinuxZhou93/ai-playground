<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>精诚中医 · 大医传承</title>
    <link rel="stylesheet" href="assets/tcm/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>

    <div id="phone-container">
        <!-- 品牌背景印章水印 -->
        <div class="brand-seal-watermark"></div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <div>
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi" style="margin: 0 4px;"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 顶部搜索 -->
        <div class="search-header" style="z-index: 100;">
            <div class="search-bar" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);">
                <i class="fas fa-search"></i>
                <input type="text" id="main-search-input" placeholder="体质辨识 · 药食同源"
                    oninput="window.handleSearch(this.value)">
            </div>
            <i class="far fa-comment-dots" onclick="window.showModuleDetail('客服咨询')"
                style="color: var(--primary-color); font-size: 20px;"></i>
        </div>

        <div class="content-area">

            <!-- 首页 -->
            <div id="home" class="page active">
                <div class="banner" style="background-image: url('assets/tcm/jingcheng_hall.png');">
                    <div
                        style="position: absolute; bottom: 20px; left: 20px; color: white; text-shadow: 0 2px 12px rgba(0,0,0,0.4);">
                        <h2 style="font-size: 22px; font-weight: 800; letter-spacing: 2px;">大医精诚</h2>
                        <p style="font-size: 11px; opacity: 0.85;">百年传承核心 · 道地药食专供</p>
                    </div>
                </div>

                <div class="quick-menu">
                    <div class="menu-item" onclick="window.showModuleDetail('智能导诊')">
                        <div class="menu-icon"><i class="fas fa-street-view"></i></div><span>导诊台</span>
                    </div>
                    <div class="menu-item" onclick="window.showModuleDetail('预约理疗')">
                        <div class="menu-icon"><i class="fas fa-hands-helping"></i></div><span>约理疗</span>
                    </div>
                    <div class="menu-item" onclick="window.showModuleDetail('健康档案')">
                        <div class="menu-icon"><i class="fas fa-file-medical-alt"></i></div><span>健康卡</span>
                    </div>
                    <div class="menu-item" onclick="window.showModuleDetail('预约专家')">
                        <div class="menu-icon"><i class="fas fa-user-md"></i></div><span>约名医</span>
                    </div>
                </div>

                <div class="section-title"><span>旗舰道地 · 本草甄选</span></div>
                <div class="hero-product" onclick="window.openProduct(1)">
                    <div class="hero-info">
                        <h3>精诚灵芝孢子粉</h3>
                        <p>灵芝三萜 ≥ 10% | 非遗传承工艺</p>
                        <div class="hero-btn">立即选购</div>
                    </div>
                    <img src="assets/tcm/lingzhi_hero_premium.png" class="hero-img">
                </div>

                <div class="section-title"><span>当季养生</span><a href="#" onclick="window.switchTab('category')">更多
                        &gt;</a></div>
                <div class="product-grid">
                    <div class="product-card" onclick="window.openProduct(2)">
                        <div class="product-img" style="background-image: url('assets/tcm/article_reishi.png')"></div>
                        <div class="p-title">特级灵芝切片</div>
                        <div class="p-price"><span>¥ 128</span><i class="fas fa-plus-circle"></i></div>
                    </div>
                    <div class="product-card" onclick="window.openProduct(6)">
                        <div class="product-img" style="background-image: url('assets/tcm/article_soup.png')"></div>
                        <div class="p-title">宁夏特配枸杞</div>
                        <div class="p-price"><span>¥ 45</span><i class="fas fa-plus-circle"></i></div>
                    </div>
                </div>

                <div class="article-preview"
                    style="margin: 20px 16px; background: white; border-radius: var(--radius); padding: 12px; display: flex; box-shadow: var(--shadow); gap: 12px;"
                    onclick="window.openArticle(1)">
                    <div style="flex: 1;">
                        <div style="font-size: 14px; font-weight: 700;">春季养肝专家谈</div>
                        <p style="font-size: 11px; color: #999; margin-top: 6px;">张景和教授详细解读：春日如何疏肝理气...</p>
                    </div>
                    <div
                        style="width: 80px; height: 64px; border-radius: 8px; background: url('assets/tcm/article_spring.png') center/cover;">
                    </div>
                </div>
            </div>

            <!-- 分类页 -->
            <div id="category" class="page">
                <div class="category-container">
                    <div class="sidebar">
                        <div class="sidebar-item active">灵芝专区</div>
                        <div class="sidebar-item">参茸滋补</div>
                        <div class="sidebar-item">养生茶饮</div>
                        <div class="sidebar-item">药食同源</div>
                    </div>
                    <div class="main-cate"></div>
                </div>
            </div>

            <!-- 养生 -->
            <div id="knowledge" class="page"></div>

            <!-- 个人中心 -->
            <div id="profile" class="page">
                <div class="profile-header"
                    style="height: 140px; background: linear-gradient(135deg, #8C1C13 0%, #B52A1E 100%); color: white;">
                    <div class="user-avatar"
                        style="background-image: url('assets/tcm/doctor_avatar.png'); border: 3px solid rgba(255,255,255,0.2);">
                    </div>
                    <div>
                        <div style="font-size: 18px; font-weight: 800;">精诚老会员</div>
                        <div style="font-size: 11px; opacity: 0.8; margin-top: 4px;">ID: JC20260125 | 黄金会员</div>
                    </div>
                </div>

                <div class="order-entry">
                    <div class="order-item" onclick="window.showModuleDetail('待付款订单')"><i
                            class="fas fa-wallet"></i><span>待付款</span></div>
                    <div class="order-item" onclick="window.showModuleDetail('待收货订单')"><i
                            class="fas fa-shipping-fast"></i><span>待收货</span></div>
                    <div class="order-item" onclick="window.showModuleDetail('评价中心')"><i
                            class="fas fa-star"></i><span>评价</span></div>
                    <div class="order-item" onclick="window.showModuleDetail('售后追踪')"><i
                            class="fas fa-undo-alt"></i><span>售后</span></div>
                </div>

                <div class="list-group" style="margin-top: 0;">
                    <div class="list-item" onclick="window.showModuleDetail('健康档案')">
                        <div class="list-item-content">
                            <div class="list-item-title"><i class="fas fa-notes-medical"
                                    style="margin-right:8px; color:var(--primary-color);"></i>我的体质报告</div>
                        </div><i class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                    <div class="list-item" onclick="window.showModuleDetail('收货地址')">
                        <div class="list-item-content">
                            <div class="list-item-title"><i class="fas fa-map-marker-alt"
                                    style="margin-right:8px; color:var(--primary-color);"></i>地址管理</div>
                        </div><i class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                    <div class="list-item" onclick="window.showModuleDetail('我的卡券')">
                        <div class="list-item-content">
                            <div class="list-item-title"><i class="fas fa-ticket-alt"
                                    style="margin-right:8px; color:var(--primary-color);"></i>优惠券</div>
                        </div><i class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                    <div class="list-item" onclick="window.showModuleDetail('关于精诚')">
                        <div class="list-item-content">
                            <div class="list-item-title"><i class="fas fa-history"
                                    style="margin-right:8px; color:var(--primary-color);"></i>关于精诚 · 品牌故事</div>
                        </div><i class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                </div>

                <div class="list-group">
                    <div class="list-item" onclick="window.showModuleDetail('设置中心')">
                        <div class="list-item-content">
                            <div class="list-item-title"><i class="fas fa-cog"
                                    style="margin-right:8px; color:#999;"></i>系统设置</div>
                        </div><i class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                </div>
            </div>

        </div>

        <div class="cart-badge" onclick="window.showModuleDetail('我的购物车')">
            <i class="fas fa-shopping-cart"></i>
            <div class="cart-count" style="display: none;">0</div>
        </div>

        <div class="tab-bar">
            <div class="tab-item active" onclick="window.switchTab('home')"><i class="fas fa-home"></i><span>首页</span>
            </div>
            <div class="tab-item" onclick="window.switchTab('category')"><i class="fas fa-th-large"></i><span>分类</span>
            </div>
            <div class="tab-item" onclick="window.switchTab('knowledge')"><i class="fas fa-om"></i><span>养生</span></div>
            <div class="tab-item" onclick="window.switchTab('profile')"><i
                    class="fas fa-user-circle"></i><span>我的</span></div>
        </div>

        <!-- 通用模块层 -->
        <div id="module-detail" class="page-overlay">
            <div class="page-header"><i class="fas fa-chevron-left"
                    onclick="window.closeOverlay('module-detail')"></i><span id="module-detail-title"
                    style="flex:1;text-align:center;font-weight:700;margin-right:20px;"></span></div>
            <div class="detail-content"></div>
        </div>

        <!-- 产品详情层 -->
        <div id="product-detail" class="page-overlay">
            <div class="page-header"><i class="fas fa-chevron-left"
                    onclick="window.closeOverlay('product-detail')"></i><span
                    style="flex:1;text-align:center;font-weight:700;margin-right:20px;">药珍详情</span></div>
            <div class="detail-content" style="padding:0;">
                <div id="detail-img-box" style="height:320px; background-size:cover; background-position:center;"></div>
                <div
                    style="background:#FFF; padding:20px 16px; border-radius:24px 24px 0 0; margin-top:-20px; position:relative;">
                    <div id="detail-price"
                        style="font-size:26px; color:var(--primary-color); font-weight:800; font-family:serif;"></div>
                    <div id="detail-title" style="font-size:18px; font-weight:800; margin:10px 0;"></div>
                    <div id="detail-desc" style="font-size:12px; color:#999; line-height:1.6;"></div>
                    <div id="product-full-content" style="margin-top:20px;"></div>
                </div>
            </div>
            <div class="action-footer" style="padding-bottom: 24px;"><button class="btn-primary"
                    onclick="window.addToCart()">加入购物袋</button></div>
        </div>

        <!-- 搜索层 -->
        <div id="search-overlay" class="page-overlay" style="background: rgba(249, 247, 242, 0.98);">
            <div class="page-header"><i class="fas fa-chevron-left" onclick="window.closeSearch()"></i><span
                    style="flex: 1; text-align: center; font-weight: 700; margin-right: 20px;">全站检索</span></div>
            <div id="search-results-container" class="detail-content"></div>
        </div>

        <!-- 文章详情层 -->
        <div id="article-detail" class="page-overlay">
            <div class="page-header"><i class="fas fa-chevron-left"
                    onclick="window.closeOverlay('article-detail')"></i><span
                    style="flex:1;text-align:center;font-weight:700;margin-right:20px;">精诚专栏</span></div>
            <div class="detail-content" style="padding: 24px;">
                <h1 class="detail-title" style="font-size:20px;line-height:1.4;"></h1>
                <div class="author-name"
                    style="margin: 15px 0; font-size: 13px; color: var(--secondary-color); font-weight:600;"></div>
                <div class="detail-body" style="line-height: 1.8; color:#444;"></div>
            </div>
        </div>

    </div>

    <script src="assets/tcm/app.js"></script>
</body>

</html>
