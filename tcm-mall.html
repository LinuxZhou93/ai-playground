<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>精诚中医 - 极致极简商城</title>
    <link rel="stylesheet" href="assets/tcm/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>

    <div id="phone-container">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>9:41</span>
            <div>
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi" style="margin: 0 4px;"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 顶部搜索 -->
        <div class="search-header">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="main-search-input" placeholder="输入药材、体质、病症"
                    oninput="window.handleSearch(this.value)">
            </div>
            <i class="far fa-comment-dots" onclick="window.showModuleDetail('客服咨询')"
                style="color: var(--primary-color); font-size: 20px;"></i>
        </div>

        <div class="content-area">

            <!-- 首页 -->
            <div id="home" class="page active">
                <div class="banner" style="background-image: url('assets/tcm/lingzhi_banner.png');"></div>

                <div class="quick-menu">
                    <div class="menu-item" onclick="window.switchTab('category')">
                        <div class="menu-icon"><i class="fas fa-gift"></i></div><span>礼盒</span>
                    </div>
                    <div class="menu-item" onclick="window.switchTab('category')">
                        <div class="menu-icon"><i class="fas fa-fire-alt"></i></div><span>热销</span>
                    </div>
                    <div class="menu-item" onclick="window.switchTab('category')">
                        <div class="menu-icon"><i class="fas fa-tag"></i></div><span>特惠</span>
                    </div>
                    <div class="menu-item" onclick="window.switchTab('category')">
                        <div class="menu-icon"><i class="fas fa-leaf"></i></div><span>新品</span>
                    </div>
                </div>

                <div class="section-title"><span>专家之选</span></div>
                <div class="hero-product" onclick="window.openProduct(1)">
                    <div class="hero-info">
                        <h3>破壁灵芝孢子粉</h3>
                        <p>灵芝之华 | 99% 破壁 | 深度稳康</p>
                        <div class="hero-btn">立即选购</div>
                    </div>
                    <img src="assets/tcm/lingzhi_banner.png" class="hero-img">
                </div>

                <div class="section-title"><span>当季好药</span><a href="#" onclick="window.switchTab('category')">更多
                        &gt;</a></div>
                <div class="product-grid">
                    <div class="product-card" onclick="window.openProduct(2)">
                        <div class="product-img" style="background-image: url('assets/tcm/article_reishi.png')"></div>
                        <div class="p-title">特级灵芝切片</div>
                        <div class="p-price"><span>¥ 128</span><i class="fas fa-plus-circle"></i></div>
                    </div>
                    <div class="product-card" onclick="window.openProduct(3)">
                        <div class="product-img" style="background-image: url('assets/tcm/tea_icon.png')"></div>
                        <div class="p-title">护肝养生茶</div>
                        <div class="p-price"><span>¥ 59</span><i class="fas fa-plus-circle"></i></div>
                    </div>
                </div>

                <div class="article-preview"
                    style="margin: 20px 15px; background: white; border-radius: 12px; padding: 12px; display: flex; box-shadow: var(--shadow); gap: 12px;"
                    onclick="window.openArticle(1)">
                    <div style="flex: 1;">
                        <div style="font-size: 14px; font-weight: 700;">春季护肝必读</div>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">张景和教授为您详解春季养肝心得...</p>
                    </div>
                    <div
                        style="width: 80px; height: 60px; border-radius: 8px; background: url('assets/tcm/article_spring.png') center/cover;">
                    </div>
                </div>
            </div>

            <!-- 分类页 -->
            <div id="category" class="page">
                <div class="category-container">
                    <div class="sidebar">
                        <div class="sidebar-item active">灵芝专区</div>
                        <div class="sidebar-item">参茸滋补</div>
                        <div class="sidebar-item">养生茶饮</div>
                        <div class="sidebar-item">药食同源</div>
                    </div>
                    <div class="main-cate"></div>
                </div>
            </div>

            <!-- 养生 -->
            <div id="knowledge" class="page"></div>

            <!-- 我的 -->
            <div id="profile" class="page">
                <div class="profile-header">
                    <div class="user-avatar" style="background-image: url('assets/tcm/doctor_avatar.png')"></div>
                    <div>
                        <div style="font-size: 18px; font-weight: 800;">张教授 (黄金会员)</div>
                        <div class="user-tag">积分: 3260</div>
                    </div>
                </div>

                <div class="order-entry">
                    <div class="order-item" onclick="window.showModuleDetail('待付款订单')"><i
                            class="fas fa-wallet"></i><span>待付款</span></div>
                    <div class="order-item" onclick="window.showModuleDetail('待收货订单')"><i
                            class="fas fa-box"></i><span>待收货</span></div>
                    <div class="order-item" onclick="window.showModuleDetail('评价管理')"><i
                            class="fas fa-comment-alt"></i><span>评价</span></div>
                    <div class="order-item" onclick="window.showModuleDetail('退换售后')"><i
                            class="fas fa-headset"></i><span>售后</span></div>
                </div>

                <div class="menu-list">
                    <div class="menu-row" onclick="window.showModuleDetail('收货地址')">
                        <div class="menu-label"><i class="fas fa-map-marker-alt"></i><span>收货地址</span></div><i
                            class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                    <div class="menu-row" onclick="window.showModuleDetail('健康档案')">
                        <div class="menu-label"><i class="fas fa-file-medical-alt"></i><span>健康档案</span></div><i
                            class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                    <div class="menu-row" onclick="window.showModuleDetail('我的卡券')">
                        <div class="menu-label"><i class="fas fa-ticket-alt"></i><span>我的卡券</span></div><i
                            class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                    <div class="menu-row" onclick="window.showModuleDetail('设置中心')">
                        <div class="menu-label"><i class="fas fa-cog"></i><span>系统设置</span></div><i
                            class="fas fa-chevron-right" style="color:#EEE"></i>
                    </div>
                </div>
            </div>

        </div>

        <div class="cart-badge" onclick="window.showModuleDetail('我的购物车')">
            <i class="fas fa-shopping-cart"></i>
            <div class="cart-count" style="display: none;">0</div>
        </div>

        <div class="tab-bar">
            <div class="tab-item active" onclick="window.switchTab('home')"><i class="fas fa-home"></i><span>首页</span>
            </div>
            <div class="tab-item" onclick="window.switchTab('category')"><i class="fas fa-th-large"></i><span>分类</span>
            </div>
            <div class="tab-item" onclick="window.switchTab('knowledge')"><i class="fas fa-leaf"></i><span>养生</span>
            </div>
            <div class="tab-item" onclick="window.switchTab('profile')"><i class="fas fa-user"></i><span>我的</span></div>
        </div>

        <!-- 全局详情/模块详情覆盖层 -->
        <div id="module-detail" class="page-overlay">
            <div class="page-header"><i class="fas fa-chevron-left"
                    onclick="window.closeOverlay('module-detail')"></i><span id="module-detail-title"
                    style="flex:1;text-align:center;font-weight:700;margin-right:20px;">详情</span></div>
            <div class="detail-content"></div>
        </div>

        <!-- 商品详情覆盖层 (专用) -->
        <div id="product-detail" class="page-overlay">
            <div class="page-header"><i class="fas fa-chevron-left"
                    onclick="window.closeOverlay('product-detail')"></i><span
                    style="flex:1;text-align:center;font-weight:700;margin-right:20px;">药材详情</span></div>
            <div class="detail-content">
                <div id="detail-img-box"
                    style="width:100%; height:300px; background-size:cover; background-position:center; border-radius:12px; margin-bottom:20px;">
                </div>
                <div style="padding: 0 16px;">
                    <div id="detail-price" style="font-size:24px; color:var(--primary-color); font-weight:800;"></div>
                    <div id="detail-title" style="font-size:18px; font-weight:700; margin: 8px 0;"></div>
                    <div id="detail-desc" style="font-size:13px; color:var(--text-muted); line-height:1.6;"></div>
                </div>
                <!-- 动态产品内容区 -->
                <div id="product-full-content" style="margin-top: 10px; padding-bottom: 40px;"></div>
            </div>
            <div class="action-footer"><button class="btn-primary" onclick="window.addToCart()">加入购物袋</button></div>
        </div>

        <!-- 搜索结果覆盖层 -->
        <div id="search-overlay" class="page-overlay" style="background: rgba(249, 247, 242, 0.98);">
            <div class="page-header"><i class="fas fa-chevron-left" onclick="window.closeSearch()"></i><span
                    style="flex: 1; text-align: center; font-weight: 700; margin-right: 20px;">搜索结果</span></div>
            <div id="search-results-container" class="detail-content"></div>
        </div>

        <!-- 文章详情覆盖层 -->
        <div id="article-detail" class="page-overlay">
            <div class="page-header"><i class="fas fa-chevron-left"
                    onclick="window.closeOverlay('article-detail')"></i><span
                    style="flex:1;text-align:center;font-weight:700;margin-right:20px;">养生阅读</span></div>
            <div class="detail-content" style="padding: 24px;">
                <h1 class="detail-title"></h1>
                <div class="author-name" style="margin: 10px 0; font-size: 13px; color: var(--secondary-color);"></div>
                <div class="detail-body" style="line-height: 1.8;"></div>
            </div>
        </div>

    </div>

    <script src="assets/tcm/app.js"></script>
</body>

</html>
