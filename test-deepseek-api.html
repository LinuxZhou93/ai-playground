<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek API 测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        .test-box {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #4f46e5;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        .info {
            color: #60a5fa;
        }
    </style>
</head>

<body>
    <h1>🔍 DeepSeek API 诊断工具</h1>

    <div class="test-box">
        <h2>测试 1: 基础连接测试</h2>
        <button onclick="testBasicConnection()">测试 API 连接</button>
        <div id="result"></div>
    </div>

    <div class="test-box">
        <h2>测试 2: 完整对话测试</h2>
        <input type="text" id="testMessage" placeholder="输入测试消息"
            style="width: 70%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #1a1a1a; color: #fff;">
        <button onclick="testFullConversation()">发送测试</button>
    </div>

    <script>
        const API_KEY = 'sk-abb5d221fe624678ad545f2469b66419';
        const API_URL = 'https://api.deepseek.com/v1/chat/completions';

        function log(message, type = 'info') {
            const result = document.getElementById('result');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            result.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            result.scrollTop = result.scrollHeight;
        }

        async function testBasicConnection() {
            document.getElementById('result').innerHTML = '';
            log('🔄 开始测试 DeepSeek API 连接...', 'info');

            try {
                log('📡 发送请求到: ' + API_URL, 'info');
                log('🔑 使用 API Key: ' + API_KEY.substring(0, 10) + '...', 'info');

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'user', content: '你好' }
                        ],
                        stream: false
                    })
                });

                log(`📊 响应状态: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    log('❌ 错误详情: ' + errorText, 'error');

                    if (response.status === 401) {
                        log('⚠️ API Key 可能无效或已过期', 'error');
                    } else if (response.status === 429) {
                        log('⚠️ 请求频率过高，请稍后重试', 'error');
                    } else if (response.status === 0 || response.status >= 500) {
                        log('⚠️ 网络连接问题或服务器错误', 'error');
                    }
                    return;
                }

                const data = await response.json();
                log('✅ API 连接成功！', 'success');
                log('📝 响应内容: ' + JSON.stringify(data, null, 2), 'success');

            } catch (error) {
                log('❌ 连接失败: ' + error.message, 'error');

                if (error.message.includes('Failed to fetch')) {
                    log('⚠️ 可能的原因:', 'error');
                    log('  1. CORS 跨域问题', 'error');
                    log('  2. 网络连接问题', 'error');
                    log('  3. API 服务不可用', 'error');
                    log('  4. 浏览器阻止了请求', 'error');
                }
            }
        }

        async function testFullConversation() {
            const message = document.getElementById('testMessage').value || '你好，请介绍一下你自己';
            document.getElementById('result').innerHTML = '';
            log('🔄 开始完整对话测试...', 'info');
            log('💬 测试消息: ' + message, 'info');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是一个友好的AI助手' },
                            { role: 'user', content: message }
                        ],
                        stream: true,
                        temperature: 0.7,
                        max_tokens: 500
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    log('❌ 请求失败: ' + errorText, 'error');
                    return;
                }

                log('✅ 开始接收流式响应...', 'success');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullResponse = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                log('✅ 响应完成', 'success');
                                continue;
                            }

                            try {
                                const parsed = JSON.parse(data);
                                const delta = parsed.choices?.[0]?.delta?.content;
                                if (delta) {
                                    fullResponse += delta;
                                    log('📨 ' + delta, 'info');
                                }
                            } catch (e) {
                                // 忽略解析错误
                            }
                        }
                    }
                }

                log('\n✅ 完整回复: ' + fullResponse, 'success');

            } catch (error) {
                log('❌ 测试失败: ' + error.message, 'error');
            }
        }

        // 页面加载时自动运行基础测试
        window.onload = () => {
            log('👋 欢迎使用 DeepSeek API 诊断工具', 'info');
            log('💡 点击"测试 API 连接"开始诊断', 'info');
        };
    </script>
</body>

</html>
