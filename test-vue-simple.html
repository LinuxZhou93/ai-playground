<!DOCTYPE html>
<html>

<head>
    <title>Vue Test</title>
    <script src="libs/vue.global.prod.js"></script>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>

<body>
    <div id="app">
        <h1>{{ message }}</h1>
        <button @click="count++">Count: {{ count }}</button>
    </div>

    <script>
        console.log('Vue object:', typeof Vue);
        console.log('Vue:', Vue);

        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const message = ref('Hello Vue!');
                const count = ref(0);
                return { message, count };
            }
        }).mount('#app');

        console.log('Vue app mounted');
    </script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.22_2"></script>
</body>

</html>
