<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPS AI 云端实验室 | WPS AI Cloud Lab</title>
    <link href="https://fonts.loli.net/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wps-red: #d92323;
            --primary: #00f0ff;
            --bg-dark: #05050a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: #e2e8f0;
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(217, 35, 35, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Orbitron';
            font-size: 32px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(to right, #fff, var(--wps-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* --- AUTH CARD --- */
        .glass-panel {
            background: rgba(13, 17, 28, 0.7);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .auth-status {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .wps-btn {
            background: var(--wps-red);
            color: #fff;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: bold;
            font-family: 'Share Tech Mono';
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .wps-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(217, 35, 35, 0.4);
        }

        .wps-btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        /* --- FILE GRID --- */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.6s all ease;
            pointer-events: none;
        }

        .file-grid.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .file-item {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .file-item:hover {
            border-color: var(--primary);
            background: rgba(0, 240, 255, 0.05);
            transform: scale(1.05);
        }

        .file-icon {
            font-size: 40px;
            margin-bottom: 15px;
            display: block;
        }

        .file-name {
            font-weight: bold;
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-date {
            font-size: 11px;
            color: #64748b;
        }

        /* --- ANALYSIS BOX --- */
        #analysis-result {
            display: none;
            margin-top: 40px;
            animation: slideUp 0.5s ease-out;
        }

        .analysis-content {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--primary);
            border-radius: 16px;
            padding: 40px;
            line-height: 1.8;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-ring {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 240, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }

        .back-link:hover { color: #fff; }
    </style>

    <link rel="stylesheet" href="assets/css/titan-core.css">
</head>
<body>

    <a href="profile.html" class="back-link">← 返回个人中心</a>

    <div class="container">
        <header>
            <div class="logo-area">
                <img src="https://www.wps.cn/favicon.ico" width="48" height="48">
                <h1>WPS AI Lab</h1>
            </div>
            <p class="subtitle">深度打通 WPS 云文档，开启人工智能文档分析新维度</p>
        </header>

        <section class="glass-panel">
            <div class="auth-status">
                <div>
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">云端服务连接</div>
                    <div id="status-text" style="color: #64748b; font-size: 13px;">尚未连接您的 WPS 账号</div>
                </div>
                <button id="auth-btn" class="wps-btn" onclick="simulateAuth()">连接 WPS 云端</button>
            </div>
        </section>

        <section id="file-section">
            <div id="file-grid" class="file-grid">
                <!-- Injected by JS -->
            </div>
        </section>

        <section id="analysis-result">
            <div class="analysis-content" id="analysis-box">
                <!-- Result will appear here -->
            </div>
        </section>
    </div>

    <script src="assets/js/wps-config.js"></script>
    <script src="assets/js/wps-integration.js"></script>

<!-- TITAN AI ASSISTANT -->
<script src="assets/js/titan-ai-assistant.js?v=2026.03.24_1"></script>
</body>
</html>
